<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Fleet Godown Master</h4>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div id="basic-example">
                                <section>
                                    <form (keydown.enter)="$event.preventDefault()" [formGroup]="formFleetGoDownMaster">
                                        <div class="row">
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Short Code:</label>
                                                    <span style="color: red">*</span>
                                                    <input uppercaseonly type="text" class="form-control" maxlength="10"
                                                        formControlName="godownShortCode"  (change)="checkDuplicateGodownShortCode()">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Description:</label>
                                                    <span style="color: red">*</span>
                                                    <input uppercaseonly type="text" class="form-control"
                                                        formControlName="godownDesc" (change)="checkDuplicateGodownDesc()">
                                                </div>
                                            </div>
                                        </div>
                                           <div class="row">
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Controlling Branch:</label>
                                                    <span style="color: red">*</span>
                                                    <select class="form-control form-select ng-pristine ng-touched"
                                                        autoclose="false"
                                                        formControlName="controllingBranch"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['controllingBranch'].invalid) }">
                                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                            {{branch.dataName}}
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Address:</label>
                                                    <input uppercaseonly type="text" class="form-control"
                                                        formControlName="godownAddress">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Godown Incharge:</label>
                                                    <input uppercaseonly type="text" class="form-control"
                                                        formControlName="godownIncharge">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Incharge Mobile No:</label>
                                                    <input numbersonly autocomplete="off" type="text" class="form-control" maxlength="10"
                                                        formControlName="inchargeMobile">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Is Active</label>
                                                    <select class="form-control form-select"
                                                        formControlName="isActive"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && f['isActive'].invalid }">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row text-right">
                                            <div class="col-lg-12">
                                                <div class="tex">
                                                    <button class="btn btn-primary w-md"
                                                        *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                                        (click)="submitFleetGroupMasterForm()">
                                                        Save
                                                    </button>
                                                    <button class="btn btn-danger w-md m-2"
                                                        *ngIf="editMode && deleteStatus"
                                                        (click)="deleteFinAccountMasterForm()">
                                                        Delete
                                                    </button>
                                                    <button class="btn btn-secondary w-md"
                                                        (click)="exit()">
                                                        Exit
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </section>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
