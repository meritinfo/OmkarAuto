<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
           <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Delivery Dispute Entry</h4>
                    </div>
                </div>
            </div>
           <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-4">
                                            <label for="formrow-inputZip" > Disp Branch  </label>
                                            <span style="color: red"> * </span>
                                            <select class="form-control form-select ng-pristine ng-touched"autoclose="false" 
                                                formControlName="dispBranch" 
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['dispBranch'].invalid) }">
                                                <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Disp Date </label>
                                            <span style="color: red">*</span>
                                            <input bsdatepicker="" type="date" autoclose="false" class="form-control"
                                                formControlName="dispDate" min="{{minDate}}" max="{{maxDate}}"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['dispDate'].invalid) }">
                                        </div>
                                    </div>  
                                   
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Disp Sl No </label>
                                            <span style="color: red">*</span>
                                            <input autoclose="false" class="form-control" 
                                            numbersonly autocomplete="off" maxlength="15" 
                                                formControlName="dispSlNo"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['dispSlNo'].invalid) }">
                                        </div>
                                    </div>                                                                                                                                                
                                   
                                </div> 
                                <div class="row">   
                                    <!-- <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputState">Gc Book </label>
                                            <select class="form-control form-select ng-pristine ng-touched"autoclose="false" 
                                            formControlName="gcBook">
                                                <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div> -->
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputState">Gc Note No </label>  <span style="color: red">*</span>
                                            <input autoclose="false" class="form-control" 
                                          maxlength="15" 
                                                formControlName="gcNoteNo"  uppercaseonly (change)="getConsignmentDetails($event)"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['gcNoteNo'].invalid) }">
                                        </div>
                                    </div>
                                     
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Dispute Status </label><span style="color: red"> * </span>
                                            <select id="formrow-inputState" class="form-control form-select ng-pristine ng-touched"
                                                        formControlName="disputeStatus"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['disputeStatus'].invalid) }"
                                                      >
                                                      <option value=""> Select</option>
                                                        <option value="DM"> Damage</option>
                                                        <option value="SH"> Shortage </option>
                                                        <option value="DS"> Damage+Shortage </option>
                                                        <option value="DL"> Delay </option>
                                                        <option value="OT"> Others </option>
                                                    </select>
                                        </div>
                                    </div>  
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label style="color: red"> 
                                                <h6>Challan No: {{ this.challanNo}} </h6> 
                                            </label>                                                 
                                        </div>
                                    </div> 
                                    
                                </div>
                                <div class="row">  
                                   
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputState">Booked At</label>
                                            <select class="form-control form-select ng-pristine ng-touched"autoclose="false" 
                                            formControlName="gcBook">
                                                <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Booked Date</label>
                                            <input bsdatepicker="" type="date" autoclose="false" class="form-control"
                                                formControlName="gcDate" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">From</label>
                                            <input autoclose="false" class="form-control"
                                                formControlName="gcFrom" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">To</label>
                                            <input autoclose="false" class="form-control"
                                                formControlName="gcTo" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">CN Pkgs</label>
                                            <input numbersonly autocomplete="off" autoclose="false" class="form-control"
                                                formControlName="cnPkgs" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">CN Weight</label>
                                            <input threedecimalonly autocomplete="off" autoclose="false" class="form-control"
                                                formControlName="cnActWt" >
                                        </div>
                                    </div>  
                                </div>
                                <div class="row">  
                                    <div class="col-lg-4">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Consignor</label>
                                            <input autoclose="false" class="form-control"
                                                formControlName="consignor" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-4">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Consignee</label>
                                            <input autoclose="false" class="form-control"
                                                formControlName="consignee" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-4">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Party</label>
                                            <input autoclose="false" class="form-control"
                                                formControlName="party" >
                                        </div>
                                    </div>  
                                </div>  
                                <div class="row"> 
                                    <div class="col-lg-5">
                                        <div class="mb-2">
                                            <label for="formrow-inputZip">Dispute Remarks  </label>                          
                                            <input class="form-control" formControlName="disputeRemarks"
                                            uppercaseonly >
                                        </div>
                                    </div> 
                                    <div class="col-lg-4">
                                        <div class="mb-2">
                                            <label for="formrow-inputZip">Disp Attach </label>                          
                                            <input #podAttach1Input class="form-control" type="file" 
                                            id="podAttach1Input" >
                                            <a *ngIf="selectedDeliveryadispute.dispAttach" target="_blank"
                                                        href={{podAttach1}}>Download</a>
                                        </div>
                                    </div> 
                                </div>
                                                                                          
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">                    
                    <div class="col-lg-5">
                        <div class="mb-3">
                            <label style="color: blue"> 
                                <h6><b>Created By:</b>  {{ this.createdBy }} </h6> 
                            </label>                                                 
                        </div>
                    </div>                   
                    <div class="col-lg-5">
                        <div class="mb-3">
                            <label style="color: blue"> 
                                <h6><b>Modified By:</b> {{ this.modifiedBy}} </h6> 
                            </label>                                                 
                        </div>
                    </div>
                    <!-- end col -->
                </div> 
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="submitDeliveryDisputeSave()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteDeliveryDisputeForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
     <!-- container-fluid -->
    </div>
  <!-- End Page-content -->
 </div>
