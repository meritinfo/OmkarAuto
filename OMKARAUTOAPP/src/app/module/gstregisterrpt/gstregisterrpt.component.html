<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">GST Purchase Report</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Branch </label>
                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="branch">
                                    <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                        {{branch.dataName}}
                                    </option>
                                </select>
                                </div>
                            </div>
                        </div>
                        <div class="row"  style="height: 300px">                            
                            <div class="col-md-5">
                                <div class="mb-3"> 
                                    <label for="formrow-inputZip">Vendor</label>                                                
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="vendorList"
                                            [searchKeyword]="keywordLocation" 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter"
                                            formControlName="vendorId" >
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">                                    
                                    <label for="basicpill-phoneno-input">GST From</label>
                                    <select id="formrow-inputState"
                                        formControlName="rptType" 
                                        class="form-control form-select ng-pristine ng-touched">
                                        <option value="GPE"> GST Purchase Entry </option>
                                        <option value="CCI"> CCI Invoice</option>
                                        <option value="DRE"> Doc Renewal Entry </option>
                                        <option value="SLP"> Spare Lube Purchase </option>
                                        <option value="VRM"> Vehicle Repair Maintainace </option>
                                        <option value="NTP"> New Tyre Purchase </option>
                                    </select>
                                </div>
                            </div> 
                            <!-- <div class="col-lg-1"  *ngIf="rptType">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                    (click)="search()"><span>Search</span></button>
                                </div>
                            </div> -->
                            <div class="col-sm-2 col-md-2 text-right">
                                <div class="dt-buttons btn-group flex-wrap export-button">
                                    <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                                        aria-controls="datatable-buttons" type="button" 
                                        (click)="exportExcel()"><span>Excel</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
