<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Count of Doc Entry</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls" style="height: 400px;">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div> 
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Doc Type</label>
                                    <select class="form-control form-select ng-pristine ng-touched"
                                        formControlName="docType">
                                        <option value="">All</option>
                                        <option value="LR">Consignment</option>
                                        <option value="CI">CC Invoice</option>
                                        <option value="CH">Challan</option>
                                        <option value="BL">Bill</option>
                                        <option value="MR">Moneny Reciept</option>
                                        <option value="LHP">Lorry Hire Payment</option>
                                        <option value="FTP">Fleet Trip Payments</option>
                                        <option value="DS">Diesel Stmt</option>
                                        <option value="VRP">Vehicle Repairs</option>
                                        <option value="TP">Tyre Purchase</option>
                                        <option value="AT">Activate Tyre</option>
                                        <option value="DT">De-Activate Tyre</option>
                                        <option value="GP">Gst Purchase Entry</option>
                                        <option value="BC">Bank Contra</option>
                                        <option value="BP">Bank Payment</option>
                                        <option value="BR">Bank Receipt</option>
                                        <option value="CP">Cash Payment</option>
                                        <option value="CR">Cash Receipt</option>
                                        <option value="JV">Journel Voucher</option>
                                      
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Entry/ Modify</label>
                                    <select class="form-control form-select ng-pristine ng-touched"
                                        formControlName="entryType">
                                        <option value="E">Entry</option>
                                        <option value="M">Modify</option>
                                    </select>
                                </div>
                            </div>
                        </div>     
                        <div class="col-sm-4 col-md-4 text-right">
                            <div class="dt-buttons btn-group flex-wrap export-button">
                                <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                                    aria-controls="datatable-buttons" type="button" 
                                    (click)="exportExcel()"><span>Excel</span></button>
                            </div>
                        </div>   
                    </form>
                </div> 
            </div>
            <!-- container-fluid -->
        </div>
        <!-- End Page-content -->
    </div>
