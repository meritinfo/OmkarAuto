
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Brands List</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                   <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Brand</label>
                                    <input type="text" class="form-control" formControlName="brandName" uppercaseonly>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   (click)="search()">
                                        <span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-12 col-md-12 text-right">
                    <button class="btn btn-primary buttons-html5" type="button"
                    (click)="addBrandmaster()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>Brand Name</th>
                            <th>Brand Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allBrandMaster.brandList?.length != 0">
                        <tr *ngFor="let brandmaster of allBrandMaster.brandList">
                            <td>
                                <button type="button" class="btn btn-edit"
                                (click)="getBrandMasterDetails(brandmaster)"></button>  
                        </td>
                            <td>{{ brandmaster.brandName }}</td>
                            <td>{{ brandmaster.brand }}</td>
                        </tr>
                    </tbody>
                    <tbody *ngIf="allBrandMaster.brandList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
