<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Employee Salary Calculation</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Month</label>
                                    <input type="date" class="form-control" 
                                    formControlName="monthYear" >
                                </div>                                
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Branch</label>
                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="branch">
                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   (click)="search()">
                                        <span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <button class="btn btn-primary buttons-html5" type="button"  *ngIf="createStatus"
                        (click)="empSalarymstAdd()"><span>New</span></button>
                </div>
            </div>
           <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>monthYear </th>
                            <th>empCode</th>
                            <th>empName</th>
                            <th>netPay </th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allEmpsalaryMaster.empPayCalcMstList?.length != 0">
                        <tr *ngFor="let es of allEmpsalaryMaster.empPayCalcMstList">               
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="getEmpsalarymstDetails(es)" ></button>             
                            </td> 
                            <td>{{ es.monthYear}}</td>
                            <td>{{ es.empCode }}</td>
                            <td>{{ es.empName }}</td>
                            <td>{{ es.netPay }}</td>   
                        </tr>
                    </tbody>
                    <tbody *ngIf="allEmpsalaryMaster.empPayCalcMstList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table> 
            </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
