<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">MONTHLY PERFORMANCE REPORT</h4>                        
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12">
                    <form [formGroup]="formFilter">
                        <div class="row">        
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control"  
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }"
                                    min="{{minDate}}" max="{{maxDate}}"
                                    formControlName="fromDate">  
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control"  
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }"
                                    min="{{minDate}}" max="{{maxDate}}"
                                    formControlName="toDate">  
                                </div>
                            </div>  
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Report Type</label>
                                    <select  class="form-control form-select ng-pristine ng-touched"
                                        formControlName="rptType"> 
                                        <option value="S">Summary</option>
                                        <option value="M">Month Wise</option>
                                        <option value="B">Branch Wise</option>
                                    </select>    
                                </div>
                            </div>    
                            <div class="col-sm-3 col-md-3 text-right">
                                <div class="dt-buttons btn-group flex-wrap export-button">
                                    <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                                    aria-controls="datatable-buttons" type="button" 
                                    (click)="exportExcel()"><span>Excel</span></button>
                                </div>
                            </div>   
                        </div>      
                    </form>
                </div>                
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
