<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
           <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Debit Note Entry</h4>
                    </div>
                </div>
            </div>
           <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-4">
                                            <label for="formrow-inputZip" > DN Branch  </label>
                                            <span style="color: red"> * </span>
                                            <select class="form-control form-select ng-pristine ng-touched"autoclose="false" 
                                                formControlName="dnBranch" 
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['bnBranch'].invalid) }">
                                                <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">DN Date </label>
                                            <span style="color: red">*</span>
                                            <input bsdatepicker="" type="date" autoclose="false" class="form-control"
                                                formControlName="dnDate" min="{{minDate}}" max="{{maxDate}}"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['dnDate'].invalid) }">
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Dn Sl No</label>
                                            <span style="color: red">*</span>
                                            <input autoclose="false" class="form-control" 
                                                numbersonly autocomplete="off" maxlength="15" 
                                                formControlName="dnSlNo" (change)="chkDocDuplicate()"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['cnSlNo'].invalid) }">
                                        </div>
                                    </div> 
                                     <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Dn Ref No</label>
                                         
                                            <input autoclose="false" class="form-control" 
                                                numbersonly autocomplete="off" maxlength="15" 
                                                formControlName="dnRefNo"
                                               >
                                        </div>
                                    </div> 
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Dn Ref Date  </label>
                                         
                                            <input bsdatepicker="" type="date" autoclose="false" class="form-control"
                                                formControlName="dnRefDate" min="{{minDate}}" max="{{maxDate}}"
                                                >
                                        </div>
                                    </div> 
                                     
                                </div> 
                            
                        
                                <div class="row"> 
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Debit Amt </label><span style="color: red"> * </span>
                                            <input autoclose="false" type="text" class="form-control" (change)="calTotal()"
                                                formControlName="debitAmt" decimalonly  
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['debitAmt'].invalid) }">
                                        </div>
                                    </div>
                                       <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">GST Type</label><span style="color: red"> * </span>                                           
                                                <select id="formrow-inputState" class="form-control" (change)="onGstChange()"
                                                    formControlName="gstType" 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['gstType'].invalid) }">
                                                        <option value="NA">NA</option>      
                                                        <option value="SC">S/CGST</option> 
                                                        <option value="IG">IGST</option>     
                                                </select>
                                            </div>
                                        </div>
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Gst Pct  </label> <span style="color: red"> * </span>
                                            <input autoclose="false" type="text" class="form-control" 
                                                formControlName="gstPct" decimalonly>
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Sgst Amt </label>
                                            <input autoclose="false" type="text" class="form-control" 
                                                formControlName="sgstAmt" decimalonly (change)="calTotal()"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['sgstAmt'].invalid) }">
                                        </div>
                                    </div>
                                      <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Cgst Amt</label>
                                            <input autoclose="false" type="text" class="form-control" 
                                                formControlName="cgstAmt" decimalonly (change)="calTotal()"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['cgstAmt'].invalid) }"> 

                                        </div>
                                    </div>
                                     <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Igst Amt</label>
                                            <input autoclose="false" type="text" class="form-control" 
                                                formControlName="igstAmt" decimalonly (change)="calTotal()"
                                                 [ngClass]="{ 'is-invalid': formSubmitted && (f['igstAmt'].invalid) }"> 
                                        </div>
                                    </div>
                                  
                                </div>
                                <div class="row"> 
                                      <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Total Debit Amt </label>
                                            <input autoclose="false" type="text" class="form-control" 
                                                formControlName="totalDebitAmt"  decimalonly 
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['totalDebitAmt'].invalid) }">
                                        </div>
                                    </div>
                                    
                                    <div class="col-sm-4">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Debit Ac</label>  <span style="color: red"> * </span>
                                            <div class="ng-autocomplete">
                                                <ng-autocomplete [data]="debitAcList"
                                                    [searchKeyword]="keywordLocation"  
                                                    formControlName="debitAc" 
                                                    (inputChanged)='onChangeSearch($event)'
                                                    (inputFocused)='onFocused($event)' 
                                                    [itemTemplate]="itemTemplate"
                                                    [notFoundTemplate]="notFoundTemplate"
                                                    [customFilter]="startWithFilter"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['debitAc'].invalid) }">
                                                </ng-autocomplete>

                                                <ng-template #itemTemplate let-item>
                                                    <a [innerHTML]="item.dataName"></a>
                                                </ng-template>

                                                <ng-template #notFoundTemplate let-notFound>
                                                    <div [innerHTML]="notFound"></div>
                                                </ng-template>
                                            </div>
                                        </div>
                                    </div>   
                                    <div class="col-sm-4">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Credit Ac</label>  <span style="color: red"> * </span>
                                            <div class="ng-autocomplete">
                                                <ng-autocomplete [data]="debitAcList"
                                                    [searchKeyword]="keywordLocation"  
                                                    formControlName="creditAc" 
                                                    (inputChanged)='onChangeSearch($event)'
                                                    (inputFocused)='onFocused($event)' 
                                                    [itemTemplate]="itemTemplate"
                                                    [notFoundTemplate]="notFoundTemplate"
                                                    [customFilter]="startWithFilter"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['creditAc'].invalid) }">
                                                </ng-autocomplete>

                                                <ng-template #itemTemplate let-item>
                                                    <a [innerHTML]="item.dataName"></a>
                                                </ng-template>

                                                <ng-template #notFoundTemplate let-notFound>
                                                    <div [innerHTML]="notFound"></div>
                                                </ng-template>
                                            </div>
                                        </div>
                                    </div> 
                                        <div class="col-sm-5">
                                        <div class="mb-3">
                                            <label>Remarks: </label>   <span style="color: red"> * </span>
                                            <input uppercaseonly type="text" maxlength="250"
                                            class="form-control" formControlName="dnRemarks"
                                              [ngClass]="{ 'is-invalid': formSubmitted && (f['dnRemarks'].invalid) }" >
                                        </div>
                                    </div>                                 
                                </div>                                                                                          
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="submitDebitNoteForm()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteDebitForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
     <!-- container-fluid -->
    </div>
  <!-- End Page-content -->
 </div>
