<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Spares Lubes master list</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <button class="btn btn-primary buttons-html5" type="button" 
                        (click)="AddSparesLubesMaster()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>spareLubName</th>
                            <th>spareLubType</th>
                            <th>sch_Oth</th>
                            <th>lifeType</th>
                            <th>lifeType</th>
                            <th>lifeExpectancy</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allSparesMaster.sparesList?.length != 0">
                        <tr *ngFor="let branch  of allSparesMaster.sparesList">
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="sparesLubesMasterDetails(branch)"></button>             
                            </td>  
                            <td>{{ branch.spareLubName }}</td>
                            <td>{{ branch.stype }}</td>
                            <td>{{ branch.sch_Oth }}</td>
                            <td>{{ branch.lifeType }}</td>
                            <td>{{ branch.lifeExpectancy }}</td>
                            <td>{{ branch.isActive }}</td>
                        </tr>
                    </tbody>
                    <tbody *ngIf="allSparesMaster.sparesList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
