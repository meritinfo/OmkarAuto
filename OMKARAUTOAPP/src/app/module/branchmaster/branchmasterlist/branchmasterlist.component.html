
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Branch list</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Branch Name</label>
                                    <input type="text" class="form-control" formControlName="centreName" uppercaseonly>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   (click)="search()">
                                        <span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <button class="btn btn-primary buttons-html5" type="button" *ngIf="createStatus"
                        (click)="Addbranchmaster()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>CentreName</th>
                            <th>StateName</th>
                            <th>ManagerName</th>
                            <th>ManagerMobileNo</th>                         
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allBranchMaster.branchMasterList?.length != 0">
                        <tr *ngFor="let branch  of allBranchMaster.branchMasterList">
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="branchmasterDetails(branch)"></button>             
                            </td>  
                            <td>{{ branch.code }}</td>
                            <td>{{ branch.centreName }}</td>
                            <td>{{ branch.stateName }}</td>
                            <td>{{ branch.managerName }}</td>
                            <td>{{ branch.managerMobileNo }}</td>                         
                            
                        </tr>
                    </tbody>
                    <tbody *ngIf="allBranchMaster.branchMasterList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
