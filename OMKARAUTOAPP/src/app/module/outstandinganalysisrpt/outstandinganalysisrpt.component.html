<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Outstanding Analysis Report</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label>
                                    <span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">As On Date </label>
                                    <span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="asOnDate" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['asOnDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">                                    
                                    <label for="basicpill-phoneno-input">Report Type</label>
                                    <select id="formrow-inputState" 
                                        formControlName="rptType" (change)="onrptchange($event)"
                                        class="form-control form-select ng-pristine ng-touched">
                                        <option value="S"> Summary</option>
                                        <option value="D"> Detail </option>                                         
                                    </select>
                                </div> 
                            </div> 
                            <div class="col-lg-1">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                    (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-5" *ngIf="rptType">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Party </label>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="partyList" 
                                            formControlName="party"
                                            [searchKeyword]="keywordLocation"  
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate" 
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>
                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>                                
                            <div class="col-lg-4">                                
                                <div class="form-check">
                                    <input type="checkbox" formControlName="submit" 
                                        class="form-check-input" >
                                    <label for="neft" class="form-check-label">Bill Submit Ref Wise
                                    </label>
                                </div>                          
                            </div>      
                        </div>
                    </form>
                </div>
                <div class="col-sm-2 col-md-2 text-right">
                    <div class="dt-buttons btn-group flex-wrap export-button">
                        <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button" 
                            (click)="exportExcel()"><span>Excel</span></button>
                    </div>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">                
                <div class="overflow-x">
                    <table datatable [dtOptions]="dtOptions" class="table table-bordered nowrap dt-responsive">
                        <thead>
                            <tr>
                                <th>party </th>
                                <th>billedDueAmt</th>
                                <th>adhocRecd</th>
                                <th>actualBillDue</th>
                                <th>ledgerAmt</th>
                                <th>totalUnbilledAmt</th>
                            </tr>
                        </thead>
                        <tbody *ngIf="allOutstandinganalrptlist.outstandingAnalList?.length != 0">
                            <tr *ngFor="let eta of allOutstandinganalrptlist.outstandingAnalList">
                                <td>{{ eta.party }}</td> 
                                <td>{{ eta.billedDueAmt }}</td> 
                                <td>{{ eta.adhocRecd }}</td> 
                                <td>{{ eta.actualBillDue }}</td>
                                <td>{{ eta.ledgerAmt }}</td> 
                                <td>{{ eta.totalUnbilledAmt }}</td>
                            </tr>
                        </tbody>
                        <tbody *ngIf="allOutstandinganalrptlist.outstandingAnalList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
