<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Document Settings </h4>    
                    </div>
                </div>
            </div>
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                   
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputCity">Doc Type</label><span style="color: red">*</span>    
                                <select id="formrow-inputState" class="form-control" 
                                        formControlName="docType"  
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['docType'].invalid) }"> 
                                        <option value="CN">Consignment</option>
                                        <option value="CH">Challan</option>
                                        <option value="BL">Bill</option> 
                                        <option value="MR">Money Receipt  </option>     
                                        <option value="CRN">Credit Note</option>     
                                        <option value="DBN">Debit Note </option>  
                                        <option value="DACK">Doc Ack </option>    
                                        <option value="BLS">Bill Submit</option>                                
                                </select>                                                
                            </div>                                              
                        </div>
                             <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip">Doc Desc</label>
                                <span style="color: red">*</span>
                                <input uppercaseonly autocomplete="off" type="text" class="form-control"  
                                formControlName="docDesc" 
                                [ngClass]="{ 'is-invalid': formSubmitted && (f['docDesc'].invalid) }">
                            </div>
                        </div>
                                <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip"> Auto Generate</label>
                                <span style="color: red">*</span>
                                <select id="formrow-inputState" class="form-control" 
                                    formControlName="autoGenYN" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['autoGenYN'].invalid) }"> 
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>                                  
                                </select>     
                            </div>
                        </div>
                    </div>
                   
                 
                    <div class="row">
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip"> Gen Type </label>
                                <span style="color: red">*</span>
                                <select id="formrow-inputState" class="form-control" 
                                    formControlName="genType"
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['genType'].invalid) }"> 
                                    <option value="B">Branch</option>
                                    <option value="BY">Branch-Year</option>   
                                    <option value="G">Global</option>      
                                    <option value="GY">Global-Year</option>                           
                                </select>     
                            </div>
                        </div>
                          <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip"> Allot YN </label>
                                <span style="color: red">*</span>
                                <select id="formrow-inputState" class="form-control" 
                                    formControlName="allotYN" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['allotYN'].invalid) }"> 
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>                                  
                                </select>     
                            </div>
                        </div>
                                 <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip"> Series YN  </label>
                                <span style="color: red">*</span>
                                <select id="formrow-inputState" class="form-control" 
                                    formControlName="seriesYN" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['seriesYN'].invalid) }"> 
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>                                  
                                </select>     
                            </div>
                        </div>
                        </div>
                           <div class="row">
                               <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip"> Inc Series YN </label>
                                <span style="color: red">*</span>
                                <select id="formrow-inputState" class="form-control" 
                                    formControlName="incSeriesYN" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['incSeriesYN'].invalid) }"> 
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>                                  
                                </select>     
                            </div>
                        </div>
                           
                            <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip">Prefix Length</label>
                                <span style="color: red">*</span>
                                <input numbersonly autocomplete="off" type="text" class="form-control"  
                                formControlName="prefixLength" 
                                [ngClass]="{ 'is-invalid': formSubmitted && (f['prefixLength'].invalid) }">
                            </div>
                        </div>
                              <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip"> Allot YN </label>
                                <span style="color: red">*</span>
                                <select id="formrow-inputState" class="form-control" 
                                    formControlName="allotYN" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['allotYN'].invalid) }"> 
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>                                  
                                </select>     
                            </div>
                        </div>
                        </div>
                         <div class="row">
                         <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip"> Dpr YN </label>
                                <span style="color: red">*</span>
                                <select id="formrow-inputState" class="form-control" 
                                    formControlName="dprYN" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['dprYN'].invalid) }"> 
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>                                  
                                </select>     
                            </div>
                        </div>
                           <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip"> AutoIncr YN </label>
                                <span style="color: red">*</span>
                                <select id="formrow-inputState" class="form-control" 
                                    formControlName="autoIncrYN" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['autoIncrYN'].invalid) }"> 
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>                                  
                                </select>     
                            </div>
                        </div>
                        
                    </div>
                 
                    <div class="row text-right">
                        <div class="col-lg-12">
                            <div class="tex">
                                <button class="btn btn-primary w-md" 
                                *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                    (click)="submitDocumentMasterForm()" >Save</button> &nbsp;  
                                <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                    (click)="deleteDocumentMasterForm()">Delete</button> &nbsp;
                                <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                            </div>
                        </div>
                    </div>
                </div>              
            </form>
        </div>
        <!-- container-fluid -->
    </div>
     <!-- End Page-content -->
</div>
