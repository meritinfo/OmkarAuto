<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Money Receipt (MR) List</h4>                       
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" formControlName="fromDate" 
                                    min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" formControlName="toDate" 
                                    min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
 
                            <div class="col-lg-2">
                                <div class="mb-2">
                                    <label for="formrow-inputState">Mr No : </label>
                                    <input class="form-control" formControlName="mrNo" numbersonly autocomplete="off" >
                                </div>
                            </div>
                           
                            <div class="col-lg-4">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Party</label>                                             
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="partyList"
                                            [searchKeyword]="keywordLocation"  
                                       
                                          
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                           
                                            formControlName="partyCode" 
                                            >
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            
                            </div>
                       
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                    (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        
                        </div>
                    </form>
                </div>
                <div class="col-sm-12 col-md-12 text-right">                   
                    <button class="btn btn-primary buttons-html5" type="button" *ngIf="createStatus"
                        (click)="mrAdd()"><span>New</span></button>
                </div>
            </div> 
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">                
                <div class="overflow-x">
                    <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                           <thead>
                        <tr>
                            <th>action</th>
                            <th>mrStn </th>
                            <th>mrNo </th>
                            <th>mrDate </th>
                            <th>partyName </th>
                            <th>partyName </th>
                            <th>partyName </th>
                            <th>partyName </th>
                            <th>cheqCashAmt</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allMrlist.mrList">
                        <tr *ngFor="let mr of allMrlist.mrList">                    
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="getMrDetails(mr)"></button>             
                            </td> 
                            <td>{{ mr.mrStn }}</td>
                            <td>{{ mr.mrNo }}</td>
                            <td>{{ mr.mrDate }}</td>
                            <td>{{ mr.partyName}}</td>
                            <td>{{ mr.mrReceiptTypeStatus}}</td>
                            <td>{{ mr.onAcStatus}}</td>
                            <td>{{ mr.onAcNewAmt}}</td>
                            <td>{{ mr.cheqCashAmt }}</td>   
                        </tr>
                    </tbody>
                    <tbody *ngIf="allMrlist.mrList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
