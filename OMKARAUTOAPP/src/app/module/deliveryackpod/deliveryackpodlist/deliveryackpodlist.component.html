<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Delivery Ack. List</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">From Date</label> 
                                    <input bsdatepicker="" type="date" autoclose="false" 
                                        min="{{minDate}}" max="{{maxDate}}"
                                        formControlName="fromDate" class="form-control">
                                </div>
                            </div>       
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">To Date</label> 
                                    <input bsdatepicker="" type="date" autoclose="false" 
                                         min="{{minDate}}" max="{{maxDate}}"
                                        formControlName="toDate" class="form-control">
                                </div>
                            </div>         
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">LR No</label> 
                                    <input autoclose="false"                                         
                                        formControlName="gcNoteNo" class="form-control">
                                </div>
                            </div>                            
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                    (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">                    
                    <button class="btn btn-primary buttons-html5" type="button" *ngIf="createStatus"
                        (click)=" deliveryackpodAdd()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                    <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                        <thead>
                            <tr>
                                <th>ackBr </th>                          
                                <th>ackDate</th>                             
                                <th>ackSlNo</th>                            
                                <th>lrno</th>
                                <th>deliveryDate</th>
                                <th>netPayable</th>
                                <th>Action</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody *ngIf="allDeliveryackpod.ackList?.length != 0">
                            <tr *ngFor="let dly of allDeliveryackpod.ackList">                  
                                <td>
                                    <button type="button" class="btn btn-edit" 
                                    (click)="getDeliveryackpodDetails(dly)"></button>    
                                             
                                </td> 
                                <td>
                                    <button type="button" 
                                        class="btn btn-primary btn-floating"  
                                    (click)="download(dly)" >
                                        <i class="fas fa-download"></i></button>   
                                </td>  
                                <td>{{ dly.ackBr }}</td>                        
                                <td>{{ dly.ackDate}}</td>
                                <td>{{ dly.ackSlNo}}</td>
                                <td>{{ dly.gcNoteNo}}</td>
                                <td>{{ dly.deliveryDate}}</td>
                                <td>{{ dly.netPayable}}</td>  
                            </tr>
                        </tbody>
                        <tbody *ngIf="allDeliveryackpod.ackList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
