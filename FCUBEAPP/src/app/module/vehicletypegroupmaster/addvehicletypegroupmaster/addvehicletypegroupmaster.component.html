<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Vehicle Type Group Master</h4>
                   <div class="page-title-right">
                      <ol class="breadcrumb m-0">
                         <li class="breadcrumb-item"><a href="javascript: void(0);">Freight</a></li>
                         <li class="breadcrumb-item active">Vehicle Type Group Master</li>
                      </ol>
                   </div>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form [formGroup]="formUser">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                         <h4 class="card-title mb-4">Vehicle Type Group Master</h4>
                         <div class="row">
                            <div class="col-lg-12">
                               <div class="card">
                                  <div class="card-body">
                                     <div class="row">
                                        <div class="col-sm-2">
                                           <label for="horizontal-firstname-input" class="col-form-label"> Vehicle Type Group
                                           Name</label>
                                        </div>
                                        <div class="col-sm-4">
                                           <input type="text"  autofocus="autofocus" class="form-control"
                                           placeholder="Enter  vehicleTypeGroupName " formControlName="vehicleTypeGroupName"
                                           [ngClass]=>
                                        </div>
                                     </div>
                                  </div>
                               </div>
                            </div>
                         
                            <div class="col-lg-12">
                                <div class="card">
                                   <div class="card-body">
                                      <div class="row">
                                         <div class="col-sm-2">
                                            <label for="horizontal-firstname-input" class="col-form-label">isActive 
                                            </label>
                                         </div>
                                         <div class="col-sm-4">
                                            <select id="scope" class="form-select" formControlName="isActive">
                                               <option value="Y">yes</option>
                                               <option value="N">No</option>
                                           </select>
                                         </div>
                                      </div>
                                   </div>
                                </div>
                             </div>
               
                 
                         </div>
                      </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                      <button class="btn btn-primary w-md"
                         (click)="submitVehicleTypeGroupMasterForm()">Submit</button>
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
