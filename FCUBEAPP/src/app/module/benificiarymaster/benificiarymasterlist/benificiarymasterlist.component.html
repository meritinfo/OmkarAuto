                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">                    
                     <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                       <thead>
                            <tr>
                                <th>dprDate </th>                          
                                <th>fromPlace </th>
                                <th>toPlace</th>  
                                <th>partyName</th>   
                                <th>partyName</th>   
                                                     
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody *ngIf="allbenificiarylist.beneficiaryList?.length != 0">
                            <tr *ngFor="let dpr of allbenificiarylist.beneficiaryList">
                                <td>{{ dpr.benType }}</td>  
                                <td>{{ dpr.benCode }}</td>                        
                                <td>{{ dpr.benName }}</td>                          
                                <td>{{ dpr.benCoAcName }}</td>                         
                                <td>{{ dpr.benBankName }}</td>                         
                                                
                
                                
                                <td>                                  
                                    <button type="button" class="btn btn-edit"
                                        (click)="getBenificiaryMasterDetails(dpr)"></button>                               
                                </td>
                               
                            </tr>
                        </tbody>
                        <tbody *ngIf="allbenificiarylist.beneficiaryList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
