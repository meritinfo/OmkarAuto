<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                    <h4 class="mb-sm-0 font-size-18">Ewaybill Bulk Extention</h4>
                    </div>
                </div>
            </div>
           <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">                             
                                <div class="row">
                                    <div class="col-lg-12">
                                        <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                            <tr>
                                                <td></td>
                                                <td>
                                                    <label for="formrow-inputZip">
                                                        <h6>EWAY Bill No</h6>
                                                    </label>
                                                </td>
                                                <td>
                                                    <label for="formrow-inputZip">
                                                        <h6>Booking Date</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputZip">
                                                        <h6>Vehicle No</h6>
                                                    </label>
                                                </td>
                                                <td>
                                                    <label for="formrow-inputCity">
                                                        <h6>From Location</h6>
                                                    </label>
                                                </td>
                                                <td>
                                                    <label for="formrow-inputCity">
                                                        <h6>Destination</h6>
                                                    </label>
                                                </td>
                                                <td>
                                                    <label for="formrow-inputCity">
                                                        <h6>Current Place</h6>
                                                    </label>
                                                </td>
                                                <td>
                                                    <label for="formrow-inputCity">
                                                         <h6>Current Pin</h6>
                                                    </label>
                                                </td>
                                                <td>
                                                    <label for="formrow-inputCity">
                                                         <h6>Remarks</h6>
                                                    </label>
                                                </td>
                                            </tr>
                                            <tr formArrayName="arrayList"
                                                *ngFor="let mst of formArray.controls; let m = index">
                                                <div [formGroupName]="m" class="grid-table">
                                                    <td>
                                                        <input (change)="selected($event,m)"
                                                        type="checkbox" class="form-check-input-small" 
                                                        formControlName="selected" >                                                                                                  
                                                    </td>
                                                    <td>   
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="ewayBillNo">                                                                                                 
                                                    </td>
                                                    <td> 
                                                        <input autoclose="false" type="date" class="form-control" 
                                                        formControlName="bookingDate">                                                      
                                                    </td>
                                                    <td> 
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="vehicleNo">                                                      
                                                    </td>
                                                    <td> 
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="fromLocation">                                                      
                                                    </td>
                                                    <td> 
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="destination">                                                      
                                                    </td>
                                                    <td> 
                                                        <input uppercaseonly autoclose="false" type="text" class="form-control" 
                                                        formControlName="currentPlace">                                                      
                                                    </td>
                                                    <td> 
                                                        <input numbersonly autoclose="false" type="text" class="form-control" 
                                                        formControlName="fromPin" maxlength="6">   
                                                        <input autoclose="false" type="hidden" class="form-control" 
                                                        formControlName="toPin">                                                      
                                                    </td>   
                                                    <td> 
                                                        <input uppercaseonly autoclose="false" type="text" class="form-control" 
                                                        formControlName="remarks">                                                      
                                                    </td>                  
                                                </div>
                                            </tr>
                                        </table>
                                    </div>
                                </div> 
                            </div> 
                        </div> 
                    </div> 
                </div>          
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="!formSubmitted"
                                (click)="submitEwaybillForm()">Save</button>&nbsp;
                        </div>
                    </div>
                   <!-- end col -->
                </div> 
            </form>
         <!-- end row -->
         <!-- end row -->
        </div>
      <!-- container-fluid -->
    </div>
   <!-- End Page-content -->
</div>
