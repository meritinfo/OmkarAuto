<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Addtional Cost Entry</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Branch </label>
                                    <select class="form-control" formControlName="branch">
                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">                                    
                                    <label for="basicpill-phoneno-input">Cost Type</label>
                                    <select id="formrow-inputState" formControlName="costType" 
                                        class="form-control form-select ng-pristine ng-touched">
                                        <option value="I"> Income</option>
                                        <option value="E"> Expense </option>                                         
                                    </select>
                                </div>
                            </div>   
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   (click)="search()">
                                        <span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="row top-controls">
                    <div class="col-sm-12 col-md-12 text-right">
                        <button class="btn btn-primary buttons-html5" type="button"  *ngIf="createStatus"
                            (click)="addcostrecAdd()"><span>New</span></button>
                    </div>
                </div>
                <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                    <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive w-100">
                        <thead>
                            <tr>
                                <th>branch</th>
                                <th>transNo </th>   
                                <th>transDate</th>
                                <th>addCostDescription </th>   
                                <th>addCostType</th>
                                <th>costTot</th>
                                <th>othTot </th>  
                                <th>grossTot </th>  
                                <th>netTot </th>
                            </tr>
                        </thead>
                        <tbody *ngIf="allAddcostreclist.addCostRecMstList">
                            <tr *ngFor="let br of allAddcostreclist.addCostRecMstList">          
                                <td>
                                    <button type="button" class="btn btn-edit" 
                                    (click)="getAddcostrecDetails(br)" ></button>             
                                </td> 
                                <td>{{ br.branch }}</td>
                                <td>{{ br.transNo }}</td> 
                                <td>{{ br.transDate }}</td> 
                                <td>{{ br.addCostDescription }}</td> 
                                <td>{{ br.addCostTp }}</td>
                                <td>{{ br.costTot }}</td> 
                                <td>{{ br.othTot }}</td>
                                <td>{{ br.grossTot }}</td>
                                <td>{{ br.netTot }}</td>  
                            </tr>
                        </tbody>
                        <tbody *ngIf="allAddcostreclist.addCostRecMstList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
                    </table>  
                </div> 
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
