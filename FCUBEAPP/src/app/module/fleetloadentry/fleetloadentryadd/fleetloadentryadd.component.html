<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Fleet Load Master</h4>

                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="/#/tripsheetlist">Other Trip Open</a></li>
                                <li class="breadcrumb-item active">Other Trip Open Add</li> -->
                            </ol>
                        </div>

                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFleetLoad">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                        
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Branch</label><span style="color: red"> * </span>
                                                <select class="form-control" formControlName="loadBranch"                             
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['loadBranch'].invalid) }">
                                                    <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Load Date</label><span style="color: red"> * </span>
                                                <input type="date" class="form-control" formControlName="loadDate"
                                                                         
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['loadDate'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Vehicle No</label><span style="color: red"> * </span> 
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="vehicleList"
                                                        [searchKeyword]="keywordLocation"  
                                                        formControlName="vehicleMasterId" [initialValue]=""
                                               
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' 
                                                        [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleMasterId'].invalid) }">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                  
                              
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    
                                    <div class="row">                                        
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Load Type</label><span style="color: red"> * </span>
                                                <select id="formrow-inputState" class="form-control"
                                                    formControlName="loadType" 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['loadType'].invalid) }">
                                                 
                                                    <option value="O">Own</option>
                                                    <option value="M">Market</option>
                                                </select>
                                            </div>
                                        </div>                                       
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Party (Load for)</label><span style="color: red"> * </span> 
                                                <!-- <input class="form-control"   uppercaseonly
                                                formControlName="loadFor"> -->
                                                <select class="form-control" 
                                                formControlName="loadFor"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['loadFor'].invalid) }">
                                                <option *ngFor="let ac of creditAcList" value={{ac.dataId}}>
                                                    {{ac.dataName}}
                                                </option>
                                            </select>
                               
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Memo No</label><span style="color: red"> * </span> 
                                                <input class="form-control"   uppercaseonly  maxlength="15"
                                                formControlName="loadMemoNo">
                               
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputState">Consignor Name</label><span style="color: red"> * </span> 
                                            <input class="form-control"   uppercaseonly  maxlength="75"
                                                formControlName="consignorName">
                                        </div>
                                    </div>
                                    <div class="col-lg-5">
                                        <div class="mb-3">
                                            <label for="formrow-inputState">Consignor Add</label>
                                            <input class="form-control"   uppercaseonly maxlength="150"
                                                formControlName="consignorAdd">
                                        </div>
                                    </div>
                                </div>

                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Loading From</label><span style="color: red"> * </span> 
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="locationList" formControlName="loadingFrom" 
                                                        [searchKeyword]="keywordLocation"  
                                                
                                                     
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"  
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['loadingFrom'].invalid) }"
                                                       >
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Destination</label><span style="color: red"> * </span> 
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="locationList" formControlName="loadingTo"
                                                        [searchKeyword]="keywordLocation"  
                                               
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"  
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['loadingTo'].invalid) }"
                                                        >
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Product</label><span style="color: red"> * </span> 
                                               
                                                    <select class="form-control" formControlName="productId"                             
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['productId'].invalid) }">
                                                        <option *ngFor="let branch of productList" value={{branch.dataId}}>
                                                            {{branch.dataName}}
                                                        </option>
                                                    </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Consignee Name</label><span style="color: red"> * </span> 
                                                <input class="form-control"   uppercaseonly  maxlength="75"
                                                    formControlName="consigneeName">
                                            </div>
                                        </div>
                                        <div class="col-lg-5">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Consignee Address</label>
                                                <input type="text" class="form-control" uppercaseonly  maxlength="150"
                                                    formControlName="consigneeAdd"
                                                   >
                                            </div>
                                        </div>
                                  
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Qty Wt (MT)</label><span style="color: red"> * </span> 
                                                <input class="form-control"   decimalonly  (change)="onRateChange()"
                                                    formControlName="qtyWt">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Packages</label><span style="color: red"> * </span> 
                                                <input class="form-control"   numbersonly
                                                    formControlName="qtyPkgs">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Rate Per Ton</label>
                                                <input class="form-control"   numbersonly 
                                                    formControlName="ratePerTon">
                                            </div>
                                        </div>
                                        
                                    </div>
                                    <div class="row">   
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity"> Freight (Hire)</label><span style="color: red"> * </span> 
                                                <input class="form-control"   numbersonly 
                                                    formControlName="hireAmt" (change)="onRateChange()">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Advance</label>
                                                <input class="form-control"   formControlName="advAmt" numbersonly>
                                            </div>
                                        </div>
                                        <!-- <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">TripAdjYN</label>
                                              
                                                    <select id="formrow-inputState" class="form-control"
                                                    formControlName="tripAdjYN" 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['tripAdjYN'].invalid) }">
                                                    
                                                    <option value="Y">Yes</option>
                                                    <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        -->
                                    </div> 
                                    <div class="row">   
                                        
                                        
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity"> Attach Memo Copy</label>
                                                <!-- <input class="form-control"  
                                                    formControlName="attachMemocopy"> -->
                                                    <input #attachmentInput class="form-control" type="file"
                                                    id="formAttFile"  >
                                                    <a *ngIf="selectedFleetLoadEntryDetails.attachMemocopy" target="_blank"
                                                            href={{uploadedAttach}}>Download</a>
                                            </div>
                                        </div>
                                        <div class="col-lg-5">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Remarks</label>
                                                <input class="form-control"   uppercaseonly  maxlength="250"
                                                    formControlName="remarks">
                                            </div>
                                        </div>
                                    </div>                           
                                </div>
                            </div>
                        </div>
                    </div>
                </div>                 
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="submitFleetLoadEntryForm()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteFleetLoadEntryForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                    <!-- end col -->
                </div>        
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
