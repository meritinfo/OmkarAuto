<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Loans & Advances Entry</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="/#/drivermasterlist">Driver Master</a></li>
                                <li class="breadcrumb-item active">Driver Master Add</li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formEmployee">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-lg-5">
                                        <div class="mb-3">
                                            <label>Employee </label><span style="color: red">*</span>
                                            <div class="ng-autocomplete">
                                                <ng-autocomplete [data]="empList"
                                                    formControlName="empId"
                                                    [searchKeyword]="keywordLocation"  
                                                    (selected)='selectEvent($event)'
                                                    (inputChanged)='onChangeSearch($event)'
                                                    (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                    [notFoundTemplate]="notFoundTemplate"
                                                    [customFilter]="startWithFilter" >
                                                </ng-autocomplete>

                                                <ng-template #itemTemplate let-item>
                                                    <a [innerHTML]="item.dataName"></a>
                                                </ng-template>

                                                <ng-template #notFoundTemplate let-notFound>
                                                    <div [innerHTML]="notFound"></div>
                                                </ng-template>
                                            </div> 
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-5">
                                        <div class="mb-3">
                                            <label>Date of Issue</label><span style="color: red">*</span>
                                            <input type="date" class="form-control" formControlName="loanDate"
                                                min="{{minDate}}" max="{{maxDate}}"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['loanDate'].invalid) }">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-5">
                                        <div class="mb-3">
                                            <label>Type of Loan</label><span style="color: red">*</span>
                                            <select class="form-control" formControlName="loanType"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['loanType'].invalid) }"
                                                class="form-control form-select ng-pristine ng-touched" >
                                                    <option value="SSA">Staff Salary Advance</option>
                                                    <option value="LTL">Long Term Loan</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label>Loan Amount</label><span style="color: red">*</span>
                                            <input decimalonly type="text" class="form-control" 
                                                maxlength="20"
                                                formControlName="loanAmt"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['loanAmt'].invalid) }">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label>EMI Amount</label><span style="color: red">*</span>
                                            <input decimalonly type="text" class="form-control" 
                                                formControlName="repaymentMonths"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['repaymentMonths'].invalid) }">
                                        </div>
                                    </div>
                                </div>                                 
                                <div class="row">
                                    <div class="col-lg-6">
                                        <div class="mb-3">
                                            <label>Remarks</label><span style="color: red">*</span>
                                            <input uppercaseonly type="text" class="form-control" 
                                                formControlName="remarks"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['remarks'].invalid) }">
                                        </div>
                                    </div>
                                </div>     
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="submitEmpLoanForm()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteEmpLoanForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                    <!-- end col -->
                </div>                
                <!-- end row -->
            </form>
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
