
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Bank Cash Contra</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item">Bank Cash Contra</li>
                                <li class="breadcrumb-item active">Bank Cash Contra</li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formBankContra">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">                                  
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <label for="formrow-inputState">Document Series</label>
                                            <input class="form-control"   
                                                formControlName="docSeries">
                                        </div>
                                        <div class="col-lg-2">
                                            <label for="formrow-inputState">Document No</label><span style="color:red">*</span>
                                            <label for="formrow-inputState">.</label>
                                            <input class="form-control"   
                                                formControlName="docNo"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['docNo'].invalid) }">
                                        </div>
                                        <div class="col-lg-2">
                                            <label for="formrow-inputState">Trans Date</label><span style="color:red">*</span>
                                            <input type="date" class="form-control"   
                                                formControlName="ftmDate"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['ftmDate'].invalid) }">
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-4">
                                                <label for="formrow-inputCity">Ref Type </label> 
                                                <select class="form-control form-select ng-pristine ng-touched"
                                                    formControlName="refType"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['refType'].invalid) }">
                                                    <option *ngFor="let branch of finRefTypes"
                                                        value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">                                    
                                            <label for="formrow-inputZip">Ref No </label>
                                            <input bsdatepicker="" autoclose="false"   formControlName="refNo"
                                                class="form-control">                                
                                        </div>                 
                                    </div>
                                    <div class="row">                 
                                        <div class="col-lg-3">  
                                            <label for="formrow-inputZip">Debit Account</label><span style="color:red">*</span>
                                            <select class="form-control"
                                                formControlName="accountid2"  
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['accountid2'].invalid) }">
                                                <option *ngFor="let branch of mainAcList"
                                                    value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>                
                                        </div>                                  
                                        <div class="col-lg-2">                                
                                            <div class="form-check">
                                                <input type="checkbox" formControlName="neftPmt" 
                                                    (change)="onneftChange($event)"
                                                    class="form-check-input" >
                                                <label for="neft" class="form-check-label">Neft/Rtgs/ATM/Online
                                                </label>
                                            </div>                          
                                        </div>          
                                    </div>                               
                                    <div class="row">                      
                                        <div class="col-lg-3">    
                                                <label for="formrow-inputZip">Utr No</label>
                                                <input uppercaseonly class="form-control"    formControlName="utrNo">
                                        </div>                                
                                        <div class="col-lg-4">                                                      
                                            <label for="formrow-inputState">Narration</label><span style="color:red">*</span>
                                            <input uppercaseonly class="form-control"   
                                                formControlName="narration" 
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['narration'].invalid) }">
                                        </div>    
                                    </div>   <br />                                        
                                    <div class="row">
                                        <div class="col-lg-4">
                                            <label for="formrow-inputState">Credit Account</label><span style="color:red">*</span>
                                            <div class="ng-autocomplete">
                                                <ng-autocomplete [data]="gridAccountList"
                                                    [searchKeyword]="keywordLocation"  
                                                    (selected)='selectEvent($event)'
                                                    (inputChanged)='onChangeSearch($event)'
                                                    (inputFocused)='onFocused($event)'
                                                    [itemTemplate]="itemTemplate"
                                                    [notFoundTemplate]="notFoundTemplate"
                                                    [customFilter]="startWithFilter"
                                                    formControlName="accountID" 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['accountID'].invalid) }">
                                                </ng-autocomplete>

                                                <ng-template #itemTemplate let-item>
                                                    <a [innerHTML]="item.dataName"></a>
                                                </ng-template>

                                                <ng-template #notFoundTemplate let-notFound>
                                                    <div [innerHTML]="notFound"></div>
                                                </ng-template>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">                                                                             
                                            <label for="formrow-inputState">Amount</label><span style="color:red">*</span>
                                            <input decimalonly class="form-control"    
                                                formControlName="amount"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['amount'].invalid) }">
                                        </div>
                                    </div>                                      
                                    <div class="row">
                                        <div class="col-lg-3">                                            
                                            <label for="formrow-inputState">Cheque No</label>
                                            <input numbersonly class="form-control"    
                                                formControlName="chequeNo" maxlength="6" 
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['chequeNo'].invalid) }">
                                        </div>                 
                                        <div class="col-lg-3">                             
                                            <label for="formrow-inputState">Cheque Date</label>
                                            <input type="date" class="form-control" 
                                                  formControlName="chequeDate"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['chequeDate'].invalid) }">
                                        </div>  
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-6">
                                                <label for="formrow-inputState">Remark</label>
                                                <input uppercaseonly class="form-control" formControlName="remarks">
                                            </div>
                                        </div>                               
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-6">
                                                <label for="formrow-inputState">Modify Remark</label>
                                                <input uppercaseonly class="form-control" 
                                                  formControlName="modifyRemarks"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['modifyRemarks'].invalid) }">
                                            </div>
                                        </div>   
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>           
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="submitBankCashContraForm()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteBankCashContraForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
