<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Custom Wizard</h4>
                    </div>
                </div>
            </div>           
            <!-- end page title -->
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step1Active}" data-toggle="tab" aria-controls="step1" role="tab"
                        title="Step 1">GST</a>
                </li>
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step2Active}" data-toggle="tab" aria-controls="step2" role="tab"
                        title="Step 2">LHP</a>
                </li>
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step3Active}" data-toggle="tab" aria-controls="step3" role="tab"
                        title="Step 3">MR</a>
                </li>
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step4Active}" data-toggle="tab" aria-controls="step4" role="tab"
                        title="Step 4">FLT</a>
                </li>
            </ul>
            <form (keydown.enter)="$event.preventDefault()"role="form" [formGroup]="formCustWizard" (keydown.enter)="$event.preventDefault()">
                <div class="tab-content">
                    <div class="tab-pane mt-4" [ngClass]="{'active' : step1Active}" role="tabpanel" id="step1">
                        <div class="row">
                            <div class="col-lg-2">   
                                <div class="mb-3">
                                    <label for="neft" >Cash Ac</label>
                                    <span style="color: red">*</span>
                                    <select formControlName="cashAc"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['cashAc'].invalid) }">
                                        <option *ngFor="let dl of creditacList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>                
                                </div>                    
                            </div>     
                            <div class="col-lg-2">   
                                <div class="mb-3">
                                    <label for="neft" >Freight Income Ac</label>
                                    <span style="color: red">*</span>
                                    <select formControlName="frtIncomeAc"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['frtIncomeAc'].invalid) }">
                                        <option *ngFor="let dl of creditacList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>                
                                </div>                    
                            </div>    
                            <div class="col-lg-2">   
                                <div class="mb-3">
                                    <label for="neft" >SGST Output Ac</label>
                                    <span style="color: red">*</span>
                                    <select formControlName="sgstOutputAc"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['sgstOutputAc'].invalid) }">
                                        <option *ngFor="let dl of creditacList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>                
                                </div>                    
                            </div>    
                            <div class="col-lg-2">   
                                <div class="mb-3">
                                    <label for="neft" >CGST Output Ac</label>
                                    <span style="color: red">*</span>
                                    <select formControlName="cgstOutputAc"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['cgstOutputAc'].invalid) }">
                                        <option *ngFor="let dl of creditacList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>                
                                </div>                    
                            </div>  
                            <div class="col-lg-2">   
                                <div class="mb-3">
                                    <label for="neft" >IGST Output Ac</label>
                                    <span style="color: red">*</span>
                                    <select formControlName="igstOutputAc"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['igstOutputAc'].invalid) }">
                                        <option *ngFor="let dl of creditacList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>                
                                </div>                    
                            </div>        
                        </div>
                        <div class="row">
                            <div class="col-lg-2">   
                                <div class="mb-3">
                                    <label for="neft" >SGST Input Ac</label>
                                    <span style="color: red">*</span>
                                    <select formControlName="sgstInputAc"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['sgstInputAc'].invalid) }">
                                        <option *ngFor="let dl of creditacList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>                
                                </div>                    
                            </div>    
                            <div class="col-lg-2">   
                                <div class="mb-3">
                                    <label for="neft" >CGST Input Ac</label>
                                    <span style="color: red">*</span>
                                    <select formControlName="cgstInputAc"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['cgstInputAc'].invalid) }">
                                        <option *ngFor="let dl of creditacList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>                
                                </div>                    
                            </div>    
                        </div>                
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-primary w-md next-step ms-2" 
                                    id="n-btn1" (click)="nextStep(2)">Save and continue</button>&nbsp;
                                    <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane mt-4" [ngClass]="{'active' : step2Active}" role="tabpanel" id="step2">
                        <div class="row">
                            <!-- 2nd tab -->
                        </div>                
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-default prev-step"
                                        id="p-btn1" (click)="nextStep(1)">Previous</button>
                                    <button type="button" class="btn btn-primary w-md next-step ms-2" 
                                    id="n-btn2"  (click)="nextStep(3)">Save and continue</button>&nbsp;
                                    <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="tab-pane mt-4"  [ngClass]="{'active' : step3Active}" role="tabpanel" id="step3">
                        <div class="row"> 
                            <!-- 3rd tab -->
                        </div>                   
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-default prev-step"
                                        id="p-btn1" (click)="nextStep(2)">Previous</button>
                                    <button type="button" class="btn btn-primary w-md next-step ms-2" 
                                    id="n-btn2"  (click)="nextStep(4)">Save and continue</button>&nbsp;
                                    <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane mt-4"  [ngClass]="{'active' : step4Active}" role="tabpanel" id="step4">
                        <div class="row">  
                            <!-- 4th tab -->
                        </div>                
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-default prev-step"
                                        id="p-btn2" (click)="nextStep(3)">Previous</button>
                                    <button type="button" class="btn btn-primary w-md next-step ms-2" 
                                    *ngIf="(editMode && editStatus) || (!editMode && createStatus) "
                                        (click)="submitCustWizardForm()">Save</button>
                                    <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                        (click)="custWizardDelete()">Delete</button> &nbsp;
                                    <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="clearfix"></div>
                </div>
            </form>
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
