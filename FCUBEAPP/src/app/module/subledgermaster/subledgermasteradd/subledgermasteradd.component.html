<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Create/Edit Sub Ledger</h4>
                    </div>
                </div>
            </div>
          <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body"> 
                                <div class="row">
                                    <div class="col-lg-2">
                                        <div class="mb-3">                                            
                                            <label for="formrow-inputState">Ledger Ac</label>
                                            <span style="color: red">*</span>
                                        </div>
                                    </div>
                                    <div class="col-lg-4">
                                        <div class="mb-3">
                                            <select class="form-control form-select ng-pristine ng-touched"
                                                formControlName="ledgerAc"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['ledgerAc'].invalid) }">
                                                <option *ngFor="let branch of ledgerAcList" value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-2">
                                        <div class="mb-3"> 
                                            <label  for="formrow-inputState">Create/Predefined</label>
                                            <span style="color: red">*</span>
                                        </div>
                                    </div>
                                    <div class="col-lg-4">
                                        <div class="mb-3">
                                            <select id="formrow-inputState" formControlName="createOrPredefined"  
                                                (change)="changePreType($event)"  
                                                class="form-control form-select ng-pristine ng-touched"                                            
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['createOrPredefined'].invalid) }">
                                                <option value="">Choose...</option>
                                                <option value="C">Create</option>
                                                <option value="P">Pre-Defined</option>                                            
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row" *ngIf="!gridview">
                                    <div class="col-lg-2">
                                        <div class="mb-3"> 
                                            <label  for="formrow-inputState">Pre-Defined</label>
                                            <span style="color: red">*</span>
                                        </div>
                                    </div>
                                    <div class="col-lg-4">
                                        <div class="mb-3">
                                            <select id="formrow-inputState" formControlName="preDefinedQuery"  
                                                class="form-control form-select ng-pristine ng-touched">
                                                <option value="">Choose...</option>
                                                <option value="Employee">Employee</option>
                                                <option value="Vehicle">Vehicle</option>                                            
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">  
                                </div>             
                            </div>                  
                            <!-- end card body -->
                        </div>                     
                        <!-- end card -->
                    </div>
                </div>  
                <div class="ng-untouched ng-pristine ng-valid" *ngIf="gridview">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="overflow-x">
                                        <table class="table table-bordered dt-responsive nowrap w-100 no-border-table half-width">
                                            <tr>       
                                                <th class="col-lg-4"><label for="formrow-inputCity">Sub Ledger Desc</label></th>   
                                                <th class="col-lg-4"><label for="formrow-inputCity">Action</label></th> 
                                            </tr>
                                            <tr formArrayName="arrayList"
                                                    *ngFor="let arrayData of formSubArray.controls; let i = index">
                                                <div [formGroupName]="i" class="grid-table">
                                                    <td class="col-lg-4">                                     
                                                        <input autoclose="false" class="form-control"
                                                        formControlName="subLedgerDesc" uppercaseonly  
                                                        maxlength="25"> 
                                                    </td>
                                                    <td>                                     
                                                        <div class="details-button">
                                                            <button *ngIf="i === formSubArray.controls.length-1" type="button"
                                                                class="btn btn-add" (click)="addItem(i)"></button>
                                                            <button *ngIf="formSubArray.controls.length > 1"
                                                                (click)="removeItem(i)" class="btn btn-delete"></button>
                                                        </div>   
                                                    </td>
                                                </div>
                                            </tr>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>         
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                             *ngIf="((editMode && editStatus) || (!editMode && createStatus))"
                                (click)="submitSubLedgerMasterForm()">Save</button>&nbsp;                            
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="ledgerMasterDelete()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                    <!-- end col -->
                </div> 
            </form>
           <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
     <!-- End Page-content -->
</div>
