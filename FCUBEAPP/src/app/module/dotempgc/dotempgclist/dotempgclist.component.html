
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">DO Generate Temp LR</h4>
                    </div>
                </div>
            </div>
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" formControlName="fromDate" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" formControlName="toDate" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>                         
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Party</label>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="partyList" 
                                            formControlName="payParty"
                                            [searchKeyword]="keywordLocation" 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div> 
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Vehicle No: </label>
                                    <input class="form-control" formControlName="vehicleNo" >
                                </div>
                            </div>        
                        </div>                        
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">From Place: </label>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="locationList" 
                                            formControlName="origin"
                                            [searchKeyword]="keywordLocation"
                                            [itemTemplate]="itemTemplate" 
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>
                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">To Place: </label>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="locationList" 
                                            formControlName="destination"
                                            [searchKeyword]="keywordLocation"
                                            [itemTemplate]="itemTemplate" 
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter" >
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>
                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>   
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Main LR </label>
                                    <select id="scope" class="form-select" formControlName="mainLr"
                                        class="form-control form-select ng-pristine ng-touched">
                                        <option value="Y">Done</option>
                                        <option value="N">Not Done</option>
                                    </select>
                                </div>
                            </div>   
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">LR No: </label>
                                    <input class="form-control" formControlName="gcNoteNo" >
                                </div>
                            </div>                 
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                        (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            <!-- end page title -->            
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">                    
                     <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                       <thead>
                            <tr>
                                <th>dprDate </th>  
                                <th>gcNoteNo</th> 
                                <th>partyName</th>                         
                                <th>fromPlace </th>
                                <th>toPlace</th>  
                                <th>vehicleNo </th>   
                                <th>driverName</th>    
                                <th>driverMob1</th>                               
                                <th>Action</th>                              
                                <th>Main LR</th>   
                            </tr>
                        </thead>
                        <tbody *ngIf="alltempgclist.doTempGcList?.length != 0">
                            <tr *ngFor="let gc of alltempgclist.doTempGcList">
                                <td>                                  
                                    <button type="button" class="btn btn-edit"
                                        (click)="gettempgcDetails(gc)"></button>                               
                                </td>
                                <td>
                                    <button type="button"  
                                        class="btn btn-primary btn-floating"  
                                    (click)="genMainLrDetails(gc)" >
                                        <i class="fas fa-file-invoice-dollar"></i></button>   
                                </td> 
                                <td>{{ gc.vehiInDate }}</td>  
                                <td>{{ gc.gcNoteNo }}</td>                        
                                <td>{{ gc.partyName }}</td>    
                                <td>{{ gc.fplace }}</td>                        
                                <td>{{ gc.tplace }}</td>                        
                                <td>{{ gc.vehicleNo }}</td>                          
                                <td>{{ gc.driverName }}</td>                          
                                <td>{{ gc.driverMob1 }}</td>                                                                 
                            </tr>
                        </tbody>
                        <tbody *ngIf="alltempgclist.doTempGcList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
                    </table> 
                </div>
            </div>
        </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
