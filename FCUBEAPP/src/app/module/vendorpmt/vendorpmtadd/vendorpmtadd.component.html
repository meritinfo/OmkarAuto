<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Vendor Payments</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">Branch</label><span style="color: red"> * </span>
                                                    <select class="form-control form-select ng-pristine ng-touched"
                                                        formControlName="transBranch"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['transBranch'].invalid) }"> 
                                                        <option *ngFor="let br of branchList" value={{br.dataId}}>
                                                            {{br.dataName}}
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">Trans Date</label><span style="color: red"> * </span>
                                                    <input autoclose="false" type="date" min="{{minDate}}" max="{{maxDate}}" 
                                                        class="form-control" formControlName="transDate"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['transDate'].invalid) }">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">Bills Upto Date</label><span style="color: red"> * </span>
                                                    <input autoclose="false" type="date" min="{{minDate}}" max="{{maxDate}}"
                                                        class="form-control" formControlName="billsUptoDate"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['billsUptoDate'].invalid) }">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-6">
                                                <div class="mb-3">
                                                    <label for="formrow-inputZip">Vendor</label> <span style="color: red"> * </span>                                               
                                                    <div class="ng-autocomplete">
                                                        <ng-autocomplete [data]="vendorList"
                                                            [searchKeyword]="keywordLocation"  
                                                            (inputChanged)='onChangeSearch($event)'
                                                            (inputFocused)='onFocused($event)'
                                                            [itemTemplate]="itemTemplate"
                                                            [notFoundTemplate]="notFoundTemplate"
                                                            [customFilter]="startWithFilter"
                                                            formControlName="vendorId" 
                                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['vendorId'].invalid) }">
                                                        </ng-autocomplete>
    
                                                        <ng-template #itemTemplate let-item>
                                                            <a [innerHTML]="item.dataName"></a>
                                                        </ng-template>
    
                                                        <ng-template #notFoundTemplate let-notFound>
                                                            <div [innerHTML]="notFound"></div>
                                                        </ng-template>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <button (click)="searchStatement()" *ngIf="!editMode"
                                                        class="btn btn-primary w-md mt-4">Search</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body -->
                            </div>
                            <!-- end card -->
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4"></h4>
                                    <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                        <tr>
                                            <td colspan="3">
                                                <div class="mb-3">
                                                    <input type="checkbox"  name="select" 
                                                         class="form-check-input"
                                                        (change)="selectAll($event)" formControlName="selectedAll">  
                                                        <label for="formrow-inputCity">  SELECT ALL</label>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th><label for="formrow-inputCity"></label></th>
                                            <th><label for="formrow-inputCity">Pmt Form</label></th>
                                            <th><label for="formrow-inputZip">Vehicle No</label></th>
                                            <th><label for="formrow-inputZip">Vendor Inv No</label></th>
                                            <th><label for="formrow-inputZip">Vendor Inv Dt</label></th>
                                            <th><label for="formrow-inputZip">Net Amount</label></th>
                                            <th><label for="formrow-inputZip">Amt Paid</label></th>
                                            <th><label for="formrow-inputZip">Amt Ded</label></th>
                                            <th><label for="formrow-inputZip">Amt TDS</label></th>
                                            <th><label for="formrow-inputZip">Amt Extras</label></th>
                                            <th><label for="formrow-inputZip">Remarks</label></th>
                                        </tr>                                        
                                        <tr formArrayName="arrayList"
                                            *ngFor="let arrayData of formArray.controls; let i = index">
                                            <div [formGroupName]="i" class="grid-table">
                                            <td>
                                                <div class="mb-3">
                                                    <input type="checkbox"  name="select" 
                                                         class="form-check-input" formControlName="selected"
                                                        (change)="selectedData(i, $event)" >
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="pmtForm">
                                                    <input class="form-control" type="hidden" formControlName="vendorBillMasterId">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="vehicleNo">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="vendorInvNo">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input  class="form-control" type="date" formControlName="vendorInvDt">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="netAmount">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="amtPaid" 
                                                    (change)="calculateTotal(i,'amtPaid')">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="amtDed" 
                                                    (change)="calculateTotal(i,'amtDed')">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="amtTDS"
                                                    (change)="calculateTotal(i,'amtTDS')">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="amtExtras"
                                                    (change)="calculateTotal(i,'amtExtras')">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="dtlRemarks">
                                                </div>
                                            </td>
                                            </div>
                                        </tr>
                                    </table>
                                    <div class="row">                                                                
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Total Amt Paid</label>
                                                <input autoclose="false" class="form-control"
                                                    formControlName="totalAmtPaid">
                                                </div>
                                        </div>                                                         
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Total Amt Ded</label>
                                                <input autoclose="false" class="form-control"
                                                    formControlName="totalAmtDed">
                                            </div>
                                        </div>                                                                   
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Total Amt TDS</label>
                                                <input decimalonly autoclose="false" 
                                                    class="form-control" formControlName="totalAmtTDS">
                                            </div>
                                        </div>                                                                                                              
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Total Amt Extras</label>
                                                <input autoclose="false" 
                                                    class="form-control" formControlName="totalAmtExtras">
                                            </div>
                                        </div>
                                    </div>  
                                    <div class="row"> 
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Net Amt Paid</label>
                                                <input autoclose="false" type="text" class="form-control"
                                                    formControlName="netAmtPaid">
                                            </div>
                                        </div>   
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Payment Type</label>
                                                <span style="color: red">*</span>
                                                <select id="formrow-inputState" class="form-control form-select ng-pristine ng-touched"
                                                    formControlName="pmtType" (change)="changePmtType($event)"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['pmtType'].invalid) }"  >
                                                    <option value="M">Cash</option>      
                                                    <option value="B">Bank</option>                                                         
                                                </select>
                                            </div>
                                        </div>   
                                        <div class="col-lg-4">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Credit Ac </label> 
                                                <span style="color: red">*</span>         
                                                <select class="form-control form-select ng-pristine ng-touched"
                                                    formControlName="creditAc"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['creditAc'].invalid) }">
                                                    <option value ="">Choose...</option>
                                                    <option *ngFor="let branch of creditAcList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>  
                                    </div>  
                                    <div class="row">   
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input"> Neft</label>
                                                <select id="formrow-inputState" 
                                                class="form-control form-select ng-pristine ng-touched"
                                                    formControlName="neftYN" (change)="onneftChange($event)"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['neftYN'].invalid) }">
                                                    <option value="Y"> Yes</option>
                                                    <option value="N"> No</option>                               
                                                </select>
                                            </div>
                                        </div>   
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Cheque No</label>
                                                <input type="text" class="form-control" formControlName="chequeNo"                                                         
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['chequeNo'].invalid)}">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-email-input">Cheque Date </label>
                                                <input bsdatepicker="" type="date" autoclose="false"
                                                    formControlName="chequeDate" class="form-control"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['chequeDate'].invalid)}"  max="{{maxDate}}">
                                            </div>
                                        </div>   
                                    </div>  
                                    <div class="row">                                                                     
                                        <div class="col-lg-5">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Remarks</label>
                                                <input  uppercaseonly autoclose="false" type="text" class="form-control"
                                                    formControlName="remarks">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label style="color: red"> 
                                                    <h6>Fin Doc Series: {{ this.seriesDoc}} </h6> 
                                                </label>                                                 
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label style="color: red"> 
                                                    <h6>Fin Doc JV Series: {{ this.seriesDocJV}} </h6> 
                                                </label>                                                 
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">                    
                    <div class="col-lg-5">
                        <div class="mb-3">
                            <label style="color: blue"> 
                                <h6><b>Created By:</b>  {{ this.createdBy }} </h6> 
                            </label>                                                 
                        </div>
                    </div>                   
                    <div class="col-lg-5">
                        <div class="mb-3">
                            <label style="color: blue"> 
                                <h6><b>Modified By:</b> {{ this.modifiedBy}} </h6> 
                            </label>                                                 
                        </div>
                    </div>
                    <!-- end col -->
                </div>  
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="saveVendorPmtDetails()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteVendorPmtForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md m-2" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
