<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Party Group Master</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-lg-2">
                                        <div class="mb-2">
                                            <label for="formrow-inputZip">Party Desc</label>
                                            <span style="color: red">*</span>
                                        </div>
                                    </div>
                                    <div class="col-lg-5">
                                        <div class="mb-3">
                                            <input type="text" autofocus="autofocus" class="form-control" 
                                            formControlName="partyGroupDesc" uppercaseonly
                                            [ngClass]="{ 'is-invalid': userSubmitted && (f['partyGroupDesc'].invalid) }">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title mb-4"></h4>
                                <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                    <tr>
                                        <td class="col-lg-8">
                                            <label for="formrow-inputZip">
                                                <h6>Party Name</h6>
                                            </label></td>
                                        
                                        <td class="col-lg-2">
                                            <label for="formrow-inputZip">
                                                <h6>Action</h6>
                                            </label></td>
                                    </tr>
                                    <tr formArrayName="arrayList"
                                        *ngFor="let arrayData of formArray.controls; let i = index">
                                        <div [formGroupName]="i" class="grid-table">
                                            <td class="col-lg-8">                                                  
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="partyList"
                                                        [searchKeyword]="keywordLocation" 
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)'
                                                        [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"
                                                        formControlName="partyId">

                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>  
                                            </td>
                                           
                                            <td class="col-lg-2">
                                                <div class="col-lg-4 details-button">
                                                    <button *ngIf="i === formArray.controls.length-1" type="button"
                                                        class="btn btn-add" (click)="addItem(i)"></button>
                                                    <button *ngIf="formArray.controls.length > 1"
                                                        (click)="removeItem(i)" class="btn btn-delete"></button>
                                                </div>   
                                            </td>
                                        </div>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" *ngIf="(editMode && editStatus) || (!editMode && createStatus)"
                             (click)="submitpartygroupForm()">Save</button>
                            <button class="btn btn-danger w-md m-4" *ngIf="editMode && deleteStatus"
                             (click)="partygroupmasterDelete()">Delete</button>
                            <button class="btn btn-secondary w-md m-4"
                             (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
