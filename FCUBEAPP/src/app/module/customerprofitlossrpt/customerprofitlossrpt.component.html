<!-- Begin page -->
<!-- ============================================================== -->
<!-- Start right Content here -->
<!-- ============================================================== -->
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Customer Profit/Loss Report</h4>
                    </div>
                </div>
            </div>   
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="row">           
                    <div class="col-md-2">
                        <div class="mb-3">
                            <label for="formrow-inputState">Min. Turnover</label><span style="color: red">*</span>    
                            <input class="form-control" numbersonly formControlName="turnover"
                                [ngClass]="{ 'is-invalid': formSubmitted && (f['turnover'].invalid) }">
                        </div>
                    </div>                 
                    <div class="col-md-2">
                        <div class="mb-3">
                            <label for="formrow-inputState">Admin Expenses %</label><span style="color: red">*</span>    
                            <input class="form-control" decimalonly formControlName="adminInt"
                                [ngClass]="{ 'is-invalid': formSubmitted && (f['adminInt'].invalid) }">
                        </div>
                    </div>              
                    <div class="col-md-2">
                        <div class="mb-3">
                            <label for="formrow-inputState">Day After Int</label><span style="color: red">*</span>    
                            <input class="form-control" numbersonly formControlName="dayAfterInt"
                                [ngClass]="{ 'is-invalid': formSubmitted && (f['dayAfterInt'].invalid) }">
                        </div>
                    </div>             
                    <div class="col-md-2">
                        <div class="mb-3">
                            <label for="formrow-inputState">Interest Rate</label><span style="color: red">*</span>    
                            <input class="form-control" decimalonly formControlName="interest"
                                [ngClass]="{ 'is-invalid': formSubmitted && (f['interest'].invalid) }">
                        </div>
                    </div>
                    <div class="col-lg-1">
                        <div class="mt-3">
                            <button class="btn btn-primary"   
                            (click)="getDashboardCustomer()"><span>Excel</span></button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <!-- container-fluid -->
    </div>
</div>
<!-- end main content-->
