<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Monthly Statement</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">                                    
                                    <label for="basicpill-phoneno-input">Amount Type</label>
                                    <select id="formrow-inputState"
                                        formControlName="freight" 
                                        class="form-control form-select ng-pristine ng-touched">
                                        <option value="Y"> Only Frt/LH Amt</option>
                                        <option value="N"> Total Amt </option>                                         
                                    </select>
                                </div>
                            </div> 
                            <div class="col-md-3">
                                <div class="mb-3">                                    
                                    <label for="basicpill-phoneno-input">Branch Wise</label>
                                    <select id="formrow-inputState"
                                        formControlName="branchWise" 
                                        class="form-control form-select ng-pristine ng-touched">
                                        <option value="Y"> Yes</option>
                                        <option value="N"> No </option>                                         
                                    </select>
                                </div>
                            </div> 
                        </div>
                        <div class="row">                          
                            <div class="col-md-3">
                                <div class="dt-buttons btn-group flex-wrap export-button">
                                    <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                                        aria-controls="datatable-buttons" type="button" 
                                        (click)="exportBookingExcel()"><span>Booking Statemnet</span></button>
                                </div>
                            </div>                        
                            <div class="col-md-3">
                                <div class="dt-buttons btn-group flex-wrap export-button">
                                    <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                                        aria-controls="datatable-buttons" type="button" 
                                        (click)="exportLhExcel()"><span>Lorry Hire Statemnet</span></button>
                                </div>
                            </div>    
                        </div>                    
                        <div class="row">  &nbsp;  &nbsp;  &nbsp;  
                        </div>                             
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Branch </label>
                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="branch">
                                    <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                        {{branch.dataName}}
                                    </option>
                                </select>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">                                    
                                    <label for="basicpill-phoneno-input">With Budget</label>
                                    <select id="formrow-inputState"
                                        formControlName="budget" 
                                        class="form-control form-select ng-pristine ng-touched">
                                        <option value="Y"> Yes</option>
                                        <option value="N"> No </option>                                         
                                    </select>
                                </div>
                            </div> 
                        </div>
                        <div class="row">             
                            <div class="col-md-3">
                                <div class="dt-buttons btn-group flex-wrap export-button">
                                    <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                                        aria-controls="datatable-buttons" type="button" 
                                        (click)="exportAdminExcel()"><span>Admin Exp Statemnet</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
