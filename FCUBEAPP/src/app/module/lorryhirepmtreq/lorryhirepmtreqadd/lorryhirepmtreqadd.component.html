<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Lorry Hire Extra Payment Request</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Req. Branch </label><span style="color: red">*</span>  
                                                <select class="form-control form-select ng-pristine ng-touched"
                                                 formControlName="reqBranch"
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['reqBranch'].invalid) }"> 
                                                    <option *ngFor="let br of branchList" value={{br.dataId}}>
                                                        {{br.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-2">
                                                <label for="formrow-inputZip">Req. Date</label><span style="color: red">*</span>    
                                                <input bsdatepicker="" type="date" autoclose="false" 
                                                min="{{minDate}}" max="{{maxDate}}"   
                                                formControlName="reqDate" class="form-control"
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['reqDate'].invalid) }">
                                            </div>
                                        </div>   
                                    </div>
                                    <div class="row"> 
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Challan Year </label><span style="color: red">*</span>  
                                                <select class="form-control form-select ng-pristine ng-touched"
                                                 formControlName="chYear"
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['chYear'].invalid) }"> 
                                                    <option *ngFor="let br of yearList" value={{br.dataId}}>
                                                        {{br.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>        
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Challan Branch </label><span style="color: red">*</span>  
                                                <select class="form-control form-select ng-pristine ng-touched"
                                                 formControlName="challanBranch"
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['challanBranch'].invalid) }"> 
                                                    <option *ngFor="let br of branchList" value={{br.dataId}}>
                                                        {{br.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-2">
                                                <label for="formrow-inputZip">Challan No</label><span style="color: red">*</span>    
                                                <input autoclose="false" (change)="getChallanDetails()"
                                                formControlName="challanNo" class="form-control"
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['challanNo'].invalid) }">
                                            </div>
                                        </div>   
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Extra Hamali</label>
                                                <input type="text" numbersonly id="formrow-inputCity" class="form-control"
                                                formControlName="extraHamali"> 
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Extra Deten</label>
                                                <input type="text" numbersonly id="formrow-inputCity" class="form-control"
                                                formControlName="extraDeten"> 
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Extra Others</label>
                                                <input type="text" numbersonly id="formrow-inputCity" class="form-control"
                                                formControlName="extraOthers"> 
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Extra Others2</label>
                                                <input type="text" numbersonly id="formrow-inputCity" class="form-control"
                                                formControlName="extraOthers2"> 
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Extra Others3</label>
                                                <input type="text" numbersonly id="formrow-inputCity" class="form-control"
                                                formControlName="extraOthers3"> 
                                            </div>
                                        </div>
                                    </div>                                    
                                    <div class="row">
                                        <div class="col-lg-5">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Remarks</label>
                                                <input type="text" maxlength="250" uppercaseonly id="formrow-inputCity" class="form-control"
                                                formControlName="remarks"> 
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">  
                                        <div class="col-lg-4">
                                            <div class="mb-2">
                                                <label for="formrow-inputZip">Attach </label>                          
                                                <input #attachPathInput class="form-control" type="file" id="formAttach1File"
                                                accept="image/*">
                                                <a *ngIf="selectedLorryhirereqDetails.attachPath" target="_blank"
                                                            href={{attachPath}}>Download</a>
                                            </div>
                                        </div> 
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>                            
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md"  *ngIf="(editMode && editStatus) || (!editMode && createStatus)"
                                (click)="submitextrapmtreqForm()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteextrapmtreq()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                    <!-- end col -->
                </div>  
            </form>
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
