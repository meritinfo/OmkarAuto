<div class="main-content">
   <div class="page-content">
      <div class="container-fluid">
          <!-- start page title -->
         <div class="row">
            <div class="col-12">
               <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                  <h4 class="mb-sm-0 font-size-18">BPCL Card Amount Return</h4>
               </div>
            </div>
         </div>
          <!-- end page title -->
         <form (keydown.enter)="$event.preventDefault()"[formGroup]="formRequestRecharge">
            <div class="row">
               <div class="col-lg-12">
                  <div class="card">
                     <div class="card-body">                               
                        <div class="row">
                           <div class="col-lg-3">
                              <div class="mb-3">
                                 <label for="basicpill-phoneno-input">Branch</label><span style="color: red">*</span>
                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="returnBranch" 
                                       [ngClass]="{ 'is-invalid': formSubmitted && (f['returnBranch'].invalid) }" >
                                          <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                              {{branch.dataName}}
                                          </option>
                                    </select>
                              </div>
                           </div>
                           <div class="col-lg-3">
                              <div class="mb-3">
                                 <label for="basicpill-phoneno-input">Date </label><span style="color: red">*</span>
                                 <input type="date" class="form-control" formControlName="returnDate"
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['returnDate'].invalid) }" >
                              </div>
                           </div>
                           <div class="col-lg-3">
                              <div class="mb-3">
                                 <label for="formrow-inputCity">Vehicle No</label><span style="color: red">*</span>    
                                 <div class="ng-autocomplete">
                                    <ng-autocomplete [data]="vehicleList"
                                       [searchKeyword]="keywordLocation"  
                                       formControlName="vehicleMasterId"
                                       (selected)='selectEvent($event)'
                                       [itemTemplate]="itemTemplate"
                                       [notFoundTemplate]="notFoundTemplate"
                                       [customFilter]="endWithFilter">
                                    </ng-autocomplete>
                                    <ng-template #itemTemplate let-item>
                                       <a [innerHTML]="item.dataName"></a>
                                    </ng-template>
                                    <ng-template #notFoundTemplate let-notFound>
                                       <div [innerHTML]="notFound"></div>
                                    </ng-template>
                                 </div>
                              </div>
                           </div>  
                        </div>
                        <div class="row">  
                           <div class="col-lg-3">
                              <div class="mb-3">
                                 <label for="basicpill-phoneno-input">Fleet Card </label>
                                 <div class="ng-autocomplete">
                                    <ng-autocomplete [data]="fleetCardList"
                                        [searchKeyword]="keywordLocation"  
                                        formControlName="fleetCard"
                                        [itemTemplate]="itemTemplate"
                                        [notFoundTemplate]="notFoundTemplate"
                                        [customFilter]="endWithFilter">
                                    </ng-autocomplete>

                                    <ng-template #itemTemplate let-item>
                                        <a [innerHTML]="item.dataName"></a>
                                    </ng-template>
                                    <ng-template #notFoundTemplate let-notFound>
                                        <div [innerHTML]="notFound"></div>
                                    </ng-template>
                                 </div>
                              </div>
                           </div>
                           <div class="col-lg-3">
                               <label for="formrow-inputCity" >Card Balance Amt: <span style="color: Red;">{{this.balanceAmt}}</span></label>   
                           </div>
                           <div class="col-lg-3">
                              <div class="mb-3">
                                 <label for="basicpill-phoneno-input">Amount</label><span style="color: red">*</span>
                                 <input type="text" class="form-control" decimalonly autocomplete="off" 
                                   formControlName="returnAmt"  (change)="CardBalCheck($event)"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['returnAmt'].invalid) }" >
                              </div>
                           </div>
                        </div>
                        <div class="row">              
                           <div class="col-lg-9">
                              <div class="mb-3">
                                 <label for="basicpill-phoneno-input">Remarks</label>
                                 <input type="text" class="form-control" uppercaseonly 
                                    formControlName="remarks" 
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['remarks'].invalid) }" >
                              </div>
                           </div>
                        </div>
                       
                     </div>
                      <!-- end card body -->
                  </div>
                   <!-- end card -->
               </div>
            </div>
            <div class="row text-right">
               <div class="col-lg-12">
                  <div class="tex">
                     <button class="btn btn-primary w-md" 
                        *ngIf="((!editMode && createStatus)) && !formSubmitted"
                        (click)="fleetCardReturnTransferSave()">Transfer</button> &nbsp;
                      <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                  </div>
               </div>
            </div>
         </form>
          <!-- end row -->
          <!-- end row -->
      </div>
       <!-- container-fluid -->
   </div>
    <!-- End Page-content -->
</div>
