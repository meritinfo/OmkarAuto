<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Document Allotment</h4>
                    </div>
                </div>
            </div>
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Branch</label>
                                    <select formControlName="branchCode"
                                    class="form-control form-select ng-pristine ng-touched"> 
                                        <option value="">All</option>
                                        <option *ngFor="let br of branchList" value={{br.dataId}}>
                                        {{br.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Doc Type</label>
                                    <select id="formrow-inputState" class="form-control" 
                                            formControlName="docType"  
                                            class="form-control form-select ng-pristine ng-touched"> 
                                            <option value="">All</option>
                                            <option value="CN">Consignment</option>
                                            <option value="CH">Challan</option>
                                            <option value="BL">Bill</option>                                      
                                    </select>                                                
                                </div>                                              
                            </div>          
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                        (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="row top-controls">                
                <div class="col-sm-12 col-md-12 text-right">
                    <button class="btn btn-primary buttons-html5" type="button"  *ngIf="createStatus"
                    (click)="adddocumentallotment()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>branch</th>
                            <th>docType</th>
                            <th>allotDate</th>
                            <th>rangeFrom</th>
                            <th>rangeTo</th>
                            <th>docStatus</th>   
                            <th>docStatus</th>                       
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allDocumentAllotment.documentAllotmentLists?.length != 0">
                        <tr *ngFor="let ren of allDocumentAllotment.documentAllotmentLists">
                            <td>{{ ren.branch }}</td>                    
                            <td>{{ ren.docType }}</td>               
                            <td>{{ ren.allotDate }}</td>
                            <td>{{ ren.rangeFrom }}</td>
                            <td>{{ ren.rangeTo }}</td>
                            <td>{{ ren.docStatus }}</td>   
                            <td>{{ ren.remarks }}</td>                  
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="getdocumentallotmentdocuments(ren)"></button>             
                            </td>  
                        </tr>
                    </tbody>
                    <tbody *ngIf="allDocumentAllotment.documentAllotmentLists?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
