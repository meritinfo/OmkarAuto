
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Recharge Request</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   (click)="search()">
                                        <span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="row top-controls">
                    <div class="col-sm-12 col-md-12 text-right">
                        <button class="btn btn-primary buttons-html5" type="button"  *ngIf="createStatus"
                            (click)="rechargeRequestAdd()"><span>New</span></button>
                    </div>
                </div>
                <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                    <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive w-100">
                        <thead>
                            <tr>
                                <th>Action</th>                      
                                <th>Req Date </th>  
                                <th>Req Card </th>                      
                                <th>Vehicle No </th>                         
                                <th>Amount</th> 
                                 <th>Status</th>                   
                              
                            </tr>
                        </thead>
                        <tbody *ngIf="allRechargerequestlist.rechargeRequestLst">
                            <tr *ngFor="let br of allRechargerequestlist.rechargeRequestLst">                     
                                <td>
                                    <button type="button" class="btn btn-edit" 
                                    (click)="getRechargeRequestDetails(br)" ></button>             
                                </td> 
                                <td>{{ br.reqDate }}</td>                    
                                <td>{{ br.vehicleNo }}</td>                   
                                <td>{{ br.cardNo }}</td>                   
                                <td>{{ br.reqAmt }}</td>   
                                <td>{{ br.approvedYN }}</td>                   

                            </tr>
                        </tbody>
                        <tbody *ngIf="allRechargerequestlist.rechargeRequestLst?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
                    </table>  
                </div> 
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
