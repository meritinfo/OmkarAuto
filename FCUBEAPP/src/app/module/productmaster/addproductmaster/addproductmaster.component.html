<div class="main-content">
   <div class="page-content">
      <div class="container-fluid">
         <!-- start page title -->
         <div class="row">
            <div class="col-12">
               <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                  <h4 class="mb-sm-0 font-size-18">Product Master</h4>
               </div>
            </div>
         </div>
         <!-- end page title -->
         <form [formGroup]="formUser">
            <div class="row">
               <div class="col-lg-12">
                  <div class="card">
                     <div class="card-body">
                        <div class="row">
                           <div class="col-sm-2">
                              <div class="mb-4">
                              <label for="horizontal-firstname-input" class="col-form-label">
                                 Product Name</label>
                              <span style="color: red">*</span>
                           </div>
                           </div>
                           <div class="col-sm-4">
                              <div class="mb-4">
                              <input type="text" autofocus="autofocus" class="form-control"
                                 uppercaseonly formControlName="productName"  (change)="chkProductDuplicate()"
                                 [ngClass]="{ 'is-invalid': userSubmitted && (f['classDesc'].invalid) }">
                           </div>
                        </div>
                           
                        </div>
                        
                        <div class="row">
                           <div class="col-sm-2">
                              <label for="horizontal-firstname-input" class="col-form-label">
                                 IsActive</label>
                              <span style="color: red">*</span>
                           </div>
                           <div class="col-sm-4">
                              <select class="form-control" formControlName="isActive"   
                              [ngClass]="{ 'is-invalid': userSubmitted && (f['isActive'].invalid) }">
                                    <option value="Y" >Yes</option>
                                    <option value="N" >No</option>
                              </select>
                           </div>
                        </div>
                     </div>
                     <!-- end card body -->
                  </div>
                  <!-- end card -->
               </div>
            </div>
            <div class="row text-right">
               <div class="col-lg-12">
                  <div class="tex">
                     <button class="btn btn-primary w-md"
                        (click)="submitProductMasterForm()">Save</button>
                     <button class="btn btn-danger w-md m-2" 
                        (click)="deleteProductMaster()">Delete</button> &nbsp;
                     <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                  </div>
               </div>
            </div>
         </form>
         <!-- end row -->
      </div>
       <!-- container-fluid -->
   </div>
    <!-- End Page-content -->
 </div>
