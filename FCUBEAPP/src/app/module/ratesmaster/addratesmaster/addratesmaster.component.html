<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Rates Master </h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formRatesMaster">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="row">
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label for="formrow-inputZip">Account Name</label>
                                                    <span style="color: red">*</span>                                                    
                                                    <div class="ng-autocomplete">
                                                        <ng-autocomplete [data]="creditacList"
                                                            [searchKeyword]="keywordLocation" 
                                                            [itemTemplate]="itemTemplate"
                                                            [notFoundTemplate]="notFoundTemplate"
                                                            [customFilter]="startWithFilter"
                                                            formControlName="accountid"
                                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['accountid'].invalid) }">
                                                        </ng-autocomplete>

                                                        <ng-template #itemTemplate let-item>
                                                            <a [innerHTML]="item.dataName"></a>
                                                        </ng-template>

                                                        <ng-template #notFoundTemplate let-notFound>
                                                            <div [innerHTML]="notFound"></div>
                                                        </ng-template>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">From Point</label>
                                                    <span style="color: red">*</span>
                                                    <div class="ng-autocomplete">
                                                        <ng-autocomplete [data]="locationList"
                                                            [searchKeyword]="keywordLocation"  
                                                            [itemTemplate]="itemTemplate"
                                                            [notFoundTemplate]="notFoundTemplate"
                                                            [customFilter]="startWithFilter"
                                                            formControlName="fromPlace"  
                                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['fromPlace'].invalid) }">
                                                        </ng-autocomplete>

                                                        <ng-template #itemTemplate let-item>
                                                            <a [innerHTML]="item.dataName"></a>
                                                        </ng-template>

                                                        <ng-template #notFoundTemplate let-notFound>
                                                            <div [innerHTML]="notFound"></div>
                                                        </ng-template>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-2">
                                                    <label for="formrow-inputCity">Valid From</label>
                                                    <span style="color: red">*</span>
                                                    <input autoclose="false" type="date"  
                                                        class="form-control" formControlName="validFrom"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['validFrom'].invalid) }">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-2">
                                                    <label for="formrow-inputCity">Valid To</label>
                                                    <span style="color: red">*</span>
                                                    <input autoclose="false" type="date"  
                                                        class="form-control" formControlName="validUpto"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['validUpto'].invalid) }">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-2">                                                 
                                                    <label for="formrow-inputCity">Rate Type</label>
                                                    <span style="color: red">*</span>
                                                    <select formControlName="rateTypeId"
                                                    class="form-control form-select ng-pristine ng-touched"                                            
                                                    (change)="onRateTypeChange($event)"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['rateTypeId'].invalid) }">
                                                    <option *ngFor="let rtl of rateList" value={{rtl.dataId}}>
                                                        {{rtl.dataName}}
                                                    </option>
                                                </select>
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-2">
                                                    <label for="formrow-inputCity">Rate Method</label>
                                                    <span style="color: red">*</span>
                                                    <input numbersonly autoclose="false" class="form-control"
                                                    formControlName="rateMethod" 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['rateMethod'].invalid) }">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">State Or ToPlace</label>
                                                    <span style="color: red">*</span>
                                                    <select class="form-control" formControlName="rateForStateOrToPlace"   
                                                    class="form-control form-select ng-pristine ng-touched" 
                                                    (change)="onStateorPlaceChange($event)"  
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['rateForStateOrToPlace'].invalid) }">
                                                        <option value="P" >To Place</option>
                                                        <option value="S" >State</option>
                                                     </select>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="formrow-inputZip">Vehicle Type</label>
                                                    <span style="color: red">*</span>
                                                    <select class="form-control"
                                                        formControlName="vehicleTypeGroupId" 
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleTypeGroupId'].invalid) }">
                                                        <option *ngFor="let ac of vehicleGrpList"  value={{ac.dataId}}>
                                                            {{ac.dataName}}
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body -->
                            </div>
                            <!-- end card -->
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4"></h4>
                                    <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                        <tr>
                                            <td class="col-lg-2">
                                                <label for="formrow-inputZip">
                                                    <h6>To place</h6>
                                                </label>
                                            </td>
                                            <td class="col-lg-2">
                                                <label for="formrow-inputZip">
                                                    <h6>Destination State</h6>
                                                </label>
                                            </td>
                                            <td class="col-lg-2">
                                                <label for="formrow-inputZip">
                                                    <h6>Rate</h6>
                                                </label>
                                            </td>
                                        </tr>
                                        <tr formArrayName="arrayList"
                                            *ngFor="let arrayData of formArray.controls; let i = index">
                                            <div [formGroupName]="i" class="grid-table">
                                                <td class="col-lg-2">
                                                    <div class="ng-autocomplete">
                                                        <ng-autocomplete [data]="locationList"
                                                            [searchKeyword]="keywordLocation"  
                                                            (selected)='selectNewEvent($event,i)'
                                                            (inputChanged)='onChangeSearch($event)'
                                                            (inputFocused)='onFocused($event)'
                                                            [itemTemplate]="itemTemplate"
                                                            [notFoundTemplate]="notFoundTemplate"
                                                            [customFilter]="startWithFilter"
                                                            formControlName="toPlace">
                                                        </ng-autocomplete>

                                                        <ng-template #itemTemplate let-item>
                                                            <a [innerHTML]="item.dataName"></a>
                                                        </ng-template>

                                                        <ng-template #notFoundTemplate let-notFound>
                                                            <div [innerHTML]="notFound"></div>
                                                        </ng-template>
                                                    </div>
                                                </td>
                                                <td class="col-lg-2">                                                  
                                                    <div class="ng-autocomplete">
                                                        <ng-autocomplete [data]="stateList"
                                                            [searchKeyword]="keywordLocation"  
                                                            (selected)='selectEvent($event)'
                                                            (inputChanged)='onChangeSearch($event)'
                                                            (inputFocused)='onFocused($event)'
                                                            [itemTemplate]="itemTemplate"
                                                            [notFoundTemplate]="notFoundTemplate"
                                                            [customFilter]="startWithFilter"
                                                            formControlName="destState">
                                                        </ng-autocomplete>

                                                        <ng-template #itemTemplate let-item>
                                                            <a [innerHTML]="item.dataName"></a>
                                                        </ng-template>

                                                        <ng-template #notFoundTemplate let-notFound>
                                                            <div [innerHTML]="notFound"></div>
                                                        </ng-template>
                                                    </div>
                                                </td>
                                                <td class="col-lg-2">
                                                    <input decimalonly autoclose="false" class="form-control"
                                                        formControlName="rate">
                                                </td>
                                                <td class="col-lg-4">
                                                    <div class="col-lg-4 details-button">
                                                        <button *ngIf="i === formArray.controls.length-1" type="button"
                                                            class="btn btn-add" (click)="addItem(i)"></button>
                                                        <button *ngIf="formArray.controls.length > 1"
                                                            (click)="removeItem(i)" class="btn btn-delete"></button>
                                                    </div>                                        
                                                </td>
                                            </div>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>                               
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="submitRatesMasterForm()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteRatesMasterForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                    <!-- end col -->
                </div>  
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
