<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Tyre Stock Report</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Brand </label><span style="color: red">*</span>    
                                    <select class="form-control" formControlName="brandId"   
                                        class="form-control form-select ng-pristine ng-touched" >
                                            <option *ngFor="let vehi of brandList" value={{vehi.dataId}}>
                                                {{vehi.dataName}}
                                            </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-2">
                                    <label for="basicpill-phoneno-input">Report Type</label>
                                    <select id="formrow-inputState" 
                                        formControlName="rptType" 
                                        class="form-control form-select ng-pristine ng-touched">
                                        <option value="N"> New + DeActive</option>
                                        <option value="R"> Regroup </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary" type="submit" 
                                    (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <div class="dt-buttons btn-group flex-wrap export-button">
                        <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button" 
                            (click)="exportExcel()"><span>Excel</span></button>
                    </div>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive w-100">
                    <thead>
                        <tr>
                            <th>tyreNo</th>
                            <th>brandID</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allTyremgntRptlist.tyreList?.length != 0">
                        <tr *ngFor="let eta of allTyremgntRptlist.tyreList">
                            <td>{{ eta.tyreNo }}</td>
                            <td>{{ eta.brandName }}</td> 
                        </tr>
                    </tbody>
                    <tbody *ngIf="allTyremgntRptlist.tyreList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
   <!-- End Page-content -->
</div>
