<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Consignment</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item">Consignment</li>
                                <li class="breadcrumb-item active">Consignment </li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
           
            <!-- end page title -->
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step1Active}" data-toggle="tab" aria-controls="step1" role="tab"
                        title="Step 1">Booking</a>
                </li>
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step2Active}" data-toggle="tab" aria-controls="step2" role="tab"
                        title="Step 2">Cnor/Cnee</a>
                </li>
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step3Active}" data-toggle="tab" aria-controls="step3" role="tab"
                        title="Step 3">Freight</a>
                </li>
            </ul>
            <form role="form" [formGroup]="formUser">
                <div class="tab-content">
                    <div class="tab-pane mt-4" [ngClass]="{'active' : step1Active}" role="tabpanel" id="step1">
                        <div class="row">
                            <div class="col-lg-2">                                
                                <div class="form-check">
                                    <input type="checkbox"  
                                        (change)="onLrManualChange($event)"
                                        class="form-check-input" >
                                    <label for="neft" class="form-check-label">LR Manual Entry
                                    </label>
                                </div>                          
                            </div>     
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">LR No.</label>
                                    <span style="color: red">*</span>
                                    <input type="text" id="formrow-inputCity" class="form-control" placeholder=""
                                        formControlName="gcNoteNo" maxlength="15" (change)="onLrChange()"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['gcNoteNo'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3"><label for="formrow-inputZip">Booking Date</label><span
                                        style="color: red">*</span>
                                    <input bsdatepicker="" type="date" autoclose="false" placeholder="yyyy-mm-dd"
                                        formControlName="bookingDate" max="{{maxDate}}" class="form-control"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['bookingDate'].invalid) }">
                                </div>
                            </div>                              
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Job No.</label>
                                    <span style="color: red">*</span>
                                    <input type="text" id="formrow-inputCity" class="form-control" placeholder=""
                                        formControlName="jobNo" 
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['jobNo'].invalid) }">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Book Status</label><span style="color: red">*</span>
                                    <select id="formrow-inputState"
                                        class="form-control form-select ng-pristine ng-touched"
                                        formControlName="bookingStatus"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['bookingStatus'].invalid) }">
                                        <option value="TBB">TBB</option>
                                        <option value="TP">To Pay</option>
                                        <option value="Paid">Paid</option>
                                        <option value="FOC">FOC</option>
                                        <option value="Can">Cancel</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Division</label><span style="color: red">*</span>
                                    <select formControlName="divType"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['divType'].invalid) }">
                                        <option value="L">Logistics</option>
                                        <option value="P">Packers</option>
                                        <option value="R">Retail</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Delivery Type</label><span style="color: red">*</span>
                                    <select formControlName="delType"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['delType'].invalid) }">
                                        <option *ngFor="let dl of delTypeList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Client Type</label><span style="color: red">*</span>
                                    <select formControlName="clientType"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['clientType'].invalid) }">                                        
                                        <option value="NR">Non Relocation</option>
                                        <option value="DP">Domestic Private</option>
                                        <option value="DC">Domestic Corp</option>
                                        <option value="IM">Import</option>
                                        <option value="EX">Export</option>
                                        <option value="IN">Individual</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="form-check mb-3">
                                    <input type="radio" formControlName="ewayBillEntryType" id="formRadios1" value="A"
                                        class="form-check-input" name="ewayBillEntryType" (change)="changeEWay('A')" />
                                    <label for="formRadios1" class="form-check-label" style="color:green">
                                        Get ALL From EWayBill API
                                    </label>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="form-check">
                                    <input type="radio" formControlName="ewayBillEntryType" id="formRadios2" value="M"
                                        class="form-check-input" name="ewayBillEntryType" (change)="changeEWay('M')" />
                                    <label for="formRadios2" class="form-check-label" style="color:green">
                                        EWay Bill Manual Entry
                                    </label>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="form-check">
                                    <input type="radio" name="ewayBillEntryType" formControlName="ewayBillEntryType"
                                        id="formRadios3" value="E" class="form-check-input" name="ewayBillEntryType"
                                        (change)="changeEWay('E')">
                                    <label for="formRadios3" class="form-check-label" style="color:green">
                                        No EWay Bill Exemption
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">EWay Bill No</label>
                                    <div class="hstack gap-1">
                                        <input type="text" maxlength="15" class="form-control" placeholder=" "
                                            formControlName="ewayBillNo"
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['ewayBillNo'].invalid) }">
                                        <button type="button" class="btn btn-primary"
                                            (click)="searchGSTDetails()">Search</button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">EWay Bill Date</label>
                                    <input bsdatepicker="" type="date" autoclose="false" placeholder="yyyy-mm-dd"
                                        max="{{maxDate}}" formControlName="ewayBillDate" class="form-control">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Vehicle No</label>
                                    <input uppercaseonly type="text" id="formrow-inputCity" class="form-control" placeholder=""
                                        formControlName="truckNo"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['truckNo'].invalid) }">                                    
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">From Place</label><span style="color: red">*</span>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="locationList" formControlName="fromPlace"
                                            [searchKeyword]="keywordLocation" placeholder=""
                                            (selected)='selectEvent($event)' 
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate" 
                                            [customFilter]="startWithFilter"
                                            [ngClass]="{'is-invalid': formSubmitted && (f['fromPlace'].invalid)}">
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>
                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">To Place</label><span style="color: red">*</span>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="locationList" formControlName="toPlace"
                                            [searchKeyword]="keywordLocation" placeholder=""
                                            (selected)='selectEvent($event)' 
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate" 
                                            [customFilter]="startWithFilter"
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['toPlace'].invalid) }">
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>
                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-1">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">kMs</label>
                                    <input type="text" numbersonly maxlength="8" class="form-control" placeholder=" "
                                        formControlName="kms">
                                </div>
                            </div>
                        </div>
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-primary w-md next-step ms-2" 
                                    id="n-btn1" (click)="nextStep(2)">Save and continue</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane mt-4" [ngClass]="{'active' : step2Active}" role="tabpanel" id="step2">
                        <div class="row">
                            <div class="col-lg-4">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Consignor</label><span style="color: red">*</span>
                                    <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                        placeholder="" formControlName="cnorName"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['cnorName'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Cnor Gst</label>
                                    <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                        placeholder="" formControlName="cnorGstNo"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['cnorGstNo'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Cnor Mobile</label><span style="color: red">*</span>
                                    <input numbersonly class="form-control" formControlName="cnorMobile"
                                    maxlength="10"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['cnorMobile'].invalid) }">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-4">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Cnor Address 1</label>
                                    <input uppercaseonly class="form-control" formControlName="cnorAdr">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Cnor Address 2</label>
                                    <input uppercaseonly class="form-control" formControlName="cnorAdr1">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Cnor State</label>
                                    <select formControlName="cnorStateCode"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['cnorStateCode'].invalid) }">
                                        <option *ngFor="let dl of stateList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-1">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Cnor Pin</label>
                                    <input numbersonly maxlength="6" class="form-control" 
                                    formControlName="cnorPincode">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-4">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Consignee</label><span style="color: red">*</span>
                                    <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                        placeholder="" formControlName="cneeName"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['cneeName'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Cnee gst</label>
                                    <input uppercaseonly class="form-control" formControlName="cneeGstNo"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['cneeGstNo'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Cnee Mobile</label><span style="color: red">*</span>
                                    <input numbersonly class="form-control" formControlName="cneeMobile"
                                    maxlength="10"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['cneeMobile'].invalid) }">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-4">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Cnee Address 1</label>
                                    <input uppercaseonly class="form-control" formControlName="cneeAdr">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Cnee Address 2</label>
                                    <input uppercaseonly class="form-control" formControlName="cneeAdr1">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Cnee State</label>
                                    <select formControlName="cneeStateCode"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['cneeStateCode'].invalid) }">
                                        <option *ngFor="let dl of stateList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-1">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Cnee Pin</label>
                                    <input numbersonly maxlength="6" class="form-control" 
                                    formControlName="cneePincode">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-4">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Contents</label><span style="color: red">*</span>
                                    <select formControlName="productId"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['productId'].invalid) }">
                                        <option *ngFor="let data of contentList" value={{data.dataId}}>
                                            {{data.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>                            
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Packing Type</label><span style="color: red">*</span>
                                    <select formControlName="packingType"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['packingType'].invalid) }">
                                        <option *ngFor="let dl of packingList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>                           
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Vehical Type</label><span style="color: red">*</span>
                                    <select formControlName="vehType"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['vehType'].invalid) }">
                                        <option *ngFor="let dl of vehicalType" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Shipment No</label>
                                    <input uppercaseonly class="form-control" formControlName="shipmentNo">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3"><label for="formrow-inputZip">Invoice No</label><span style="color: red">*</span>
                                    <input type="text" id="formrow-inputCity" class="form-control" placeholder=""
                                        formControlName="cnorInvNo"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['cnorInvNo'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Invoice Value</label><span style="color: red">*</span>
                                    <input type="text" decimalonly autoclose="false" class="form-control"
                                        formControlName="declaredValue"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['declaredValue'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Invoice Date</label><span style="color: red">*</span>
                                    <input bsdatepicker="" type="date" autoclose="false" placeholder="yyyy-mm-dd"
                                        formControlName="cnorInvDate" max="{{maxDate}}" class="form-control"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['declaredValue'].invalid) }">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Load Length</label>
                                    <input type="text" decimalonly class="form-control" formControlName="loadLength"
                                        [ngClass]=>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Load Width</label>
                                    <input type="text" decimalonly class="form-control" formControlName="loadWidth"
                                        [ngClass]=>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Load Height</label>
                                    <input type="text" decimalonly class="form-control" formControlName="loadHeight"
                                        [ngClass]=>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Actual Wt</label><span style="color: red">*</span>
                                    <input type="text" decimalonly class="form-control" formControlName="actualWt"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['actualWt'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Charged Wt</label><span style="color: red">*</span>
                                    <input type="text" decimalonly class="form-control" formControlName="chargewt"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['chargewt'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Qty/Pkgs</label><span style="color: red">*</span>
                                    <input numbersonly autoclose="false" formControlName="noPackages" placeholder=" "
                                        class="form-control"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['noPackages'].invalid) }">
                                </div>
                            </div>
                        </div>
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-default prev-step"
                                        id="p-btn1" (click)="nextStep(1)">Previous</button>
                                    <button type="button" class="btn btn-primary w-md next-step ms-2" 
                                    id="n-btn2"  (click)="nextStep(3)">Save and continue</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane mt-4"  [ngClass]="{'active' : step3Active}" role="tabpanel" id="step3">
                        <div class="row">
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Rate Type</label><span style="color: red">*</span>
                                    <select formControlName="rateType"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['rateType'].invalid) }">
                                        <option *ngFor="let rate of rateList" value={{rate.dataId}}>
                                            {{rate.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Rate</label>
                                    <input type="text" decimalonly class="form-control" placeholder=" "
                                        formControlName="rateRs">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Freight</label>
                                    <input type="text" decimalonly class="form-control" placeholder=""
                                        formControlName="freightRs" (change)="calculateTotalAmount()">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Statistical</label>
                                    <input type="text" decimalonly class="form-control" placeholder=" "
                                        formControlName="statisticalRs" (change)="calculateTotalAmount()">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Sub Total</label>
                                    <input type="text" decimalonly class="form-control" placeholder=""
                                        formControlName="subTotalRs" [ngClass]=>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Net Total</label>
                                    <input type="text" decimalonly class="form-control" placeholder=""
                                        formControlName="gtotalRs" [ngClass]=>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Billing Stn</label><span style="color: red">*</span>
                                    <select formControlName="billingStn"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['billingStn'].invalid) }">
                                        <option *ngFor="let dl of branchList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Billing Party </label><span style="color: red">*</span>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="partyList" 
                                            formControlName="billingParty"
                                            [searchKeyword]="keywordLocation" placeholder=""
                                            (selected)='selectEvent($event)' 
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate" 
                                            [customFilter]="startWithFilter"
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['billingParty'].invalid) }">
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>
                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Business By </label><span style="color: red">*</span>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="businessByList" 
                                            formControlName="businessBy"
                                            [searchKeyword]="keywordLocation" placeholder=""
                                            (selected)='selectEvent($event)' 
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate" 
                                            [customFilter]="startWithFilter"
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['businessBy'].invalid) }">
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>
                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>

                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-8">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Remarks</label>
                                    <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                        placeholder="" formControlName="generalRemarks" [ngClass]=>
                                </div>
                            </div>
                        </div>
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-default prev-step"
                                        id="p-btn2" (click)="nextStep(2)">Previous</button>
                                    <button type="button" class="btn btn-primary w-md next-step ms-2" id="n-btn3"
                                        (click)="submitLrDetailsForm()">Save</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="clearfix"></div>
                </div>
            </form>
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
