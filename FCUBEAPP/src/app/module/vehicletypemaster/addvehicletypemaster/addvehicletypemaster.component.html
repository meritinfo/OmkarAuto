
<div class="main-content">
   <div class="page-content">
       <div class="container-fluid">
           <!-- start page title -->
           <div class="row">
               <div class="col-12">
                   <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                       <h4 class="mb-sm-0 font-size-18">Vehicle Type Master</h4>
                       <div class="page-title-right">
                           <ol class="breadcrumb m-0">
                               <!-- <li class="breadcrumb-item"><a href="/#/branchmasterlist">Branch Master</a></li>
                               <li class="breadcrumb-item active">Branch master Add</li> -->
                           </ol>
                       </div>
                   </div>
               </div>
           </div>
           <!-- end page title -->
           <form [formGroup]="formUser">
               <div class="ng-untouched ng-pristine ng-valid">
                   <div class="row">
                       <div class="col-lg-12">
                           <div class="card">
                               <div class="card-body">
                                   <div class="row">
                                       <div class="col-lg-3">
                                           <div class="mb-2">
                                               <label for="formrow-inputZip">Vehicle Type Desc</label>
                                               <span style="color: red">*</span>
                                               <input uppercaseonly type="text" class="form-control" placeholder=" "
                                               formControlName="vehicleTypeDesc"     (change)="chkVehTypeDuplicate()"     
                                               [ngClass]="">
                                           </div>
                                       </div>
                                   </div>   
                                   <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-2">
                                            <label for="formrow-inputZip">Vehicle Type</label>
                                            <span style="color: red">*</span>
                                            
                                            <select class="form-control" formControlName="vehicleTypeGroupId"      
                                            [ngClass]="">
                                                <option *ngFor="let state of vehicleTypeList" value={{state.dataId}}>
                                                   {{state.dataName}}
                                                </option>
                                             </select>
                                        </div>
                                    </div>
                                </div>   
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-2">
                                            <label for="formrow-inputZip">TonCap</label>
                                            <span style="color: red">*</span>
                                            <input numbersonly type="text" class="form-control" placeholder=" "
                                            formControlName="tonCap"         
                                            [ngClass]="">
                                        </div>
                                    </div>
                                </div>   
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-2">
                                            <label for="formrow-inputZip">RunPerDayKM</label>
                                            <span style="color: red">*</span>
                                            <input numbersonly type="text" class="form-control" placeholder=" "
                                            formControlName="runPerDayKM"         
                                            [ngClass]="">
                                        </div>
                                    </div>
                                </div>   
                                  
                                   
                                   
                                   
                                   
                                  
                               </div>
                           </div>
                       </div>
                   </div>
               </div>           
               <div class="row text-right">
                   <div class="col-lg-12">
                       <div class="tex">
                           <!-- <button class="btn btn-primary w-md" *ngIf="(editMode && editStatus) || (!editMode && createStatus)"
                           (click)="submitClassificationMasterForm()" >Save</button> &nbsp;   -->

                           <button class="btn btn-primary w-md" 
                           (click)="submitVehicleTypeMasterForm()" >Save</button> &nbsp;  
                           <button class="btn btn-danger w-md m-2" 
                           (click)="vehicleTypeMasterDelete()">Delete</button> &nbsp;
                           <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                       </div>
                   </div>
               </div>
           </form>
           <!-- end row -->
           <!-- end row -->
       </div>
       <!-- container-fluid -->
   </div>
   <!-- End Page-content -->

</div>
