
<div class="main-content">
   <div class="page-content">
       <div class="container-fluid">
           <!-- start page title -->
           <div class="row">
               <div class="col-12">
                   <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                       <h4 class="mb-sm-0 font-size-18">Create/Edit Vehicle Types</h4>
                   </div>
               </div>
           </div>
           <!-- end page title -->
           <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
               <div class="ng-untouched ng-pristine ng-valid">
                   <div class="row">
                       <div class="col-lg-12">
                           <div class="card">
                               <div class="card-body">
                                   <div class="row">
                                     <div class="col-lg-6">
                                         <div class="col-lg-6">
                                           <div class="mb-2">
                                               <label for="formrow-inputZip">Vehicle Type Desc</label>
                                               <span style="color: red">*</span>
                                               <input uppercaseonly type="text" class="form-control"  
                                               formControlName="vehicleTypeDesc"     (change)="chkVehTypeDuplicate()"     
                                               [ngClass]="">
                                           </div>
                                       </div>
                                            <div class="col-lg-6">
                                        <div class="mb-2">
                                            <label for="formrow-inputZip">Vehicle Type</label>
                                            <span style="color: red">*</span>                                            
                                            <select class="form-control form-select ng-pristine ng-touched"formControlName="vehicleTypeGroupId"      
                                            [ngClass]="">
                                                <option *ngFor="let state of vehicleTypeList" value={{state.dataId}}>
                                                   {{state.dataName}}
                                                </option>
                                             </select>
                                        </div>
                                    </div>
                                      <div class="col-lg-6">
                                        <div class="mb-2">
                                            <label for="formrow-inputZip">Ton Capacity</label>
                                            <span style="color: red">*</span>
                                            <input decimalonly autocomplete="off" type="text" class="form-control"  
                                            formControlName="tonCap"         
                                            [ngClass]="">
                                        </div>
                                    </div>
                                       <div class="col-lg-6">
                                        <div class="mb-2">
                                            <label for="formrow-inputZip">Run PerDay KM</label>
                                            <span style="color: red">*</span>
                                            <input decimalonly autocomplete="off" type="text" class="form-control"  
                                            formControlName="runPerDayKM"         
                                            [ngClass]="">
                                        </div>
                                    </div>

                                     </div>
                                       <div class="col-lg-6">
                                         <div class="ng-untouched ng-pristine ng-valid">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
            <tr>
              <td class="col-lg-2">
                <label for="formrow-inputZip">
                  <h6>Vehicle Type Alias</h6>
                </label>
              </td>
              <td class="col-lg-2">
                <label for="formrow-inputZip">
                  <h6>Action</h6>
                </label>
              </td>
            </tr>

            <tr formArrayName="arrayList" *ngFor="let arrayData of formRatesArray.controls; let i = index">
              <div [formGroupName]="i" class="grid-table">
                <td class="col-lg-2">
                  <input
                    autoclose="false"
               
                    class="form-control" (change)="selectToLocationEvent($event,i)"
                    formControlName="vehTypeAlias" uppercaseonly  
                  />
                </td>
                <td class="col-lg-4">
                  <div class="col-lg-4 details-button">
                    <button
                      *ngIf="i === formRatesArray.controls.length - 1"
                      type="button"
                      class="btn btn-add"
                      (click)="addItem(i)"
                    ></button>
                    <button
                      *ngIf="formRatesArray.controls.length > 1"
                      (click)="removeItem(i)"
                      class="btn btn-delete"
                    ></button>
                  </div>
                </td>
              </div>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

                                     </div> 
                                   </div>                                    
                               </div>
                           </div>
                       </div>
                   </div>
               </div>           
               <div class="row text-right">
                   <div class="col-lg-12">
                       <div class="tex">
                           <button class="btn btn-primary w-md"  
                           *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                           (click)="submitVehicleTypeMasterForm()" >Save</button> &nbsp;  
                           <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                           (click)="vehicleTypeMasterDelete()">Delete</button> &nbsp;
                           <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                       </div>
                   </div>
               </div>
           </form>
           <!-- end row -->
           <!-- end row -->
       </div>
       <!-- container-fluid -->
   </div>
   <!-- End Page-content -->

</div>
