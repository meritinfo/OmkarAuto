


<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Transport Master</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Transporter Name</label>
                                    <input type="text" class="form-control" formControlName="tptName">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary" type="submit" (click)="search()">
                                        <span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12 text-right">
                    <button class="btn btn-primary buttons-html5" type="button"
                    (click)="addTransportMaster()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>tptName</th>
                            <th>address1</th>
                            <th>address2</th>
                            <th>address3</th>
                            <th>address4</th>
                            <th>stateCode</th>
                            <th>pinCode</th>                         
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allTransportMaster.transportMastersList?.length != 0">
                        <tr *ngFor="let brandmaster of allTransportMaster.transportMastersList">
                            <td>{{ brandmaster.tptName }}</td>
                            <td>{{ brandmaster.address1 }}</td>
                            <td>{{ brandmaster.address2 }}</td>
                            <td>{{ brandmaster.address3 }}</td>
                            <td>{{ brandmaster.address4 }}</td>
                            <td>{{ brandmaster.stateCode }}</td>
                            <td>{{ brandmaster.pinCode }}</td> 
                            <td>                               
                                <button type="button" class="btn btn-edit" 
                                    (click)="getTransportMasterDetails(brandmaster)"></button> 
                            </td>
                        </tr>
                    </tbody>
                    <tbody *ngIf="allTransportMaster.transportMastersList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
