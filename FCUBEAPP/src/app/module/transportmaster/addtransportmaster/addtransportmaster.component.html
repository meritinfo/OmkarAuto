<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Transport Master</h4>
                    </div>
                </div>
            </div>
          <!-- end page title -->
            <form [formGroup]="formUser">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body"> 
                                <div class="row">
                                    <div class="col-sm-5">
                                        <div class="mb-3">
                                            <label>Tpt Name: </label><span style="color: red">*</span> 
                                            <input  uppercaseonly type="text" class="form-control" 
                                            formControlName="tptName" >
                                        </div>
                                    </div>
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Branch Code: </label>
                                            <select class="form-control" formControlName="branchCode"
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['branchCode'].invalid) }">
                                                <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>   
                                </div> 
                                <div class="row"> 
                                    <div class="col-sm-6">
                                        <div class="mb-3">
                                            <label>Address 1: </label><span style="color: red">*</span> 
                                            <input uppercaseonly type="text" class="form-control" 
                                            maxlength="200" formControlName="address1" >
                                        </div>
                                    </div>                          
                                 
                                    <div class="col-sm-6">
                                        <div class="mb-3">
                                            <label>Address 2: </label>
                                            <input uppercaseonly type="text" class="form-control" 
                                            maxlength="200" formControlName="address2" >
                                        </div>
                                    </div>   
                                </div> 
                                <div class="row">
                                    <div class="col-sm-6">
                                        <div class="mb-3">
                                            <label>Address 3: </label>
                                            <input uppercaseonly type="text" class="form-control" 
                                            maxlength="200" formControlName="address3" >
                                        </div>
                                    </div> 
                                    <div class="col-sm-6">
                                        <div class="mb-3">
                                            <label>Address 4: </label>
                                            <input uppercaseonly type="text" class="form-control" 
                                            maxlength="200" formControlName="address4" >
                                        </div>
                                    </div>   
                                </div> 
                                <div class="row">                                
                                    <div class="col-sm-3">
                                        <div class="mb-3">
                                            <label>StateCode: </label><span style="color: red">*</span> 
                                            <select class="form-control" formControlName="stateCode"      
                                            [ngClass]="">
                                                <option *ngFor="let state of stateList" value={{state.dataId}}>
                                                   {{state.dataName}}
                                                </option>
                                             </select>
                                        </div>
                                    </div>  
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Pin Code: </label>
                                            <input decimalonly type="text" numbersonly
                                            class="form-control" 
                                            formControlName="pinCode" >
                                        </div>
                                    </div>       
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Phone: </label>
                                            <input numbersonly type="text" maxlength="10"
                                            class="form-control" 
                                            formControlName="phone" >
                                        </div>
                                    </div>   
                                </div> 
                                <div class="row">                             
                                    <div class="col-sm-6">
                                        <div class="mb-3">
                                            <label>Email: </label>
                                            <input  type="text" 
                                            class="form-control" 
                                            formControlName="email" >
                                        </div>
                                    </div> 
                                    <div class="col-sm-3">
                                        <div class="mb-3">
                                            <label>Contact Person1: </label><span style="color: red">*</span> 
                                            <input uppercaseonly type="text"
                                            class="form-control" 
                                            formControlName="contactPerson1" >
                                        </div>
                                    </div>       
                                    <div class="col-sm-3">
                                        <div class="mb-3">
                                            <label>Mobile 1: </label><span style="color: red">*</span> 
                                            <input numbersonly type="text" class="form-control" maxlength="10"
                                            maxlength="200" formControlName="mobile1" >
                                        </div>
                                    </div>   
                                </div> 
                                <div class="row">        
                                    <div class="col-sm-3">
                                        <div class="mb-3">
                                            <label>Contact Person2: </label>
                                            <input uppercaseonly type="text" class="form-control" 
                                            maxlength="200" formControlName="contactPerson2" >
                                        </div>
                                    </div>  
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Mobile 2: </label>
                                            <input numbersonly maxlength="10" type="text" 
                                            class="form-control"
                                            formControlName="mobile2" >
                                        </div>
                                    </div> 
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>PanNo: </label>
                                            <input  type="text" 
                                            class="form-control" uppercaseonly
                                            formControlName="panNo" >
                                        </div>
                                    </div> 
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Gst No: </label>
                                            <input  type="text" 
                                            class="form-control" uppercaseonly
                                            formControlName="gstNo" >
                                        </div>
                                    </div> 
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>AadharNo: </label>
                                            <input numbersonly  type="text" 
                                            class="form-control"
                                            formControlName="aadharNo" >
                                        </div>
                                    </div>  
                                </div> 
                                <div class="row">
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Eligible ForBid: </label>                                           
                                            <select id="formrow-inputState" 
                                                class="form-control form-select ng-pristine ng-touched"
                                                formControlName="eligibleForBid"
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['isActive'].invalid) }">
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>                                                                                          
                                            </select>
                                        </div>
                                    </div> 
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Whatsapp Mobile No: </label>
                                            <input numbersonly  type="text"  maxlength="10"class="form-control"
                                            formControlName="whatsappMblNo" >
                                        </div>
                                    </div>                                 
                                    <div class="col-sm-6">
                                        <div class="mb-3">
                                            <label>Remarks: </label>
                                            <input  uppercaseonly type="text" 
                                            class="form-control"
                                            formControlName="remarks" >
                                        </div>
                                    </div>  
                                </div> 
                                <div class="row">
                                    <div class="col-sm-3">
                                        <div class="mb-3">
                                            <label>Is Active: </label>
                                            <select id="formrow-inputState" 
                                            class="form-control form-select ng-pristine ng-touched"
                                                formControlName="isActive"
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['isActive'].invalid) }">
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>                                                                                          
                                            </select>
                                        </div>
                                    </div> 
                                    <div class="col-sm-3">
                                        <div class="mb-3">
                                            <label >InActive Date: </label><span style="color: red">*</span>  
                                            <input type="date"  autofocus="autofocus" class="form-control"
                                            formControlName="inActiveDate"
                                            [ngClass]=>
                                        </div>
                                    </div>                                         
                                </div>                                
                            </div>                  
                            <!-- end card body -->
                        </div>                     
                        <!-- end card -->
                    </div>
                </div>  
                <div class="row">
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title mb-4" style="color: red;">Transport BidLocations</h4>
                                <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                    <tr>                                   
                                        <div class="col-lg-5">
                                            <label for="formrow-inputZip">
                                                <h6>Location</h6>
                                            </label>  
                                        </div>
                                    </tr>
                                    <tr formArrayName="transportDetailList"
                                        *ngFor="let miscData of formLocationArray.controls; let k = index">
                                        <div [formGroupName]="k">
                                            <td class="col-lg-5">                                         
                                                <select class="form-control" formControlName="locId">
                                                    <option *ngFor="let branch of locationList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </td> 
                                            <td class="col-lg-1">       
                                                <div class="details-button">                                               
                                                    <button *ngIf="k === formLocationArray.controls.length-1" type="button"
                                                        class="btn btn-add" (click)="addMiscItem(k)"></button>
                                                    <button *ngIf="formLocationArray.controls.length > 1"
                                                        (click)="removeMiscItem(k)" class="btn btn-delete"></button>
                                                </div>
                                            </td>
                                        </div>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>           
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title mb-4" style="color: red;">Transport States</h4>
                                <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                    <tr>
                                        <div class="row">
                                            <div class="col-lg-5">
                                                <label for="formrow-inputZip">
                                                    <h6>Select States </h6>
                                                </label>
                                            </div>                                      
                                        </div>
                                    </tr>
                                    <tr formArrayName="stateDetailList"
                                        *ngFor="let miscData of formStateArray.controls; let k = index">
                                        <div [formGroupName]="k">
                                            <td class="col-lg-5">
                                                <select class="form-control" formControlName="stateCode"      
                                                [ngClass]="">
                                                    <option *ngFor="let state of stateList" value={{state.dataId}}>
                                                    {{state.dataName}}
                                                    </option>
                                                </select>
                                            </td>  
                                            <td class="col-lg-1">
                                                <div class="details-button">
                                                    <button *ngIf="k === formStateArray.controls.length-1" type="button"
                                                        class="btn btn-add" (click)="addStateItem(k)"></button>
                                                    <button *ngIf="formStateArray.controls.length > 1"
                                                        (click)="removeStateItem(k)" class="btn btn-delete"></button>
                                                </div>
                                            </td>
                                        </div>
                                    </tr>
                                </table>
                            </div>      
                        </div>                             
                    </div>   
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title mb-4" style="color: red;">Vehicle Type</h4>
                                <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                    <tr>
                                        <div class="row">
                                            <div class="col-lg-5">
                                                <label for="formrow-inputZip">
                                                    <h6>Vehicle</h6>
                                                </label>
                                            </div>
                                        </div>
                                    </tr>
                                    <tr formArrayName="vehTypeDetailList"
                                        *ngFor="let miscData of formVehArray.controls; let k = index">
                                        <div [formGroupName]="k">
                                            <td class="col-lg-5">
                                                <select class="form-control" formControlName="vehTypeId">
                                                    <option *ngFor="let branch of vehicleTypeList"
                                                        value={{branch.dataId}}>  
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </td>  
                                            <td class="col-lg-1">
                                                <div class="details-button">
                                                    <button *ngIf="k === formVehArray.controls.length-1" type="button"
                                                        class="btn btn-add" (click)="addVehItem(k)"></button>
                                                    <button *ngIf="formVehArray.controls.length > 1"
                                                            (click)="removeVehItem(k)" class="btn btn-delete"></button>
                                                </div>
                                            </td>
                                        </div>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div> 
                    <div class="col-sm-2">
                        <div class="mb-3">
                            <label>Cancel Cheque: </label>
                            <input #attachmentInput1 class="form-control" type="file"
                            id="formAttFile" accept="image/*">
                        </div>
                    </div> 
                    <div class="col-sm-2">
                        <div class="mb-3">
                            <label>Address Proof: </label>
                            <input #attachmentInput class="form-control" type="file"
                                    id="formAttFile" accept="image/*">
                        </div>
                    </div> 
                </div>         
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                             <button class="btn btn-primary w-md" 
                                (click)="submitTransportMasterForm()">Save</button>&nbsp;                            
                            <button class="btn btn-danger w-md m-2" 
                                (click)="transportMasterDelete()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                    <!-- end col -->
                </div> 
            </form>
           <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
     <!-- End Page-content -->
</div>
