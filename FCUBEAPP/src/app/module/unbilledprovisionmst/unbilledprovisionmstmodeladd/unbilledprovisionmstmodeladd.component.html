<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="card-title mb-4">Unbilled Provision</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formProvision">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                   
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Provision Date </label><span style="color: red">*</span> 
                                                <input autoclose="false" type="date" min="{{minDate}}" max="{{maxDate}}"
                                                    class="form-control" formControlName="provisionDate"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['provisionDate'].invalid) }">
                                            </div>
                                        </div>
                                          <div class="col-lg-2">
                                            <div class="mb-3">
                                                <button (click)="searchStatement()" *ngIf="searchenable"
                                                    class="btn btn-primary w-md mt-4">Show</button>
                                            </div>
                                        </div>
                                                       
                                    </div>  
                                    <div class="row">                                          
                                       
                                
                                    
                                      
                                    </div>
                                </div>
                                <!-- end card body -->
                            </div>
                            <!-- end card -->
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4"></h4>
                                    <table class="table table-bordered dt-responsive nowrap w-100 no-border-table mb-5">

                                        <tr>
                                            <th><label for="formrow-inputCity">Branch</label></th>
                                            <th><label for="formrow-inputCity">Party</label></th>
                                            <th><label for="formrow-inputZip">UnBilled Amount</label></th>

                                        </tr>
                                        <tr formArrayName="arrayList"
                                            *ngFor="let arrayData of formArray.controls; let i = index">
                                            <div [formGroupName]="i" class="grid-table">
                                             
                                                
                                                <!-- <td>
                                                    <div class="mb-3">
                                                        <input class="form-control" formControlName="vehicleNo">
                                                        <input type="hidden" class="form-control" formControlName="vehicleMasterId">
                                                        <input type="hidden" class="form-control" formControlName="driverMasterId">
                                                    </div>
                                                </td> -->
                                                <td>
                                                    <div class="mb-3">
                                                        <input class="form-control" formControlName="branchName">
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="mb-3">
                                                        <input class="form-control" formControlName="partyName">
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="mb-3">
                                                        <input class="form-control" formControlName="amount">
                                                    </div>
                                                </td>
                                               
                                              
                                                
                                              
                                            </div>
                                        </tr>
                                    </table>
                                
                                
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button  class="btn btn-primary w-md" *ngIf=" (!editMode && createStatus)"
                                (click)="saveStatementDetails()">Save</button>
                            <button  class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="provisionDelete()">Delete</button>
                            <button  class="btn btn-secondary w-md m-2" 
                                (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
