
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Consignor/Consignee Master</h4>
                    </div>
                </div>
            </div>
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                             <div class="col-md-2">
                                <div class="mb-3">
                                    <div class="mb-3">
                                        <label for="basicpill-phoneno-input">Cnor Cnee Name </label>
                                        <input uppercaseonly type="text" class="form-control"
                                           formControlName="cnorCneeName"
                                          >                                                                                               
                                     </div>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="basicpill-phoneno-input">Branch</label>
                                    <select class="form-control form-select ng-pristine ng-touched"autoclose="false" 
                                    formControlName="branchCode">
                                       <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                           {{branch.dataName}}
                                       </option>
                                    </select>
         
                                 </div>
                            </div> 
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                        (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12 text-right">
                    <button class="btn btn-primary buttons-html5" type="button"
                        (click)="addCneeMastermaster()" *ngIf="createStatus"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">                    
                     <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                       <thead>
                        <tr>
                            <th>branch</th> 
                            <th>docCode </th>                      
                            <th>docDescription</th>
                            <th>reminderDays</th>      
                            <th>docDescription</th>           
                            <th>docDescription</th>
                            <th>reminderDays</th>                       
                            <th>Action</th>
                        </tr>

                        </thead>
                        <tbody *ngIf="allCnorcneeMaster.consigneeList?.length != 0">
                            <tr *ngFor="let ren of allCnorcneeMaster.consigneeList">               
                                <td>
                                    <button type="button" class="btn btn-edit" 
                                    (click)="getCneeMasterDetails(ren)"></button>             
                                </td>  
                                <td>{{ ren.bname }}</td>   
                                <td>{{ ren.cnorCneeName }}</td>                    
                                <td>{{ ren.printName }}</td> 
                                <td>{{ ren.cnorCneeFlag }}</td>               
                                <td>{{ ren.address1 }}</td> 
                                <td>{{ ren.phone }}</td>       
                                <td>{{ ren.email }}</td> 
                            </tr>
                        </tbody>
                        <tbody *ngIf="allCnorcneeMaster.consigneeList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
    
                    </table> 
                </div>
            </div>
        </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
