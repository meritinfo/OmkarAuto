<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">DO Vehicle Placement</h4>
                    </div>
                </div>
            </div>
          <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">  
                                <div class="row">
                                    <div class="col-sm-3">
                                        <div class="mb-3">
                                            <label>DO Branch: </label> 
                                            <select id="scope" class="form-select" formControlName="doBranch"
                                            class="form-control form-select ng-pristine ng-touched">
                                                <option *ngFor="let br of branchList" value={{br.dataId}}>
                                                    {{br.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label >DO No: </label>
                                            <input class="form-control" formControlName="doNo">
                                        </div>
                                    </div>  
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label >DO Date: </label>
                                            <input type="date" class="form-control" formControlName="doDate">
                                        </div>
                                    </div>                                                                                                         
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label style="color: red"> 
                                                <h6>Balance DO Qty: {{ this.baldoQty}} </h6> 
                                            </label>                                                 
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-5">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Party: </label>
                                            <input type="text" class="form-control" 
                                            formControlName="partyName">
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputState">Party Do No: </label>  
                                            <input type="text" class="form-control" 
                                            formControlName="partyDoNo" >
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Loading From: </label>
                                            <input type="text" class="form-control" 
                                            formControlName="loadingFr">
                                        </div>
                                    </div>
                                    <div class="col-lg-5">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Consignor: </label>
                                            <input type="text" class="form-control" 
                                            formControlName="cnorName">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Destination: </label>
                                            <input type="text" class="form-control" 
                                            formControlName="dest">
                                        </div>
                                    </div>
                                    <div class="col-lg-5">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Consignee: </label>
                                            <input type="text" class="form-control" 
                                            formControlName="cneeName">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">                                    
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label >Placement Date: </label><span style="color: red">*</span>  
                                            <input type="date" class="form-control" 
                                            min="{{minDate}}" max="{{maxDate}}" formControlName="placementDate" 
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['placementDate'].invalid) }">
                                        </div>
                                    </div>
                                    <div class="col-sm-3">
                                        <div class="mb-3">
                                            <label>Vehicle Type: </label><span style="color: red">*</span>
                                            <select id="scope" class="form-select" 
                                            formControlName="vehicleType" (change)="getVehiCapacity($event)"
                                            class="form-control form-select ng-pristine ng-touched"
                                            [ngClass]="{'is-invalid': formSubmitted && (f['vehicleType'].invalid)}">
                                                <option *ngFor="let br of vehicleTypeList" value={{br.dataId}}>
                                                    {{br.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>                                 
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label >Vehicle Capacity: </label><span style="color: red">*</span>  
                                            <input class="form-control" formControlName="vehicleCapacity" 
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleCapacity'].invalid) }">
                                        </div>
                                    </div>
                                    <div class="col-sm-3">
                                        <div class="mb-3">
                                            <label>Vehicle No: </label><span style="color: red">*</span>
                                            <input uppercaseonly type="text" class="form-control" 
                                            formControlName="vehicleNo" 
                                            [ngClass]="{'is-invalid': formSubmitted && (f['vehicleNo'].invalid)}">
                                        </div>
                                    </div>   
                                </div>
                                <div class="row">
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Own/Market: </label><span style="color: red">*</span> 
                                            <select id="scope" class="form-select" formControlName="ownMarket"
                                                class="form-control form-select ng-pristine ng-touched"
                                                [ngClass]="{'is-invalid': formSubmitted && (f['ownMarket'].invalid)}">
                                                <option value="O">Own</option>
                                                <option value="M">Market</option>
                                            </select> 
                                        </div>
                                    </div>  
                                    <div class="col-lg-5">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Broker: </label><span style="color: red">*</span>  
                                            <div class="ng-autocomplete">
                                                <ng-autocomplete [data]="brokerList" 
                                                    formControlName="brokerId"
                                                    [searchKeyword]="keywordLocation" 
                                                    [itemTemplate]="itemTemplate"
                                                    [notFoundTemplate]="notFoundTemplate"
                                                    [customFilter]="startWithFilter"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['brokerId'].invalid) }">
                                                </ng-autocomplete>

                                                <ng-template #itemTemplate let-item>
                                                    <a [innerHTML]="item.dataName"></a>
                                                </ng-template>

                                                <ng-template #notFoundTemplate let-notFound>
                                                    <div [innerHTML]="notFound"></div>
                                                </ng-template>
                                            </div>
                                        </div>
                                    </div>
                                </div> 
                                <div class="row">
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Hire Rate Type: </label><span style="color: red">*</span> 
                                            <select id="scope" class="form-select" 
                                                class="form-control form-select ng-pristine ng-touched"
                                                formControlName="hireRateType" (change)="onRateChange($event)"
                                                [ngClass]="{'is-invalid': formSubmitted && (f['hireRateType'].invalid)}">
                                                <option value="P">Per MT</option>
                                                <option value="F">Fixed</option>
                                            </select> 
                                        </div>
                                    </div>  
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Hire Rate: </label>
                                            <input decimalonly type="text" class="form-control" 
                                            (change)="onratepct($event)" formControlName="hireRate">
                                        </div>
                                    </div>  
                                    <div class="col-sm-2">
                                        <div class="mb-3">
                                            <label>Hire Amount: </label><span style="color: red">*</span> 
                                            <input decimalonly type="text" class="form-control" 
                                            formControlName="hireAmt" 
                                            [ngClass]="{'is-invalid': formSubmitted && (f['hireAmt'].invalid)}">
                                        </div>
                                    </div>  
                                </div> 
                                <div class="row">
                                    <div class="col-sm-4">
                                        <div class="mb-3">
                                            <label>Vehicle Eng By: </label>
                                            <select id="scope" class="form-select" formControlName="vehicleEngBy"
                                            class="form-control form-select ng-pristine ng-touched">
                                                <option *ngFor="let emp of empList" value={{emp.dataId}}>
                                                    {{emp.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>  
                                    <div class="col-sm-4">
                                        <div class="mb-3">
                                            <label>Load Assign To: </label>
                                            <select id="scope" class="form-select" formControlName="loadAssignTo"
                                            class="form-control form-select ng-pristine ng-touched">
                                                <option *ngFor="let emp of empList" value={{emp.dataId}}>
                                                    {{emp.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>  
                                </div> 
                                <div class="row">
                                    <div class="col-sm-5">
                                        <div class="mb-3">
                                            <label>Remarks: </label>
                                            <input uppercaseonly type="text" class="form-control" 
                                            formControlName="placementRem" >
                                        </div>
                                    </div>  
                                </div> 
                            </div>                  
                            <!-- end card body -->
                        </div>                     
                        <!-- end card -->
                    </div>
                </div>         
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                                *ngIf="(!editMode && createStatus) && !this.formSubmitted"
                                (click)="submitDprDetails()">Save</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                    <!-- end col -->
                </div> 
            </form>
           <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
     <!-- End Page-content -->
</div>
