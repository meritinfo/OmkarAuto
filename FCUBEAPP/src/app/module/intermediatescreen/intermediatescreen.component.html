<div class="container-fluid p-0">
    <div class="row g-0">

        <div class="col-xl-9">
            <div class="auth-full-bg pt-lg-5 p-4">
                <div class="w-100">
                    <div class="bg-overlay"></div>
                    <div class="d-flex h-100 flex-column">

                        <div class="p-4 mt-auto">
                            <div class="row justify-content-center">
                                <div class="col-lg-7">
                                    <div class="text-center">
                                        <h4 class="mb-3">                                             
                                            <img src="assets/images/fcube_logo_light.png" alt="" height="21" class="auth-logo-dark"> Licensed to <span
                                                class="text-primary">Network </span></h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- end col -->

        <div class="col-xl-3">
            <div class="auth-full-page-content p-md-5 p-4">
                <div class="w-100">
                    <div class="d-flex flex-column h-100">
                        <div class="mb-4 mb-md-5">
                            <img src="assets/images/meritlogo.png" alt="" height="60" class="auth-logo-dark">
                        </div>
                        <div class="my-auto">
                            <div>
                                <h5 class="text-primary">Welcome Back !</h5>
                                <p class="text-muted">Select Financial Year</p>
                            </div>

                            <div class="mt-4">
                                <form (keydown.enter)="$event.preventDefault()"[formGroup]="formLogin"> 
                                    <div class="mb-3">
                                        <label for="basicpill-phoneno-input">Select Year</label>
                                        <select class="form-control" formControlName="yearID" [ngClass]="{ 'is-invalid': formSubmitted && (f['yearID'].invalid) }" >
                                            <option *ngFor="let branch of yearList" value={{branch.dataId}}>
                                               {{branch.dataName}}
                                            </option>
                                         </select>
                                    </div>     
                                    <div class="mb-3">
                                        <label for="formrow-inputState">Login  Date</label>
                                        <input type="date" [value]="currentServerTime" class="form-control col-md-8" formControlName="loginDate"  [ngClass]="{ 'is-invalid': formSubmitted && (f['loginDate'].invalid) }"
                                        max="{{maxDate}}"/>
                                    </div>
                                    <div class="mb-3">
                                        <label for="basicpill-phoneno-input">Select Branch</label>
                                        <select   class="form-control form-select ng-pristine ng-touched"
                                         formControlName="userBranch"  [ngClass]="{ 'is-invalid': formSubmitted && (f['userBranch'].invalid) }">
                                            <option *ngFor="let branch of branchList" [ngValue]="branch">
                                               {{branch.dataName}}
                                            </option>
                                         </select>
                                    </div>
                                    <div class="form-group">
                                        <p class="small text-danger">{{this.responseDetails.message}}</p>
                                    </div>
                                    <div class="mt-3 d-grid">
                                        <button class="btn btn-primary waves-effect waves-light" type="submit"
                                            (click)="submitIntermediateForm()">Log
                                            In</button>
                                    </div>
                                </form>   
                            </div>
                        </div>
                        <div class="mt-4 text-center">
                           
                            <img src="assets/images/NCC Logo_black.png" alt="" height="45" class="auth-logo-dark">
                        </div>
                        <div class="mt-md-5 text-center">
                            <p class="mb-0">© Merit Info Solutions</p>
                        </div>
                    </div>


                </div>
            </div>
        </div>
        <!-- end col -->
    </div>
    <!-- end row -->
</div>
<!-- end container-fluid -->
