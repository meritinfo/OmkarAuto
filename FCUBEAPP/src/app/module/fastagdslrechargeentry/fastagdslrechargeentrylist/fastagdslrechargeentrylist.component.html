<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18"> Card Recharge Entry List</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" formControlName="fromDate" 
                                    min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" formControlName="toDate" 
                                    min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>  
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Vehicle No</label> 
                                    <ng-autocomplete [data]="vehicleList"
                                        [searchKeyword]="keywordLocation"  
                                        formControlName="vehicleID" [initialValue]=""
                                        (inputChanged)='onChangeSearch($event)'
                                        (inputFocused)='onFocused($event)' 
                                        [itemTemplate]="itemTemplate"
                                        [notFoundTemplate]="notFoundTemplate"
                                        [customFilter]="startWithFilter">                                              
                                    </ng-autocomplete>

                                    <ng-template #itemTemplate let-item>
                                        <a [innerHTML]="item.dataName"></a>
                                    </ng-template>

                                    <ng-template #notFoundTemplate let-notFound>
                                        <div [innerHTML]="notFound"></div>
                                    </ng-template>
                                </div>
                            </div>         
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary" (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                   <button class="btn btn-primary buttons-html5" type="button" *ngIf="createStatus"
                        (click)="addfastagdslrechargeentry()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>transBranch</th>  
                            <th>rechargeDate</th>
                            <th>rechargeType</th>
                            <th>rechargeAmt</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allFasttag.fastList">
                        <tr *ngFor="let actlist of allFasttag.fastList">
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="getfastagdslrechargeentryDetails(actlist)"></button>             
                            </td>    
                            <td>{{ actlist.branch }}</td>
                            <td>{{ actlist.rechargeDate }}</td>
                            <td>{{ actlist.rechargeType }}</td> 
                            <td>{{ actlist.rechargeAmt }}</td> 
                        </tr>
                    </tbody>
                    <tbody *ngIf="allFasttag.fastList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
