<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Document Allotment</h4>    
                    </div>
                </div>
            </div>
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip">Branch</label><span style="color: red">*</span>  
                                <select formControlName="branchCode"
                                class="form-control form-select ng-pristine ng-touched"
                                    (change)="getDocNumCode()"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['branchCode'].invalid) }"> 
                                    <option *ngFor="let br of branchList" value={{br.dataId}}>
                                    {{br.dataName}}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputCity">Doc Type</label><span style="color: red">*</span>    
                                <select id="formrow-inputState" class="form-control" 
                                        formControlName="docType"  (change)="chageDocument()"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['docType'].invalid) }"> 
                                        <option value="CN">Consignment</option>
                                        <option value="CH">Challan</option>
                                        <option value="BL">Bill</option>                                      
                                </select>                                                
                            </div>                                              
                        </div>
                    </div>
                    <div class="row">   
                        <div class="col-lg-2">
                            <div class="mb-3">
                                <label for="formrow-inputState">Series Code:</label>
                                <span style="color: red">*</span>
                                <select formControlName="seriesCode"
                                    (change)="checkDocumentRange()"
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['seriesCode'].invalid) }">
                                    <option value=""> </option>
                                    <option *ngFor="let dl of seriesList" value={{dl.dataId}}>
                                        {{dl.dataName}}
                                    </option>
                                </select> 
                            </div>
                        </div>  
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip">Allot Date</label><span style="color: red">*</span>    
                                    <input bsdatepicker="" type="date" autoclose="false" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    formControlName="allotDate" class="form-control"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['allotDate'].invalid) }">
                            </div>
                        </div>
                    </div> 
                    <div class="row">
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip">Range From</label>
                                <span style="color: red">*</span>
                                <input type="text" class="form-control"
                                 formControlName="rangeFrom" maxlength="12"     
                                (change)="checkDocumentRange()"
                                [ngClass]="{ 'is-invalid': formSubmitted && (f['rangeFrom'].invalid) }">
                            </div>
                        </div>  
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip">Range To</label>
                                <span style="color: red">*</span>
                                <input type="text" class="form-control"
                                formControlName="rangeTo" maxlength="12"    
                                (change)="checkDocumentRange()"    
                                [ngClass]="{ 'is-invalid': formSubmitted && (f['rangeTo'].invalid) }">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip">Doc Count</label>
                                <span style="color: red">*</span>
                                <input numbersonly autoclose="false" class="form-control"   
                                formControlName="docCount" maxlength="5"      
                                 [ngClass]="{ 'is-invalid': formSubmitted && (f['docCount'].invalid) }">
                            </div>
                        </div>
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip"> Auto Generate</label>
                                <span style="color: red">*</span>
                                <select id="formrow-inputState" class="form-control" 
                                    formControlName="autoGenYN" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['autoGenYN'].invalid) }"> 
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>                                  
                                </select>     
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip"> Doc Status</label>
                                <span style="color: red">*</span>
                                <select id="formrow-inputState" class="form-control" 
                                    formControlName="docStatus" (change)="onStatusChange($event)" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['docStatus'].invalid) }"> 
                                    <option value="O">Open</option>
                                    <option value="C">Close</option>                                  
                                </select>     
                            </div>
                        </div>
                        <div class="col-lg-3">
                            <div class="mb-3">
                                <label for="formrow-inputZip">Doc Close Date</label>                                
                                <input bsdatepicker="" type="date" autoclose="false" 
                                min="{{minDate}}" 
                                formControlName="docCloseDate" class="form-control">
                            </div>
                        </div>
                        
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <label for="formrow-inputZip">Remarks</label>
                            <input uppercaseonly autoclose="false" class="form-control"   
                            formControlName="remarks"   minlength="4"  
                             [ngClass]="{ 'is-invalid': formSubmitted && (f['remarks'].invalid) }">
                        </div>
                    </div>
                    <div class="row text-right">
                        <div class="col-lg-12">
                            <div class="tex">
                                <button class="btn btn-primary w-md" 
                                *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                    (click)="submitDocumentallotmentForm()" >Save</button> &nbsp;  
                                <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                    (click)="deleteDocumentAllotmentForm()">Delete</button> &nbsp;
                                <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                            </div>
                        </div>
                    </div>
                </div>              
            </form>
        </div>
        <!-- container-fluid -->
    </div>
     <!-- End Page-content -->
</div>
