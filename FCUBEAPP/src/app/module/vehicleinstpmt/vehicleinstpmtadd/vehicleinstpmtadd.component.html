<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Vehicle inst Pmt Master</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Branch Code</label>
                                                <span style="color: red">*</span>
                                                <select formControlName="branchCode"
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['branchCode'].invalid) }">
                                                    <option *ngFor="let dl of branchList" value={{dl.dataId}}>
                                                        {{dl.dataName}}
                                                    </option>
                                                </select>    
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Pmt Date</label>
                                                <span style="color: red">*</span>
                                                <input type="date"  autofocus="autofocus" class="form-control"
                                                  formControlName="pmtDate" min="{{minDate}}" max="{{maxDate}}"                                          
                                                  [ngClass]="{ 'is-invalid': formSubmitted && (f['pmtDate'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Vehicle</label>
                                                <span style="color: red">*</span>
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="vehicleList"
                                                        [searchKeyword]="keywordLocation"  
                                                        formControlName="vehicleMasterid"
                                                        (selected)='selectEvent($event)'
                                                        [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="endWithFilter">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div> 
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Inst No</label><span style="color: red">*</span>
                                                <select class="form-control form-select ng-pristine ng-touched"
                                                    formControlName="instId" 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['instId'].invalid) }">
                                                    <option *ngFor="let branch of instList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>         
                                            </div>
                                        </div> 
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Priciple Amt</label>  
                                                <span style="color: red">*</span>                                             
                                                <input autoclose="false" class="form-control"   
                                                formControlName="priAmt" decimalonly (change)="calTot()"    
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['priAmt'].invalid) }">
                                            </div>
                                        </div>                            
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Interest Amt</label>
                                                <input autoclose="false" class="form-control"   
                                                formControlName="intAmt" decimalonly (change)="calTot()">
                                                
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip"> Total Amt</label> 
                                                <span style="color: red">*</span>                                            
                                                <input autoclose="false" class="form-control"   
                                                formControlName="totAmt" decimalonly
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['totAmt'].invalid) }">
                                            </div>
                                        </div>
                                    </div>   
                                    <div class="row">    
                                        <div class="col-lg-5">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Remarks</label>                              
                                                <input autoclose="false" class="form-control"     
                                                formControlName="remarks"  uppercaseonly   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['remarks'].invalid) }">
                                            </div>
                                        </div>
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Pmt Type</label>
                                                <span style="color: red">*</span>
                                                <select id="formrow-inputState" class="form-control"
                                                formControlName="pmtType" (change)="changePmtType($event)"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['pmtType'].invalid) }" >
                                                    <option value="C"> Cash</option>
                                                    <option value="B"> Bank</option>
                                                    <option value="H"> Happay</option>
                                                    <option value="P"> Petro</option>
                                                    <option value="V"> Vendor</option>
                                                    <option value="A"> Adjust </option>
                                                </select>
                                            </div>
                                        </div>                                     
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Neft YN </label> 
                                                <span style="color: red">*</span>                                              
                                                <select id="formrow-inputState" class="form-control"
                                                    formControlName="neftYN" (change)="onneftChange($event)" 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['neftYN'].invalid) }">
                                                    <option value="Y">Yes</option>
                                                    <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Cheq No </label>
                                                <input type="email" autoclose="false" class="form-control"    
                                                formControlName="cheqNo">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Cheq Date</label>
                                                <span style="color: red">*</span>
                                                <input type="date"  autofocus="autofocus" class="form-control"
                                                  formControlName="cheqDate"   
                                                  [ngClass]="{ 'is-invalid': formSubmitted && (f['cheqDate'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Credit Ac</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control form-select ng-pristine ng-touched"formControlName="creditAc" 
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['creditAc'].invalid) }">
                                                    <option *ngFor="let branch of mainAcList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>                                                
                                            </div>
                                        </div>  
                                    </div> 
                                </div>
                            </div>
                        </div>
                    </div>
                </div> 
                <div class="row">                    
                    <div class="col-lg-5">
                        <div class="mb-3">
                            <label style="color: blue"> 
                                <h6><b>Created By:</b>  {{ this.createdBy }} </h6> 
                            </label>                                                 
                        </div>
                    </div>                   
                    <div class="col-lg-5">
                        <div class="mb-3">
                            <label style="color: blue"> 
                                <h6><b>Modified By:</b> {{ this.modifiedBy}} </h6> 
                            </label>                                                 
                        </div>
                    </div>
                    <!-- end col -->
                </div>              
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="submitVehicleInstPmtForm()" >Save</button> &nbsp;  
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="vehicleInstPmtDelete()">Delete</button> &nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->

</div>
