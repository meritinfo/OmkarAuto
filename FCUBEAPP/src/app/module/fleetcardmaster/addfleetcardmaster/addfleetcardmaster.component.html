
<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Fleet Card Master</h4>
                   <div class="page-title-right">
                      <ol class="breadcrumb m-0">
                         <li class="breadcrumb-item"><a href="javascript: void(0);">Fleet</a></li>
                         <li class="breadcrumb-item active">Fleet Card Master</li>
                      </ol>
                   </div>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                         <h4 class="card-title mb-4">Fleet Card Master</h4>
                      
                            
                               
                               
                                     <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Card Type</label>
                                                <select id="formrow-inputState" class="form-control"
                                                    formControlName="cardType"
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['cardType'].invalid) }"  
                                                    >
                                                  
                                                    <option value="HP"> Happay</option>
                                               
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Card Code</label>
                                                <input type="text" class="form-control"
                                                placeholder=" " formControlName="cardCode" uppercaseonly
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['cardCode'].invalid) }"  (change)="checkDuplicateCardCode()">
                                                
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Card No</label>
                                                <input type="text" class="form-control"
                                                placeholder=" " formControlName="cardNo"  uppercaseonly
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['cardNo'].invalid) }"  (change)="checkDuplicateCardNo()">
                                                
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Card Pin</label>
                                                <input type="text" class="form-control"
                                                placeholder=" " formControlName="cardPin"
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['cardPin'].invalid) }">
                                                
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">CardLedger Ac</label>
                                                <select class="form-control" formControlName="cardLedgerAc"
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['cardLedgerAc'].invalid) }">

                                                <option *ngFor="let branch of ledgerAcList" value={{branch.dataId}}>

                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                                
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Vehicle No</label>
                                                <input type="text" class="form-control"
                                                placeholder=" " formControlName="vehicleNo"
                                                [ngClass]=>
                                                
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Driver Name</label>
                                                <input type="text" class="form-control"
                                                placeholder=" " formControlName="driverName"
                                                [ngClass]=>
                                                
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">DriverLic No</label>
                                                <input type="text" class="form-control"
                                                placeholder=" " formControlName="driverLicNo"
                                                [ngClass]=>
                                                
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">MobileNo</label>
                                                <input type="text" class="form-control"
                                                placeholder=" " formControlName="mobileNo"
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['mobileNo'].invalid) }">
                                                
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">IsActive </label>
                                                <select id="formrow-inputState" class="form-control"
                                                formControlName="isActive"
                                              >
                                                <option selected="">Choose...</option>
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                               
                                            </select>
                                            </div>
                                        </div>
                                    </div>
                        
                          
                        
                                
                             
                       
               
                 
                      </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                      <button class="btn btn-primary w-md"
                         (click)="submitFleetCardMasterForm()" *ngIf="(editMode && editStatus) || (!editMode && createStatus)">Save</button>
                          <button  class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="fleetCardMasterDelete()">Delete</button>
                                <button  class="btn btn-secondary w-md m-2" 
                                 (click)="exit()">Exit</button>
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
