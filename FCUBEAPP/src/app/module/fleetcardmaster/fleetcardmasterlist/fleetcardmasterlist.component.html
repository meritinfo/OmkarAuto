<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18"> Fleet Cards List</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Card No</label>
                                    <input type="text" uppercaseonly class="form-control" formControlName="cardNo">
                                </div>
                            </div>
                             <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Vehicle No</label>
                                    <input type="text" uppercaseonly class="form-control" formControlName="vehicleNo">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <button class="btn btn-primary buttons-html5" type="button" *ngIf="createStatus"
                        (click)="addFleetCardMaster()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>Card Type</th>
                            <th>Card Code</th>
                            <th>Card No</th>
                            <th>Vehicle NO</th>
                            <th>Action</th>
                            
                        </tr>
                    </thead>
                   <tbody *ngIf="allCardMaster.cardList?.length != 0">
                        <tr *ngFor="let brandmaster of allCardMaster.cardList">
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="getFleetCardMasterDetails(brandmaster)"></button>             
                            </td>
                            <td>{{ brandmaster.cardType }}</td>                    
                            <td>{{ brandmaster.cardCode }}</td>                    
                            <td>{{ brandmaster.cardNo }}</td> 
                            <td>{{ brandmaster.vehicleNo }}</td>   
                        </tr>
                    </tbody>
                    <tbody *ngIf="allCardMaster.cardList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
