<div class="main-content">
  <div class="page-content">
    <div class="container-fluid">

      <!-- Page Title -->
      <div class="row mb-3">
        <div class="col-12">
          <div class="page-title-box d-flex align-items-center justify-content-between">
            <h4 class="mb-0">Multiple Ledger Report</h4>
          </div>
        </div>
      </div>

      <!-- Main Form -->
      <form [formGroup]="formFilter">
        <div class="row">
       <div class="col-sm-4">
            <div class="card">
              <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                <!-- Menu List -->
                <ul class="list-unstyled mb-0">
                  <ng-container *ngFor="let item of menuList">
                    <ng-template [ngTemplateOutlet]="renderItem"
                      [ngTemplateOutletContext]="{ $implicit: item, level: 0 }">
                    </ng-template>
                  </ng-container>
                </ul>
              </div>
            </div>
          </div>
            <div class="col-sm-8">
              <div class="row">
            <div class="col-sm-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-sm-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                                
                            </div>
                             <div class="row">
                               <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Sub Ledger</label>
                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="subLedger">
                                        <option value=""></option>
                                        <option value="L">Like</option>
                                        <option value="E">Equal</option>
                                        <option value="H">Having</option>
                                    </select>
                                </div>
                            </div> 
                        
                              <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">&nbsp;</label>
                                    <input uppercaseonly class="form-control" formControlName="subType" >
                                </div>
                            </div>  
                            </div> 
                            <div class="row">
                                <div class="col-lg-6">
                                <div class="form-check mb-3">
                                    <input type="radio" formControlName="branchorCon" value="C"
                                        class="form-check-input"  (change)="change('C')" />
                                    <label for="formRadios1" class="form-check-label" style="color:green">
                                        Consolidate
                                    </label>
                                </div>
                                    <div class="col-lg-3">
                                <div class="form-check">
                                    <input type="radio" formControlName="branchorCon"  value="B"
                                        class="form-check-input"  (change)="change('B')" />
                                    <label for="formRadios2" class="form-check-label" style="color:green">
                                        Branch
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Branch</label>
                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="branch">
                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            </div>
                            <div class="col-lg-2">                                
                                <div class="form-check">
                                    <input type="checkbox"  formControlName="groupYN"                                         
                                        class="form-check-input" >
                                    <label for="neft" class="form-check-label">Group All Branches
                                    </label>
                                </div>                          
                            </div>  
                            </div> 
                                <div class="col-lg-3">
                                <div class="mt-3">
                                    <button class="btn btn-primary" 
                                        (click)="search('PDF')"><span>Generate PDF</span></button>
                                </div>
                            </div> 
                            
                            </div>

        </div>
        <!-- <div class="text-end mt-3">
          <button class="btn btn-primary w-md"
                  (click)="saveSelectedIds()"
                  [disabled]="!hasAnyChecked(menuList)">
            Save
          </button>
        </div> -->
      </form>

    </div>
  </div>
</div>

<!-- Recursive Item Template -->
<ng-template #renderItem let-item let-level="level">
  <li [style.padding-left.px]="level * 20" class="mb-1">
    <div class="d-flex align-items-center">

      <!-- Checkbox -->
      <input type="checkbox"
             class="form-check-input me-2"
             [checked]="item.checked"
             (click)="toggleCheck(item); $event.stopPropagation()"
             name="chk_{{item.accountID}}" />

      <!-- Item Name -->
      <span
        [ngClass]="{
          'fw-bold text-primary': item.isLink,
         
          'fw-bold text-decoration-underline': item.children.length > 0,
          'text-success': selectedItem === item,
          'ms-1': true
        }"
        style="cursor: pointer;"
        (click)="setSelectedItem(item)">
        {{ item.accountName }}
      </span>

      <!-- Expand/Collapse Icon -->
      <span *ngIf="item.children.length > 0"
            (click)="toggleExpand(item); setSelectedItem(item)"
            class="ms-2"
            style="cursor: pointer;">
        <i class="bi"
          [ngClass]="{
            'bi-plus-square-fill': !item.isExpanded,
            'bi-dash-square-fill': item.isExpanded
          }"></i>
      </span>
    </div>

    <!-- Child Items -->
    <ul class="list-unstyled mt-1" *ngIf="item.isExpanded && item.children.length > 0">
      <ng-container *ngFor="let child of item.children">
        <ng-template [ngTemplateOutlet]="renderItem"
          [ngTemplateOutletContext]="{ $implicit: child, level: level + 1 }">
        </ng-template>
      </ng-container>
    </ul>
  </li>
</ng-template>
