<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Accounts/Ledger List</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Account Name</label>
                                    <input type="text" class="form-control" formControlName="accountName">
                                </div>
                            </div>
                            <div class="col-lg-4">
                                <div class="mb-3">
                                    <label for="basicpill-lastname-input" class="form-label">Group:</label><span style="color:red">*</span>
                                    <select formControlName="groupName" 
                                        class="form-control form-select ng-pristine ng-touched">                                             
                                        <option *ngFor="let subacttp of groupList" value={{subacttp.dataId}}>
                                            {{subacttp.dataName}}
                                        </option>
                                    </select>   
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary" (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-2 col-md-2 text-right">
                   <button class="btn btn-primary buttons-html5" type="button" *ngIf="createStatus"
                        (click)="addfinaccount()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>Account Name</th>  
                            <th>Ledger Name</th>
                            <th>Sub Account Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allFinaccounts.finaccountList">
                        <tr *ngFor="let actlist of allFinaccounts.finaccountList">
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="getFinsaccountsDetails(actlist)"></button>             
                            </td>    
                            <td>{{ actlist.accountName }}</td>
                            <td>{{ actlist.ledgerName }}</td>
                            <td>{{ actlist.subAccountName }}</td> 
                        </tr>
                    </tbody>
                    <tbody *ngIf="allFinaccounts.finaccountList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
