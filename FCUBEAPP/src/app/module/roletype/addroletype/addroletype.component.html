
<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Role Type Master</h4>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form (keydown.enter)="$event.preventDefault()"[formGroup]="formRoleType">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                     
                      
                            
                               
                               
                                     <div class="row">
                                       
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Role Name </label>
                                                <input type="text" class="form-control" uppercaseonly (change)="ChkDuplicateRoleName()"
                                                  formControlName="roleName" 
                                                  [ngClass]="{ 'is-invalid': formSubmitted && (f['roleName'].invalid) }" >
                                                
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Role Desc</label>
                                                <input type="text" class="form-control" uppercaseonly (change)="ChkDuplicateRoleDesc()"
                                                  formControlName="roleDesc"
                                                  [ngClass]="{ 'is-invalid': formSubmitted && (f['roleDesc'].invalid) }">
                                                
                                            </div>
                                        </div>
                                       
                                    </div>
                                  
                                       
                                 
                                    <div class="row">
                                        
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Is Active </label>
                                                <select id="formrow-inputState" class="form-control"
                                                formControlName="activeYN"
                                              >
                                                <option selected="">Choose...</option>
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                               
                                            </select>
                                            </div>
                                        </div>
                                    </div>
                        
                          
                        
                                
                             
                       
               
                 
                      </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                      <button class="btn btn-primary w-md" 
                      *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                         (click)="submitRoleTypesForm()">Save</button>
                         <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="roleTypesDelete()">Delete</button> 
                                <button  class="btn btn-secondary w-md m-2" 
                                 (click)="exit()">Exit</button>
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
