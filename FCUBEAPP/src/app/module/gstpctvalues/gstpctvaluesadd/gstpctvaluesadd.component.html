<

<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Define GST Pct</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formPctMaster">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-2">
                                                <label for="formrow-inputZip">Valid From</label>
                                                <span style="color: red">*</span>
                                                <input  type="date" class="form-control"  
                                                formControlName="validFrom"   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['validFrom'].invalid) }">
                                            </div>
                                        </div>
                                        
                                    </div>   
                                    <div class="row">                                        
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Road Frt Gst</label>
                                         
                                                <input decimalonly autocomplete="off" type="text" class="form-control"  
                                                formControlName="roadFrtGst"   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['roadFrtGst'].invalid) }">
                                            </div>
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Rail Frt Gst</label> 
                                                
                                                
                                                <input decimalonly autocomplete="off" type="text" class="form-control"  
                                                formControlName="railFrtGst"   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['railFrtGst'].invalid) }">
                                            </div>
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Coastal Frt Gst</label> 
                                                <input decimalonly autocomplete="off" type="text" class="form-control"  
                                                formControlName="coastalFrtGst"   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['coastalFrtGst'].invalid) }">
                                            </div>
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Hamali Gst</label> 
                                               
                                                <input decimalonly autocomplete="off" type="text" class="form-control"  
                                                formControlName="hamaliGst"   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['hamaliGst'].invalid) }">
                                            </div>
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Detention Gst</label> 
                                              
                                                <input decimalonly autocomplete="off" type="text" class="form-control"  
                                                formControlName="detentionGst"   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['detentionGst'].invalid) }">
                                            </div>
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Other Charges Gst</label> 
                                              
                                                <input decimalonly autocomplete="off" type="text" class="form-control"  
                                                formControlName="otherChargesGst"   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['otherChargesGst'].invalid) }">
                                            </div>
                                            
                                            
                                        </div> 
                                    </div>  
                                </div>
                            </div>
                        </div>
                    </div>
                </div>           
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                            (click)="submitGstPctValuesForm()" >Save</button> &nbsp;  
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                            (click)="deleteGstPctDetailsForm()">Delete</button> &nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->

</div>
