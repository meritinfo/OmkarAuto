
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">DO Vehicle IN</h4>
                    </div>
                </div>
            </div>
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" formControlName="fromDate" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" formControlName="toDate" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-4">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Vehicle No</label>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="vehicleList" 
                                            formControlName="vehicleNo"
                                            [searchKeyword]="keywordLocation" 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div> 
                            <div class="col-lg-1">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                        (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">                    
                     <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                       <thead>
                            <tr>
                                <th>doBr </th>                          
                                <th>doDate </th>                      
                                <th>doDate </th>
                                <th>loadingFr</th>  
                                <th>dest</th>   
                                <th>partyName</th>   
                                <th>cnorName </th>   
                                <th>cneeName </th>                           
                                <th>Action</th>                         
                                <th>Action</th>  
                            </tr>
                        </thead>
                        <tbody *ngIf="allDolist.doVehicleInList?.length != 0">
                            <tr *ngFor="let dpr of allDolist.doVehicleInList">
                                <td>{{ dpr.entryDate }}</td>  
                                <td>{{ dpr.truckNo }}</td>  
                                <td>{{ dpr.vehicleInDatetime }}</td>                        
                                <td>{{ dpr.ownerName }}</td>                          
                                <td>{{ dpr.contactName }}</td>                         
                                <td>{{ dpr.mobileNo }}</td>                        
                                <td>{{ dpr.driverName }}</td>                          
                                <td>{{ dpr.driverMobile1 }}</td>  
                                <td>                                  
                                    <button type="button" class="btn btn-edit"
                                        (click)="getdoVehiDetails(dpr)"></button>                               
                                </td> 
                                <td>                                  
                                    <button type="button"
                                        class="btn btn-primary btn-floating"  
                                        (click)="genConsignment(dpr)"></button>                               
                                </td>
                            </tr>
                        </tbody>
                        <tbody *ngIf="allDolist.doVehicleInList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
                    </table> 
                </div>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
