<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Driver Salary Payment</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" formControlName="fromDate" 
                                    min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" formControlName="toDate" 
                                    min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>  
                          
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                   <button class="btn btn-primary buttons-html5" type="button" *ngIf="createStatus"
                        (click)="driversalarypmtadd()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>transBranch</th>  
                            <th>salaryDate</th>
                            <th>rechargeType</th>
                            <th>rechargeAmt</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="alldriver.salaryList">
                        <tr *ngFor="let actlist of alldriver.salaryList">
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="getdriversalarypmtDetails(actlist)"></button>             
                            </td>    
                            <td>{{ actlist.branch }}</td>
                            <td>{{ actlist.salaryDate }}</td>
                            <td>{{ actlist.driver }}</td> 
                            <td>{{ actlist.vehicle }}</td> 
                            
                        </tr>
                    </tbody>
                    <tbody *ngIf="alldriver.salaryList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
