<div class="main-content">
   <div class="page-content">
      <div class="container-fluid">
          <!-- start page title -->
         <div class="row">
            <div class="col-12">
               <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                  <h4 class="mb-sm-0 font-size-18">Admin Expense Group</h4>
               </div>
            </div>
         </div>
          <!-- end page title -->
         <form (keydown.enter)="$event.preventDefault()"[formGroup]="formChCost">
            <div class="row">
               <div class="col-lg-12">
                  <div class="card">
                     <div class="card-body">                                 
                        <div class="row">
                          <div class="col-lg-2">
                              <div class="mb-4"><label for="formrow-inputCity">Admin Group Desc </label> <span style="color: red">*</span>
                              </div>
                           </div>
                           <div class="col-lg-4">
                              <div class="mb-4">
                                 <input type="text"  autofocus="autofocus" class="form-control"
                                 uppercaseonly formControlName="adminGrpDesc"  (change)="checkDuplicateAdmin()"
                                 [ngClass]="{ 'is-invalid': formSubmitted && (f['adminGrpDesc'].invalid) }">
                              </div>
                           </div>
                        </div>
                        <div class="row">
                           <div class="col-lg-2">
                              <div class="mb-4"><label for="formrow-inputCity">Sort Id </label> <span style="color: red">*</span>
                              </div>
                           </div>
                           <div class="col-lg-4">
                              <div class="mb-4">
                                 <input type="text"  autofocus="autofocus" class="form-control"
                                    numbersonly formControlName="sortId"   
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['sortId'].invalid) }">
                              </div>
                           </div>
                        </div>
                        <div class="row">
                           <div class="col-lg-2">
                              <div class="mb-4"><label for="formrow-inputCity">ActiveYN </label> <span style="color: red">*</span>
                              </div>
                           </div>
                           <div class="col-lg-4">
                              <div class="mb-4">
                                 <select formControlName="activeYN" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['activeYN'].invalid) }">
                                    <option value ="Y">Yes</option>
                                    <option value="N">No</option>                                       
                                 </select> 
                              </div>
                           </div>
                        </div>  
                     </div>
                      <!-- end card body -->
                  </div>
                <!-- end card -->
               </div>
            </div>
            <div class="row text-right">
               <div class="col-lg-12">
                  <div class="tex">
                     <button class="btn btn-primary w-md"
                        *ngIf="((editMode && editStatus) || (!editMode && createStatus))"
                         (click)="submitAdminForm()">Save</button>&nbsp;
                     <button class="btn btn-danger w-md m-2" 
                     (click)="amingrpDelete()" 
                        *ngIf="editMode && deleteStatus">Delete</button>  &nbsp;                       
                     <button class="btn btn-secondary w-md m-2" (click)="exit()">Exit</button>                         
                  </div>
               </div>
            </div>
         </form>
       <!-- end row -->
       <!-- end row -->
      </div>
       <!-- container-fluid -->
   </div>
    <!-- End Page-content -->
</div>
