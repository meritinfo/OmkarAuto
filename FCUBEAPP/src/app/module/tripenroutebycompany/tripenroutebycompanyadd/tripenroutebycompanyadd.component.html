<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Trip Enroute Exp By Company</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div id="basic-example">
                                <section>
                                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formTripPayment">
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="basicpill-firstname-input">Exp Branch</label><span style="color: red">*</span> 
                                                    <select class="form-control form-select ng-pristine ng-touched"
                                                        formControlName="expBranch"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['expBranch'].invalid) }">
                                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                            {{branch.dataName}}
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="basicpill-firstname-input">Vehicle</label><span style="color: red">*</span> 
                                                    <ng-autocomplete [data]="vehicleList"
                                                        [searchKeyword]="keywordLocation"  
                                                        formControlName="vehicleID"  
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' 
                                                        [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleID'].invalid) }">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="basicpill-firstname-input">Expense Desc</label><span style="color: red">*</span> 
                                                    <select class="form-control form-select ng-pristine ng-touched"
                                                     formControlName="expId"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['expId'].invalid) }">
                                                        <option *ngFor="let branch of expList"
                                                            value={{branch.dataId}}>
                                                            {{branch.dataName}}
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="ng-untouched ng-pristine ng-valid">
                                            <div class="row">
                                                    <!-- <div class="mb-3">
                                                        <label for="formrow-inputState">From</label>
                                                        <select class="form-control form-select ng-pristine ng-touched"
                                                         formControlName="from"
                                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['from'].invalid) }">
                                                            <option *ngFor="let branch of locationList"
                                                                value={{branch.dataId}}>
                                                                {{branch.dataName}}
                                                            </option>
                                                        </select>                                                          
                                                    </div> -->
                                                <!-- <div class="col-lg-3">
                                                    <div class="mb-3"><label for="formrow-inputZip">To</label>
                                                        <select class="form-control form-select ng-pristine ng-touched"
                                                         formControlName="to"
                                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['to'].invalid) }">
                                                            <option *ngFor="let branch of locationList"
                                                                value={{branch.dataId}}>
                                                                {{branch.dataName}}
                                                            </option>
                                                        </select>
                                                    </div>
                                                </div> -->
                                            </div>
                                        </div>
                                        <div class="row">                                            
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="basicpill-email-input">Exp Date </label><span style="color: red">*</span> 
                                                    <input bsdatepicker="" type="date" autoclose="false"
                                                        formControlName="expDate"
                                                        class="form-control"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['expDate'].invalid)}"  max="{{maxDate}}">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="basicpill-phoneno-input">Exp Amount</label><span style="color: red">*</span> 
                                                    <input type="text" class="form-control" formControlName="expAmount" decimalonly
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['expAmount'].invalid)}">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="basicpill-phoneno-input">Payment Type</label><span style="color: red">*</span> 
                                                    <select id="formrow-inputState" class="form-control form-select ng-pristine ng-touched"
                                                        formControlName="pmtType" (change)="changePmtType($event)"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['pmtType'].invalid) }" >
                                                        <option value="M">Cash</option>      
                                                        <option value="B">Bank</option> 
                                                        <option value="H">Happay</option>
                                                        <option value="D">Vendor</option>
                                                        <option value="A">Adjust</option> 
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label for="basicpill-phoneno-input">Credit Ac </label> <span style="color: red">*</span>          
                                                    <select class="form-control form-select ng-pristine ng-touched"
                                                        formControlName="creditAc"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['creditAc'].invalid) }">
                                                        <option value ="">Choose...</option>
                                                        <option *ngFor="let branch of creditAcList" value={{branch.dataId}}>
                                                            {{branch.dataName}}
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>   
                                            <div class="col-lg-3">
                                                <div class="form-check">
                                                    <input type="checkbox"  formControlName="neftYN" id="neft"  (change)="onNeftChk($event)"
                                                        name="neft" class="form-check-input" value="Y" >
                                                    <label for="neft" class="form-check-label" style="color: green;"> Neft
                                                    </label>
                                                </div>
                                            </div>             
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="basicpill-phoneno-input">Cheque No</label>
                                                    <input type="text" class="form-control" formControlName="chequeNo" numbersonly
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['chequeNo'].invalid)}">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="basicpill-email-input">Cheque Date </label>
                                                    <input bsdatepicker="" type="date" autoclose="false" max="{{maxDate}}"
                                                        formControlName="chequeDate" class="form-control"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['chequeDate'].invalid)}" >
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Remark</label>
                                                <input uppercaseonly  class="form-control" formControlName="remarks">
                                            </div>
                                        </div>
                                        <div class="row">                    
                                            <div class="col-lg-5">
                                                <div class="mb-3">
                                                    <label style="color: blue"> 
                                                        <h6><b>Created By:</b>  {{ this.createdBy }} </h6> 
                                                    </label>                                                 
                                                </div>
                                            </div>                   
                                            <div class="col-lg-5">
                                                <div class="mb-3">
                                                    <label style="color: blue"> 
                                                        <h6><b>Modified By:</b> {{ this.modifiedBy}} </h6> 
                                                    </label>                                                 
                                                </div>
                                            </div>
                                            <!-- end col -->
                                        </div>  
                                        <div class="row text-right">
                                            <div class="col-lg-12">
                                                <div class="tex">
                                                    <button class="btn btn-primary w-md" 
                                                    *ngIf="((editMode && editStatus) || (!editMode && createStatus)) "
                                                        (click)="submitTripenroutebyCompanyForm()">Save</button>
                                                    <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                                        (click)="tripenroutebycompanyDelete()">Delete</button>
                                                    <button class="btn btn-secondary w-md m-2" (click)="exit()">Exit</button>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </section>
                                <!-- Attachment Details -->
                            </div>
                        </div>
                        <!-- end card body -->
                    </div>
                    <!-- end card -->
                </div>
                <!-- end col -->
            </div>
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
