<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Bills Outstanding Report</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label>
                                    <span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label>
                                    <span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">As On Date </label>
                                    <span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="asOnDate" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['asOnDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Branch</label>
                                    <select class="form-control" formControlName="branch">
                                        <option value="0">ALL</option>
                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>                             
                            <div class="col-lg-2">
                                <div class="mb-4">
                                    <div class="form-check">
                                        <input type="checkbox"  formControlName="incUnBilled"
                                            value="Y" class="form-check-input" >
                                        <label for="neft" class="form-check-label"> Include UnBilled</label>
                                    </div>
                                </div>
                            </div>   
                        </div>
                        <div class="row">
                            <div class="col-md-1">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Age1 </label>
                                    <span style="color: red">*</span>    
                                    <input numbersonly class="form-control" 
                                    formControlName="age1" maxlength="3">
                                </div>
                            </div>
                            <div class="col-md-1">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Age2 </label>
                                    <span style="color: red">*</span>    
                                    <input numbersonly class="form-control" 
                                    formControlName="age2" maxlength="3">
                                </div>
                            </div>
                            <div class="col-md-1">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Age3 </label>
                                    <span style="color: red">*</span>    
                                    <input numbersonly class="form-control" 
                                    formControlName="age3" maxlength="3">
                                </div>
                            </div>
                            <div class="col-md-1">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Age4 </label>
                                    <span style="color: red">*</span>    
                                    <input numbersonly class="form-control" 
                                    formControlName="age4" maxlength="3">
                                </div>
                            </div>
                            <div class="col-md-1">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Age5 </label>
                                    <span style="color: red">*</span>    
                                    <input numbersonly class="form-control" 
                                    formControlName="age5" maxlength="3">
                                </div>
                            </div>
                        </div>
                        <div class="row">                                  
                            <div class="col-lg-2">
                                <div class="mb-4">
                                    <label for="formrow-inputCity">Submitted</label>
                                    <select class="form-control" formControlName="submitYN">
                                        <option value="">All</option>
                                        <option value="Y">Submitted</option>
                                        <option value="N">Not Submitted</option>
                                    </select>
                                </div>
                            </div>                                
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Report Type</label>
                                    <select class="form-control" formControlName="rptType" >
                                        <option value="AS">Ageing Summary</option>
                                        <option value="ASB">Ageing Summary Branch</option>
                                        <option value="ASP">Ageing Summary Party</option>
                                        <option value="AD">Ageing Detail</option>
                                        <option value="OS">OutStanding Summary</option>
                                        <option value="OD">OutStanding Detail</option>                                      
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mt-3">
                                    <button class="btn btn-primary" 
                                        (click)="getRptExcel()"><span>Download Excel</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <!-- container-fluid -->
        </div>
        <!-- End Page-content -->
    </div>
