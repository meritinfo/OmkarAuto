<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Document/Service Renewals List</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-9 col-md-9">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label>
                                    <span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label>
                                    <span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>    
                        </div>
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Vehicle No</label>  
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="vehicleList"
                                            [searchKeyword]="keywordLocation" 
                                            formControlName="vehicleMasterID"
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="endWithFilter">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-4">
                                <div class="mb-2">
                                    <label for="formrow-inputCity">Doc Description </label>
                                    <select id="formrow-inputState" class="form-control" 
                                    class="form-control form-select ng-pristine ng-touched"
                                    formControlName="docDescription"> 
                                       <option *ngFor="let doc of docRenewalList" value={{doc.dataId}}>
                                          {{doc.dataName}}
                                       </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   (click)="search()">
                                        <span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-3 col-md-3 text-right">
                    <button class="btn btn-primary buttons-html5" type="button"  *ngIf="createStatus"
                        (click)="docrenewalEntryAdd()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                    <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                        <thead>
                            <tr>
                                <th>transDate</th>                          
                                <th>docDescription</th>                              
                                <th>vehicleNo</th>                                 
                                <th>validFromDt</th>                                   
                                <th>validToDt</th>                                
                                <th>netAmount</th>                             
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody *ngIf="allDocRenewalEntry.docRenewalList?.length != 0">
                            <tr *ngFor="let renentry of allDocRenewalEntry.docRenewalList">                     
                                <td>
                                    <button type="button" class="btn btn-edit" 
                                    (click)="getRenewalEntryDetails(renentry)"></button>             
                                </td> 
                                <td>{{ renentry.transDate }}</td>                        
                                <td>{{ renentry.docDescription }}</td>                        
                                <td>{{ renentry.vehicleNo }}</td>                     
                                <td>{{ renentry.validFromDt }}</td>                     
                                <td>{{ renentry.validToDt }}</td>                        
                                <td>{{ renentry.netAmount }}</td>  
                            </tr>
                        </tbody>
                        <tbody *ngIf="allDocRenewalEntry.docRenewalList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
