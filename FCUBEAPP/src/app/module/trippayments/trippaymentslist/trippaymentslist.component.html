<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Trip Payments</h4>
                    </div>
                </div>
            </div>            
            <!-- end page title -->             
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" formControlName="toDate" min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
                            <!-- <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Branch</label>
                                    <select class="form-control" formControlName="branch" [ngClass]="">
                                        <option value="0">ALL</option>
                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div> -->
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Vehicle No</label>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="vehicleList" 
                                            [searchKeyword]="keywordLocation"
                                            formControlName="vehicle" 
                                            (selected)='selectEvent($event)'
                                            (inputChanged)='onChangeSearch($event)' 
                                            (inputFocused)='onFocused($event)'
                                            [itemTemplate]="itemTemplate" 
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>
                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div> 
                            </div>  
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   (click)="search()">
                                        <span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12 text-right">                   
                    <button class="btn btn-primary buttons-html5" type="button"
                        (click)="trippaymentsAdd()"><span>New</span></button>
                </div>
            </div>
      
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>PmtBranch </th>
                            <th>Date </th>
                            <th>Vehicle No. </th> 
                            <th>Trans Type</th>
                            <th>Trans Type</th>
                            <th>Amount</th>  
                            <th>Action</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allTripPaymentsTypes.tripPaymentsList?.length != 0">
                        <tr *ngFor="let trip of allTripPaymentsTypes.tripPaymentsList">                        
                            <td>                               
                                <button type="button" class="btn btn-edit" 
                                    (click)="gettrippaymentsDetails(trip)" ></button>                           
                            </td>                       
                            <td>                               
                                <button type="button" class="btn btn-edit" 
                                    (click)="getVoucherPrint(trip)" ></button>                           
                            </td>
                            <td>{{ trip.bName }}</td>
                            <td>{{ trip.pmtDate }}</td>
                            <td>{{ trip.vehicleNo }}</td>
                            <td>{{ trip.transType }}</td>
                            <td>{{ trip.qtyLtrs }}</td>
                            <td>{{ trip.amountPaid }}</td> 
                        </tr>
                    </tbody>
                    <tbody *ngIf="allTripPaymentsTypes.tripPaymentsList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
