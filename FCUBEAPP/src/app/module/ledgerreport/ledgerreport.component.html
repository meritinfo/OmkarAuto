<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Accounts Ledger Report</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Account </label>                                    
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="accountList"
                                            [searchKeyword]="keywordLocation"  
                                            formControlName="accountID" 
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                        </div>                                               
                        <div class="row">                        
                            <div class="col-lg-2">
                                <div class="form-check mb-3">
                                    <input type="radio" formControlName="branchorCon" value="C"
                                        class="form-check-input"  (change)="change('C')" />
                                    <label for="formRadios1" class="form-check-label" style="color:green">
                                        Consolidate
                                    </label>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="form-check">
                                    <input type="radio" formControlName="branchorCon"  value="B"
                                        class="form-check-input"  (change)="change('B')" />
                                    <label for="formRadios2" class="form-check-label" style="color:green">
                                        Branch
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Branch</label>
                                    <select class="form-control" formControlName="branch">
                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">                                
                                <div class="form-check">
                                    <input type="checkbox"  formControlName="groupYN"                                         
                                        class="form-check-input" >
                                    <label for="neft" class="form-check-label">Group All Branches
                                    </label>
                                </div>                          
                            </div>    
                        </div>                          
                        <div class="row">   
                            <div class="col-lg-3">
                                <div class="mt-3">
                                    <button class="btn btn-primary" 
                                        (click)="search('PDF')"><span>Generate PDF</span></button>
                                </div>
                            </div> 
                            <div class="col-lg-3">
                                <div class="mt-3">
                                    <button class="btn btn-primary" 
                                        (click)="search('XL')"><span>Export Excel</span></button>
                                </div>
                            </div>
                        </div>            
                    </form>
                </div>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
