<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Lorry Hire Challan Entry</h4>
                    </div>
                </div>
            </div>           
            <!-- end page title -->
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step1Active}" data-toggle="tab" aria-controls="step1" role="tab"
                    (click)="nextStep(1)" title="Step 1">Booking</a>
                </li>
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step2Active}" data-toggle="tab" aria-controls="step2" role="tab"
                    (click)="nextStep(2)" title="Step 2">Vehicle Details</a>
                </li>
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step3Active}" data-toggle="tab" aria-controls="step3" role="tab"
                        (click)="nextStep(3)" title="Step 3">Lorry Hire</a>
                </li>
            </ul>
            <form (keydown.enter)="$event.preventDefault()"role="form" [formGroup]="formUser">
                <div class="tab-content">
                    <div class="tab-pane mt-4" [ngClass]="{'active' : step1Active}" role="tabpanel" id="step1">
                        <div class="row">
                            <div class="col-lg-2">   
                                <div class="mb-3">
                                    <label for="neft" >Booking Place : </label>
                                    <span style="color: red">*</span>
                                    <select formControlName="challanBranch"
                                        class="form-control form-select ng-pristine ng-touched"
                                        (change)="onBranchChange()"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['challanBranch'].invalid) }">
                                        <option *ngFor="let dl of branchList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>                
                                </div>                    
                            </div>     
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Challan No. : </label>
                                    <span style="color: red">*</span>
                                    <input type="text" id="formrow-inputCity" class="form-control" 
                                        formControlName="challanNo" maxlength="15" numbersonly
                                        (change)="chkChallanDuplicate()"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['challanNo'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Challan Date : </label><span
                                        style="color: red">*</span>
                                    <input bsdatepicker="" type="date" autoclose="false" class="form-control"
                                        formControlName="challanDateTime" 
                                        min="{{minDate}}" max="{{maxDate}}"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['challanDateTime'].invalid) }">
                                </div>
                            </div>  
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Challan Status : </label><span style="color: red">*</span>
                                    <select id="formrow-inputState"
                                        class="form-control form-select ng-pristine ng-touched"
                                        formControlName="chStatus" (change)="onStatusChange($event)"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['chStatus'].invalid) }">
                                        <option value="N">Normal</option>
                                        <option value="I">Include</option>
                                        <option value="C">Cancel</option>
                                        <option value="S">Stop</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">LR NO : </label>
                                    <input  class="form-control" formControlName="lrNo" maxlength="15">   
                                </div>
                            </div>                             
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary" *ngIf="(!editMode && createStatus)"
                                        (click)="getDetails()"><span>Get Details</span></button>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">From Place : </label><span style="color: red">*</span>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="locationList"
                                            [searchKeyword]="keywordLocation"  
                                            formControlName="challanFromStn" 
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter" 
                                            [ngClass]="{'is-invalid': formSubmitted && (f['challanFromStn'].invalid)}">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>                                    
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">To Place : </label><span style="color: red">*</span>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="locationList" formControlName="challanToStn"
                                            [searchKeyword]="keywordLocation" 
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate" 
                                            [customFilter]="startWithFilter"
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['challanToStn'].invalid) }">
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>
                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-1">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">KMs :</label>
                                    <input type="text" numbersonly maxlength="8" class="form-control" 
                                        formControlName="distanceKms">
                                </div>
                            </div>                            
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Exp Arrival Date : </label><span
                                        style="color: red">*</span>
                                    <input bsdatepicker="" type="date" autoclose="false" class="form-control"
                                        formControlName="expArrivalDate" 
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['expArrivalDate'].invalid) }">
                                </div>
                            </div>  
                        </div>  
                        <div class="row">
                            <div class="col-lg-2">   
                                <div class="mb-3">
                                    <label for="neft" >Main Ch Br : </label>
                                    <select formControlName="mainChallanBranch"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['mainChallanBranch'].invalid) }">
                                        <option *ngFor="let dl of branchList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>                
                                </div>                    
                            </div>     
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Main Ch No : </label>
                                    <input type="text" id="formrow-inputCity" class="form-control" 
                                        formControlName="mainChallanNo" maxlength="15" 
                                        (change)="chkMainChallan()"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['mainChallanNo'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Vehicle No : </label>
                                    <span style="color: red">*</span>
                                    <input uppercaseonly class="form-control" formControlName="truckNo"
                                        maxlength="15" (change)="chkTruckNo($event)"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['truckNo'].invalid) }">                                    
                                </div>
                            </div>                           
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <input type="checkbox"  formControlName="ownTruckYN" 
                                      (change)="chkTruck($event)"  class="form-check-input" >
                                    <label for="neft" class="form-check-label">Own Truck </label>                                    
                                </div>
                            </div>
                        </div>                                              
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Broker : </label>
                                    <span style="color: red">*</span>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="brokerList" formControlName="brokerId"
                                            [searchKeyword]="keywordLocation"
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate" 
                                            [customFilter]="startWithFilter"
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['brokerId'].invalid) }">
                                        </ng-autocomplete>
                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>
                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Broker Mobile</label>
                                    <input numbersonly autoclose="false" maxlength="10" 
                                        formControlName="brokerMblNo" class="form-control">
                                </div>
                            </div>
                        </div>                                               
                        <div class="row">
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Advance1</label>
                                    <input decimalonly autoclose="false" maxlength="15" 
                                        formControlName="advance1" class="form-control">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Advance2</label>
                                    <input decimalonly autoclose="false" maxlength="15" 
                                        formControlName="advance2" class="form-control">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Advance3</label>
                                    <input decimalonly autoclose="false" maxlength="15" 
                                        formControlName="advance3" class="form-control">
                                </div>
                            </div>
                        </div>      
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="card">
                                    <div class="card-body">
                                        <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                            <tr>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputZip">
                                                        <h6>Year<span style="color: red">*</span></h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-2">
                                                    <label for="formrow-inputZip">
                                                        <h6>CN Booked At<span style="color: red">*</span></h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputZip">
                                                        <h6>LR NO :<span style="color: red">*</span></h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputZip">
                                                        <h6>Booking Date</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-2">
                                                    <label for="formrow-inputZip">
                                                        <h6>CN From</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-2">
                                                    <label for="formrow-inputZip">
                                                        <h6>CN To</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputZip">
                                                        <h6>Pkgs <span style="color: red">*</span></h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputZip">
                                                        <h6>Wt <span style="color: red">*</span></h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1"></td>
                                            </tr>
                                            <tr formArrayName="arrayList"
                                                *ngFor="let arrayData of formArray.controls; let i = index">
                                                <div [formGroupName]="i" class="grid-table">
                                                    <td class="col-lg-1">
                                                        <select class="form-control form-select ng-pristine ng-touched"formControlName="gcYear"
                                                        class="form-control form-select ng-pristine ng-touched">
                                                            <option *ngFor="let yr of yearList" value={{yr.dataId}}>
                                                                {{yr.dataName}}
                                                            </option>
                                                        </select>
                                                    </td>                                       
                                                    <td class="col-lg-2">
                                                        <select formControlName="gcBook"
                                                            class="form-control form-select ng-pristine ng-touched">
                                                            <option *ngFor="let dl of branchList" value={{dl.dataId}}>
                                                                {{dl.dataName}}
                                                            </option>
                                                        </select>       
                                                    </td>                                                  
                                                    <td class="col-lg-1">
                                                        <input uppercaseonly type="text" class="form-control" 
                                                        numbersonly maxlength="15" 
                                                        formControlName="gcNoteNo" (change)="onGcNoteChange(i,$event)">
                                                        <input type="hidden" class="form-control" 
                                                        formControlName="consignmentId">
                                                    </td>
                                                    <td class="col-lg-1">
                                                        <input type="date" class="form-control" 
                                                        formControlName="bookingDate" >
                                                    </td>  
                                                    <td class="col-lg-2">
                                                        <input type="text" class="form-control" 
                                                        formControlName="fplace">
                                                    </td>  
                                                    <td class="col-lg-2">
                                                        <input type="text" class="form-control" 
                                                        formControlName="tplace" >
                                                    </td>  
                                                    <td class="col-lg-1">
                                                        <input numbersonly type="text" class="form-control" 
                                                        formControlName="challanPkgs" (change)="onPkgsChange()">
                                                    </td>     
                                                    <td class="col-lg-1">
                                                        <input threedecimalonly type="text" class="form-control" 
                                                        formControlName="challanWT" (change)="onActWtChange()">
                                                    </td>                                                
                                                    <td class="col-lg-1">
                                                        <div class="col-lg-4 details-button">
                                                            <button *ngIf="i === formArray.controls.length-1" type="button"
                                                                class="btn btn-add" (click)="addItem(i)"></button>
                                                            <button *ngIf="formArray.controls.length > 1"
                                                                (click)="removeItem(i)" class="btn btn-delete"></button>
                                                        </div>                                        
                                                    </td>
                                                </div>
                                            </tr>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row text-right">                       
                            <div class="col-lg-3"></div>                     
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Total Pkgs</label>      
                                </div>
                            </div>             
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <input type="text" numbersonly class="form-control" formControlName="totPkgs">
                                </div>
                            </div> 
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Total Act Wt</label>
                                </div>
                            </div> 
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <input type="text" decimalonly class="form-control" formControlName="totActWt">
                                </div>
                            </div>
                        </div>
                        <div class="row">                    
                            <div class="col-lg-5">
                                <div class="mb-3">
                                    <label style="color: blue"> 
                                        <h6><b>Created By:</b>  {{ this.createdBy }} </h6> 
                                    </label>                                                 
                                </div>
                            </div>                   
                            <div class="col-lg-5">
                                <div class="mb-3">
                                    <label style="color: blue"> 
                                        <h6><b>Modified By:</b> {{ this.modifiedBy}} </h6> 
                                    </label>                                                 
                                </div>
                            </div>
                            <!-- end col -->
                        </div> 
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-primary w-md next-step ms-2" 
                                        id="n-btn1" (click)="nextStep(2)">Save and continue</button>&nbsp;
                                    <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane mt-4" [ngClass]="{'active' : step2Active}" role="tabpanel" id="step2">
                        <div class="row">                                       
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Vehicle Type : </label>
                                    <span style="color: red">*</span>
                                    <select formControlName="vehicleType"
                                        class="form-control form-select ng-pristine ng-touched"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleType'].invalid) }">
                                        <option *ngFor="let dl of vehicalList" value={{dl.dataId}}>
                                            {{dl.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Vehicle Make : </label>
                                    <input uppercaseonly type="text" class="form-control"
                                        maxlength="10" 
                                        formControlName="vehicleMake">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Vehicle Model : </label>
                                    <input uppercaseonly class="form-control" 
                                    maxlength="50" formControlName="vehicleModel">
                                </div>
                            </div>                            
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Engine No : </label>
                                    <input uppercaseonly class="form-control" 
                                    maxlength="50" formControlName="engineNo">
                                </div>
                            </div>                       
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Chassis No : </label>
                                    <input uppercaseonly class="form-control" 
                                    maxlength="50" formControlName="chassisNo">
                                </div>
                            </div>  
                        </div>
                        <div class="row">                
                            <div class="col-lg-3">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Vehi Owner Name</label>
                                    <input uppercaseonly class="form-control" 
                                    maxlength="75" formControlName="vehicleOwnerName">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Vehi Owner Add1</label>
                                    <input uppercaseonly class="form-control" 
                                    maxlength="100" formControlName="vehicleOwnerAdd1">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Vehi Owner Add2</label>
                                    <input uppercaseonly class="form-control"  
                                    maxlength="100" formControlName="vehicleOwnerAdd2">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Vehi Owner Pan No</label>
                                    <input uppercaseonly class="form-control" 
                                    maxlength="10"  (change)="onOwnerPanChange()"
                                    formControlName="vehicleOwnerPanNo">
                                </div>
                            </div>
                        </div>
                        <div class="row">                    
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <input type="checkbox"  formControlName="panValid" class="form-check-input" >
                                    <label for="neft" class="form-check-label">PAN Valid </label>                                    
                                </div>
                            </div>                          
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <input type="checkbox"  formControlName="aadharLinked" class="form-check-input" >
                                    <label for="neft" class="form-check-label">Aadhar Linked </label>                                    
                                </div>
                            </div>                           
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <input type="checkbox"  formControlName="itFiled" class="form-check-input" >
                                    <label for="neft" class="form-check-label">IT Filed </label>                                    
                                </div>
                            </div>                            
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <input type="checkbox"  formControlName="permitValid" class="form-check-input" >
                                    <label for="neft" class="form-check-label">Permit Valid </label>                                    
                                </div>
                            </div>                              
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <input type="checkbox"  
                                     formControlName="declarationYN" class="form-check-input" 
                                     (change)="onDeclareChk($event)" >
                                    <label for="neft" class="form-check-label">Declaration Recd</label>
                                </div>
                            </div> 
                        </div>
                        <div class="row">                       
                            <div class="col-lg-2">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Vehi Owner Mobile</label>
                                    <input numbersonly maxlength="10" class="form-control" 
                                    formControlName="vehicleOwnerMblNo">
                                </div>
                            </div>                            
                            <div class="col-lg-2">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Vehi Ins Details</label>
                                    <input uppercaseonly class="form-control" formControlName="vehicleInsDetails">
                                </div>
                            </div>   
                        </div>
                        <div class="row">   
                            <div class="col-lg-3">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Driver Name</label>
                                    <input uppercaseonly class="form-control" maxlength="50" 
                                    formControlName="driverName">
                                </div>
                            </div>      
                            <div class="col-lg-4">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Driver Address</label>
                                    <input uppercaseonly class="form-control" 
                                    maxlength="250" formControlName="driverAddress">
                                </div>
                            </div>  
                        </div>
                        <div class="row">    
                            <div class="col-lg-2">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Driver LIC No</label>
                                    <input uppercaseonly class="form-control" 
                                    maxlength="25" formControlName="driverLicNo">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-4">
                                    <label for="formrow-inputZip">Driver LIC Issued At</label>
                                    <input uppercaseonly maxlength="25" 
                                        maxlength="25" class="form-control" 
                                        formControlName="driverLicIssuedAt">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Driver LIC Valid</label>
                                    <input bsdatepicker="" type="date" autoclose="false" class="form-control"
                                        formControlName="driverLicValid" >
                                </div>
                            </div> 
                            <div class="col-lg-2">
                                <div class="mb-3">
