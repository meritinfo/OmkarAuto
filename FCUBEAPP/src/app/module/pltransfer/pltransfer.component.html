<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Pl Transfer</h4>
                    </div>
                    <form [formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label>Branch: <span class="text-danger">*</span></label>
                                    <select class="form-control form-select ng-pristine ng-touched"
                                        autoclose="false"
                                        formControlName="tfrBranch"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['tfrBranch'].invalid) }">
                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2" style="padding-top:10px">
                                <div class="mt-3">
                                    <button class="btn btn-primary" (click)="search()">
                                        <span>Show PL</span>
                                    </button>
                                    &nbsp;&nbsp;
                                </div>
                            </div>
                        </div>
                        <div class="row" *ngIf="showGrid">
                            <div class="col-lg-8">
                                <div class="card">
                                    <div class="card-body">
                                        <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                            <tr>
                                                <th><label for="formrow-inputZip">Account Name</label></th>
                                                <th><label for="formrow-inputZip">Dr Amount</label></th>
                                                <th><label for="formrow-inputZip">Cr Amount</label></th>
                                            </tr>
                                            <tr formArrayName="arrayList"
                                                *ngFor="let arrayData of formArray.controls; let i = index">
                                                <div [formGroupName]="i" class="grid-table">

                                                    <td style="width:150px;padding:4px 6px;">
                                                        <input class="form-control" formControlName="accountName">
                                                        <input type="hidden" class="form-control" formControlName="accountId">
                                                    </td>

                                                    <td style="width:100px;padding:4px 6px;">
                                                        <input class="form-control" formControlName="drAmt" decimalonly>
                                                    </td>

                                                    <td style="width:100px;padding:4px 6px;">
                                                        <input class="form-control" formControlName="crAmt">
                                                    </td>
                                                </div>
                                            </tr>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-4">
                                <div class="row">
                                    <div class="col-lg-6">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Credits</label>
                                            <input decimalonly autocomplete="off" autoclose="false" class="form-control"
                                                formControlName="tfrTotalCrAmt"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['tfrTotalCrAmt'].invalid) }">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-6">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Debits</label>
                                            <input decimalonly autocomplete="off" autoclose="false" class="form-control"
                                                formControlName="tfrTotalDrAmt"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['tfrTotalDrAmt'].invalid) }">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-6">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">P & L</label>
                                            <input decimalonly autocomplete="off" autoclose="false" class="form-control"
                                                formControlName="tfrPLAmt"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['tfrPLAmt'].invalid) }">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row" *ngIf="showGrid">
                                <div class="col-lg-12 text-end">
                                    <button class="btn btn-primary w-md" (click)="plTransferSave()">
                                        Save
                                    </button>
                                    &nbsp;
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
