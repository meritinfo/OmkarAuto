<div class="main-content">
   <div class="page-content">
      <div class="container-fluid">
         <!-- start page title -->
         <div class="row">
            <div class="col-12">
               <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                  <h4 class="mb-sm-0 font-size-18">Truck Master</h4>
               </div>
            </div>
         </div>
         <!-- end page title -->
         <form [formGroup]="formUser">
            <div class="row">
               <div class="col-lg-12">
                  <div class="card">
                     <div class="card-body">                       
                        <div class="row">                             
                           <div class="row">
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Truck No </label><span style="color: red">*</span>                                       
                                 <input type="text" uppercaseonly  autofocus="autofocus" 
                                    class="form-control" formControlName="truckNo"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['truckNo'].invalid) }">
                              </div>                                      
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label">Regn Date </label><span style="color: red">*</span>                                          
                                 <input type="date"  autofocus="autofocus" class="form-control"
                                    formControlName="regnDate"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['regnDate'].invalid) }">
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Owner Name</label><span style="color: red">*</span> 
                                 <input type="text"  uppercaseonly autofocus="autofocus" 
                                    class="form-control" formControlName="ownerName"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['ownerName'].invalid) }">
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label">Owner Type </label>                                  
                                 <select id="scope" class="form-select" formControlName="ownerType">
                                    <option value="I">Individual </option>
                                    <option value="C">Company </option>
                                    <option value="H">HUF </option>
                                    <option value="O">Other </option>
                                 </select>
                              </div>                           
                           </div>
                           <div class="row">                                    
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Own Market </label>                               
                                 <select id="scope" uppercaseonly class="form-select" 
                                    formControlName="ownerType">
                                    <option value="O">Own  </option>
                                    <option value="M">Market </option>                                 
                                 </select>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Pan No  </label>                             
                                 <input type="text"  uppercaseonly autofocus="autofocus" 
                                    class="form-control"  formControlName="panNo"
                                 [ngClass]=>
                              </div>                         
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Aadhar No </label><span style="color: red">*</span>                              
                                 <input type="text" numbersonly autofocus="autofocus" 
                                    class="form-control" formControlName="aadharNo"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['aadharNo'].invalid) }">
                              </div>                        
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Aadhar Linked YN      </label>                          
                                 <select id="scope" class="form-select" formControlName="aadharLinkedYN">
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>
                                 </select>
                              </div>
                           </div>
                           <div class="row">
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> PAN Valid YN </label>                            
                                 <select id="scope" class="form-select" formControlName="panValidYN">
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>
                                 </select>
                              </div>                         
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> IT Filed YN   </label>                            
                                 <select id="scope" class="form-select" formControlName="itFiledYN">
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>
                                 </select>
                              </div>                    
                              <div class="col-sm-4">
                                 <label for="horizontal-firstname-input" uppercaseonly 
                                    class="col-form-label"> Address 1 </label>                              
                                 <input type="text"  autofocus="autofocus" class="form-control"
                                   uppercaseonly formControlName="address1"
                                   [ngClass]=>
                              </div>                          
                              <div class="col-sm-4">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Address 2</label>                          
                                 <input type="text" uppercaseonly autofocus="autofocus" 
                                    class="form-control" formControlName="address2"
                                   [ngClass]=>
                              </div>
                           </div>
                           <div class="row">
                              <div class="col-sm-4">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Address 3 </label>
                                 <input type="text" uppercaseonly  autofocus="autofocus" 
                                    class="form-control" formControlName="address3"
                                    [ngClass]=>
                              </div>                            
                              <div class="col-sm-4">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Address 4</label>
                                 <input type="text" uppercaseonly autofocus="autofocus" 
                                    class="form-control" formControlName="address4"
                                   [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input"  
                                    class="col-form-label"> State Code</label><span style="color: red">*</span> 
                                 <select class="form-control" formControlName="stateCode" >
                                    <option *ngFor="let state of stateList" value={{state.dataId}}>
                                        {{state.dataName}}
                                    </option>
                                 </select>
                              </div>    
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Pin Code</label>
                                 <input type="text" numbersonly autofocus="autofocus" 
                                    class="form-control" formControlName="pinCode">
                              </div>
                           </div>
                           <div class="row">
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Phone No</label>
                                 <input type="text" numbersonly  autofocus="autofocus" 
                                    class="form-control" formControlName="phoneNo"
                                   [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Contact Name</label>
                                 <input type="text" uppercaseonly  autofocus="autofocus" 
                                    class="form-control" formControlName="contactName"
                                   [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Mobile No</label>
                                 <input type="text" numbersonly autofocus="autofocus" 
                                    class="form-control" formControlName="mobileNo"
                                   [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Chasis No </label>
                                 <input type="text"  autofocus="autofocus" 
                                    class="form-control" formControlName="chasisNo" uppercaseonly
                                    [ngClass]=>
                              </div>
                           </div>
                           <div class="row">
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Engine No</label>
                                 <input type="text"  autofocus="autofocus" class="form-control"
                                    formControlName="engineNo" uppercaseonly
                                    [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Veh Code</label>
                                 <input type="text"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="vehCode" uppercaseonly
                                   [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Model</label>
                                 <input type="text" autofocus="autofocus" 
                                    class="form-control" formControlName="model" uppercaseonly
                                    [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> MfrName</label>
                                 <input type="text"  autofocus="autofocus" class="form-control"
                                    placeholder="" formControlName="mfrName" uppercaseonly
                                    [ngClass]=>
                                 </div>
                              </div>
                           </div>
                           <div class="row">
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Laden Weight </label>
                                 <input type="text"  autofocus="autofocus" class="form-control"
                                    placeholder="" formControlName="ladenWt" decimalonly
                                    [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> UnLaden Weight </label>
                                 <input type="text"  autofocus="autofocus" class="form-control"
                                    placeholder="" formControlName="unLadenWt" decimalonly
                                    [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Insurance Date</label>
                                 <input type="date"  autofocus="autofocus" class="form-control"
                                    placeholder="" formControlName="insuranceDt"
                                    [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> National Permit Date</label>
                                 <input type="date" autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="nationalPermitDt"
                                   [ngClass]=>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Fitness Date</label>
                                 <input type="date"  autofocus="autofocus" class="form-control"
                                    placeholder="" formControlName="fitnessDt"
                                    [ngClass]=>
                              </div>
                           </div>
                           <div class="row">
                              <div class="col-sm-4">
                                 <label for="formDLFile" class="col-form-label">Rc Upload</label>
                                 <input #attachmentInput class="form-control" type="file"
                                    id="formAttFile" accept="image/*">
                              </div>
                              <div class="col-sm-4">
                                 <label for="otherUpload" class="col-form-label">Other Upload</label>
                                 <input #attachmentInput1 class="form-control" type="file"
                                 id="formAttFile" accept="image/*">
                              </div>
                           </div>
                           <div class="row">
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Is Active</label>
                                 <select id="scope" class="form-select" formControlName="isActive">
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>
                                 </select>
                              </div>
                              <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> In Active Date</label>
                                 <input type="date" autofocus="autofocus" class="form-control"
                                    placeholder="" formControlName="inActiveDate"
                                    [ngClass]=>
                              </div>
                              <div class="col-sm-4">
                                 <label for="horizontal-firstname-input" 
                                    class="col-form-label"> Remarks</label>
                                 <input type="text" uppercaseonly autofocus="autofocus" 
                                    class="form-control" formControlName="remarks"
                                    [ngClass]=>
                              </div>
                           </div>
                        </div>
                     </div>
                  </div> 
               </div> 
               <div class="row text-right">
                  <div class="col-lg-12">
                     <div class="tex">
                        <button class="btn btn-primary w-md"
                           (click)="submitTruckMasterForm()">Save</button>
                        <button class="btn btn-danger w-md m-2" 
                              (click)="truckMasterDelete()">Delete</button>                         
                        <button class="btn btn-secondary w-md m-2" (click)="exit()">Exit</button>
                     </div>
                  </div>
               </div>
            </form>
         </div>
      </div>
   </div>
