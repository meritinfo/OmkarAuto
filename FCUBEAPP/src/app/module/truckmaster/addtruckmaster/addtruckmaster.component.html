<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Truck Master</h4>
                   <div class="page-title-right">
                      <ol class="breadcrumb m-0">
                         <li class="breadcrumb-item"><a href="javascript: void(0);">Freight</a></li>
                         <li class="breadcrumb-item active">Truck  Master</li>
                      </ol>
                   </div>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form [formGroup]="formUser">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                       
                         <div class="row">
                            <div class="col-lg-12">
                               <div class="card">
                                  
                                 <div class="card-body">
                                 
                                    <div class="row">
                                      <div class="col-sm-2">
                                         <label for="horizontal-firstname-input" class="col-form-label"> Truck No 
                                         </label><span style="color: red">*</span> 
                                      
                                       <input type="text" uppercaseonly  autofocus="autofocus" class="form-control"
                                       placeholder="" formControlName="truckNo"
                                       [ngClass]=>
                                      </div>
                                      
                                      <div class="col-sm-2">
                                         <label for="horizontal-firstname-input" class="col-form-label">Regn Date 
                                         </label>
                                   
                                      
                                          <input type="date"  autofocus="autofocus" class="form-control"
                                          placeholder="" formControlName="regnDate"
                                          [ngClass]=>
                                     
                                      </div>
                             
                                
                                    <div class="col-sm-2">
                                       <label for="horizontal-firstname-input" class="col-form-label"> Owner Name
                                       </label><span style="color: red">*</span> 
                                  
                                       <input type="text"  uppercaseonly autofocus="autofocus" class="form-control"
                                       placeholder="" formControlName="ownerName"
                                       [ngClass]=>
                                    </div>
                                    <div class="col-sm-2">
                                       <label for="horizontal-firstname-input" class="col-form-label">Owner Type 
                                       </label>
                                  
                                       <select id="scope" class="form-select" formControlName="ownerType">
                                          <option value="I">Individual </option>
                                          <option value="C">Company </option>
                                          <option value="H">HUF </option>
                                          <option value="O">Other </option>
                                      </select>
                                    </div>
                           
                                 </div>
                              </div>
                              <div class="card-body">
                                 <div class="row">
                                    
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Own Market
                                   </label>
                               
                                 <select id="scope" uppercaseonly class="form-select" formControlName="ownerType">
                                    <option value="O">Own  </option>
                                    <option value="M">Market </option>
                                 
                                </select>
                                </div>
                                <div class="col-sm-2">
                                 <label for="horizontal-firstname-input" class="col-form-label"> Pan No
                                 </label>
                             
                                 <input type="text"  uppercaseonly autofocus="autofocus" class="form-control"
                                 placeholder="" formControlName="panNo"
                                 [ngClass]=>
                              </div>
                         
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Aadhar No
                                   </label><span style="color: red">*</span> 
                             
                                   <input type="text"  uppercaseonly  numbersonly autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="aadharNo"
                                   [ngClass]=>
                                </div>
                        
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> AadharLinkedYN
                                   </label>
                          
                                    <select id="scope" class="form-select" formControlName="aadharLinkedYN">
                                       <option value="Y">Yes</option>
                                       <option value="N">No</option>
                                   </select>
                                 </div>
                             </div>
                           </div>
                           <div class="card-body">
                             <div class="row">
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> PanValidYN
                                   </label>
                            
                                    <select id="scope" class="form-select" formControlName="panValidYN">
                                       <option value="Y">Yes</option>
                                       <option value="N">No</option>
                                   </select>
                                 </div>
                         
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> ItFiledYN
                                   </label>
                            
                                    <select id="scope" class="form-select" formControlName="itFiledYN">
                                       <option value="Y">Yes</option>
                                       <option value="N">No</option>
                                   </select>
                                 </div>
                    
                                <div class="col-sm-4">
                                   <label for="horizontal-firstname-input" uppercaseonly class="col-form-label"> Address 1
                                   </label>
                              
                                   <input type="text"  autofocus="autofocus" class="form-control"
                                   placeholder="" uppercaseonly formControlName="address1"
                                   [ngClass]=>
                                </div>
                          
                                <div class="col-sm-4">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Address 2
                                   </label>
                          
                                   <input type="text" uppercaseonly autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="address2"
                                   [ngClass]=>
                                </div>
                             </div>
                           </div>
                           <div class="card-body">
                             <div class="row">
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Address 3
                                   </label>
                                </div>
                                <div class="col-sm-4">
                                   <input type="text" uppercaseonly  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="address3"
                                   [ngClass]=>
                                </div>
                            
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Address 4
                                   </label>
                                </div>
                                <div class="col-sm-4">
                                   <input type="text" uppercaseonly autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="address4"
                                   [ngClass]=>
                                </div>
                             </div>
                           </div>
                           <div class="card-body">
                             <div class="row">
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input"  class="col-form-label"> State Code
                                   </label><span style="color: red">*</span> 
                                </div>
                                <div class="col-sm-4">
                                 <select class="form-control" formControlName="stateCode"      
                                 [ngClass]="">
                                     <option *ngFor="let state of stateList" value={{state.dataId}}>
                                        {{state.dataName}}
                                     </option>
                                  </select>
                                </div>
                             
                             
                          
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Pin Code
                                   </label>
                                </div>
                                <div class="col-sm-4">
                                   <input type="text" numbersonly autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="pinCode"
                                   [ngClass]=>
                                </div>
                              </div>
                           </div>
                        </div>
                        <div class="card-body">
                             <div class="row">
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Phone No
                                   </label>
                                
                                   <input type="text" numbersonly  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="phoneNo"
                                   [ngClass]=>
                                </div>
                             
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Contact Name
                                   </label>
                              
                                   <input type="text" uppercaseonly  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="contactName"
                                   [ngClass]=>
                                </div>
                      
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Mobile No
                                   </label>
                               
                                   <input type="text"   numbersonly autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="mobileNo"
                                   [ngClass]=>
                                </div>
                          
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Chasis No
                                   </label>
                            
                                   <input type="text"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="chasisNo"
                                   [ngClass]=>
                                </div>
                             </div>
                           </div>
                           <div class="card-body"> 
                             <div class="row">
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Engine No
                                   </label>
                             
                                   <input type="text"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="engineNo"
                                   [ngClass]=>
                                </div>
                            
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Veh Code
                                   </label>
                              
                                   <input type="text"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="vehCode"
                                   [ngClass]=>
                                </div>
                          
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Model
                                   </label>
                               
                                   <input type="text"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="model"
                                   [ngClass]=>
                                </div>
                            
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> MfrName
                                   </label>
                           
                                   <input type="text"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="mfrName"
                                   [ngClass]=>
                                </div>
                             </div>
                           </div>
                           <div class="card-body"> 
                             <div class="row">
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Laden Weight
                                   </label>
                              
                                   <input type="text"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="ladenWt"
                                   [ngClass]=>
                                </div>
                        
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> UnLaden Weight
                                   </label>
                           
                                   <input type="text"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="unLadenWt"
                                   [ngClass]=>
                                </div>
                      
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Insurance Date
                                   </label>
                           
                                   <input type="date"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="insuranceDt"
                                   [ngClass]=>
                                </div>
                         
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> National Permit Date
                                   </label>
                              
                                   <input type="date"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="nationalPermitDt"
                                   [ngClass]=>
                                </div>
                             </div>
                           </div>
                           <div class="card-body"> 
                             <div class="row">
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Fitness Date
                                   </label>
                                </div>
                                <div class="col-sm-4">
                                   <input type="date"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="fitnessDt"
                                   [ngClass]=>
                                </div>
                          
                                <div class="col-sm-2">
                                 <label for="formDLFile" class="form-label">
                                    Rc Upload
                                </label>
                                </div>
                                <div class="col-sm-4">
                                 
                                <input #attachmentInput class="form-control" type="file"
                                    id="formAttFile" accept="image/*">
                                </div>

                             </div>
                           </div>
                           <div class="card-body"> 
                             <div class="row">
                                <div class="col-sm-2">
                                 <label for="otherUpload" class="form-label">
                                    Other Upload
                                </label>
                                </div>
                                <div class="col-sm-4">
                                 <input #attachmentInput1 class="form-control" type="file"
                                 id="formAttFile" accept="image/*">

                                </div>
                           
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> isActive
                                   </label>
                                </div>
                                <div class="col-sm-4">
                                 <select id="scope" class="form-select" formControlName="isActive">
                                    <option value="Y">Yes</option>
                                    <option value="N">No</option>
                                </select>
                                </div>
                             </div>
                           </div>
                           <div class="card-body"> 
                             <div class="row">
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> InActiveDate
                                   </label>
                                </div>
                                <div class="col-sm-4">
                                   <input type="date"  autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="inActiveDate"
                                   [ngClass]=>
                                </div>
                         
                                <div class="col-sm-2">
                                   <label for="horizontal-firstname-input" class="col-form-label"> Remarks
                                   </label>
                                </div>
                                <div class="col-sm-4">
                                   <input type="text" uppercaseonly autofocus="autofocus" class="form-control"
                                   placeholder="" formControlName="remarks"
                                   [ngClass]=>
                                </div>
                             </div>
                           </div>
                             
                             
                            </div>
                               </div>
                            </div>
                         
                            <div class="col-lg-12">
                                <div class="card">
                                   <div class="card-body">
                                   
                                         
                                   </div>
                                </div>
                             </div>
               
                 
                         </div>
                      </div>
                      <!-- end card body -->
                  
                   <!-- end card -->
           
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                      <button class="btn btn-primary w-md"
                         (click)="submitTruckMasterForm()">Save</button>
                         <button class="btn btn-danger w-md m-2" 
                           (click)="truckMasterDelete()">Delete</button>
                         
                         <button class="btn btn-secondary w-md m-2" (click)="exit()">Exit</button>
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->

    <!-- End Page-content -->
