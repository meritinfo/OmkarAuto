
<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Challan Cost Types</h4>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form (keydown.enter)="$event.preventDefault()"[formGroup]="formChCost">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                                 
                         <div class="row">
                           <div class="col-lg-2">
                               <div class="mb-4"><label for="formrow-inputCity">Challan Cost Desc</label> <span style="color: red">*</span>
                               </div>
                              </div>
                              <div class="col-lg-4">
                               <div class="mb-4">
                                 <input type="text"  autofocus="autofocus" class="form-control"
                                   uppercaseonly formControlName="chCostDesc"  (change)="checkDuplicateDesc()"
                                 [ngClass]="{ 'is-invalid': formSubmitted && (f['chCostDesc'].invalid) }">
                               </div>
                           </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-2">
                                <div class="mb-4"><label for="formrow-inputCity">Sac Code</label> <span style="color: red">*</span>
                                </div>
                               </div>
                               <div class="col-lg-4">
                                <div class="mb-4">
                                  <input type="text"  autofocus="autofocus" class="form-control"
                                    uppercaseonly formControlName="sacCode"   
                                  [ngClass]="{ 'is-invalid': formSubmitted && (f['sacCode'].invalid) }">
                                </div>
                            </div>
                         </div>
                         <div class="row">
                            <div class="col-lg-2">
                                <div class="mb-4"><label for="formrow-inputCity">Gst Pct</label> <span style="color: red">*</span>
                                </div>
                               </div>
                               <div class="col-lg-4">
                                <div class="mb-4">
                                  <input type="text"  autofocus="autofocus" class="form-control"
                                    decimalonly formControlName="gstPct" 
                                  [ngClass]="{ 'is-invalid': formSubmitted && (f['gstPct'].invalid) }">
                                </div>
                            </div>
                         </div>
                        
                                   
                           
                          
                              
                                 
                           
                 
                      </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                   



                         <button class="btn btn-primary w-md"
                         *ngIf="((editMode && editStatus) || (!editMode && createStatus))"
                            (click)="submitChCostTypesForm()">Save</button>&nbsp;
                         <button class="btn btn-danger w-md m-2" 
                               (click)="chCostTypeDelete()" 
                               *ngIf="editMode && deleteStatus">Delete</button>  &nbsp;                       
                         <button class="btn btn-secondary w-md m-2" (click)="exit()">Exit</button>

                         
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
