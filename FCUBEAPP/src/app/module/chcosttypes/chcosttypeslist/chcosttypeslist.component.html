                    <tbody *ngIf="allCostTypes.costList?.length != 0">
                        <tr *ngFor="let branch  of allCostTypes.costList">
                            <td>{{ branch.chCostDesc }}</td>
                            <td>{{ branch.sacCode }}</td>
                            <td>{{ branch.gstPct }}</td>
                                
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="getCostTypesList(branch)"></button>             
                            </td>  
                        </tr>
                    </tbody>
                    <tbody *ngIf="allCostTypes.costList?.length == 0">

                        </tr>
