<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title  createdby aashish ware-->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Bank Reconciliation Report</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                        
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState"> Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="clearDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['clearDate'].invalid) }">
                                </div>
                            </div>                            
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Branch </label>
                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="branch">
                                    <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                        {{branch.dataName}}
                                    </option>
                                </select>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Account </label> 
                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="accountID">
                                        <option *ngFor="let branch of accountList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>        
                                </div>
                            </div>
                        </div>                        
                        <div class="row">   
                          
                            <div class="col-lg-3">
                                <div class="mt-3">
                                    <button class="btn btn-primary" 
                                        (click)="exportExcel()"><span>Export Excel</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
