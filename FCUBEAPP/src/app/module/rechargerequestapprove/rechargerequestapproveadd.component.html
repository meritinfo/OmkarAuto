<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
          <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Recharge Request Approve</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formRequestRecharge">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">                               
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="basicpill-phoneno-input">Branch</label><span style="color: red">*</span>    
                                            <select class="form-control form-select ng-pristine ng-touched"
                                                formControlName="reqBranch" 
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['reqBranch'].invalid) }" >
                                                <option value="">All</option>
                                                <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputState">From Date</label><span style="color: red">*</span>    
                                            <input type="date" class="form-control" 
                                            formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputState">To Date</label><span style="color: red">*</span>    
                                            <input type="date" class="form-control" 
                                            formControlName="toDate" min="{{minDate}}" max="{{maxDate}}"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Vehicle No</label><span style="color: red">*</span>    
                                            <div class="ng-autocomplete">
                                                <ng-autocomplete [data]="vehicleList"
                                                    [searchKeyword]="keywordLocation"  
                                                    formControlName="vehicleMasterId"
                                                    (inputChanged)='onChangeSearch($event)'
                                                    (inputFocused)='onFocused($event)' 
                                                    [itemTemplate]="itemTemplate"
                                                    [notFoundTemplate]="notFoundTemplate"
                                                    [customFilter]="endWithFilter">
                                                </ng-autocomplete>
                                                <ng-template #itemTemplate let-item>
                                                    <a [innerHTML]="item.dataName"></a>
                                                </ng-template>
                                                <ng-template #notFoundTemplate let-notFound>
                                                    <div [innerHTML]="notFound"></div>
                                                </ng-template>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="basicpill-phoneno-input">Req Card </label>
                                            <div class="ng-autocomplete">
                                                <ng-autocomplete [data]="fleetCardList"
                                                    [searchKeyword]="keywordLocation"  
                                                    formControlName="reqCard"
                                                    (inputChanged)='onChangeSearch($event)'
                                                    (inputFocused)='onFocused($event)' 
                                                    [itemTemplate]="itemTemplate"
                                                    [notFoundTemplate]="notFoundTemplate"
                                                    [customFilter]="endWithFilter">
                                                </ng-autocomplete>

                                                <ng-template #itemTemplate let-item>
                                                    <a [innerHTML]="item.dataName"></a>
                                                </ng-template>

                                                <ng-template #notFoundTemplate let-notFound>
                                                    <div [innerHTML]="notFound"></div>
                                                </ng-template>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mt-3">
                                            <button class="btn btn-primary" (click)="search()">
                                            <span>Search</span></button>&nbsp;&nbsp;
                                        </div>
                                    </div>     
                                </div>
                                <div class="ng-untouched ng-pristine ng-valid">
                                    <div class="row">
                                        <div class="col-lg-12">
                                            <div class="card">
                                                <div class="card-body">
                                                    <div class="overflow-x">
                                                    <table class="table table-bordered dt-responsive nowrap w-100 no-border-table mini-width">
                                                        <tr>
                                                            <th colspan="3">
                                                                <input type="checkbox"  name="select" *ngIf="showGrid" 
                                                                        class="form-check-input" style="border: 1px; border-style: double;"
                                                                        (change)="selectAll($event)" formControlName="selectedAll">  
                                                                        <label for="formrow-inputCity" *ngIf="showGrid" >SELECT ALL</label>
                                                            </th>
                                                            <th colspan="3">
                                                                <label for="formrow-inputCity" *ngIf="showGrid" >Balance Amt: <span style="color: Red;">{{balanceAmt}}</span> </label>
                                                            </th>
                                                        </tr>
                                                        <tr>
                                                            <th></th>
                                                            <th><label for="formrow-inputZip">Req Date</label></th>
                                                            <th><label for="formrow-inputZip">Vehicle No</label></th>
                                                            <th><label for="formrow-inputZip">Card No</label></th>
                                                            <th><label for="formrow-inputZip">Req Amt</label></th>
                                                            <th><label for="formrow-inputZip">Req Remarks</label></th>
                                                            <th><label for="formrow-inputZip">Approved Amount</label></th>
                                                            <th><label for="formrow-inputZip">App/Rej</label></th>
                                                            <th><label for="formrow-inputZip">App Rej Remarks</label></th>
                                                        </tr>
                                                        <tr  formArrayName="arrayList" *ngFor="let arrayData of formArray.controls; let i = index"  >
                                                            <div [formGroupName]="i"   class="grid-table" *ngIf="showGrid"> 
                                                                <td style="width: 5px;">
                                                                    <div class="mb-3">
                                                                        <input type="checkbox"  name="select" 
                                                                            class="form-check-input"
                                                                            (change)="selectedData(i, $event)" formControlName="selected">
                                                                    </div>
                                                                </td>                                            
                                                                <td  > 
                                                                    <div class="mb-3">
                                                                        <input class="form-control" formControlName="reqDate" >
                                                                    </div>
                                                                </td>
                                                                <td>
                                                                    <div class="mb-3">
                                                                        <input class="form-control" formControlName="vehicleNo" uppercaseonly>
                                                                    </div>
                                                                </td>
                                                                <td>
                                                                    <div class="mb-3">
                                                                        <input class="form-control" formControlName="cardNo" >
                                                                    </div>
                                                                </td>
                                                                <td>
                                                                    <div class="mb-3">
                                                                        <input class="form-control" formControlName="reqAmt" >
                                                                    </div>
                                                                </td>
                                                                <td>
                                                                    <div class="mb-3">
                                                                        <input class="form-control" formControlName="remarks" uppercaseonly>
                                                                    </div>
                                                                </td>
                                                                <td >
                                                                    <div class="mb-3">       
                                                                        <input class="form-control" style="width: 100px;" 
                                                                            formControlName="approvedAmt" decimalonly>
                                                                    </div>
                                                                </td>
                                                                <td>
                                                                    <div class="mb-3">                        
                                                                        <select  class="form-control form-select ng-pristine ng-touched" 
                                                                            style="width:100px;"
                                                                            formControlName="approvedYN" >
                                                                            <option value="Y">Approve</option>
                                                                            <option value="N">Reject</option>
                                                                        </select>
                                                                    </div>
                                                                </td>
                                                                <td >
                                                                    <div class="mb-3">       
                                                                        <input class="form-control" style="width: 150px;" 
                                                                        formControlName="appRejRemarks" uppercaseonly>
                                                                    </div>
                                                                </td>
                                                            </div>
                                                        </tr>
                                                    </table>                                              
                                                    </div>                                                    
                                                </div>                                           
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- end card body -->
                        </div>
                        <!-- end card -->
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                                *ngIf="showGrid"
                                (click)="rechargeRequestAppSave()">Update</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
