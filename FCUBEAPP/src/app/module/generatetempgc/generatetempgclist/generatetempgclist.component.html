
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">DPR Generate Temp GC</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="javascript: void(0);">Freight</a></li>
                                <li class="breadcrumb-item active">Distance Master Freight </li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form [formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" formControlName="fromDate" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" formControlName="toDate" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>  
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary" type="submit" 
                                        (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            <!-- end page title -->            
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">                    
                     <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                       <thead>
                            <tr>
                                <th>dprDate </th>  
                                <th>gcNoteNo</th> 
                                <th>partyName</th>                         
                                <th>fromPlace </th>
                                <th>toPlace</th>  
                                <th>vehicleNo </th>   
                                <th>driverName</th>    
                                <th>driverMob1</th>                               
                                <th>Action</th>                                
                                <th>Download</th>                                
                                <th>Mail</th>                                
                                <th>Main LR</th>   
                            </tr>
                        </thead>
                        <tbody *ngIf="alltempgclist.tempGcList?.length != 0">
                            <tr *ngFor="let gc of alltempgclist.tempGcList">
                                <td>{{ gc.dprDate }}</td>  
                                <td>{{ gc.gcNoteNo }}</td>                        
                                <td>{{ gc.partyName }}</td>    
                                <td>{{ gc.fromPlace }}</td>                        
                                <td>{{ gc.toPlace }}</td>                        
                                <td>{{ gc.vehicleNo }}</td>                          
                                <td>{{ gc.driverName }}</td>                          
                                <td>{{ gc.driverMob1 }}</td> 
                                <td>                                  
                                    <button type="button" class="btn btn-edit"
                                        (click)="gettempgcDetails(gc)"></button>                               
                                </td>
                                <td>
                                    <button type="button" *ngIf="gc.tempGcId!='0'" 
                                        class="btn btn-primary btn-floating"  
                                    (click)="download(gc)" >
                                        <i class="fas fa-download"></i></button>   
                                </td>  
                                <td>
                                    <button type="button" *ngIf="gc.tempGcId!='0'" 
                                        class="btn btn-primary btn-floating"  
                                    (click)="sendMail(gc)" >
                                        <i class="far fa-envelope"></i></button>   
                                </td>   
                                <td>
                                    <button type="button" *ngIf="gc.tempGcId!='0'" 
                                        class="btn btn-primary btn-floating"  
                                    (click)="genMainLrDetails(gc)" >
                                        <i class="fas fa-file-invoice-dollar"></i></button>   
                                </td> 
                                                                
                            </tr>
                        </tbody>
                        <tbody *ngIf="alltempgclist.tempGcList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
                    </table> 
                </div>
            </div>
        </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
