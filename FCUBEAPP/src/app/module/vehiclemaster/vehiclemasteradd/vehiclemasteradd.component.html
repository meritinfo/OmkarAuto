<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Vehicle Master</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formVehicleMaster">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4">Master Details</h4>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" class="form-control"
                                                    placeholder="" formControlName="vehicleNo"  
                                                    (change)="onVehicalNoChange($event)" maxlength="20"                                                 
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['vehicleNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Regn Date</label> 
                                                <span style="color: red">*</span>                                               
                                                <input type="date" class="form-control" formControlName="regnDate"
                                                    placeholder= "dd/MM/yyyy"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['regnDate'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-5">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Regd Owner</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly autoclose="false" class="form-control"
                                                    formControlName="regdOwner" placeholder=""                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['regdOwner'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label  for="formrow-inputState">Chessis No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" class="form-control"
                                                    formControlName="chasisNo"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['chasisNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Engine No</label>
                                                <span style="color: red">*</span>
                                                <input type="text" uppercaseonly class="form-control"
                                                    formControlName="engineNo"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['engineNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Type</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control" formControlName="vehicleTypeGroupId"   
                                                class="form-control form-select ng-pristine ng-touched"   
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['vehicleTypeGroupId'].invalid) }">
                                                    <option *ngFor="let vehi of vehicleTypeList" value={{vehi.dataId}}>
                                                       {{vehi.dataName}}
                                                    </option>
                                                 </select>
                                            </div>
                                        </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Mfr</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control" formControlName="vehMfrId"   
                                                class="form-control form-select ng-pristine ng-touched"   
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['vehMfrId'].invalid) }">
                                                    <option *ngFor="let mfr of vehicleMfrList" value={{mfr.dataId}}>
                                                       {{mfr.dataName}}
                                                    </option>
                                                 </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Mfr Model Name</label>
                                                <span style="color: red">*</span>
                                                <input  uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="mfrModelName" placeholder=""                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['mfrModelName'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Year</label>
                                                <span style="color: red">*</span>
                                                <input numbersonly maxlength="4" autoclose="false" placeholder=""                                                 
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['makeYear'].invalid) }"
                                                    formControlName="makeYear" class="form-control">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Fule Type</label>
                                                <span style="color: red">*</span>
                                                <select id="formrow-inputState" class="form-select"  formControlName="fuelType"    
                                                class="form-control form-select ng-pristine ng-touched"                                            
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['fuelType'].invalid) }"
                                                    formControlName="fuelType">
                                                    <option value="">Choose...</option>
                                                    <option value="D">Diesel</option>
                                                    <option value="E">Electric</option>
                                                    <option value="H">Hybrid</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Tank Capacity</label>
                                                <span style="color: red">*</span>
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="tankCap" placeholder=""                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['tankCap'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Mileage</label>
                                                <span style="color: red">*</span>
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="mileageLt" placeholder=""                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['mileageLt'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Gross Weight</label>
                                               
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="grossWt" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">UnLaden Weight</label>
                                        
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="unLadenWT">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">No of Tyres</label>
                                                <span style="color: red">*</span>
                                                <input numbersonly maxlength="3" type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="noOfTyres">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Vehicle Length</label>
                                               
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="vehLength" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Height</label>
                                              
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="vehHeight" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Breadth</label>
                                            
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="vehBreadth" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Volume(CFT)</label>
                                                <input type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="vehVolumeCFT">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3"><label for="formrow-inputCity">FastTag Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control" formControlName="fastTagYN" 
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    (change)="onFastTagChange($event)"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['fastTagYN'].invalid) }">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">FastTag Company</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="fastTagCo" placeholder=""                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['fastTagCo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">FastTag Card No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly autoclose="false" placeholder=""
                                                    formControlName="fastTagNo" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['fastTagNo'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Petro Card Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control" formControlName="petroCardYN"    
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    (change)="onPetroCardChange($event)"                                                    
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['petroCardYN'].invalid) }">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Petro Card Company</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="petroCo" placeholder=""                                                  
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['petroCo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Petro Card No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly  autoclose="false" placeholder=""
                                                    formControlName="petroCardNo" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['petroCardNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Petro Card Pin</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly autoclose="false" placeholder=""
                                                    formControlName="petroCardPin" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['petroCardPin'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3"><label for="formrow-inputCity">Happay Card Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control" formControlName="happayCardYN"  
                                                    class="form-control form-select ng-pristine ng-touched"  
                                                    (change)="onHappayCardChange($event)"                                                                       
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['happayCardYN'].invalid) }">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Happay Card No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly  autoclose="false" placeholder=""
                                                    formControlName="happayCardNo" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['happayCardNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Happay Card Pin</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly  autoclose="false" placeholder=""
                                                    formControlName="happayCardPin" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['happayCardPin'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3"><label for="formrow-inputCity">FIP Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control" formControlName="fipYN"      
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    (change)="onFipChange($event)"                                                                      
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['fipYN'].invalid) }">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">FIP No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="fipNo" placeholder=""                                                  
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['fipNo'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Sold Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control"     
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    (change)="onSoldChange($event)"                                                                        
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['soldYN'].invalid) }"
                                                        formControlName="soldYN">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Sold To</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="soldTo" placeholder=""                                                  
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['soldTo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Sold Date</label>
                                                <span style="color: red">*</span>
                                                <input autoclose="false" type="date" 
                                                    placeholder="dd-mm-yyyy" class="form-control"
                                                    formControlName="soldDate"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['soldDate'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Sold Value</label>
                                                <span style="color: red">*</span>
                                                <input decimalonly bsdatepicker="" autoclose="false" placeholder=""
                                                    formControlName="soldValue" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['soldValue'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3"><label for="formrow-inputCity">Transfer Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control" 
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    (change)="onTransferChange($event)"                                                       
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['tfrYN'].invalid) }"
                                                        formControlName="tfrYN">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Transfer Date</label>
                                                <span style="color: red">*</span>
                                                <input autoclose="false" type="date"
                                                    placeholder="dd-mm-yyyy" class="form-control"
                                                    formControlName="tfrDate"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['tfrDate'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Transfer New Vehicle</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly autoclose="false"
                                                    placeholder="" class="form-control"
                                                    formControlName="tfrVehicleNo"                                                 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['tfrVehicleNo'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Vehicle Ledger Account</label>
                                              
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="vehicleLedgerAcList"
                                                        [searchKeyword]="keywordLocation" placeholder=""
                                                        formControlName="vehicleLedgerAc" [initialValue]=""
                                                        (selected)='selectEvent($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' 
                                                        [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"
                                                        [ngClass]="{ 'is-invalid': userSubmitted && (f['vehicleLedgerAc'].invalid) }" >
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Vehicle Asset Account</label>
                                              
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="vehicleAssetAcList"
                                                        [searchKeyword]="keywordLocation" placeholder=""
                                                        formControlName="vehicleAssetAc" [initialValue]=""
                                                        (selected)='selectEvent($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' 
                                                        [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"
                                                        [ngClass]="{ 'is-invalid': userSubmitted && (f['vehicleAssetAc'].invalid) }" >
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Attachment Description 1</label>
                                                <input autoclose="false" placeholder=""
                                                    class="form-control" formControlName="attach1Desc">
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Attachment</label>                                                
                                                <input #attachment1Input class="form-control" type="file"
                                                    id="formAttach1File" accept="image/*">
                                                <a *ngIf="selectedVehicleMasterDetails.attach1Link" target="_blank"
                                                    href={{attach1}}>Download</a>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Attachment Description 2</label>
                                                <input autoclose="false" placeholder=""
                                                    class="form-control" formControlName="attach2Desc">
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Attachment</label>                                                                                               
                                                <input #attachment2Input class="form-control" type="file"
                                                    id="formAttach2File" accept="image/*">
                                                <a *ngIf="selectedVehicleMasterDetails.attach2Link" target="_blank"
                                                    href={{attach2}}>Download</a>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Attachment Description 3</label>
                                                <input autoclose="false" placeholder=""
                                                    class="form-control" formControlName="attach3Desc">
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Attachment</label>                                                                                               
                                                <input #attachment3Input class="form-control" type="file"
                                                    id="formAttach3File" accept="image/*">
                                                <a *ngIf="selectedVehicleMasterDetails.attach3Link" target="_blank"
                                                    href={{attach3}}>Download</a>
                                            </div>

                                            
                                        </div>
                                    </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="ng-untouched ng-pristine ng-valid">
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="card-title mb-4">Details</h4>
                                        <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                            <tr>
                                                <td class="col-lg-2">
                                                    <label for="formrow-inputZip">
                                                        <h6>Valid From</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-2">
                                                    <label for="formrow-inputZip">
                                                        <h6>Valid To</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-2">
                                                    <label for="formrow-inputZip">
                                                        <h6>Vehicle Agv Load</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-2">
                                                    <label for="formrow-inputZip">
                                                        <h6>Vehicle Agv Empty</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-2">
                                                    <label for="formrow-inputZip">
                                                        <h6>Ad Blue</h6>
                                                    </label>
                                                </td>
                                            </tr>
                                            <tr formArrayName="arrayList"
                                            *ngFor="let arrayData of formArray.controls; let i = index">
                                                <div [formGroupName]="i" class="grid-table">
                                                    <td class="col-lg-2">                                                  
                                                        <input autoclose="false" type="date"
                                                                class="form-control form-control-lg" 
                                                                formControlName="validFrom">
                                                    </td>
                                                    <td class="col-lg-2">
                                                        <input autoclose="false" type="date"
                                                                class="form-control form-control-lg" 
                                                                formControlName="validTo">
                                                    </td>
                                                    <td class="col-lg-2">
                                                        <input  maxlength="9" decimalonly class="form-control form-control-lg"
                                                                formControlName="vehicleAvgLoad">
                                                    </td>
                                                    <td class="col-lg-2">
                                                        <input  maxlength="9" decimalonly class="form-control form-control-lg"
                                                            formControlName="vehicleAvgEmpty">
                                                    </td>
                                                    <td class="col-lg-2">
                                                        <input maxlength="9" decimalonly class="form-control form-control-lg" 
                                                                    formControlName="adBlue">
                                                    </td>
                                                    <td class="col-lg-2">
                                                        <div class="col-lg-4 details-button">
                                                            <button *ngIf="i === formArray.controls.length-1" type="button"
                                                                class="btn btn-add" (click)="addItem(i)"></button>
                                                            <button *ngIf="formArray.controls.length > 1"
                                                                (click)="removeItem(i)" class="btn btn-delete"></button>
                                                        </div>                                        
                                                    </td>
                                                </div>
                                            </tr>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>                
                    <div class="row text-right">
                        <div class="col-lg-12">
                            <div class="tex">
                                <button class="btn btn-primary w-md" *ngIf="(editMode && editStatus) || (!editMode && createStatus)"
                                    (click)="submitVehicleMasterForm()">Save</button>&nbsp;
                                <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                    (click)="deleteVehicleMasterForm()">Delete</button>&nbsp;
                                <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                            </div>
                        </div>
                        <!-- end col -->
                    </div>   
                </div>                       
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
