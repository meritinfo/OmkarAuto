<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Vehicle Master</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formVehicleMaster">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4">Master Details</h4>
                                    <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputState">Fleet Group</label>
                                            <span style="color: red">*</span>
                                            <select class="form-control form-select ng-pristine ng-touched"formControlName="fleetGroupId"   
                                            class="form-control form-select ng-pristine ng-touched"   
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['fleetGroupId'].invalid) }">
                                                <option *ngFor="let vehi of fltGrpList" value={{vehi.dataId}}>
                                                   {{vehi.dataName}}
                                                </option>
                                             </select>
                                        </div>
                                    </div>
                                </div>
                                    
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" class="form-control"
                                                      formControlName="vehicleNo"  
                                                    (change)="onVehicalNoChange($event)" maxlength="20"                                                 
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Regn Date</label> 
                                                <span style="color: red">*</span>                                               
                                                <input type="date" class="form-control" formControlName="regnDate"                                                                                               
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['regnDate'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-5">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Regd Owner</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly autoclose="false" class="form-control"
                                                    formControlName="regdOwner"                                                   
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['regdOwner'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label  for="formrow-inputState">Chessis No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" class="form-control"
                                                    formControlName="chasisNo"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['chasisNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Engine No</label>
                                                <span style="color: red">*</span>
                                                <input type="text" uppercaseonly class="form-control"
                                                    formControlName="engineNo"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['engineNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Type</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control form-select ng-pristine ng-touched"formControlName="vehicleTypeGroupId"   
                                                class="form-control form-select ng-pristine ng-touched"   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleTypeGroupId'].invalid) }">
                                                    <option *ngFor="let vehi of vehicleFltGrpList" value={{vehi.dataId}}>
                                                       {{vehi.dataName}}
                                                    </option>
                                                 </select>
                                            </div>
                                        </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Mfr</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control form-select ng-pristine ng-touched"formControlName="vehMfrId"   
                                                class="form-control form-select ng-pristine ng-touched"   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['vehMfrId'].invalid) }">
                                                    <option *ngFor="let mfr of vehicleMfrList" value={{mfr.dataId}}>
                                                       {{mfr.dataName}}
                                                    </option>
                                                 </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Mfr Model Name</label>
                                                <span style="color: red">*</span>
                                                <input  uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="mfrModelName"                                                   
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['mfrModelName'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Year</label>
                                                <span style="color: red">*</span>
                                                <input numbersonly maxlength="4" autoclose="false"                                                   
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['makeYear'].invalid) }"
                                                    formControlName="makeYear" class="form-control">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Fule Type</label>
                                                <span style="color: red">*</span>
                                                <select id="formrow-inputState"   formControlName="fuelType"    
                                                class="form-control form-select ng-pristine ng-touched"                                            
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['fuelType'].invalid) }"
                                                    formControlName="fuelType">
                                                    <option value="">Choose...</option>
                                                    <option value="D">Diesel</option>
                                                    <option value="E">Electric</option>
                                                    <option value="H">Hybrid</option>
                                                    <option value="C">CNG</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Tank Capacity</label>
                                                <span style="color: red">*</span>
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="tankCap"                                                   
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['tankCap'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Mileage</label>
                                                <span style="color: red">*</span>
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="mileageLt"                                                   
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['mileageLt'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">AdBlue Mileage</label>
                                                <span style="color: red">*</span>
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="adBlueMileageLt"                                                   
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['adBlueMileageLt'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Gross Weight</label>                                               
                                                <input threedecimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="grossWt" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">UnLaden Weight</label>                                        
                                                <input threedecimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="unLadenWT">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">No of Tyres</label>
                                                <span style="color: red">*</span>
                                                <input numbersonly maxlength="3" type="text" class="form-control"
                                                    formControlName="noOfTyres"                                               
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['noOfTyres'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Capacity</label>
                                                <span style="color: red">*</span>
                                                <input decimalonly maxlength="8" type="text" class="form-control"
                                                    formControlName="vehicleCapacity"                                               
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleCapacity'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Vehicle Length</label>                                               
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="vehLength" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Height</label>                                              
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="vehHeight" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Breadth</label>                                            
                                                <input decimalonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="vehBreadth" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Vehicle Volume(CFT)</label>
                                                <input type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="vehVolumeCFT">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3"><label for="formrow-inputCity">FastTag Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control form-select ng-pristine ng-touched"formControlName="fastTagYN" 
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    (change)="onFastTagChange($event)"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fastTagYN'].invalid) }">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">FastTag Company</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="fastTagCo"                                                   
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fastTagCo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">FastTag Card No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly autoclose="false"  
                                                    formControlName="fastTagNo" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fastTagNo'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Petro Card Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control form-select ng-pristine ng-touched"formControlName="petroCardYN"    
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    (change)="onPetroCardChange($event)"                                                    
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['petroCardYN'].invalid) }">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Petro Card Company</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="petroCo"                                                    
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['petroCo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Petro Card No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly  autoclose="false"  
                                                    formControlName="petroCardNo" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['petroCardNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Petro Card Pin</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly autoclose="false"  
                                                    formControlName="petroCardPin" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['petroCardPin'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3"><label for="formrow-inputCity">Happay Card Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control form-select ng-pristine ng-touched"formControlName="happayCardYN"  
                                                    class="form-control form-select ng-pristine ng-touched"  
                                                    (change)="onHappayCardChange($event)"                                                                       
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['happayCardYN'].invalid) }">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Happay Card No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly  autoclose="false"  
                                                    formControlName="happayCardNo" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['happayCardNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Happay Card Pin</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly  autoclose="false"  
                                                    formControlName="happayCardPin" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['happayCardPin'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3"><label for="formrow-inputCity">FIP Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control form-select ng-pristine ng-touched"formControlName="fipYN"      
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    (change)="onFipChange($event)"                                                                      
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fipYN'].invalid) }">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">FIP No</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="fipNo"                                                    
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fipNo'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Sold Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control form-select ng-pristine ng-touched"    
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    (change)="onSoldChange($event)"                                                                        
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['soldYN'].invalid) }"
                                                        formControlName="soldYN">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Sold To</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" id="formrow-inputCity" class="form-control"
                                                    formControlName="soldTo"                                                    
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['soldTo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Sold Date</label>
                                                <span style="color: red">*</span>
                                                <input autoclose="false" type="date" 
                                                      class="form-control"
                                                    formControlName="soldDate"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['soldDate'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Sold Value</label>
                                                <span style="color: red">*</span>
                                                <input decimalonly bsdatepicker="" autoclose="false"  
                                                    formControlName="soldValue" class="form-control"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['soldValue'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3"><label for="formrow-inputCity">Transfer Y/N</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control form-select ng-pristine ng-touched"
                                                    class="form-control form-select ng-pristine ng-touched"
                                                    (change)="onTransferChange($event)"                                                       
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['tfrYN'].invalid) }"
                                                        formControlName="tfrYN">
                                                        <option value="Y">Yes</option>
                                                        <option value="N">No</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Transfer Date</label>
                                                <span style="color: red">*</span>
                                                <input autoclose="false" type="date"
                                                      class="form-control"
                                                    formControlName="tfrDate"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['tfrDate'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Transfer New Vehicle</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly autoclose="false"
                                                      class="form-control"
                                                    formControlName="tfrVehicleNo"                                                 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['tfrVehicleNo'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Vehicle Ledger Account</label>
                                              
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="vehicleLedgerAcList"
                                                        [searchKeyword]="keywordLocation"  
                                                        formControlName="vehicleLedgerAc" 
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' 
                                                        [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleLedgerAc'].invalid) }" >
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Vehicle Asset Account</label>
                                              
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="vehicleAssetAcList"
                                                        [searchKeyword]="keywordLocation"  
                                                        formControlName="vehicleAssetAc" 
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' 
                                                        [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleAssetAc'].invalid) }" >
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Chassis Fin Comp </label>
                                                <span style="color: red">*</span>
                                            



                                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="chassisFinCompId"   
                                                    class="form-control form-select ng-pristine ng-touched"   (change)="chesisFinChange($event)"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['chassisFinCompId'].invalid) }">
                                                    <option selected value ="">Choose...</option>
                                                        <option *ngFor="let vehi of finCompList" value={{vehi.dataId}}>
                                                           {{vehi.dataName}}
                                                        </option>
                                                     </select>
                                            </div>
                                        </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="formrow-inputZip">Chassis Loan AcNo </label>
                                                    <span style="color: red">*</span>
                                                    <input uppercaseonly autoclose="false"
                                                          class="form-control"
                                                        formControlName="chassisLoanAcNo"                                                 
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['chassisLoanAcNo'].invalid) }">
                                                </div>
                                            </div>
                                            
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label for="formrow-inputZip">Chassis Loan From Date</label>
                                                    <span style="color: red">*</span>
                                                    <input autoclose="false" type="date"
