
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Godown Stock Entry</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formGodownStockEntryMaster">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Godown Desc</label>
                                                <span style="color: red">*</span>
                                                   <select class="form-control form-select ng-pristine ng-touched"formControlName="godownId" (change)="getSparesLubesInnerGridList()"   
                                                        class="form-control form-select ng-pristine ng-touched"   
                                                        [ngClass]="">
                                                            <option *ngFor="let vehi of godownList" value={{vehi.dataId}}>
                                                            {{vehi.dataName}}
                                                            </option>
                                                    </select>
                                            </div>
                                        </div> 
                                    </div>   
                                </div>
                            </div>
                        </div>
                    </div>
                </div>    
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4"></h4>
                                    <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                        <tr>
                                            <td class="col-lg-2">
                                                <label for="formrow-inputZip">
                                                    <h6>Spare/Lube</h6>
                                                </label>
                                            </td>
                                            <td class="col-lg-2">
                                                <label for="formrow-inputZip">
                                                    <h6>Brand </h6>
                                                </label>
                                            </td>
                                            <td class="col-lg-1">
                                                <label for="formrow-inputZip">
                                                    <h6>Opening Qty</h6>
                                                </label>
                                            </td>
                                            <td class="col-lg-2">
                                                <label for="formrow-inputZip">
                                                    <h6>Opening Value</h6>
                                                </label>
                                            </td>  
                                            <td class="col-lg-2">
                                                <label for="formrow-inputZip">
                                                    <h6>Action</h6>
                                                </label>
                                            </td>
                                        </tr>
                                        <tr formArrayName="arrayList"
                                            *ngFor="let arrayData of formArray.controls; let i = index">
                                            <div [formGroupName]="i" class="grid-table">
                                                   <td class="col-lg-3">                                                        
                                                        <div class="ng-autocomplete">
                                                            <ng-autocomplete [data]="sparesList"
                                                                [searchKeyword]="keywordLocation"  
                                                                [itemTemplate]="itemTemplate"
                                                                [notFoundTemplate]="notFoundTemplate"
                                                                [customFilter]="startWithFilter"
                                                                formControlName="spareLubId"
                                                               >
                                                            </ng-autocomplete>
                                                            <ng-template #itemTemplate let-item>
                                                                <a [innerHTML]="item.dataName"></a>
                                                            </ng-template>
                                                            <ng-template #notFoundTemplate let-notFound>
                                                                <div [innerHTML]="notFound"></div>
                                                            </ng-template>
                                                        </div>
                                                    </td>
                                                <td class="col-lg-2">
                                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="brandId"   
                                                     (change)="checkduplicate(i)"
                                                        class="form-control form-select ng-pristine ng-touched"   
                                                        [ngClass]="">
                                                            <option *ngFor="let vehi of brandList" value={{vehi.dataId}}>
                                                            {{vehi.dataName}}
                                                            </option>
                                                    </select>
                                                </td>
                                                <td class="col-lg-2">
                                                    <input autoclose="false"  numbersonly class="form-control" 
                                                    formControlName="openingQty" >
                                                </td>
                                                <td class="col-lg-2">
                                                    <input autoclose="false" class="form-control"
                                                    uppercaseonly   formControlName="openingValue">

                                                </td>    
                                                <td class="col-lg-3">
                                                    <div class="col-lg-4 details-button">
                                                        <button *ngIf="i === formArray.controls.length-1" type="button"
                                                            class="btn btn-add" (click)="addItem(i)"></button>
                                                        <button *ngIf="formArray.controls.length > 1"
                                                            (click)="removeItem(i)" class="btn btn-delete"></button>
                                                    </div>
                                                </td>
                                            </div>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>       
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                            (click)="submitSparesLubesMasterForm()" >Save</button> &nbsp;  
                           
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->

</div>
