<p>bankreconcilation works!</p>
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Bank Reconciliation Update</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formBankRecEntry">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row" >
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <label for="formrow-inputZip"><h6>From Date</h6></label> <span style="color:red">*</span>
                                                <input bsdatepicker="" type="date" autoclose="false" 
                                                      min="{{minDate}}" max="{{maxDate}}"
                                                    formControlName="fromDate" class="form-control">
                                            </div>
                                        </div>       
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <label for="formrow-inputZip"><h6>To Date</h6></label> <span style="color:red">*</span>
                                                <input bsdatepicker="" type="date" autoclose="false" 
                                                      min="{{minDate}}" max="{{maxDate}}"
                                                    formControlName="toDate" class="form-control">
                                            </div>
                                        </div>    
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <label for="formrow-inputZip"><h6>Bank</h6></label>  <span style="color:red">*</span>                                               
                                                <select   class="form-control form-select ng-pristine ng-touched"
                                                    formControlName="accountid"  
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['accountid'].invalid) }">
                                                    <option *ngFor="let branch of bankacList"
                                                        value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div> 
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <label for="formrow-inputZip"><h6>Reconcile</h6></label> <span style="color:red">*</span>                                                
                                                <select   class="form-control form-select ng-pristine ng-touched"
                                                    formControlName="reconcile"  
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['reconcile'].invalid) }">
                                                    <option value="N">Un Reconciled</option>
                                                    <option value="Y">Reconciled</option>
                                                </select>
                                            </div>
                                        </div>                                         
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <br />
                                                <br />
                                                <input type="checkbox"  formControlName="inclopening" id="neft"
                                                    (change)="onIncOpenChange($event)"
                                                            class="form-check-input" >
                                                <label for="inclopening" ><h5> Include Opening</h5> 
                                                </label>
                                            </div>          
                                        </div>                                                                    
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <br />
                                                <button class="btn btn-primary" 
                                                (click)="getBankrecData()"><span>Display</span></button>
                                            </div>
                                        </div>                                        
                                    </div>

                                                </td>
                                                <td>

                                                </td>
                                                <td>
                                                    <div class="mb-3">
                                                        <input type="date" (change)="selectedData(i,$event)">  
                                                    </div>
                                                </td>
                                            </tr>

                                        </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="!formSubmitted"
                                (click)="submitBankreconcilationForm()">Save</button>&nbsp;
