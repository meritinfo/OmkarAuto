<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Deduction Statement</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-11 col-md-11">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">                        
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" formControlName="fromDate" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" formControlName="toDate" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>                            
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Branch </label>
                                    <select formControlName="branch"
                                        class="form-control form-select ng-pristine ng-touched" >                                        
                                        <option value="">All</option>
                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>     
                        </div>                        
                        <div class="row">                        
                            <div class="col-lg-5">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Party</label>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="partyList" 
                                            formControlName="party"
                                            [searchKeyword]="keywordLocation" 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div> 
                            <div class="col-lg-1">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                        (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-1 col-md-1 text-right">
                    <div class="dt-buttons btn-group flex-wrap export-button">
                        <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button" 
                            (click)="exportExcel()"><span>Excel</span></button>
                    </div>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">                
                <div class="overflow-x">
                    <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive half-width">
                       <thead>
                            <tr>
                                <th>partyName </th>  
                                <th>mrNo</th> 
                                <th>mrDate </th> 
                                <th>billLrOthType </th> 
                                <th>totalDed </th> 
                                <th>mrRemarks</th> 
                            </tr>
                        </thead>
                        <tbody *ngIf="allmrlist.mrList?.length != 0">
                            <tr *ngFor="let eta of allmrlist.mrList">
                                <td>{{ eta.partyName }}</td>
                                <td>{{ eta.mrNo }}</td> 
                                <td>{{ eta.mrDate }}</td> 
                                <td>{{ eta.billLrOthType }}</td> 
                                <td>{{ eta.totalDed }}</td> 
                                <td>{{ eta.mrRemarks }}</td>                                      
                            </tr>
                        </tbody>
                        <tbody *ngIf="allmrlist.mrList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div> 
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
