<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
           <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Destination</h4>
                    </div>
                </div>
            </div>
           <!-- end page title -->
            <form [formGroup]="formUser">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-4">
                                            <label for="horizontal-firstname-input" class="col-form-label">
                                            DRP Branch </label><span style="color: red"> * </span>
                                            <select class="form-control" autoclose="false" formControlName="acctBranch" 
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['acctBranch'].invalid) }">
                                                <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">DRP Date</label><span
                                                style="color: red">*</span>
                                            <input bsdatepicker="" type="date" autoclose="false" class="form-control"
                                                formControlName="bookingDate" min="{{minDate}}" max="{{maxDate}}"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['bookingDate'].invalid) }">
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">DRP No</label><span
                                                style="color: red">*</span>
                                            <input autoclose="false" class="form-control"
                                                formControlName="bookingDate"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['bookingDate'].invalid) }">
                                        </div>
                                    </div> 
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">CN No</label><span
                                                style="color: red">*</span>
                                            <input autoclose="false" class="form-control"
                                                formControlName="bookingDate"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['bookingDate'].invalid) }">
                                        </div>
                                    </div> 
                                </div> 
                                <div class="row">   
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputState">Booked At</label>
                                            <select class="form-control" autoclose="false" formControlName="acctBranch">
                                                <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Booked Date</label>
                                            <input bsdatepicker="" type="date" autoclose="false" class="form-control"
                                                formControlName="bookingDate" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">From</label>
                                            <input autoclose="false" class="form-control"
                                                formControlName="bookingDate" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">To</label>
                                            <input autoclose="false" class="form-control"
                                                formControlName="bookingDate" >
                                        </div>
                                    </div>  
                                </div>
                                <div class="row">  
                                    <div class="col-lg-4">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Consignor</label>
                                            <input autoclose="false" class="form-control"
                                                formControlName="bookingDate" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-4">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Consignee</label>
                                            <input autoclose="false" class="form-control"
                                                formControlName="bookingDate" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-4">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Party</label>
                                            <input autoclose="false" class="form-control"
                                                formControlName="bookingDate" >
                                        </div>
                                    </div>  
                                </div>    
                                <div class="row">  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Delivered Pkgs</label>
                                            <input numbersonly autoclose="false" class="form-control"
                                                formControlName="bookingDate" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Pkgs (Short/Excess)</label>
                                            <input numbersonly autoclose="false" class="form-control"
                                                formControlName="bookingDate" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Delivered Weight</label>
                                            <input decimalonly autoclose="false" class="form-control"
                                                formControlName="bookingDate" >
                                        </div>
                                    </div>  
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label for="formrow-inputZip">Weight (Short/Excess)</label>
                                            <input decimalonly autoclose="false" class="form-control"
                                                formControlName="bookingDate" >
                                        </div>
                                    </div>  
                                </div>                                     
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" *ngIf="(editMode && editStatus) || (!editMode && createStatus)"
                                (click)="submitDestinationForm()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteDestinationForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
     <!-- container-fluid -->
    </div>
  <!-- End Page-content -->
 </div>
