
<div class="main-content">

                                <li class="breadcrumb-item active">Distance Master Freight </li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <!-- <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" formControlName="fromDate" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" formControlName="toDate" 
                                    min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div> -->
                         
                          
                        </div>
                        
                        <div class="row">
                           
                                          
                            <!-- <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                        (click)="search()"><span>Search</span></button>
                                </div>
                            </div> -->
                        </div>
                    </form>
                </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12 text-right">
                    <button class="btn btn-primary buttons-html5" type="button"
                        (click)="adddditionalcostrecmaster()" *ngIf="createStatus"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">                    
                     <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                       <thead>
                        <tr>
                            <th>docCode </th>                      
                            <th>docDescription</th>
                            <th>reminderDays</th>      
                                          
                            <th>docDescription</th>
                                           
                            <th>Action</th>
                        </tr>

                        </thead>
                        <tbody *ngIf="allAdditionalMaster.additionalList?.length != 0">
                            <tr *ngFor="let ren of allAdditionalMaster.additionalList">
                                <td>
                                    <button type="button" class="btn btn-edit" 
                                    (click)="getdditionalcostrecmasterDetails(ren)"></button>             
                                </td>  
                                <td>{{ ren.addCostCode }}</td>                    
                                <td>{{ ren.addCostType }}</td>               
                                <td>{{ ren.addCostDescription }}</td>       
                                <!-- <td>{{ ren.accountID }}</td>      -->
                                <td>{{ ren.affectCosting }}</td>       
                                             
                               
                            </tr>
                        </tbody>
                        <tbody *ngIf="allAdditionalMaster.additionalList?.length == 0">
                            <tr>
                                <td colspan="3" class="no-data-available">No data!</td>
                            </tr>
                        </tbody>
    
                    </table> 
                </div>
            </div>
        </div>
        </div>
