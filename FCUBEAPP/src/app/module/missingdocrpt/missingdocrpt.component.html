
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Missing Document Report</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">                            
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Doc Type</label>
                                    <select id="formrow-inputState" class="form-control" 
                                            formControlName="docType" (change)="onDocChange()"
                                            class="form-control form-select ng-pristine ng-touched"
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['docType'].invalid) }"> 
                                            <option value="CN">Consignment</option>
                                            <option value="CH">Challan</option>
                                            <option value="BL">Bill</option>                                      
                                    </select>                                                
                                </div>                                              
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Branch</label>
                                    <select class="form-control" formControlName="branchCode"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['branchCode'].invalid) }"> 
                                        <option *ngFor="let br of branchList" value={{br.dataId}}>
                                        {{br.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div> 
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Range From</label>
                                    <select class="form-control" formControlName="rangeFrom"> 
                                        <option value="">ALL</option>
                                        <option *ngFor="let br of rangeFromList" value={{br.dataId}}>
                                        {{br.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>  
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Range To</label>
                                    <select class="form-control" formControlName="rangeTo">  
                                        <option value="">ALL</option>
                                        <option *ngFor="let br of rangeToList" value={{br.dataId}}>
                                        {{br.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-1">
                                <div class="mt-3">
                                    <button class="btn btn-primary" 
                                    (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <div class="dt-buttons btn-group flex-wrap export-button">
                        <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button" 
                            (click)="exportExcel()"><span>Excel</span></button>                      
                    </div>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive w-100">
                    <thead>
                        <tr>
                            <th>RenewalDocName</th>
                            <th>TransDate</th>
                            <th>TransDate</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allDocRptlist.documentAllotmentLists?.length != 0">
                        <tr *ngFor="let eta of allDocRptlist.documentAllotmentLists">
                            <td>{{ eta.branch }}</td>
                            <td>{{ eta.docNumCode }}</td> 
                            <td>{{ eta.remarks }}</td> 
                        </tr>
                    </tbody>
                    <tbody *ngIf="allDocRptlist.documentAllotmentLists?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
