<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Branch Master</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formBranchMaster">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Code</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text"  autofocus="autofocus" 
                                                class="form-control"
                                                formControlName="code" maxlength="6" 
                                                (change)="chkCodeExits($event)"                              
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['code'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Branch Name</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" class="form-control"   
                                                (change)="chkBranchNameExits($event)"                       
                                                formControlName="userBranch"    maxlength="49"       
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['userBranch'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Zone Code</label>
                                                <span style="color: red">*</span>
                                                <select formControlName="zoneCode" 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['zoneCode'].invalid) }"
                                                    class="form-control form-select ng-pristine ng-touched">                                             
                                                    <option value="">Choose...</option>
                                                    <option value="N">North</option>
                                                    <option value="E">EAST</option>
                                                    <option value="W">WEST</option>
                                                    <option value="S">SOUTH</option>
                                                </select> 
                                            </div>
                                        </div>  
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-9">
                                            <div class="mb-6">
                                                <label for="formrow-inputZip">Address 1</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" class="form-control" placeholder=" "
                                                formControlName="address1"   maxlength="49"        
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['address1'].invalid) }">
                                            </div>
                                        </div>
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-9">
                                            <div class="mb-6">
                                                <label for="formrow-inputZip">Address 2</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly type="text" class="form-control"
                                                placeholder=" "formControlName="address2"   maxlength="49"       
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['address2'].invalid) }">
                                            </div>
                                        </div>
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-9">
                                            <div class="mb-6">
                                                <label for="formrow-inputZip">Address 3</label>
                                                <input uppercaseonly type="text" class="form-control"
                                                placeholder=" "formControlName="address3" maxlength="49"    
                                                [ngClass]=>
                                            </div>
                                        </div>
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-9">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">City</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly autoclose="false" class="form-control" placeholder="Enter City" 
                                                formControlName="city"    maxlength="50"      
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['city'].invalid) }">
                                            </div>
                                        </div>
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">State</label>
                                                <span style="color: red">*</span>
                                                <select class="form-control" formControlName="stateCode"      
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['stateCode'].invalid) }">
                                                    <option *ngFor="let state of stateList" value={{state.dataId}}>
                                                       {{state.dataName}}
                                                    </option>
                                                 </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip"> Pin</label>
                                                <span style="color: red">*</span>
                                                <input numbersonly autoclose="false" class="form-control" 
                                                formControlName="pinCode" maxlength="6"      
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['pinCode'].invalid) }">
                                            </div>
                                        </div>
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Office Phone1</label>
                                                <span style="color: red">*</span>
                                                <input autoclose="false" class="form-control" 
                                                formControlName="offPhone1" numbersonly  maxlength="10"     
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['offPhone1'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Office Phone2</label>
                                                <input autoclose="false" class="form-control" numbersonly
                                                formControlName="offPhone2" numbersonly  maxlength="10"     >
                                            </div>
                                        </div>
                                      
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Office Mobile No</label>
                                                <span style="color: red">*</span>
                                                <input  maxlength="10"  autoclose="false" class="form-control"  
                                                formControlName="mobileNo" numbersonly      
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['mobileNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Office Email</label>
                                                <input type="email" autoclose="false" class="form-control"    
                                                formControlName="branchEmail">
                                            </div>
                                        </div>
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Manager Name</label>
                                                <span style="color: red">*</span>
                                                <input uppercaseonly autoclose="false" class="form-control"  placeholder=" "  
                                                formControlName="managerName"      
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['managerName'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Manager Mobile No</label>
                                                <span style="color: red">*</span>
                                                <input  maxlength="10"  autoclose="false" class="form-control" 
                                                formControlName="managerMobileNo"   numbersonly        
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['managerMobileNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Manager Phone</label>
                                                <input  maxlength="10"  autoclose="false" class="form-control" numbersonly
                                                formControlName="managerPhone">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Manager Email</label>
                                                <input type="email" autoclose="false" class="form-control"
                                                formControlName="managerEmail">
                                            </div>
                                        </div>
                                    </div>   
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Gst No</label>
                                                <input maxlength="15" autoclose="false" class="form-control" 
                                                formControlName="gstNo">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Entry Lock Days </label>
                                                <input numbersonly maxlength="3" autoclose="false" class="form-control" 
                                                formControlName="entryLockDays" >
                                            </div>
                                        </div>  
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">RCM_GstNo </label>
                                                <input autoclose="false" maxlength="22" class="form-control"  uppercaseonly
                                                formControlName="rcM_GstNo" >
                                            </div>
                                        </div>   
                                    </div> 
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Zone Code</label>
                                                <span style="color: red">*</span>
                                                <input numbersonly maxlength="3" autoclose="false" class="form-control" 
                                                formControlName="znNumCode" (change)="onChange()"       
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['znNumCode'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Branch Code </label>
                                                <span style="color: red">*</span>
                                                <input numbersonly maxlength="2" autoclose="false" class="form-control"
                                                formControlName="brNumCode" (change)="onChange()"       
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['brNumCode'].invalid) }">
                                            </div>
                                        </div>   
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">DocNum Code </label>
                                                <span style="color: red">*</span>
                                                <input numbersonly maxlength="2" autoclose="false" class="form-control"
                                                formControlName="docNumCode"        
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['docNumCode'].invalid) }">
                                            </div>
                                        </div>   
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>           
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="submitBranchMasterForm()" >Save</button> &nbsp;  
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteBranchMasterForm()">Delete</button> &nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->

</div>
