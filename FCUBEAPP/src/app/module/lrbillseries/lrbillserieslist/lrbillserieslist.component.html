
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">
                            Lr bill series Master</h4>

                        

                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                    <div class="row">
                        <div class="col-md-2">
                            <div class="mb-3">
                                <label for="basicpill-lastname-input" class="form-label">lR Bill type</label><span style="color:red">*</span>
                                <select id="formrow-inputState" 
                                             class="form-control form-select ng-pristine ng-touched"
                                                 formControlName="lR_Bill_type">
                                                
                                                 <option selected="">Choose...</option>
                                                 <option value="L">LR</option>
                                                 <option value="B">BILL</option>
                                                
                                           </select>
                            </div>
                        </div>
                    <div class="col-md-2">
                        <div class="mb-3">
                            <label for="formrow-inputState">Branch</label>
                          
                            <select class="form-control" autoclose="false" 
                            formControlName="branchCode" 
                           >
                            <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                {{branch.dataName}}
                            </option>
                        </select>
                        </div>
                    </div>
               
                    <div class="col-lg-2">
                        <div class="mt-3">
                            <button class="btn btn-primary" (click)="search()"><span>Search</span></button>
                        </div>
                    </div>
                </div>
                    <div class="col-sm-12 col-md-12 text-right">
                        <button class="btn btn-primary buttons-html5" type="button"
                        (click)="addLrBillSeries()"><span>New</span></button>
                    </div>
                 
                </form>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>Centre Name</th>
                      
                            <th>State Code</th>
                            <th>State Code</th>
                         
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allLRBillSeries.seriesList?.length != 0">
                        <tr *ngFor="let billseries of allLRBillSeries.seriesList">
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="getLrBillSeriesDetails(billseries)"></button>     
                       
                        </td>
                            <td>{{ billseries.seriesCode }}</td>
                    
                            <td>{{ billseries.type }}</td>
                            <td>{{ billseries.branch }}</td>
                         
                            
                        </tr>
                    </tbody>
                    <tbody *ngIf="allLRBillSeries.seriesList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
