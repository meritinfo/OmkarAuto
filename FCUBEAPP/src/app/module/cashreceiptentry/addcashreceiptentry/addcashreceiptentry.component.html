<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Cash Receipts & Payments Voucher Entry</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formCashRRecEntry">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row" >
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="form-check mb-3">
                                                <input type="radio" formControlName="docType" value="CP"  (change)="changePType('CP')"
                                                    class="form-check-input" />
                                                <label for="formRadios1" class="form-check-label" style="color: blue;">
                                                    <h6>Cash Payment</h6>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="form-check mb-3">
                                                <input type="radio" formControlName="docType" value="CR"(change)="changePType('CR')"
                                                    class="form-check-input" />
                                                <label for="formRadios1" class="form-check-label" style="color: blue;">
                                                    <h6>Cash Receipt</h6>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <label for="formrow-inputState">Document Series</label>
                                            <input class="form-control"   formControlName="docSeries">
                                        </div>
                                        <div class="col-lg-2">
                                            <label for="formrow-inputState">Document No</label><span style="color: red">*</span>    
                                            <label for="formrow-inputState">.</label>
                                            <input class="form-control"   formControlName="docNo"
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['docNo'].invalid) }">
                                           
                                        </div>
                                        <div class="col-lg-2">
                                            <label for="formrow-inputState"> Trans Date</label><span style="color: red">*</span>    
                                            <input type="date" class="form-control"  
                                                formControlName="ftmDate"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['ftmDate'].invalid) }">
                                               
                                        </div>
                                        <div class="col-lg-2">
                                            <label for="formrow-inputCity">Ref Type </label> <span style="color: red">*</span>    
                                            <select class="form-control form-select ng-pristine ng-touched"
                                                formControlName="refType"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['refType'].invalid) }">
                                                <option *ngFor="let branch of finRefTypes"
                                                    value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-2">
                                                <label for="formrow-inputZip">Ref No </label>
                                                <input uppercaseonly autoclose="false"  
                                                    class="form-control" formControlName="refNo">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">                                        
                                        <div class="col-lg-4">
                                            <div class="mb-4">
                                                <label for="formrow-inputZip">Cash Account</label><span style="color: red">*</span>    
                                                <select class="form-control"
                                                    formControlName="accountid2" 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['accountid2'].invalid) }">
                                                    <option *ngFor="let branch of mainAcList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="mb-6">
                                                <label for="formrow-inputState">Remark</label>
                                                <input uppercaseonly class="form-control"   
                                                formControlName="remarks">
                                            </div>
                                        </div>                                        
                                    </div>
                                    <div class="col-lg-12">
                                        <div class="card">
                                            <div class="card-body">
                                                <div class="overflow-x">
                                                <h4 class="card-title mb-4" style="color: red;"> Details</h4>
                                                <table class="table table-bordered table-striped dt-responsive nowrap w-100 no-border-table half-width">
                                                    <tr>
                                                        <td style="width: 50px;"></td>
                                                        <td style="width: 700px;">
                                                            <label for="formrow-inputZip">
                                                                <h6>Account Name<span style="color: red">*</span>    </h6>
                                                            </label>
                                                        </td>
                                                        <td  style="width: 100px;">
                                                            <label for="formrow-inputZip">
                                                                <h6>Amount<span style="color: red">*</span> </h6>   
                                                            </label>
                                                        </td>
                                                        <td  style="width: 500px;">
                                                            <label for="formrow-inputZip">
                                                                <h6>Narration<span style="color: red">*</span> </h6>   
                                                            </label>
                                                        </td>
                                                        <td  style="width: 300px;">
                                                            <label for="formrow-inputZip">
                                                                <h6>Reference/SubLedger</h6>
                                                            </label>
                                                        </td>
                                                        <td  style="width: 200px;">
                                                            <label for="formrow-inputZip">
                                                                <h6>CN/LR Ref No</h6>
                                                            </label>
                                                        </td>
                                                    </tr>                                                    
                                                    <tr formArrayName="arrayList" 
                                                    *ngFor="let arrayData of formArray.controls; let i = index">
                                                        <div [formGroupName]="i" class="grid-table">
                                                            <td  style="width: 50px;">
                                                                <div class="col-lg-4 details-button">
                                                                    <button *ngIf="i === formArray.controls.length-1" type="button"
                                                                        class="btn btn-add" (click)="addItem(i)"></button>
                                                                    <button *ngIf="formArray.controls.length > 1"
                                                                        (click)="removeItem(i)" class="btn btn-delete"></button>
                                                                </div>     
                                                            </td>
                                                            <td  style="width: 700px;">
                                                                <div class="ng-autocomplete">
                                                                    <ng-autocomplete [data]="gridAccountList"
                                                                        [searchKeyword]="keywordLocation"
                                                                        (inputChanged)='onChangeSearch($event)'
                                                                        (inputFocused)='onFocused($event)'
                                                                        (selected)="selectEvent($event,i)"
                                                                        [itemTemplate]="itemTemplate"
                                                                        [notFoundTemplate]="notFoundTemplate"
                                                                        [customFilter]="startWithFilter"
                                                                        formControlName="accountID">
                                                                    </ng-autocomplete>        
                                                                    <ng-template #itemTemplate let-item>
                                                                        <a [innerHTML]="item.dataName"></a>
                                                                    </ng-template>        
                                                                    <ng-template #notFoundTemplate let-notFound>
                                                                        <div [innerHTML]="notFound"></div>
                                                                    </ng-template> 
                                                                </div> 
                                                                <input type="hidden" formControlName="subLedger">  
                                                                <input type="hidden" formControlName="cnLedger">      
                                                            </td>
                                                            <td  style="width: 100px;">
                                                                <input decimalonly class="form-control"    
                                                                (change)="updateAmount()"
                                                                    formControlName="amount">
                                                            </td>
                                                            <td  style="width: 500px;">
                                                                <input uppercaseonly autoclose="false" type="text" 
                                                                class="form-control"
                                                                    formControlName="narration">
                                                                  
                                                            </td>
                                                            <td  style="width: 300px;">
                                                                <input autoclose="false" type="text"
                                                                              class="form-control"
                                                                            formControlName="reference">                                                                
                                                            </td>
                                                            <td  style="width: 200px;">
                                                                <input autoclose="false" type="text"
                                                                    class="form-control" (change)="checkLrExists($event,i)"
                                                                    formControlName="cnRefNo">                                                                
                                                            </td>
                                                        </div>
                                                    </tr>
                                                    <tr>
                                                        <td colspan="2" class="text-right">
                                                            <label for="formrow-inputZip"><h6>Total Amt. </h6></label>
                                                        </td>
                                                        <td >
                                                            <div class="mb-3">
                                                                <input autoclose="false" type="text"
                                                                  class="form-control" formControlName="docAmount"
                                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['docAmount'].invalid) }">
                                                            </div>
                                                        </td>
                                                    </tr>            
                                                </table>
                                            </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-6">
                                                <label for="formrow-inputState">Modify Del Remark</label>
                                                <input uppercaseonly class="form-control" 
                                                formControlName="modifyRemarks"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['modifyRemarks'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">                    
                                        <div class="col-lg-5">
                                            <div class="mb-3">
                                                <label style="color: blue"> 
                                                    <h6><b>Created By:</b>  {{ this.createdBy }} </h6> 
                                                </label>                                                 
                                            </div>
                                        </div>                   
                                        <div class="col-lg-5">
                                            <div class="mb-3">
                                                <label style="color: blue"> 
                                                    <h6><b>Modified By:</b> {{ this.modifiedBy}} </h6> 
                                                </label>                                                 
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                            </div>
                        </div>
                    </div>
                </div>                             
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md"  
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="submitCashReceiptPaymentsForm()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteCashReceiptPaymentsForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                    <!-- end col -->
                </div>   
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
