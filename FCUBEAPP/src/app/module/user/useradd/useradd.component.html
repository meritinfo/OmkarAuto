<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">User</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title mb-4">User details</h4>
                                <div class="row">
                                    <div class="col-lg-4">
                                        <div class="mb-4">
                                            <label for="horizontal-firstname-input"
                                                class="col-form-label">Username</label>
                                            <span style="color: red">*</span>
                                            <input type="text" class="form-control" 
                                                formControlName="userName" (keypress)="alphaNumberOnly($event)"
                                                maxlength="50" (change)="chkUsername($event)"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['userName'].invalid) }">
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mb-4">
                                            <label for="horizontal-password-input"
                                                class="col-form-label">Password</label>
                                            <span style="color: red">*</span>
                                            <input type="password" class="form-control" 
                                                formControlName="userPassword" maxlength="15"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['userPassword'].invalid) }">
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="mb-4">
                                            <label for="scope" class="col-form-label">Scope</label>
                                            <span style="color: red">*</span>
                                            <select id="scope" class="form-control form-select ng-pristine ng-touched" 
                                            formControlName="userScope"
                                                (change)="onScopeChange()">
                                                <option value="BO">Branch office</option>
                                                <option value="HO">Headoffice</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mb-4">
                                            <label for="branch" class="col-form-label">Employee Branch</label>
                                            <span style="color: red">*</span>
                                            <select id="empbranch" class="form-control form-select ng-pristine ng-touched" formControlName="empbranch">
                                                <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                    {{branch.dataName}}
                                                </option>
                                            </select>                                            
                                        </div>                                          
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-4">
                                        <div class="mb-4">
                                            <label for="horizontal-email-input"
                                                class="col-form-label">Name </label>
                                            <span style="color: red">*</span>
                                            <input type="text" class="form-control" 
                                                formControlName="userDescription" maxlength="50" uppercaseonly
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['userDescription'].invalid) }">
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mb-4">
                                            <label for="horizontal-email-input" class="col-form-label">Mobile</label>
                                            <span style="color: red">*</span>
                                            <input type="text" class="form-control"
                                                formControlName="userMobile" maxlength="10" numbersonly
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['userMobile'].invalid) }">
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="mb-4">
                                            <label for="horizontal-email-input" class="col-form-label">Email</label>
                                            <span style="color: red">*</span>
                                            <input type="text" class="form-control"
                                                formControlName="userEmail" maxlength="75"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['userEmail'].invalid) }">
                                        </div>
                                    </div>
                                    <div class="col-lg-2">                                       
                                        <div class="mb-4">
                                            <label for="role" class="col-form-label">Role</label>
                                            <span style="color: red">*</span>
                                            <select id="role"   class="form-control form-select ng-pristine ng-touched"
                                             formControlName="role"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['role'].invalid) }">
                                                <option value="">Choose...</option>
                                                <option *ngFor="let roleType of roleTypeList" value={{roleType.dataId}}>
                                                    {{roleType.dataName}}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-2">
                                        <div class="mb-4">
                                            <label for="active" class="col-form-label">Update Advance Paid</label>
                                            <select id="active" class="form-control form-select ng-pristine ng-touched"
                                             formControlName="updateAdvancePaid"> 
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                            </select>
                                        </div>
                                    </div> 
                                    <div class="col-lg-2">
                                        <div class="mb-4">
                                            <label for="active" class="col-form-label">DPR Advance Update</label>
                                            <select id="active" class="form-control form-select ng-pristine ng-touched"
                                             formControlName="dprAdvanceUpdate"> 
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                            </select>
                                        </div>
                                    </div> 
                                    <div class="col-lg-2">
                                        <div class="mb-4">
                                            <label for="active" class="col-form-label">Update Cn Freight</label>
                                            <select id="active" class="form-control form-select ng-pristine ng-touched"
                                             formControlName="updateCnFreight"> 
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="mb-4">
                                            <label for="active" class="col-form-label">Can Add Same LR In Challan</label>
                                            <select id="active" class="form-control form-select ng-pristine ng-touched"
                                             formControlName="sameLrChallan"> 
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-2">
                                        <div class="mb-4">
                                            <label for="active" class="col-form-label">Active</label>
                                            <span style="color: red">*</span>
                                            <select id="active"  class="form-control form-select ng-pristine ng-touched"
                                             formControlName="activeYN"
                                             [ngClass]="{ 'is-invalid': formSubmitted && (f['activeYN'].invalid) }"> 
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="mb-4">
                                            <label for="active" class="col-form-label">OTP Req, out Of Office login</label>
                                            <select class="form-control form-select ng-pristine ng-touched"
                                             formControlName="outOfOffReqOTP"
                                             [ngClass]="{ 'is-invalid': formSubmitted && (f['outOfOffReqOTP'].invalid) }"> 
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="mb-4">
                                            <label for="active" class="col-form-label">Show Freight Details</label>
                                            <select class="form-control form-select ng-pristine ng-touched"
                                             formControlName="showFreightDtls"
                                             [ngClass]="{ 'is-invalid': formSubmitted && (f['showFreightDtls'].invalid) }"> 
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-3">
                                        <div class="mb-4">
                                            <label for="active" class="col-form-label">DPR Add/Remove LR</label>
                                            <select class="form-control form-select ng-pristine ng-touched"
                                             formControlName="dprAddLr"
                                             [ngClass]="{ 'is-invalid': formSubmitted && (f['dprAddLr'].invalid) }"> 
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="mb-4">
                                            <label for="active" class="col-form-label">DPR Update Assigned BY</label>
                                            <select class="form-control form-select ng-pristine ng-touched"
                                             formControlName="updateAssignBy"
                                             [ngClass]="{ 'is-invalid': formSubmitted && (f['updateAssignBy'].invalid) }"> 
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-4">
                                        <div class="mb-3">
                                            <label>User Photo</label>
                                            <input #userPhotoInput class="form-control" type="file" 
                                                formControlName="formUserPhoto" id="formUserPhoto" accept="image/*"
                                                (change)="onSelectUserPhoto($event)">
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <img [src]="userPhotoPreview" height="120" width="120">
                                    </div>
                                </div>
                            </div>
                            <!-- end card body -->
                        </div>
                        <!-- end card -->
                    </div>
                    <div class="col-xl-6">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title">Branch</h4>
                                <div class="mb-3">
                                    <select class="form-control" multiple="multiple" formControlName="userBranch"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['userBranch'].invalid) }">
                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- <div class="col-xl-6">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title">Module</h4>
                                <div class="mb-3">
                                    <select class="form-control" multiple="multiple" formControlName="userModule"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['userModule'].invalid) }">
                                        <option *ngFor="let module of moduleList" value={{module.dataId}}>
                                            {{module.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div> -->
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button  class="btn btn-primary w-md"  
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="submitUserForm()">Save</button>
                                <button class="btn btn-secondary w-md m-2" (click)="exit()">Exit</button>                                
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->

</div>
