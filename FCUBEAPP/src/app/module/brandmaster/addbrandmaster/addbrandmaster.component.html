<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Brand Master</h4>
                   <div class="page-title-right">
                      <ol class="breadcrumb m-0">
                        
                      </ol>
                   </div>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form [formGroup]="formUser">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                         <h4 class="card-title mb-4">Brand Master</h4>
                      
                            
                               
                               
                                     <div class="row">
                                       <div class="col-lg-2">
                                          <div class="mb-4">
                                           <label for="horizontal-firstname-input" class="col-form-label">Brand
                                           Name</label>
                                        </div>
                                       </div>
                                       <div class="col-lg-2">
                                          <div class="mb-4">
                                           <input type="text" class="form-control"
                                           placeholder="Enter  brand name" formControlName="brandName"
                                           [ngClass]=>
                                        </div>
                                     </div>
                                    </div>
                        
                          
                        
                                
                                     <div class="row">
                                       <div class="col-lg-2">
                                          <div class="mb-3">
                                           <label for="horizontal-firstname-input" class="col-form-label">Brand Type</label>
                                        </div>
                                       </div>
                                       <div class="col-lg-2">
                                          <div class="mb-3">
                                           <input type="text" class="form-control"
                                           placeholder="Enter brand type " formControlName="brandType"
                                           [ngClass]=>
                                        </div>
                                     </div>
                                    </div>
                             
                       
               
                 
                      </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                      <button class="btn btn-primary w-md"
                         (click)="submitBrandMasterForm()">Submit</button>
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
