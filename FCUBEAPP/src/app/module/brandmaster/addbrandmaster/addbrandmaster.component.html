<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Brand Master</h4>
                   <div class="page-title-right">
                      <ol class="breadcrumb m-0">
                        
                      </ol>
                   </div>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form (keydown.enter)="$event.preventDefault()"[formGroup]="formUser">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                        
                            
                               
                               
                                     <div class="row">
                                       <div class="col-lg-2">
                                          <div class="mb-4">
                                           <label for="horizontal-firstname-input" class="col-form-label">Brand
                                           Name</label>  <span style="color: red" >*</span>
                                        </div>
                                       </div>
                                       <div class="col-lg-4">
                                          <div class="mb-4">
                                           <input type="text" class="form-control"
                                             formControlName="brandName" uppercaseonly  (change)="chkBrandDuplicate()"
                                           [ngClass]= "{ 'is-invalid': formSubmitted && (f['brandName'].invalid) }">
                                        </div>
                                     </div>
                                    </div>
                        
                          
                        
                                
                                     <div class="row">
                                       <div class="col-lg-2">
                                          <div class="mb-3">
                                           <label for="horizontal-firstname-input" class="col-form-label">Brand Type</label>  <span style="color: red">*</span>
                                        </div>
                                       </div>
                                       <div class="col-lg-2">
                                          <div class="mb-3">
                                          
                                           <select formControlName="brandType" 
                                               class="form-control form-select ng-pristine ng-touched"
                                               [ngClass]="{ 'is-invalid': formSubmitted && (f['brandType'].invalid) }">
                                               <option value="">Choose</option>
                                               <option value="S">Spare</option>
                                               <option value="L">Lubricant</option>
                                               <option value="T">Tyre</option>
                                           </select> 
                                        </div>
                                     </div>

                                    </div>
                                    <div class="row">
                                     <div class="col-lg-2">
                                       <div class="mb-3">
                                          <label for="formrow-inputZip">Is Active</label>
                                        
                                     </div>
                                    </div>
                                     <div class="col-lg-2">
                                       <div class="mb-3">
                                 
                                           <select formControlName="isActive" 
                                               class="form-control form-select ng-pristine ng-touched"
                                               [ngClass]="{ 'is-invalid': formSubmitted && (f['isActive'].invalid) }">
                                               <option value ="Y">Yes</option>
                                               <option value="N">No</option>
                                           </select> 
                                       </div>
                                    </div>
                                    </div>
                             
                       
               
                 
                      </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                     
                     <button class="btn btn-primary w-md" 
                        *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                         (click)="submitBrandMasterForm()">Save</button>&nbsp;
                     <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                         (click)="deleteBrandMasterForm()">Delete</button>&nbsp;
                     <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
            
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
