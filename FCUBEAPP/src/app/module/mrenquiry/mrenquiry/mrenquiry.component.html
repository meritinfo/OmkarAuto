
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Mr Enquiry</h4>
                    </div>
                </div>
            </div>  <div class="row top-controls">
                <div class="col-sm-12 col-md-12">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-1">
                                <div class="mb-1">
                                    <label for="formrow-inputState">Mr No : </label>
                                   
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-2">
                                    
                                    <input class="form-control" formControlName="mrNo" numbersonly >
                                </div>
                            </div>
                          
                            <div class="col-md-2">
                                <div class="mb-2">
                                    <button class="btn btn-primary"   
                                    (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>          
            <!-- end page title -->
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step1Active}" data-toggle="tab" aria-controls="step1" role="tab"
                        title="Step 1">Mr Master</a>
                </li>
                <li role="presentation" class="nav-item">
                    <a class="nav-link" [ngClass]="{'active' : step2Active}" data-toggle="tab" aria-controls="step2" role="tab"
                        title="Step 2"> Mr OnAccount</a>
                </li>
               
            </ul>
            <form (keydown.enter)="$event.preventDefault()"role="form" [formGroup]="formUser">
                <div class="tab-content">
                    <div class="tab-pane mt-4" [ngClass]="{'active' : step1Active}" role="tabpanel" id="step1">
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">MR Station </label><span style="color: red">*</span>  
                                    <select class="form-control form-select ng-pristine ng-touched"
                                     formControlName="mrStation"
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['mrStation'].invalid) }"> 
                                        <option *ngFor="let br of branchList" value={{br.dataId}}>
                                            {{br.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>       
                            <!-- <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Challan No. : </label>
                                    <span style="color: red">*</span>
                                    <input type="text" id="formrow-inputCity" class="form-control" 
                                        formControlName="challanNo" maxlength="15" numbersonly
                                       
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['challanNo'].invalid) }">
                                </div>
                            </div>      -->
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">MR No</label><span style="color: red">*</span> 
                                    <input uppercaseonly class="form-control" formControlName="mrNo" 
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['mrNo'].invalid) }">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-2">
                                    <label for="formrow-inputZip">MR Date</label><span style="color: red">*</span>    
                                    <input bsdatepicker="" type="date" autoclose="false" 
                                    min="{{minDate}}" max="{{maxDate}}"   
                                    formControlName="mrDate" class="form-control"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['mrDate'].invalid) }">
                                </div>
                            </div>    
                            <div class="col-lg-2">
                                <div class="mb-3">
                                    <div class="form-check mt-4">
                                        <input type="checkbox"  
                                            class="form-check-input mt-10" formControlName="mrStatus" >
                                        <label for="formrow-inputZip"> Cancel </label>
                                    </div>
                                </div>
                            </div>
                            <!-- <div class="col-lg-2">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">LR NO : </label>
                                    <input  class="form-control" formControlName="lrNo" maxlength="15">   
                                </div>
                            </div>   -->
                        </div>
                            <div class="row">  
                                <div class="col-lg-2">
                                    <div class="mb-3">
                                        <label for="formrow-inputZip">MR Type</label>
                                        <span style="color: red">*</span>
                                        <select class="form-control" formControlName="mrType"      
                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['mrType'].invalid) }">
                                            <option value="B">Bill/LR</option>
                                            <!-- <option value="L">LR</option> -->
                                            <option value="N">NR/TDS</option>
                                            <option value="A">Adj on A/C</option>
                                            <option value="S">SD</option>
                                            <!-- <option value="O">Other/General</option> -->
                                         </select>
                                    </div>
                                </div>
                                <div class="col-lg-1">
                                    <div class="form-check mb-3">
                                        <input type="radio" formControlName="billLrOthType" 
                                            id="formRadios1" value="B" class="form-check-input" 
                                             />
                                        <label for="formRadios1" class="form-check-label" style="color:green">
                                            Bill
                                        </label>
                                    </div>
                                </div>
                                <div class="col-lg-4">
                                    <div class="mb-3">
                                        <label for="formrow-inputZip">Party</label><span style="color: red">*</span>                                                
                                        <div class="ng-autocomplete">
                                            <ng-autocomplete [data]="partyList"
                                                [searchKeyword]="keywordLocation"  

                                                [itemTemplate]="itemTemplate"
                                                [notFoundTemplate]="notFoundTemplate"
                                      
                                                formControlName="partyCode" 
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['partyCode'].invalid) }">
                                            </ng-autocomplete>

                                            <ng-template #itemTemplate let-item>
                                                <a [innerHTML]="item.dataName"></a>
                                            </ng-template>

                                            <ng-template #notFoundTemplate let-notFound>
                                                <div [innerHTML]="notFound"></div>
                                            </ng-template>
                                        </div>
                                    </div>
                                </div>    
                           
                            <div class="col-lg-6">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Cash / Chq Amt</label>
                                    <input decimalonly class="form-control" formControlName="cheqCashAmt" 
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['cheqCashAmt'].invalid) }">
                                </div>
                            </div>
                                               
                            <div class="col-lg-6">
                                <div class="mb-3">
                                    <div class="form-check mt-4">
                                        <input type="checkbox" 
                                            class="form-check-input mt-10" formControlName="onAcStatus" >
                                        <label for="formrow-inputZip"> Total On Ac </label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">On A/C Amt</label>
                                    <input decimalonly class="form-control" formControlName="onAcNewAmt" >
                                </div>
                            </div>                          
                        </div>
                                              
                            
                                               
                              
                    
                       
                       
                                               
                        <div class="row">
                            
                           
                          
                        
                            
                        </div>                          
                        <div class="row">
                            
                        </div>    
                        <div class="row">                                                       
                           
                        </div>
                        <div class="row">
                            
                            
                        </div>
                        <div class="row">
                          
                           
                        </div>
                        <div class="row">
                            
                            
                            
                           
                           
                        </div>
                        <div class="row">    
                            <div class="ng-untouched ng-pristine ng-valid">
                                <div class="row">                     
                                    <div class="overflow-x">
                                        <table class="table table-bordered dt-responsive nowrap w-100 no-border-table full-grid-width">
                                            <tr>
                                           
                                                <th><label for="formrow-inputZip">Bill/LR Stn</label></th>
                                                <th><label for="formrow-inputZip">Bill/LR No</label></th>
                                                <!-- <th><label for="formrow-inputZip">Bill/LR Date</label></th> -->
                                                <!-- <th><label for="formrow-inputZip">Amt Due</label></th> -->
                                                <th><label for="formrow-inputZip">Amt Recd</label></th>
                                                <th><label for="formrow-inputZip">Frt / NR</label></th>
                                                <th><label for="formrow-inputZip">Claims</label></th>
                                                <th><label for="formrow-inputZip">Bank Chrg</label></th>
                                                <th><label for="formrow-inputZip">Other Ded</label></th>
                                                <th><label for="formrow-inputZip">Other Ded1</label></th>
                                                <th><label for="formrow-inputZip">Other Ded2</label></th>
                                                <th><label for="formrow-inputZip">Other Ded3</label></th>
                                                <!-- <th><label for="formrow-inputZip">Recoverable</label></th> -->
                                                <th><label for="formrow-inputZip">Tot Ded</label></th>
                                                <th><label for="formrow-inputZip">TDS</label></th>
                                                <th><label for="formrow-inputZip">Sec.Deposit</label></th>
                                                <th><label for="formrow-inputZip">Excess Recd</label></th>
                                                <th><label for="formrow-inputZip">Remarks</label></th>    
                                                <th><label for="formrow-inputZip">Party</label></th>
                                                <th><label for="formrow-inputZip"></label></th>                                                     
                                            </tr>
                                            <tr formArrayName="arrayMrList"
                                                *ngFor="let arrayData of formMrArray.controls; let i = index">
                                                <div [formGroupName]="i" class="grid-table">
                                                    
                                                    <td>                                                  
                                                     
                                                        <input type="text" autoclose="false" class="form-control"
                                                        formControlName="billLrStn">
                                                    </td>
                                                    <td>
                                                        <input uppercaseonly autoclose="false" class="form-control"
                                                            formControlName="billLrNo" >
                                                        <input type="hidden" autoclose="false" class="form-control"
                                                            formControlName="billLrMasterId">
                                                    </td>                                                    
                                                    <!-- <td>
                                                        <input type="date" autoclose="false" class="form-control"
                                                            formControlName="billLrDate">
                                                    </td>                                                -->
                                                    <!-- <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="dueAmt">
                                                        <input type="hidden" autoclose="false" class="form-control"
                                                            formControlName="oldDueAmt">
                                                    </td>                                                  -->
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="recdAmt">
                                                    </td>                                                
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="freightDed">
                                                    </td>                                                
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="claimsDed">
                                                    </td>                                                
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="bankChrgDed">
                                                    </td>                                                
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="othersDed" >
                                                    </td>                                                
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="othersDed1">
                                                    </td>                                                
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="othersDed2" >
                                                    </td>                                               
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="othersDed3">
                                                    </td>                                               
                                                    <!-- <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="recoverable" (change)="amtcheck(i,'recoverable')">
                                                    </td>                                              -->
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="totDed" >
                                                    </td>                                                  
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="tdsDed">
                                                    </td>                                               
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="sdEmdDed" >
                                                    </td>                                               
                                                    <td>
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="excessRecd">
                                                    </td>                                             
                                                    <td>
                                                        <input uppercaseonly autoclose="false" class="form-control"
                                                            formControlName="remarks">
                                                    </td> 
                                                    <td>                                                  
                                                        <select class="form-control form-select ng-pristine ng-touched"
                                                        formControlName="partyCode"> 
                                                            <option *ngFor="let br of partyList" value={{br.dataId}}>
                                                                {{br.dataName}}
                                                            </option>
                                                        </select>
                                                    </td>   
                                                    <td>
                                                        <div class="col-lg-4 details-button">
                                                            <button *ngIf="i === formMrArray.controls.length-1" type="button"
                                                                class="btn btn-add" ></button>
                                                            <button *ngIf="formMrArray.controls.length > 1"
                                                                class="btn btn-delete"></button>
                                                        </div>                                        
                                                    </td>
                                                </div>
                                            </tr>
                                          
                                        </table>
                                    </div>
                                </div>
                            </div>                       
                                                            
                                                             
                                                        
                                           
                        </div>
                       
                       
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-primary w-md next-step ms-2" 
                                    id="n-btn1" (click)="nextStep(2)">Next</button>&nbsp;
                                    <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane mt-4" [ngClass]="{'active' : step2Active}" role="tabpanel" id="step2">
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="card">
                                    <div class="card-body">
                                        <div class="overflow-x">
                                            <h4 class="card-title mb-4" style="color: red;"> Mr OnAc List</h4>
                                            <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                            <tr>
                                                <th><label for="formrow-inputCity">Adj Mr Station</label></th>  
                                                <th><label for="formrow-inputCity">Adj MrNo</label></th>  
                                                <th><label for="formrow-inputCity">Adj Amount</label></th>   
                                            </tr>
                                            <tr formArrayName="mrOnAcList"
                                                *ngFor="let arrayData of formOnAcArray.controls; let i = index">
                                                <div [formGroupName]="i" class="grid-table">
                                                    <td>
                                                        <input type="text" class="form-control" 
                                                        formControlName="adjMrStn">
                                                    </td> 
                                                    <td>
                                                        <input type="text" class="form-control" 
                                                        formControlName="adjMrNo">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="form-control" 
                                                        formControlName="adjAmt">
                                                    </td>
                                                    
                                                    
                                                </div>
                                            </tr>
                                        </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>  
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="card">
                                    <div class="card-body">
                                        <div class="overflow-x">
                                            <h4 class="card-title mb-4" style="color: red;"> Mr Adj On Ac List</h4>
                                            <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                            <tr>
                                                <th><label for="formrow-inputCity">Mr Station</label></th>  
                                                <th><label for="formrow-inputCity">Mr No</label></th>  
                                                <th><label for="formrow-inputCity">Mr Date</label></th>   
                                                <th><label for="formrow-inputCity">Adj Amount</label></th>   
                                            </tr>
                                            <tr formArrayName="mrAdjList"
                                                *ngFor="let arrayData of formAdjArray.controls; let i = index">
                                                <div [formGroupName]="i" class="grid-table">
                                                    <td>
                                                        <input type="text" class="form-control" 
                                                        formControlName="mrStation">
                                                    </td> 
                                                    <td>
                                                        <input type="text" class="form-control" 
                                                        formControlName="mrNo">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="form-control" 
                                                        formControlName="mrDate">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="form-control" 
                                                        formControlName="adjAmt">
                                                    </td>
                                                    
                                                </div>
                                            </tr>
                                        </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>                        
                                             
                       
                                          
                       
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-default prev-step"
                                        id="p-btn1" (click)="nextStep(1)">Previous</button>
                                    <button type="button" class="btn btn-primary w-md next-step ms-2" 
                                        id="n-btn2"  (click)="nextStep(3)">Next</button>&nbsp;
                                    <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane mt-4"  [ngClass]="{'active' : step3Active}" role="tabpanel" id="step3">
                        <!-- 3rd tab -->
                        <div class="row text-right">
                            <div class="col-lg-12">
                                <div class="tex">
                                    <button type="button" class="btn btn-default prev-step"
                                        id="p-btn2" (click)="nextStep(2)">Previous</button> &nbsp;
                                    <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="clearfix"></div>
                </div>
            </form>
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
