<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Bill Print</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Format </label>
                                    <select formControlName="format"
                                    class="form-control form-select ng-pristine ng-touched" 
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['format'].invalid) }">
                                    <option value="RCM">General Bill RCM </option>
                                    <option value="FCM">General Bill FCM </option>
                                    <option value="GTA">General Bill GTA </option>
                                    <option value="NOLR">Supp Bill No LR </option>
                                </select>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Branch </label>
                                    <select formControlName="billingStn"
                                    class="form-control form-select ng-pristine ng-touched" 
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['billingStn'].invalid) }">
                                    <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                        {{branch.dataName}}
                                    </option>
                                </select>
                                </div>
                            </div>                       
                            <div class="col-md-2">
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Bill No </label>  
                                    <input uppercaseonly class="form-control" formControlName="billNo"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['billNo'].invalid) }">
                                </div>
                            </div>     
                        </div>
                        <div class="row">                                
                            <div class="col-lg-3">
                                <div class="form-check mb-3">
                                    <input type="radio" formControlName="cnorCnee" value="R"
                                        class="form-check-input" />
                                    <label for="formRadios1" class="form-check-label" style="color:green">
                                        Consigner
                                    </label>
                                </div>
                            </div>                           
                            <div class="col-lg-3">
                                <div class="form-check mb-3">
                                    <input type="radio" formControlName="cnorCnee" value="E"
                                        class="form-check-input" />
                                    <label for="formRadios1" class="form-check-label" style="color:green">
                                        Consignee
                                    </label>
                                </div>
                            </div>              
                            <div class="col-md-2">
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Copy Type </label>  
                                    <input class="form-control" formControlName="copy"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['copy'].invalid) }">
                                </div>
                            </div>                                        
                            <div class="col-lg-1" >
                                <div class="mt-3">
                                    <button class="btn btn-primary"   
                                    (click)="download()"><span>Download</span></button>
                                </div>
                            </div>   
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
