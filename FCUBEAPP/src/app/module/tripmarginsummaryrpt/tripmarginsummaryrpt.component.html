<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Trip Margin Summary</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" 
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" 
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Location </label>
                                    <select class="form-control form-select ng-pristine ng-touched"
                                        formControlName="branch">
                                        <option value="">All</option>
                                        <option *ngFor="let branch of fltGrpList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>   
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Report Type </label>
                                    <select class="form-control form-select ng-pristine ng-touched"
                                        formControlName="rptType">
                                        <option value="N">No Of Trips</option>
                                        <option value="M">Margin</option>
                                    </select>   
                                </div>
                            </div>
                            <div class="col-sm-2 col-md-2 text-right">
                                <div class="dt-buttons btn-group flex-wrap export-button">
                                    <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                                        aria-controls="datatable-buttons" type="button" 
                                        (click)="exportExcel()"><span>Excel</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>               
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
