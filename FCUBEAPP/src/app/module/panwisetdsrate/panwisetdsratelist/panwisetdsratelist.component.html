<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">PAN wise TDS Rates </h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Pan No</label>
                                    <input type="text" class="form-control" formControlName="panNo">
                                </div>
                            </div>
                            <!-- <div class="mb-3">
                                <label for="basicpill-phoneno-input">Select Year</label>
                                <select class="form-control" formControlName="yearID"   >
                                    <option *ngFor="let branch of yearList" value={{branch.dataId}}>
                                       {{branch.dataName}}
                                    </option>
                                 </select>
                            </div>      -->
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"  
                                    (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <!-- <div class="dt-buttons btn-group flex-wrap export-button">
                        <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button" 
                            (click)="exportExcel()"><span>Excel</span></button>
                        <button class="btn btn-secondary buttons-pdf buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button" 
                            (click)="exportPdf()"><span>PDF</span></button>
                    </div> -->
                    <button class="btn btn-primary buttons-html5" type="button" *ngIf="createStatus"
                        (click)="panwisetdsrateAdd()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive w-100">
                    <thead>
                        <tr>
                            <th>Driver Name </th>
                            <th>Father Name </th>
                            <th>Date Of Appoint </th>
                            <th>License No</th>
                            <th>licValidUpto</th>
                            <th>driverMobile1</th>
                                            
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allPanRate.panList?.length != 0">
                        <tr *ngFor="let drvr of allPanRate.panList">
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="setPanwisetdsrateDetails(drvr)"></button>    
                                         
                            </td> 
                         
                            <td>{{ drvr.panNo }}</td>
                            <td>{{ drvr.ownerName }}</td>
                            <td>{{ drvr.validFrom }}</td>
                            <td>{{ drvr.validUpto }}</td>
                            <td>{{ drvr.tdsRate }}</td>
                            <td>{{ drvr.isActive }}</td>                        
                            
                        </tr>
                    </tbody>
                    <tbody *ngIf="allPanRate.panList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
