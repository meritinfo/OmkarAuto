<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Bill Statement</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="javascript: void(0);">Fleet</a></li>
                                <li class="breadcrumb-item active">Bill Statement </li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form (keydown.enter)="$event.preventDefault()"[formGroup]="formBillStatement">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4">Bill Statement</h4>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Bill Station</label><span style="color: red"> * </span>
                                                <select class="form-control" formControlName="statementBillStation"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['statementBillStation'].invalid) }">
                                                    <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Bill Series</label><span style="color: red"> * </span>
                                                <select class="form-control" formControlName="billSeries"  (change)="billSeriesChange()"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['billSeries'].invalid) }">
                                                    <option *ngFor="let branch of lrSeries" value={{branch.dataName}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Bill No</label><span style="color: red"> * </span>
                                                <input autoclose="false" type="text" placeholder=""
                                                    class="form-control" formControlName="billNo"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['billNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Bill Date</label><span style="color: red"> * </span>
                                                <input autoclose="false" type="date" placeholder="dd/MM/yyyy"
                                                    class="form-control" formControlName="billDate"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['billDate'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Party</label><span style="color: red"> * </span>
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="partyList" formControlName="party"
                                                        [searchKeyword]="keywordLocation" placeholder=""
                                                        (selected)='selectEvent($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['party'].invalid) }">
                                                    </ng-autocomplete>
                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>
                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">LR From Date</label><span style="color: red"> * </span>
                                                <input autoclose="false" type="date" placeholder=""
                                                    class="form-control" formControlName="lrFrom"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['lrFrom'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">LR To Date</label><span style="color: red"> * </span>
                                                <input autoclose="false" type="date" placeholder=""
                                                    class="form-control" formControlName="lrTo"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['lrTo'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">From Point</label><span style="color: red"> * </span>                                                 
                                                <div class="ng-autocomplete">                                             
                                                    <ng-autocomplete [data]="locationList"
                                                        formControlName="fromPoint"
                                                        [searchKeyword]="keywordLocation" placeholder=""                                                    
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter" 
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['fromPoint'].invalid) }">
                                                    </ng-autocomplete>
                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>
                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>    
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">To Point</label>                                              
                                                <div class="ng-autocomplete">                        
                                                    <ng-autocomplete [data]="locationList"
                                                        formControlName="toPoint"
                                                        [searchKeyword]="keywordLocation" placeholder=""                                                    
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter" [ngClass]="">
                                                    </ng-autocomplete>
                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>
                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-2">
                                                <label for="formrow-inputCity">Plant Code</label>
                                                <input autoclose="false" type="text" placeholder=""
                                                    class="form-control" formControlName="plantCode"
                                                    [ngClass]="">
                                            </div>
                                        </div> 
                                        <div class="col-lg-2">
                                            <div class="mb-2">
                                                <input type="checkbox" formControlName="suppYN" id="suppYN"
                                                    value="Y" (change)="onSuppYNChange($event)" class="form-check-input" >
                                                <label for="without" > <h5>Without LR</h5></label>
                                            </div>
                                        </div> 
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <button (click)="searchStatement()" *ngIf="showButton"
                                                    class="btn btn-primary w-md mt-4">Show</button>
                                            </div>
                                        </div>
                                    </div>
                                    
                                </div>
                                <!-- end card body -->
                            </div>
                            <!-- end card -->
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4"></h4>
                                    <table class="table table-bordered dt-responsive nowrap w-100 no-border-table mb-5">
                                        <tr>
                                            <th><label for="formrow-inputCity"></label></th>
                                            <th><label for="formrow-inputCity">GC No</label></th>
                                            <th><label for="formrow-inputZip">LR Date</label></th>
                                            <th><label for="formrow-inputZip">Vehicle No</label></th>
                                            <th><label for="formrow-inputZip">Product Name</label></th>
                                            <th><label for="formrow-inputZip">No Packages</label></th>
                                            <th><label for="formrow-inputZip">Kms</label></th>
                                            <th><label for="formrow-inputZip">Rate</label></th>
                                            <th><label for="formrow-inputZip">Total</label></th>
                                        </tr>
                                        <tr  
                                            *ngFor="let arrayData of billstatementsearchlistmodel.billStatementSearchList; let i = index">
                                            <td>
                                                <div class="mb-3">
                                                    <input type="checkbox"  class="form-check-input" 
                                                    (change)="selectedData(i, $event)" [checked]="arrayData.selected"  >
                                                    <!-- {{arrayData.pmtId}} -->
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    {{arrayData.gcNoteNo}}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    {{arrayData.bookingDate}}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    {{arrayData.vehicleNo}}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    {{arrayData.productName}}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    {{arrayData.noPackages}}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    {{arrayData.kms}}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    {{arrayData.rate}}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    {{arrayData.gtotalRs}}
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Total Freight</label><span style="color: red"> * </span>
                                                <input autoclose="false" type="text" class="form-control" 
                                                    formControlName="totFreight" 
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['totFreight'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Total Extra</label>
                                                <input autoclose="false" type="text" class="form-control" 
                                                 
                                                  >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Total Sub Total</label><span style="color: red"> * </span>
                                                <input autoclose="false" type="text" class="form-control"
                                                    formControlName="totSubTotal" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">GST Type</label>  <span style="color: red"> * </span>                                            
                                                <select id="formrow-inputState" class="form-control"
                                                    formControlName="gstType"  (change)="changeGstType($event)"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['gstType'].invalid) }">
                                                        <option value="N">NA</option>      
                                                        <option value="S">S/CGST</option> 
                                                        <option value="I">IGST</option>     
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">SGST Pct</label>
                                                <input autoclose="false" type="text" class="form-control"
                                                    formControlName="sgstPct" (change)="onPctChange()" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">SGST Amount</label>
                                                <input autoclose="false" type="text" class="form-control"
                                                    formControlName="sgstAmt" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">CGST Pct</label>
                                                <input autoclose="false" type="text" class="form-control" 
                                                    formControlName="cgstPct"  (change)="onPctChange()" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">CGST Amount</label>
                                                <input autoclose="false" type="text" class="form-control" 
                                                    formControlName="cgstAmt" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">IGST Pct</label>
                                                <input autoclose="false" type="text" class="form-control"
                                                    formControlName="igstPct"  (change)="onPctChange()" >
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">IGST Amount</label>
                                                <input autoclose="false" type="text" class="form-control" 
                                                    formControlName="igstAmt" >
                                            </div>
                                        </div>                                        
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Credit Ac</label><span style="color: red"> * </span>
                                                <select class="form-control" 
                                                    formControlName="creditAc"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['creditAc'].invalid) }">
                                                    <option *ngFor="let ac of creditAcList" value={{ac.dataId}}>
                                                        {{ac.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>                                                                         
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Party Ref No</label>
                                                <input autoclose="false" type="text" class="form-control"
                                                    formControlName="partyRefNo">
                                            </div>
                                        </div>  
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Total Bill Amount</label><span style="color: red"> * </span>
                                                <input autoclose="false" type="text" class="form-control"
                                                    formControlName="totalBillAmt"  
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['totalBillAmt'].invalid) }">
                                            </div>
                                        </div>                                        
                                        <div class="col-lg-4">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Mofify/Remarks</label><span style="color: red"> * </span>
                                                <input uppercaseonly autoclose="false" type="text" class="form-control"
                                                    formControlName="remarks"  
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['remarks'].invalid) }">
                                            </div>
                                        </div>  
                                        <div class="col-lg-4">
                                            <div class="mb-3">
                                                <input type="checkbox" 
                                                formControlName="cancelBill"                                     
                                                class="form-check-input" />
                                                <label for="formrow-inputCity">Cancel Bill</label>
                                            </div>                                                    
                                        </div>                                                                            
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label style="color: red"> 
                                                    <h6>Fin Doc Series: {{ this.seriesDoc}} </h6> 
                                                </label>                                                 
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" 
                            *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                (click)="saveStatementDetails()"> Save</button>
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="billsStatementDelete()"> Delete</button>                           
                            <button class="btn btn-secondary w-md  m-2" 
                                (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
