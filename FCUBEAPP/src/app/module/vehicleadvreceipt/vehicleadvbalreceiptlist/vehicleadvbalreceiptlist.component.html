



<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Advance/Balance Receipts</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-12 col-md-12">
                    <form [formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date</label>
                                    <input type="date" class="form-control" formControlName="fromDate" 
                                    min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date</label>
                                    <input type="date" class="form-control" formControlName="toDate" 
                                    min="{{minDate}}" max="{{maxDate}}">
                                </div>
                            </div>
                            <div class="col-lg-4">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Vehicle No</label><span style="color: red">*</span>                                           
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="vehicleList"
                                            [searchKeyword]="keywordLocation"  
                                            formControlName="vehicleMasterId" 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="endWithFilter" >
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>       
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary"   (click)="search()">
                                        <span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-12 col-md-12 text-right">
                    <button class="btn btn-primary buttons-html5" type="button"
                        (click)="addVehicleadvbalreceiptMaster()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <div class="overflow-x">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>tptName</th>
                            <th>address1</th>
                            <th>address2</th>
                            <th>address3</th> 
                            <th>address1</th>
                            <th>address1</th>
                            <th>tptName</th>
                            <th>tptName</th>
                            <th>tptName</th>
                       
                      
                                            
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allAdvanceMaster.advanceList?.length != 0">
                        <tr *ngFor="let tm of allAdvanceMaster.advanceList">
                            <td>                                
                                <button type="button" class="btn btn-edit" 
                                    (click)="getVehicleAdvBalreceiptasterDetails(tm)"></button> 
                            </td>
                         
                            <td>{{ tm.transDate}}</td>
                            <td>{{ tm.branchName}}</td>
                            <!-- <td>{{ tm.vendor}}</td>  -->
                            <td>{{ tm.tripsUptoDate}}</td> 
                     
                            <td>{{ tm.vehicleNo}}</td> 
                            <td>{{ tm.cheqCashAmt}}</td> 
                            <!-- <td>{{ tm.tripOnAcAdj}}</td> 
                            <td>{{ tm.onAcAdjAmt}}</td>  -->
                            <td>{{ tm.amtRecd}}</td> 
                            <td>{{ tm.amtDed}}</td> 
                            <td>{{ tm.amtTDS}}</td> 
                            <td>{{ tm.amtExtras}}</td>
                            
                                                    
                           
                        </tr>
                    </tbody>
                    <tbody *ngIf="allAdvanceMaster.advanceList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
