<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Bill Interest Loss</h4>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls" style="height: 400px;">
                <div class="col-sm-10 col-md-10">
                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div> 
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="formrow-inputCity">Branch</label>
                                    <select class="form-control form-select ng-pristine ng-touched"formControlName="branch">
                                        <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>                            
                        <div class="row">   
                            <div class="col-md-6">
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Party </label>  
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="partyList"
                                            [searchKeyword]="keywordLocation"  
                                            formControlName="party" 
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-2"> 
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Interest % </label><span style="color: red">*</span>    
                                    <input decimalonly autocomplete="off" class="form-control" formControlName="intPct" maxlength="5" 
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['intPct'].invalid) }">                                    
                                </div>                         
                            </div>
                            <div class="col-lg-2"> 
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Days After </label><span style="color: red">*</span>    
                                    <input numbersonly autocomplete="off" class="form-control" formControlName="daysAfter" maxlength="5" 
                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['daysAfter'].invalid) }">                                    
                                </div>                         
                            </div>
                            <div class="col-sm-1 col-md-1 text-right">
                                <div class="dt-buttons btn-group flex-wrap export-button">
                                    <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                                        aria-controls="datatable-buttons" type="button" 
                                        (click)="exportExcel()"><span>Excel</span></button>
                                </div>
                            </div>   
                        </div>   
                    </form>
                </div> 
            </div>
            <!-- container-fluid -->
        </div>
        <!-- End Page-content -->
    </div>
