
<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Create/Edit Vehicle Types</h4>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form (keydown.enter)="$event.preventDefault()"[formGroup]="formRoleType">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                     
                      
                            
                               
                               
                                     <div class="row">
                                       
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Vehicle Type Group Code </label><span style="color: red"> * </span>
                                                <input type="text" class="form-control" uppercaseonly (change)="ChkDuplicateFltCode()"
                                                  formControlName="vehicleTypeGroupCode" 
                                                  [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleTypeGroupCode'].invalid) }" >
                                                
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Vehicle Type Group Name</label><span style="color: red"> * </span>
                                                <input type="text" class="form-control" uppercaseonly (change)="ChkDuplicateName()"
                                                  formControlName="vehicleTypeGroupName"
                                                  [ngClass]="{ 'is-invalid': formSubmitted && (f['vehicleTypeGroupName'].invalid) }">
                                                
                                            </div>
                                        </div>
                                       
                                    </div>
                                  
                                       
                                 
                                    <div class="row">
                                        
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Is Active </label><span style="color: red"> * </span>
                                                <select id="formrow-inputState" class="form-control"
                                                formControlName="isActive"
                                              >
                                                <option selected="">Choose...</option>
                                                <option value="Y">Yes</option>
                                                <option value="N">No</option>
                                               
                                            </select>
                                            </div>
                                        </div>
                                    </div>
                        
                          
                        
                                
                             
                       
               
                 
                      </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                      <button class="btn btn-primary w-md" 
                      *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                         (click)="submitFltTypeGroupTypesForm()">Save</button>
                         <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="fltTypesDelete()">Delete</button> 
                                <button  class="btn btn-secondary w-md m-2" 
                                 (click)="exit()">Exit</button>
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
