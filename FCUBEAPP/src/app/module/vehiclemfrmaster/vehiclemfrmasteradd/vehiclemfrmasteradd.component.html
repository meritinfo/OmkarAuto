<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Create/Edit Vehicle Mfr</h4>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div id="basic-example">
                                <section>
                                    <form (keydown.enter)="$event.preventDefault()"[formGroup]="formVehMfrMaster">
                                                <div class="row"> 
                                                    <div class="col-lg-4">
                                                        <div class="mb-3">
                                                         <label for="basicpill-lastname-input" class="form-label">Mrf Name:</label><span style="color: red">*</span>
                                                          <input uppercaseonly type="text" class="form-control" formControlName="vehMrfName" 
                                                          maxlength="50"  (change)="vehicleMfrMasterChkActName()">
                                                        </div>
                                                   </div>
                                                </div>
                                            <div class="row text-right">
                                                <div class="col-lg-12">
                                                    <div class="tex">
                                                      <button class="btn btn-primary w-md" 
                                                       *ngIf="((editMode && editStatus) || (!editMode && createStatus)) && !formSubmitted"
                                                        (click)="submitVehicleMfrMasterForm()">Save</button>&nbsp;
                                                        <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                                        (click)="DeleteVehicleMfrMasterForm()">Delete</button>&nbsp;
                                                        <button class="btn btn-secondary w-md" (click)="exit()">Exit</button> 
                                                    </div>
                                                </div>
                                                <!-- end col -->
                                            </div>                                                                              
                                    </form>
                                </section>
                                <!-- Attachment Details -->
                            </div>
                        </div>
                        <!-- end card body -->
                    </div>
                    <!-- end card -->
                </div>
                <!-- end col -->
            </div>
            <!-- end row -->
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
