
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">JournalEntry</h4>

                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <li class="breadcrumb-item"><a href="/#/gstpurchaselist">Cash Receipt</a></li>
                                <li class="breadcrumb-item active">Cash Receipt</li>
                            </ol>
                        </div>

                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form [formGroup]="formUser">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4">Details</h4>
                                    
                                 
                                <div class="row">
                                    <div class="col-lg-2">

                                        <label for="formrow-inputState">Document Series</label>


                                        <input class="form-control" placeholder="" formControlName="docSeries">


                                    </div>
                                    <div class="col-lg-3">
                                        
                                            <label for="formrow-inputState">Document No</label>
                                            <input class="form-control" placeholder=""    formControlName="docNo">
                                        
                                    </div>
                                    
                                    <div class="col-lg-3">
                                       
                                            <label for="formrow-inputState"> Trance Date</label>
                                            <input type="date" class="form-control" placeholder=""  formControlName="ftmDate">
                                        
                                    </div>
                               
                                <div class="col-lg-3">
                                   <div class="mb-3">
                                        <label for="formrow-inputCity">Ref Type </label>
                                        <select class="form-control" formControlName="refType">
                                            <option selected="">Choose...</option>
                                            <option selected="">1</option>
                                        </select>
                                        </div>
                                
                                </div>
                          
                                <div class="col-lg-3">
                                      <div class="mb-3">
                                        <label for="formrow-inputZip">Ref No </label>
                                        <input bsdatepicker="" autoclose="false" placeholder="" formControlName="refNo"
                                            class="form-control">
                                    </div>
                                </div>
                            </div>
                        
                            <div class="col-lg-12">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="card-title mb-4" style="color: red;"> Details</h4>
                                        <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                            <tr formArrayName="cashDetailsList"
                                            *ngFor="let miscData of formCashArray.controls; let k = index">
                                            <div [formGroupName]="k">
                                                
                                                    
                                                        <td>
                                                            <div class="col-lg-12">
                                                                <div class="mb-3">
                                                                    <label for="formrow-inputCity"><h6>Account Name</h6></label>
                                                                    <select class="form-control"
                                                                    formControlName="accountId" [ngClass]="">

                                                                    <option *ngFor="let branch of creditacList"
                                                                        value={{branch.dataId}}>

                                                                        {{branch.dataName}}
                                                                    </option>
                                                                </select>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    
                                                    <td>
                                                        <div class="col-lg-12">
                                                            <div class="mb-3">
                                                                <label for="formrow-inputCity">
                                                                    <h6>Type</h6> </label>
                                                                <select id="role" class="form-select"
                                                                    formControlName="typeSign">
                                                                    <option value="">Choose...</option>
                                                                    <option value="C">Credit</option>
                                                                    <option value="D">Debit</option>
                                                                
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="col-lg-12">
                                                            <div class="mb-3">
                                                                <label for="formrow-inputCity"><h6>Amount</h6></label>
                                                                <input autoclose="false" type="text" placeholder=""
                                                                    class="form-control" formControlName="amount">
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="col-lg-12">
                                                            <div class="mb-3">
                                                                <label for="formrow-inputCity"><h6>Narration</h6></label>
                                                                <input autoclose="false" type="text" placeholder=""
                                                                    class="form-control" formControlName="narration">
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="col-lg-12">
                                                            <div class="mb-3">
                                                                <label for="formrow-inputCity"><h6>Reference/Subledger</h6></label>
                                                                <input autoclose="false" type="text" placeholder=""
                                                                    class="form-control" formControlName="reference">
                                                            </div>
                                                        </div>
                                                    </td>
                                                  
                                                    <td>
                                                        <div class="col-lg-12">
                                                            <div class="mb-3">
                                                                <label for="formrow-inputCity"><h6>Cbs Cost Ref</h6></label>
                                                                <input autoclose="false" type="text" placeholder=""
                                                                    class="form-control" formControlName="costRefNo">
                                                            </div>
                                                        </div>
                                                    </td>
                                                  
                                                    <td>
                                                        <div class="col-lg-12 details-button">

                                                            <button type="button" class="btn btn-primary"
                                                                (click)="addMiscItem()">Add</button>
                                                            <button (click)="removeMiscItem(k)"
                                                                class="btn btn-danger">Delete</button>
                                                        </div>
                                                    </td>
                                                </div>
                                            </tr>
                                        </table>
                                    </div>
                                </div>
                            </div>
                           
                                    <div class="row">
                                      
                                        <div class="col-lg-3">
                                      
                                                <label for="formrow-inputState">Total Credits </label>
                                                <input class="form-control" placeholder="">
                                    
                                        </div>
                                    
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Total Debits </label>
                                                <input class="form-control" placeholder=""  formControlName="docAmount">
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="mb-6">
                                                <label for="formrow-inputState">Remark</label>
                                                <input class="form-control" placeholder="" formControlName="remarks">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="mb-6">
                                                <label for="formrow-inputState"> Modify Remark</label>
                                                <input class="form-control" placeholder="" formControlName="modifyRemarks">
                                            </div>
                                        </div>

                                    
                
                                    </div>
                       
                 
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
             
                                 
                                     
                                      
                                        
                                    
                                
                                      
                                   
           
                

                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button type="submit" class="btn btn-primary w-md" (click)="submitJournalEntryForm()">Save</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
