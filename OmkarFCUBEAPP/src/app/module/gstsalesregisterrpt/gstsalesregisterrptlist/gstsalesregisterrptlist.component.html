



<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Gst Sales Report</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="javascript: void(0);">Fleet</a></li>
                                <li class="breadcrumb-item active">Driver Master </li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form [formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                           <!-- <div class="col-md-2">
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Loading Branch</label>  
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="branchList"
                                            [searchKeyword]="keywordLocation" placeholder=""
                                            formControlName="tripBranch" [initialValue]=""
                                            (selected)='selectEvent($event)'
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>-->
                            <div class="col-lg-4">
                                <div class="mb-3">
                                    <label for="formrow-inputZip">Billing Party </label>
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="partyList" 
                                            formControlName="accountID"
                                            [searchKeyword]="keywordLocation" placeholder=""
                                            (selected)='selectEvent($event)'
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter"
                                            [ngClass]=" ">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>

                                </div>
                            </div>
                     
                            
                        
                            <div class="col-lg-2">
                                <div class="mb-2">
                                    <label for="basicpill-phoneno-input">Type</label>
                                    <select id="formrow-inputState" class="form-control"
                                        formControlName="gstType"
                                        [ngClass]="">
                                        <option value ="">Choose...</option>
                                        <option value="S"> Sales</option>
                                        <option value="P"> Purchase </option>
                                    </select>
                                </div>
                            </div>  
                            <div class="col-lg-1">
                                <div class="mt-3">
                                    <button class="btn btn-primary" type="submit" 
                                    (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <div class="dt-buttons btn-group flex-wrap export-button">
                        <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button" 
                            (click)="exportExcel()"><span>Excel</span></button>
                       <!--<button class="btn btn-secondary buttons-pdf buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button"><span>PDF</span></button>--> 
                    </div>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive w-100">
                    <thead>
                        <tr>
                            <!-- <th>seriesCode</th>
                            <th>bill_StmtNo</th> -->
                            <th>invDate </th>  
                            <th>invNo </th>
                            <th>accountGstNo</th>
                            <th>partyName </th> 
                            <th>totSubTotal </th> 
                            <th>sgstAmt</th>
                            <th>cgstAmt</th>
                            <th>igstAmt</th>
                            <th>totalBillAmt</th>
                          <!-- <th>AmountPaid</th>
                            <th>PmtType</th>
                            <th>CreditAffect</th>-->
                       

                        </tr>
                    </thead>
                    <tbody *ngIf="allGstSalesRegisterRptlist.gstSalesList?.length != 0">
                        <tr *ngFor="let eta of allGstSalesRegisterRptlist.gstSalesList">
                            <!-- <td>{{ eta.seriesCode }}</td>
                            <td>{{ eta.bill_StmtNo }}</td>  -->
                            <td>{{ eta.invDate }}</td>
                            <td>{{ eta.invNo }}</td>
                            <td>{{ eta.accountGstNo }}</td>
                             <td>{{ eta.partyName }}</td> 
                             <td>{{ eta.totSubTotal }}</td> 
                            <td>{{ eta.sgstAmt }}</td> 
                            <td>{{ eta.cgstAmt   }}</td> 
                            <td>{{ eta.igstAmt   }}</td> 
                            <td>{{ eta.totalBillAmt }}</td> 
                           <!-- <td>{{ eta.tripStatus }}</td> 
                            <td>{{ eta.tripCloseDt }}</td> 
                            <td>{{ eta.tripLinkYN }}</td> 
                            <td>{{ eta.loadType   }}</td> -->
                        
                       
                        </tr>
                    </tbody>
                    <tbody *ngIf="allGstSalesRegisterRptlist.gstSalesList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
