<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Doc Renewal  Master</h4>
                   <div class="page-title-right">
                      <ol class="breadcrumb m-0">
                         <li class="breadcrumb-item"><a href="javascript: void(0);">Fleet</a></li>
                         <li class="breadcrumb-item active">Doc Renewal  Master</li>
                      </ol>
                   </div>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form [formGroup]="formUser">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                        
                         <div class="row">
                            <div class="col-lg-12">
                               <div class="card">
                                  <div class="card-body">
                                     <div class="row">
                                        <div class="col-sm-2">
                                           <label for="horizontal-firstname-input" class="col-form-label">Doc Code
                                           </label>
                                        </div>
                                        <div class="col-sm-4">
                                           <input type="text" class="form-control"
                                           placeholder="Enter  doc code " formControlName="docCode"
                                           [ngClass]=>
                                        </div>
                                     </div>
                                  </div>
                               </div>
                            </div>
                            <div class="col-lg-12">
                               <div class="card">
                                  <div class="card-body">
                                     <div class="row">
                                        <div class="col-sm-2">
                                           <label for="horizontal-firstname-input" class="col-form-label">Doc Description</label>
                                        </div>
                                        <div class="col-sm-4">
                                           <input type="text" class="form-control"
                                           placeholder="Enter Description " formControlName="docDescription"
                                           [ngClass]=>
                                        </div>
                                     </div>
                                  </div>
                               </div>
                            </div>
                            <div class="col-lg-12">
                              <div class="card">
                                 <div class="card-body">
                                    <div class="row">
                                       <div class="col-sm-2">
                                          <label for="horizontal-firstname-input" class="col-form-label">Reminder Days</label>
                                       </div>
                                       <div class="col-sm-4">
                                          <input type="text" class="form-control"
                                          placeholder="Enter ReminderDays " formControlName="reminderDays"
                                          [ngClass]=>
                                       </div>
                                    </div>
                                 </div>
                              </div>
                           </div>
                           <div class="col-lg-12">
                              <div class="card">
                                 <div class="card-body">
                                    <div class="row">
                                       <div class="col-sm-2">
                                          <label for="horizontal-firstname-input" class="col-form-label">Debit Ac
                                          </label>
                                       </div>
                                       <div class="col-sm-4">
                                          <select id="scope" class="form-select" formControlName="debitAc">
                                             <option value="BO">Branch office</option>
                                             <option value="HO">Headoffice</option>
                                         </select>
                                       </div>
                                    </div>
                                 </div>
                              </div>
                           </div>
                           <div class="col-lg-12">
                              <div class="card">
                                 <div class="card-body">
                                    <div class="row">
                                       <div class="col-sm-2">
                                          <label for="horizontal-firstname-input" class="col-form-label">Debit Type
                                          </label>
                                       </div>
                                       <div class="col-sm-4">
                                          <select id="scope" class="form-select" formControlName="debitType">
                                             <option value="BO">Branch office</option>
                                             <option value="HO">Headoffice</option>
                                         </select>
                                       </div>
                                    </div>
                                 </div>
                              </div>
                           </div>
                        
                          
               
                 
                         </div>
                      </div>
                      <!-- end card body -->
                   </div>                     
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                      <button type="submit" class="btn btn-primary w-md"
                         (click)="submitDocRenewalMasterForm()">Submit</button>
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
