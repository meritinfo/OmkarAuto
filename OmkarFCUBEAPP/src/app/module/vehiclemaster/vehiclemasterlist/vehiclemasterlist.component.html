

<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Vehicle Master</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="javascript: void(0);">Vehicle Type Master</a></li>
                                <li class="breadcrumb-item active">Vehicle Type Master </li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form [formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Vehicle No</label>
                                    <input type="text" class="form-control" formControlName="vehicleNo">
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mt-3">
                                    <button class="btn btn-primary" type="submit" (click)="search()">
                                        <span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <div class="dt-buttons btn-group flex-wrap export-button">
                        <!-- <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button"><span>Excel</span></button>
                        <button class="btn btn-secondary buttons-pdf buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button"><span>PDF</span></button> -->
                    </div>
                    <button class="btn btn-primary buttons-html5" type="button" *ngIf="createStatus"
                    (click)="vehiclemasterAdd()"><span>New</span></button>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive nowrap w-100">
                    <thead>
                        <tr>
                            <th>vehicleNo</th>
                            <th>regnDate </th>
                            <th>mfrModelName </th>
                            <th>makeYear</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allVehicleFltMaster.vehicleFltMasterList?.length != 0">
                        <tr *ngFor="let vehi of allVehicleFltMaster.vehicleFltMasterList">
                            <td>{{ vehi.vehicleNo }}</td>  
                            <td>{{ vehi.regnDate }}</td>
                            <td>{{ vehi.mfrModelName }}</td>
                            <td>{{ vehi.makeYear }}</td>                   
                            <td>
                                <button type="button" class="btn btn-edit" 
                                (click)="getvehicleFltDetails(vehi)" ></button>             
                            </td> 
                        </tr>
                    </tbody>
                    <tbody *ngIf="allVehicleFltMaster.vehicleFltMasterList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
