<p>finopenbalanceadd works!</p>
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Fin Opening Balance </h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="javascript: void(0);">Rate</a></li>
                                <li class="breadcrumb-item active">Rates Master  </li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form [formGroup]="formFinOpenBal">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="row text-right">
                                                <div class="mb-3">
                                                    <label for="formrow-inputZip"><h6>Branch Name</h6></label>                                                    
                                                </div>                                                   
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <select class="form-control"
                                                    formControlName="branchCode" (change)="onBranchChange($event)"
                                                    [ngClass]="{ 'is-invalid': formSubmitted && (f['branchCode'].invalid) }">
                                                    <option *ngFor="let ac of branchList"  
                                                        value={{ac.dataId}}>
                                                        {{ac.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body -->
                            </div>
                            <!-- end card -->
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4"></h4>
                                    <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                        <tr>
                                            <td class="col-lg-4">
                                                <label for="formrow-inputZip">
                                                    <h6>Account</h6>
                                                </label>
                                            </td>
                                            <td class="col-lg-2">
                                                <label for="formrow-inputZip">
                                                    <h6>Credit Rs.</h6>
                                                </label>
                                            </td>
                                            <td class="col-lg-2">
                                                <label for="formrow-inputZip">
                                                    <h6>Debit Rs.</h6>
                                                </label>
                                            </td>
                                        </tr>
                                        <tr formArrayName="arrayList"
                                            *ngFor="let arrayData of formArray.controls; let i = index">
                                            <div [formGroupName]="i" class="grid-table">
                                                <td class="col-lg-4">
                                                    <div class="ng-autocomplete">
                                                        <ng-autocomplete [data]="accountList"
                                                            [searchKeyword]="keywordLocation" placeholder=""
                                                            (selected)='selectEvent($event,i)'
                                                            (inputChanged)='onChangeSearch($event)'                                                            
                                                            (inputFocused)='onFocused($event)'
                                                            [itemTemplate]="itemTemplate"
                                                            [notFoundTemplate]="notFoundTemplate"
                                                            [customFilter]="startWithFilter"
                                                            formControlName="accountID">
                                                        </ng-autocomplete>

                                                        <ng-template #itemTemplate let-item>
                                                            <a [innerHTML]="item.dataName"></a>
                                                        </ng-template>

                                                        <ng-template #notFoundTemplate let-notFound>
                                                            <div [innerHTML]="notFound"></div>
                                                        </ng-template>
                                                    </div>
                                                </td>
                                                <td class="col-lg-2">
                                                    <input decimalonly autoclose="false" class="form-control"
                                                        formControlName="creditAmt" (change)="onCreditAmtChange($event,i)">
                                                </td>
                                                <td class="col-lg-2">
                                                    <input decimalonly autoclose="false" class="form-control"
                                                        formControlName="debitAmt" (change)="onDebitAmtChange($event,i)">
                                                </td>
                                                <td class="col-lg-4">
                                                    <div class="col-lg-4 details-button">
                                                        <button *ngIf="i === formArray.controls.length-1" type="button"
                                                            class="btn btn-add" (click)="addItem(i)"></button>
                                                        <button *ngIf="formArray.controls.length > 1"
                                                            (click)="removeItem(i)" class="btn btn-delete"></button>
                                                    </div>                                        
                                                </td>
                                            </div>
                                        </tr>
                                        <tr>
                                            <td class="col-lg-4"></td>
                                            <td class="col-lg-2">                                                   
                                                <div class="col-lg-12">
                                                    <div class="mb-3">
                                                        <label for="formrow-inputZip"><h6>Total Credit Amount</h6></label> 
                                                        <input decimalonly autoclose="false" class="form-control"
                                                        formControlName="totalCredit"> 
                                                    </div>
                                                </div>                   
                                            </td>
                                            <td class="col-lg-1">                                                  
                                                <div class="col-lg-12">
                                                    <div class="mb-3">
                                                        <label for="formrow-inputZip"><h6>Total Credit Amount</h6></label>  
                                                        <input decimalonly autoclose="false" class="form-control"
                                                            formControlName="totalDebit">
                                                    </div>
                                                </div>  
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>                               
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" *ngIf="(editMode && editStatus) || (!editMode && createStatus)"
                                (click)="submitOpeningBalanceForm()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteOpeningBalanceForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                    <!-- end col -->
                </div>  
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
