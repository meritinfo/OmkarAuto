
<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Hr Master Master</h4>
                   <div class="page-title-right">
                      <ol class="breadcrumb m-0">
                         <li class="breadcrumb-item"><a href="javascript: void(0);">Admin</a></li>
                         <li class="breadcrumb-item active">Hr Master</li>
                      </ol>
                   </div>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form [formGroup]="formHrMaster">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">                                 
                           <div class="row">
                              <div class="col-lg-3">
                                 <div class="mb-3">
                                    <label for="basicpill-phoneno-input">HRCode </label>
                                       <input type="text" class="form-control"
                                          uppercaseonly formControlName="hrCode"
                                          (change)="chkHrcode($event)"
                                          [ngClass]="{ 'is-invalid': userSubmitted && (f['hrCode'].invalid) }">                                                
                                 </div>
                              </div>
                           </div>
                           <div class="row">
                               <div class="col-lg-3">
                                   <div class="mb-3">
                                       <label for="basicpill-phoneno-input">Description </label>
                                       <input uppercaseonly type="text" class="form-control"
                                       formControlName="description"
                                       [ngClass]="{ 'is-invalid': userSubmitted && (f['description'].invalid) }">                                                
                                   </div>
                               </div>                                       
                           </div> 
                           <div class="row">
                               <div class="col-lg-3">
                                   <div class="mb-3">
                                       <label for="basicpill-phoneno-input">Hr type</label>
                                       <select class="form-control" 
                                          formControlName="hrType" 
                                          class="form-control form-select ng-pristine ng-touched" 
                                          [ngClass]="{ 'is-invalid': userSubmitted && (f['hrType'].invalid) }">
                                          <option *ngFor="let hr of hrList" value={{hr.dataId}}>
                                             {{hr.dataName}}
                                          </option>
                                       </select>
                                   </div>
                               </div>
                           </div>
                        </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                 <div class="col-lg-12">
                     <div class="tex">
                         <button class="btn btn-primary w-md" *ngIf="(editMode && editStatus) || (!editMode && createStatus)"
                             (click)="submitHrMasterForm()">Save</button>&nbsp;
                         <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                             (click)="deleteHrMaster()">Delete</button>&nbsp;
                         <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                     </div>
                 </div>
                 <!-- end col -->
             </div>    
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
