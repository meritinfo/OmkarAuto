
<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Hr Master Master</h4>
                   <div class="page-title-right">
                      <ol class="breadcrumb m-0">
                         <li class="breadcrumb-item"><a href="javascript: void(0);">Admin</a></li>
                         <li class="breadcrumb-item active">Hr Master</li>
                      </ol>
                   </div>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form [formGroup]="formHrMaster">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                     
                      
                            
                               
                               
                                     <div class="row">
                                       
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">HRCode </label>
                                                <input type="text" class="form-control"
                                                placeholder=" " formControlName="hrCode"
                                                [ngClass]="" >
                                                
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Description </label>
                                                <input type="text" class="form-control"
                                                placeholder=" " formControlName="description"
                                                [ngClass]="">
                                                
                                            </div>
                                        </div>
                                       
                                    </div>
                                  
                                       
                                 
                                    <div class="row">
                                        
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="basicpill-phoneno-input">Hr type</label>
                                                <select id="formrow-inputState" class="form-control"
                                                formControlName="hrType"
                                              >
                                                <option selected="">Choose...</option>
                                                <option value="1">Yes</option>
                                                <option value="2">No</option>
                                               
                                            </select>
                                            </div>
                                        </div>
                                    </div>
                        
                          
                        
                                
                             
                       
               
                 
                      </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                      <button class="btn btn-primary w-md" *ngIf="(editMode && editStatus) || (!editMode && createStatus)"
                         (click)="submitHrMasterForm()">Save</button>
                         <!--<button type="submit" class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="fleetCardMasterDelete()">Delete</button>--> 
                                <button type="submit" class="btn btn-secondary w-md m-2" *ngIf="createmode" (click)="exit()">Exit</button>
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
