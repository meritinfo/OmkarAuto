<p>bankreconcilation works!</p>
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Bank Reconcilation</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="/#/gstpurchaselist">Cash Receipt</a></li>
                                <li class="breadcrumb-item active">Cash Receipt</li> -->
                            </ol>
                        </div>

                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form [formGroup]="formBankRecEntry">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row" >
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <label for="formrow-inputZip"><h6>From Date</h6></label> <span style="color:red">*</span>
                                                <input bsdatepicker="" type="date" autoclose="false" 
                                                    placeholder="dd-mm-yyyy" min="{{minDate}}" max="{{maxDate}}"
                                                    formControlName="fromDate" class="form-control">
                                            </div>
                                        </div>       
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <label for="formrow-inputZip"><h6>To Date</h6></label> <span style="color:red">*</span>
                                                <input bsdatepicker="" type="date" autoclose="false" 
                                                    placeholder="dd-mm-yyyy" min="{{minDate}}" max="{{maxDate}}"
                                                    formControlName="toDate" class="form-control">
                                            </div>
                                        </div>    
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <label for="formrow-inputZip"><h6>Bank</h6></label>  <span style="color:red">*</span>                                               
                                                <select   class="form-control form-select ng-pristine ng-touched"
                                                    formControlName="accountid"  
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['accountid'].invalid) }">
                                                    <option *ngFor="let branch of bankacList"
                                                        value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div> 
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <label for="formrow-inputZip"><h6>Reconcile</h6></label> <span style="color:red">*</span>                                                
                                                <select   class="form-control form-select ng-pristine ng-touched"
                                                    formControlName="reconcile"  
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['reconcile'].invalid) }">
                                                    <option value="N">Un Reconciled</option>
                                                    <option value="Y">Reconciled</option>
                                                </select>
                                            </div>
                                        </div>                                         
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <br />
                                                <br />
                                                <input type="checkbox" formControlName="inclopening" id="neft"
                                                    (change)="onIncOpenChange($event)"
                                                            class="form-check-input" >
                                                <label for="inclopening" ><h5> Include Opening</h5> 
                                                </label>
                                            </div>          
                                        </div>                                                                    
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <br />
                                                <button class="btn btn-primary" *ngIf="createStatus"
                                                (click)="getBankrecData()"><span>Display</span></button>
                                            </div>
                                        </div>                                        
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-2 text-right">
                                            <div class="mt-3">
                                                <label for="formrow-inputState"><h5>Search</h5></label>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <select class="form-control form-select ng-pristine ng-touched"
                                                    formControlName="searchby">
                                                    <option value="Q">Cheque No</option>
                                                    <option value="N">Narration</option>
                                                    <option value="D">Debit</option>
                                                    <option value="C">Credit</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <input class="form-control" placeholder="" 
                                                formControlName="search">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mt-3">
                                                <button class="btn btn-primary" 
                                                (click)="search()"><span>Search</span></button>
                                            </div>
                                        </div>     
                                    </div> 
                                </div>
                            </div>
                            <div class="col-lg-12">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="card-title mb-4" style="color: red;"> Details</h4>
                                        <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                            <tr>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputZip">
                                                        <h6>Trans. Date</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputZip">
                                                        <h6>Doc No.</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputZip">
                                                        <h6>Debit Rs.</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputCity">
                                                        <h6>Credit Rs.</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputCity">
                                                        <h6>Cheque No</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputCity">
                                                        <h6>Cheque Date</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-3">
                                                    <label for="formrow-inputCity">
                                                         <h6>Narration</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-2">
                                                    <label for="formrow-inputCity">
                                                         <h6>Account Head</h6>
                                                    </label>
                                                </td>
                                                <td class="col-lg-1">
                                                    <label for="formrow-inputCity">
                                                         <h6>Clear Date</h6>
                                                    </label>
                                                </td>
                                            </tr>
                                            <tr formArrayName="arrayList"
                                                *ngFor="let miscData of formArray.controls; let k = index">
                                                <div [formGroupName]="k" class="grid-table">   
                                                    <td  class="col-lg-1">   
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="ftmDate"> 
                                                        <input autoclose="false" type="hidden" class="form-control" 
                                                        formControlName="ftdID">                                                                                                    
                                                    </td>
                                                    <td  class="col-lg-1"> 
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="docNo">                                                        
                                                    </td>
                                                    <td  class="col-lg-1">   
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="debit" 
                                                        [class.bg-highlight]="searchbyfield === 'Debit' && miscData.get('debit')?.value === searchValue">                                                        
                                                    </td>
                                                    <td  class="col-lg-1"> 
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="credit" 
                                                        [class.bg-highlight]="searchbyfield === 'Credit' && miscData.get('credit')?.value === searchValue">                                                        
                                                    </td>
                                                    <td  class="col-lg-1">   
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        #cheqInputs formControlName="chequeNo" 
                                                        [class.bg-highlight]="searchbyfield === 'ChequeNo' && miscData.get('chequeNo')?.value === searchValue">                                                        
                                                    </td>
                                                    <td  class="col-lg-1"> 
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="chequeDate">                                                        
                                                    </td>
                                                    <td  class="col-lg-3">   
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="narration" 
                                                        [class.bg-highlight]="searchbyfield === 'Narration' && miscData.get('narration')?.value === searchValue">                                                        
                                                    </td>
                                                    <td  class="col-lg-2">
                                                        <input autoclose="false" type="text" class="form-control" 
                                                        formControlName="subAccountName">                                                     
                                                    </td>
                                                    <td class="col-lg-1">
                                                        <input type="date" class="form-control" placeholder="dd/mm/yyyy" 
                                                            formControlName="clearDate">                                                
                                                    </td>                                   
                                                </div>
                                            </tr>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" *ngIf="editStatus || createStatus"
                                (click)="submitBankreconcilationForm()">Save</button>&nbsp;                           
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
