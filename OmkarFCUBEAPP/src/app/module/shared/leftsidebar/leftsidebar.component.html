<!-- ========== Left Sidebar Start ========== -->
<div class="vertical-menu">

    <div data-simplebar class="h-100">

        <!--- Sidemenu -->
        <div id="sidebar-menu" class="mm-active">
            <!-- Left Menu Start -->
            <ul class="metismenu list-unstyled" id="side-menu">
                <li *ngFor="let menu of mainMenuList">
                    <a href="javascript: void(0);" class="has-arrow">
                        <i class="bx bx-cog"></i>
                        <span key="t-ui-elements">{{menu.moduleName}}</span>
                    </a>
                    <ul *ngIf="menu.menuList" class="sub-menu" aria-expanded="false">
                        <li *ngFor="let subMenu of menu.menuList">
                            <a href="#{{subMenu.menuCode}}">{{subMenu.menuName}}</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
        <!-- Sidebar -->
    </div>
</div>
<!-- Left Sidebar End -->
