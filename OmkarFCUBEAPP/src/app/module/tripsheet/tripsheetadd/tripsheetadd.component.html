<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Trip Sheet</h4>

                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <li class="breadcrumb-item"><a href="/#/tripsheetlist">Trip Sheet</a></li>
                                <li class="breadcrumb-item active">Trip Sheet Add</li>
                            </ol>
                        </div>

                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form [formGroup]="formTripsheet">

                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4">Basic Details</h4>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Branch</label>
                                                <select class="form-control" formControlName="tripBranch" [ngClass]="">
                                                    <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Last Trip Close</label>
                                                <input type="date" class="form-control" placeholder=""
                                                    formControlName="lastTripCloseDate">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">New Trip Date</label>
                                                <input type="date" class="form-control" formControlName="newTripDate"
                                                    placeholder="newTripDate">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Time</label>
                                                <input bsdatepicker="" autoclose="false" placeholder=""
                                                    class="form-control">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Vehicle No</label>
                                               
                                                    <div class="ng-autocomplete" >
                                                        <ng-autocomplete [data]="vehicleList"
                                                            [searchKeyword]="keywordLocation" placeholder=""formControlName="vehicleMasterID"
                                                            [initialValue]="" (selected)='selectEvent($event)'
                                                            (inputChanged)='onChangeSearch($event)'
                                                            (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                            [notFoundTemplate]="notFoundTemplate"
                                                            [customFilter]="startWithFilter">
                                                        </ng-autocomplete>
    
                                                        <ng-template #itemTemplate let-item>
                                                            <a [innerHTML]="item.dataName"></a>
                                                        </ng-template>
    
                                                        <ng-template #notFoundTemplate let-notFound>
                                                            <div [innerHTML]="notFound"></div>
                                                        </ng-template>
                                                    </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Trip No</label>
                                                <input class="form-control" placeholder="" formControlName="tripNo">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Driver</label>
                                            
                                                    <select class="form-control" formControlName="driverMasterID"
                                                    [ngClass]="">
                                                    <option *ngFor="let branch of driverList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                                    
                                                    
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">

                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                                                        </div>

                                                        </div>
                                                    </div>

                                                            <input class="form-control" placeholder="Delay Days"

                                                        </div>
                                                    </div>

                                                        <button type="button" class="btn btn-primary"

                                                    </div>
                                                </td>
                                            </div>
                                        </tr>
                                    </table>
                                </div>
                            </div>
