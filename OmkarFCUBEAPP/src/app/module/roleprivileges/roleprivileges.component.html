<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Role Privileges</h4>
                   <div class="page-title-right">
                      <ol class="breadcrumb m-0">
                         <!-- <li class="breadcrumb-item"><a href="javascript: void(0);">Fin Group Master</a></li>
                         <li class="breadcrumb-item active">Fin Group Master</li> -->
                      </ol>
                   </div>
                </div>
             </div>
          </div>
           <!-- end page title -->
          <form [formGroup]="formUser">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-lg-2 text-right">
                                        <div class="mb-3">
                                            <label for="horizontal-firstname-input" class="col-form-label">
                                                <h5>Role: </h5> 
                                            </label><span style="color: red"> *</span>
                                        </div>
                                    </div>
                                    <div class="col-lg-4">
                                    <div class="mb-3">
                                        <select class="form-control"
                                            formControlName="roleId" 
                                            class="form-control form-select ng-pristine ng-touched"
                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['roleId'].invalid) }"
                                            (change)="onRoleChange($event)">
                                            <option *ngFor="let role of roleList"  value={{role.dataId}}>
                                                {{role.dataName}}
                                            </option>
                                        </select>
                                    </div>
                               </div>
                            </div>
                            <div class="row">
                                <div class="col-lg-8">
                                    <div class="card">
                                        <div class="card-body">
                                            <h4 class="card-title mb-4" style="color: red;"> Master & Transactions</h4>
                                            <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                                <tr>
                                                    <td class="col-lg-1">
                                                        <label for="formrow-inputZip">
                                                            <h6>Module</h6>
                                                        </label>
                                                    </td>
                                                    <td class="col-lg-2">
                                                        <label for="formrow-inputZip">
                                                            <h6>Menu</h6>
                                                        </label>
                                                    </td>
                                                    <td class="col-lg-1">
                                                        <label for="formrow-inputZip">
                                                            <h6>Add</h6>
                                                        </label>
                                                    </td>
                                                    <td class="col-lg-1">
                                                        <label for="formrow-inputCity">
                                                            <h6>Edit</h6>
                                                        </label>
                                                    </td>
                                                    <td class="col-lg-1">
                                                        <label for="formrow-inputCity">
                                                            <h6>Delete</h6>
                                                        </label>
                                                    </td>
                                                    <td class="col-lg-1">
                                                        <label for="formrow-inputCity">
                                                            <h6>View</h6>
                                                        </label>
                                                    </td>
                                                    <td class="col-lg-1">
                                                        <label for="formrow-inputCity">
                                                             <h6>Print</h6>
                                                        </label>
                                                    </td>
                                                </tr>
                                                <tr formArrayName="masterList"
                                                    *ngFor="let mst of formMasterArray.controls; let m = index">
                                                    <div [formGroupName]="m" class="grid-table">
                                                        <td  class="col-lg-1">   
                                                            <input autoclose="false" type="text" class="form-control" 
                                                            formControlName="moduleName"> 
                                                            <input autoclose="false" type="hidden" class="form-control" 
                                                            formControlName="moduleId">                                                                                                    
                                                        </td>
                                                        <td  class="col-lg-1"> 
                                                            <input autoclose="false" type="text" class="form-control" 
                                                            formControlName="menuName">
                                                            <input autoclose="false" type="hidden" class="form-control" 
                                                            formControlName="menuId">                                                             
                                                        </td>
                                                        <td  class="col-lg-1">
                                                            <select class="form-control"
                                                            class="form-control form-select ng-pristine ng-touched"
                                                                formControlName="createYN">
                                                                <option value="Y">Yes</option>
                                                                <option value="N">No</option>
                                                            </select>
                                                        </td>
                                                        <td  class="col-lg-1"> 
                                                            <select class="form-control"
                                                            class="form-control form-select ng-pristine ng-touched"
                                                                formControlName="editYN">
                                                                <option value="Y">Yes</option>
                                                                <option value="N">No</option>
                                                            </select>
                                                        </td>
                                                        <td  class="col-lg-1"> 
                                                            <select class="form-control"
                                                            class="form-control form-select ng-pristine ng-touched"
                                                                formControlName="viewYN">
                                                                <option value="Y">Yes</option>
                                                                <option value="N">No</option>
                                                            </select>
                                                        </td>
                                                        <td  class="col-lg-1"> 
                                                            <select class="form-control"
                                                            class="form-control form-select ng-pristine ng-touched"
                                                                formControlName="deleteYN">
                                                                <option value="Y">Yes</option>
                                                                <option value="N">No</option>
                                                            </select>
                                                        </td>
                                                        <td  class="col-lg-1"> 
                                                            <select class="form-control"
                                                            class="form-control form-select ng-pristine ng-touched"
                                                                formControlName="printYN">
                                                                <option value="Y">Yes</option>
                                                                <option value="N">No</option>
                                                            </select>
                                                        </td>                              
                                                    </div>
                                                </tr>
                                            </table>
                                        </div>
                                    </div>
                                </div> 
                                <div class="col-lg-4">                                    
                                    <div class="card">
                                        <div class="card-body">
                                            <h4 class="card-title mb-4" style="color: red;"> Reports/Tools</h4>
                                            <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                                <tr>
                                                    <td class="col-lg-1">
                                                        <label for="formrow-inputZip">
                                                            <h6>Module</h6>
                                                        </label>
                                                    </td>
                                                    <td class="col-lg-2">
                                                        <label for="formrow-inputZip">
                                                            <h6>Menu</h6>
                                                        </label>
                                                    </td>
                                                    <td class="col-lg-1">
                                                        <label for="formrow-inputCity">
                                                            <h6>View</h6>
                                                        </label>
                                                    </td>
                                                </tr>
                                                <tr formArrayName="reportList"
                                                    *ngFor="let rpt of formReportArray.controls; let n = index">
                                                    <div [formGroupName]="n"  class="grid-table">
                                                        <td  class="col-lg-1">   
                                                            <input autoclose="false" type="text" class="form-control" 
                                                            formControlName="moduleName"> 
                                                            <input autoclose="false" type="hidden" class="form-control" 
                                                            formControlName="moduleId">                                                                                                    
                                                        </td>
                                                        <td  class="col-lg-1"> 
                                                            <input autoclose="false" type="text" class="form-control" 
                                                            formControlName="menuName">
                                                            <input autoclose="false" type="hidden" class="form-control" 
                                                            formControlName="menuId">                                                             
                                                        </td>
                                                        <td  class="col-lg-1"> 
                                                            <select class="form-control"
                                                            class="form-control form-select ng-pristine ng-touched"
                                                                formControlName="viewYN">
                                                                <option value="Y">Yes</option>
                                                                <option value="N">No</option>
                                                            </select>
                                                        </td>                         
                                                    </div>
                                                </tr>
                                            </table>
                                        </div>
                                    </div>
                                </div>                 
                            </div>
                         </div>  
                      </div>  
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>               
             </div>              
             <div class="row text-right">
                <div class="col-lg-12">
                    <div class="tex">
                        <button class="btn btn-primary w-md" *ngIf="(editMode && editStatus) || (!editMode && createStatus)"
                            (click)="submitRolePrivilegesForm()">Save</button>&nbsp;
                        <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                    </div>
                </div>
                <!-- end col -->
             </div> 
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
