<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">GST Details</h4>
                   <div class="page-title-right">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item"><a href="">Admin</a></li>
                        <li class="breadcrumb-item active">GST Details</li>
                    </ol>
                </div>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form [formGroup]="formUser">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                         <h4 class="card-title mb-4">EWay Bill Details</h4>
                         <div class="row">
                            <div class="col-lg-12">
                               <div class="card">
                                  <div class="card-body">
                                     <div class="row">
                                        <div class="col-sm-2">
                                           <label for="horizontal-firstname-input" class="col-form-label">EWay Bill Number</label>
                                        </div>
                                        <div class="col-sm-4">
                                           <input type="text" class="form-control"
                                           placeholder="Enter eway bill number" formControlName="eWayBillNo">
                                        </div>
                                     </div>
                                  </div>
                               </div>
                            </div>                 
                         </div>
                      </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                      <button type="submit" class="btn btn-primary w-md"
                         (click)="submitForm()">Submit</button>
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
          
          <div class="col-lg-12">
            <div class="card">
               <div class="card-body">
                  <div class="row">
                       <label for="scope" class="col-form-label">{{result}}</label>
                  </div>
               </div>
            </div>
         </div>
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
