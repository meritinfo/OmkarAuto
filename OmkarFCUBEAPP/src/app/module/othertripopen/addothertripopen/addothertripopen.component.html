<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Other Trip Open</h4>

                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="/#/tripsheetlist">Other Trip Open</a></li>
                                <li class="breadcrumb-item active">Other Trip Open Add</li> -->
                            </ol>
                        </div>

                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form [formGroup]="formOtherTripOpen">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Branch</label>
                                                <select class="form-control" formControlName="tripBranch"                             
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['tripBranch'].invalid) }">
                                                    <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Trip Date</label>
                                                <input type="date" class="form-control" formControlName="newTripDate"
                                                    placeholder="newTripDate"  max="{{maxDate}}"                          
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['newTripDate'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Vehicle No</label>  
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="vehicleList"
                                                        [searchKeyword]="keywordLocation" placeholder=""
                                                        formControlName="vehicleMasterID" [initialValue]=""
                                                        (selected)='selectVehicalEvent($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' 
                                                        [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"
                                                        [ngClass]="{ 'is-invalid': userSubmitted && (f['vehicleMasterID'].invalid) }">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">   
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Trip No</label>
                                                <input class="form-control" placeholder="" formControlName="tripNo"                            
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['tripNo'].invalid) }">
                                            </div>
                                        </div>
                                        <div class="col-lg-4">
                                            <div class="mb-4">
                                                <label for="formrow-inputState">Driver</label>
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="driverList"
                                                        [searchKeyword]="keywordLocation" placeholder=""
                                                        formControlName="driverMasterID" [initialValue]=""
                                                        (selected)='selectEvent($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"  
                                                        [ngClass]="{ 'is-invalid': userSubmitted && (f['driverMasterID'].invalid) }">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>                                                    
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="form-check mb-3">
                                                <input type="radio" name="compNonCompStatus" id="formRadios1" value="C"
                                                    class="form-check-input" formControlName="compNonCompStatus" 
                                                    (change)="onChange($event)"
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['compNonCompStatus'].invalid) }"/>
                                                <label for="formRadios1" class="form-check-label"> Company
                                                </label>

                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="form-check">
                                                <input type="radio" name="compNonCompStatus" id="formRadios2" value="N"
                                                    class="form-check-input" formControlName="compNonCompStatus" 
                                                    (change)="onChange($event)"
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['compNonCompStatus'].invalid) }"/>
                                                <label for="formRadios2" class="form-check-label"> Non Company
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="form-check">
                                                <input type="radio" name="compNonCompStatus" id="formRadios3" value="R"
                                                    class="form-check-input" formControlName="compNonCompStatus" 
                                                    (change)="onChange($event)"
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['compNonCompStatus'].invalid) }"/>
                                                <label for="formRadios3" class="form-check-label"> RCM
                                                </label>
                                            </div>
                                        </div>                                      
                                        <div class="col-lg-2">                                            
                                            <div class="row text-right">
                                                <div class="mb-3">
                                                    <label for="formrow-inputState"> RCM Challan No.</label>
                                                </div>
                                            </div>
                                        </div>                                       
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <input class="form-control" placeholder="" formControlName="challanNo"               
                                                [ngClass]="{ 'is-invalid': userSubmitted && (f['challanNo'].invalid) }">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">                                        
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Load Type</label>
                                                <select id="formrow-inputState" class="form-control"
                                                    formControlName="loadEmptyType" 
                                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['loadEmptyType'].invalid) }">
                                                    <option selected="">Choose...</option>
                                                    <option value="L">Loaded</option>
                                                    <option value="E">Empty</option>
                                                </select>
                                            </div>
                                        </div>                                       
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Content Desc</label>
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="contentList"
                                                        [searchKeyword]="keywordLocation" placeholder=""
                                                        formControlName="contents" [initialValue]=""
                                                        (selected)='selectEvent($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"  
                                                        [ngClass]="{ 'is-invalid': userSubmitted && (f['contents'].invalid) }">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>                                                    
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Loading From</label>
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="locationList" formControlName="loadingFrom"
                                                        [searchKeyword]="keywordLocation" placeholder=""
                                                        (selected)='changeFromPlace($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"  
                                                        [ngClass]="{ 'is-invalid': userSubmitted && (f['loadingFrom'].invalid) }">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Destination</label>
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="locationList" formControlName="destination"
                                                        [searchKeyword]="keywordLocation" placeholder=""
                                                        (selected)='changeToPlace($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter"  
                                                        [ngClass]="{ 'is-invalid': userSubmitted && (f['destination'].invalid) }">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">KMs</label>
                                                <input class="form-control" placeholder=""
                                                    formControlName="distanceTripKM_1">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Expected Rpt</label>
                                                <input type="date" class="form-control"
                                                    formControlName="expectedReportingDt"
                                                    placeholder="expectedReportingDt">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Expected Rpt Days</label>
                                                <input class="form-control" placeholder=""
                                                    formControlName="expectedReportingDays">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Dsl To Be</label>
                                                <input class="form-control" placeholder=""
                                                    formControlName="ltsDslToBe_1">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">AdBlue To be</label>
                                                <input class="form-control" placeholder=""
                                                    formControlName="ltsAdblueToBe_1">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Travel Adv Payable</label>
                                                <input class="form-control" placeholder=""
                                                    formControlName="advPayable_1">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">   
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Opening Balance</label>
                                                <input class="form-control" placeholder=""
                                                    formControlName="opBalDriver">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Opening Bal. Dsl</label>
                                                <input class="form-control" placeholder="" formControlName="opBalDsl">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Opening Bal. Adblue</label>
                                                <input class="form-control" placeholder=""
                                                    formControlName="opBalAdblue">
                                            </div>
                                        </div>
                                    </div>                                  
                                </div>
                            </div>
                        </div>
                    </div>
                </div>                 
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" *ngIf="editStatus && createStatus"
                                (click)="submitOtherTripOpenForm()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteOtherTripOpenForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md" (click)="exit()">Exit</button>
                        </div>
                    </div>
                    <!-- end col -->
                </div>        
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
