<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Diesel Statement</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="javascript: void(0);">Fleet</a></li>
                                <li class="breadcrumb-item active">Diesel Statement </li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form [formGroup]="formDieselStatement">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="row">
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">Statement Branch</label><span style="color: red"> * </span>
                                                    <select class="form-control" formControlName="BranchCode"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['BranchCode'].invalid) }"> 
                                                        <option *ngFor="let br of branchList" value={{br.dataId}}>
                                                            {{br.dataName}}
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">Statement Date</label><span style="color: red"> * </span>
                                                    <input autoclose="false" type="date" placeholder="dd/MM/yyyy"
                                                        class="form-control" formControlName="billStmtDate"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['billStmtDate'].invalid) }">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">Valid From</label><span style="color: red"> * </span>
                                                    <input autoclose="false" type="date" placeholder="dd/MM/yyyy"
                                                        class="form-control" formControlName="fromDate" 
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['fromDate'].invalid) }">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">Valid To</label><span style="color: red"> * </span>
                                                    <input autoclose="false" type="date" placeholder="dd/MM/yyyy"
                                                        class="form-control" formControlName="toDate"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['toDate'].invalid) }">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <!-- <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">Location</label><span style="color: red"> * </span>
                                                    <div class="ng-autocomplete">
                                                        <ng-autocomplete [data]="branchList"
                                                            [searchKeyword]="keywordLocation" placeholder=""
                                                            (selected)='selectEvent($event)'
                                                            (inputChanged)='onChangeSearch($event)'
                                                            (inputFocused)='onFocused($event)'
                                                            [itemTemplate]="itemTemplate"
                                                            [notFoundTemplate]="notFoundTemplate"
                                                            [customFilter]="startWithFilter"
                                                            formControlName="location"
                                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['location'].invalid) }">
                                                        </ng-autocomplete>

                                                        <ng-template #itemTemplate let-item>
                                                            <a [innerHTML]="item.dataName"></a>
                                                        </ng-template>

                                                        <ng-template #notFoundTemplate let-notFound>
                                                            <div [innerHTML]="notFound"></div>
                                                        </ng-template>
                                                    </div>
                                                </div>
                                            </div> -->
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label for="formrow-inputZip">Vendor</label> <span style="color: red"> * </span>                                               
                                                    <div class="ng-autocomplete">
                                                        <ng-autocomplete [data]="vendorList"
                                                            [searchKeyword]="keywordLocation" placeholder=""
                                                            (selected)='selectEvent($event)'
                                                            (inputChanged)='onChangeSearch($event)'
                                                            (inputFocused)='onFocused($event)'
                                                            [itemTemplate]="itemTemplate"
                                                            [notFoundTemplate]="notFoundTemplate"
                                                            [customFilter]="startWithFilter"
                                                            formControlName="vendorId" 
                                                            [ngClass]="{ 'is-invalid': formSubmitted && (f['vendorId'].invalid) }">
                                                        </ng-autocomplete>
    
                                                        <ng-template #itemTemplate let-item>
                                                            <a [innerHTML]="item.dataName"></a>
                                                        </ng-template>
    
                                                        <ng-template #notFoundTemplate let-notFound>
                                                            <div [innerHTML]="notFound"></div>
                                                        </ng-template>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label for="formrow-inputCity">Rate</label><span style="color: red"> * </span>
                                                    <input decimalonly autoclose="false" (change)="ratechange($event)"
                                                        class="form-control" formControlName="rate"
                                                        [ngClass]="{ 'is-invalid': formSubmitted && (f['rate'].invalid) }">
                                                </div>
                                            </div>  
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <button (click)="searchStatement()" *ngIf="!editMode"
                                                        class="btn btn-primary w-md mt-4">Search</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body -->
                            </div>
                            <!-- end card -->
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4"></h4>
                                    <table class="table table-bordered dt-responsive nowrap w-100 no-border-table">
                                        <tr>
                                            <td colspan="3">
                                                <div class="mb-3">
                                                    <input type="checkbox" name="select" 
                                                         class="form-check-input"
                                                        (change)="selectAll($event)" formControlName="selectedAll">  
                                                        <label for="formrow-inputCity">  SELECT ALL</label>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th><label for="formrow-inputCity"></label></th>
                                            <th><label for="formrow-inputCity">Branch</label></th>
                                            <th><label for="formrow-inputZip">Pmt Date</label></th>
                                            <th><label for="formrow-inputZip">Vehicle No</label></th>
                                            <th><label for="formrow-inputZip">Hsd Adv Type</label></th>
                                            <th><label for="formrow-inputZip">Trans Desc</label></th>
                                            <th><label for="formrow-inputZip">Qty Ltrs</label></th>
                                            <th><label for="formrow-inputZip">Rate Per Ltr</label></th>
                                            <th><label for="formrow-inputZip">Total Amount</label></th>
                                        </tr>                                        
                                        <tr formArrayName="arrayList"
                                            *ngFor="let arrayData of formArray.controls; let i = index">
                                            <div [formGroupName]="i" class="grid-table">
                                            <td>
                                                <div class="mb-3">
                                                    <input type="checkbox" name="select" 
                                                         class="form-check-input"
                                                        (change)="selectedData(i, $event)" formControlName="selected">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="branch">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input  class="form-control" type="date" formControlName="pmtDate">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="vehicleNo">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="hsdAdvType">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="transDesc">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="qtyLtrs">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="ratePerLtr">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="mb-3">
                                                    <input class="form-control" formControlName="amountPaid">
                                                </div>
                                            </td>
                                            </div>
                                        </tr>
                                    </table>
                                    <div class="row">                                                                
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Total Diesel Liters</label>
                                                <input autoclose="false" type="text" class="form-control"
                                                    formControlName="totalDslLtrs">
                                                </div>
                                        </div>                                                         
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputCity">Gross Diesel Amount</label>
                                                <input autoclose="false" type="text" class="form-control"
                                                    formControlName="grossDslAmt">
                                            </div>
                                        </div>
                                    </div>    
                                </div>                                
                                <div class="row">                                                                           
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Disc Rate/Ltr</label>
                                            <input decimalonly autoclose="false" (change)="calculateTotal()"
                                                class="form-control" formControlName="discRateLtr">
                                        </div>
                                    </div>                                                                                                              
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Total Disc Amount</label>
                                            <input autoclose="false" 
                                                class="form-control" formControlName="discAmt">
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Net Diesel Amount</label>
                                            <input autoclose="false" type="text" class="form-control"
                                                formControlName="totalDslAmt">
                                        </div>
                                    </div>
                                </div>  
                                <div class="row">                                                                           
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">TDS Perc</label>
                                            <input decimalonly autoclose="false" (change)="calculateTotal()"
                                                class="form-control" formControlName="tdsRate">
                                        </div>
                                    </div>                                                                                                              
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">TDS Amount</label>
                                            <input autoclose="false" 
                                                class="form-control" formControlName="tdsAmt">
                                        </div>
                                    </div>
                                    <div class="col-lg-2">
                                        <div class="mb-3">
                                            <label style="color: red"> 
                                                <h5>Fin Doc Series: {{ this.seriesDoc}} </h5> 
                                            </label>                                                 
                                        </div>
                                    </div>
                                </div>                              
                                <div class="row">                                                                                                    
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Total Driver Adv Amount</label>
                                            <input autoclose="false" type="text" class="form-control"
                                                formControlName="totalCashAdv">
                                        </div>
                                    </div>                                                                                                  
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Total Statement Amount</label><span style="color: red"> * </span>
                                            <input autoclose="false" type="text" class="form-control"
                                                formControlName="totalNetAmount"
                                                [ngClass]="{ 'is-invalid': formSubmitted && (f['totalNetAmount'].invalid) }">
                                        </div>
                                    </div>                                                                                                
                                    <div class="col-lg-3">
                                        <div class="mb-3">
                                            <label for="formrow-inputCity">Remarks</label>
                                            <input  uppercaseonly autoclose="false" type="text" class="form-control"
                                                formControlName="remarks">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" *ngIf="(editMode && editStatus) || (!editMode && createStatus)"
                                (click)="saveStatementDetails()">Save</button>&nbsp;
                            <button class="btn btn-danger w-md m-2" *ngIf="editMode && deleteStatus"
                                (click)="deleteDieselStatementForm()">Delete</button>&nbsp;
                            <button class="btn btn-secondary w-md m-2" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
