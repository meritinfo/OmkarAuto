<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
           <!-- start page title -->
              <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Change Password</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="javascript: void(0);">Admin</a></li>
                                <li class="breadcrumb-item active">Change Password</li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
           <!-- end page title -->
            <form [formGroup]="formUser">
                <div class="row">
                    <div class="col-lg-12">  
                        <div class="row">                                       
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label for="basicpill-phoneno-input"> Branch </label>
                                    <select   class="form-control form-select ng-pristine ng-touched"
                                        formControlName="userBranch"  
                                        [ngClass]="{ 'is-invalid': userSubmitted && (f['userBranch'].invalid) }">
                                        <option *ngFor="let branch of branchList" [ngValue]="branch">
                                            {{branch.dataName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>  
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">
                            <button class="btn btn-primary w-md" *ngIf="createStatus || editStatus"
                                (click)="submitUserBranch()">Save</button>                               
                            <button class="btn btn-secondary w-md m-2" (click)="exit()">Exit</button>
                        </div>
                    </div>
                </div>
            </form>
           <!-- end row -->
           <!-- end row -->
        </div>
        <!-- container-fluid -->
     </div>
     <!-- End Page-content -->
  </div>
