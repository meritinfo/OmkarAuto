<div class="main-content">
    <div class="page-content">
       <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
             <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                   <h4 class="mb-sm-0 font-size-18">Destination</h4>
                   <div class="page-title-right">
                      <ol class="breadcrumb m-0">
                         <li class="breadcrumb-item"><a href="javascript: void(0);">Freight</a></li>
                         <li class="breadcrumb-item active">Destination</li>
                      </ol>
                   </div>
                </div>
             </div>
          </div>
          <!-- end page title -->
          <form [formGroup]="formUser">
             <div class="row">
                <div class="col-lg-12">
                   <div class="card">
                      <div class="card-body">
                         <h4 class="card-title mb-4">Destination details</h4>
                         <div class="row">
                            <div class="col-lg-12">
                              
                                  
                                     <div class="row">
                                       <div class="col-lg-2">
                                          <div class="mb-4">
                                           <label for="horizontal-firstname-input" class="col-form-label">Destination
                                           Name</label>
                                        </div>
                                       </div>
                                        <div class="col-lg-2">
                                          <div class="mb-4">
                                           <input type="text"  autofocus="autofocus"  class="form-control"
                                           placeholder="Enter  Destination name" formControlName="centreName"
                                           [ngClass]=>
                                        </div>
                                     </div>
                                    </div>
                                
                               
                            </div>
                            <div class="col-lg-12">
                             
                               
                                     <div class="row">
                                       <div class="col-lg-2">
                                          <div class="mb-4">
                                           <label for="horizontal-firstname-input" class="col-form-label">Pin Code</label>
                                        </div>
                                       </div>
                                        <div class="col-lg-2">
                                          <div class="mb-4">
                                           <input type="text" class="form-control"
                                           placeholder="Enter Pin Code" formControlName="pinCode"
                                           [ngClass]=>
                                        </div>
                                     </div>
                                    </div>
                                
                               
                            </div>
                            <div class="col-lg-12">
                              
                                 
                                     <div class="row">
                                       <div class="col-lg-2">
                                          <div class="mb-4">
                                           <label for="horizontal-firstname-input" class="col-form-label">Branch</label>
                                        </div>
                                       </div>
                                        <div class="col-lg-2">
                                          <div class="mb-4">
                                           <select class="form-control" formControlName="userBranch" [ngClass]="">
                                              <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                 {{branch.dataName}}
                                              </option>
                                           </select>
                                        </div>
                                     </div>
                                    </div>
                               
                            </div>
                            <div class="col-lg-12">
                             
                                  
                                     <div class="row">
                                       <div class="col-lg-2">
                                          <div class="mb-4">
                                           <label for="horizontal-firstname-input" class="col-form-label">Select State</label>
                                        </div>
                                       </div>
                                       <div class="col-sm-2">
                                          <div class="mb-4">
                                           <select class="form-control" formControlName="userState" [ngClass]="">
                                              <option *ngFor="let state of stateList" value={{state.dataId}}>
                                                 {{state.dataName}}
                                              </option>
                                           </select>
                                        </div>
                                     </div>
                                    </div>
                            
                            </div>
                         </div>
                      </div>
                      <!-- end card body -->
                   </div>
                   <!-- end card -->
                </div>
             </div>
             <div class="row text-right">
                <div class="col-lg-12">
                   <div class="tex">
                      <button type="submit" class="btn btn-primary w-md"
                         (click)="submitDestinationForm()">Submit</button>
                   </div>
                </div>
             </div>
          </form>
          <!-- end row -->
          <!-- end row -->
       </div>
       <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
 </div>
