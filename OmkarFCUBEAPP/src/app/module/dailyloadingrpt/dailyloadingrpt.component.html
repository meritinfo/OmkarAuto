<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Daily Loading Report</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="javascript: void(0);">Fleet</a></li>
                                <li class="breadcrumb-item active">Driver Master </li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form [formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="formrow-inputState">Branch </label>
                                    <select class="form-control" formControlName="branch">
                                    <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                        {{branch.dataName}}
                                    </option>
                                </select>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Vehicle No</label>  
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="vehicleList"
                                            [searchKeyword]="keywordLocation" placeholder=""
                                            formControlName="vehicleMasterID" [initialValue]=""
                                            (selected)='selectEvent($event)'
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-2">
                                <div class="mb-2">
                                    <label for="basicpill-phoneno-input">Open Through</label>
                                    <select id="formrow-inputState" class="form-control"
                                        formControlName="openThrough"
                                        [ngClass]=""    >
                                        <option value="" selected="">All</option>
                                        <option value="LR"> LR</option>
                                        <option value="OT"> Other Trip </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-2">
                                <div class="mb-2">
                                    <label for="basicpill-phoneno-input">Load/Empty</label>
                                    <select id="formrow-inputState" class="form-control"
                                        formControlName="loadEmptyType"
                                        [ngClass]="">
                                        <option value="" selected="">Choose...</option>
                                        <option value="L"> Load </option>
                                        <option value="E"> Empty </option>
                                    </select>
                                </div>
                            </div>  
                            <div class="col-lg-1">
                                <div class="mt-3">
                                    <button class="btn btn-primary" type="submit" 
                                    (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <div class="dt-buttons btn-group flex-wrap export-button">
                        <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button" 
                            (click)="exportExcel()"><span>Excel</span></button>
                    </div>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive w-100">
                    <thead>
                        <tr>
                            <th>fromPlace</th>
                            <th>toPlace</th>
                            <th>openThrough </th>  
                            <th>partyName </th>
                            <th>loadContents</th>
                            <th>loadingFor </th>   
                            <th>lrNo</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="allDailyloadingrptlist.dailyLoadingRptsList?.length != 0">
                        <tr *ngFor="let eta of allDailyloadingrptlist.dailyLoadingRptsList">
                            <td>{{ eta.fromPlace }}</td>
                            <td>{{ eta.toPlace }}</td> 
                            <td>{{ eta.openThrough }}</td>
                            <td>{{ eta.partyName }}</td>
                            <td>{{ eta.loadContents }}</td>
                            <td>{{ eta.loadingFor }}</td> 
                            <td>{{ eta.lrNo }}</td>                       
                        </tr>
                    </tbody>
                    <tbody *ngIf="allDailyloadingrptlist.dailyLoadingRptsList?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
