<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Consignment</h4>

                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <li class="breadcrumb-item"><a href="/#/consignmentlist">Consignment</a></li>
                                <li class="breadcrumb-item active">Consignment Add</li>
                            </ol>
                        </div>

                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form [formGroup]="formConsignment">
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4">Booking</h4>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3"><label for="formrow-inputCity">Booked at</label>
                                                <select class="form-control" formControlName="userBranch" [ngClass]="">
                                                    <option *ngFor="let branch of branchList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>

                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">LR.Series/No</label>

                                                <select id="formrow-inputState" class="form-select"
                                                    formControlName="gcSeries">
                                                    <option selected="">Choose...</option>
                                                    <option>2001</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">GcSlNo</label>

                                                <input type="text" id="formrow-inputCity" class="form-control"
                                                    placeholder="Enter GcSlNo" formControlName="gcSlNo" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3"><label for="formrow-inputZip">Booking Date</label>
                                                <input bsdatepicker="" type="date" autoclose="false"
                                                    placeholder="yyyy-mm-dd" formControlName="bookingDate"
                                                    class="form-control">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Book Status</label>
                                                <select id="formrow-inputState" class="form-control"
                                                    formControlName="bookingStatus">
                                                    <option selected="">Choose...</option>
                                                    <option>yes</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">

                                        <div class="col-lg-3">
                                            <div class="form-check mb-3">
                                                <input type="radio" formControlName="ewayBillEntryType" value="A"
                                                    class="form-check-input" />
                                                <label for="formRadios1" class="form-check-label"> Get ALL
                                                    From EWayBill API
                                                </label>

                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="form-check">
                                                <input type="radio" formControlName="ewayBillEntryType" id="formRadios2"
                                                    value="M" class="form-check-input" /><label for="formRadios2"
                                                    class="form-check-label"> No EWay Bill or Manual Entry
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="form-check">
                                                <input type="radio" name="ewayBillEntryType"
                                                    formControlName="ewayBillEntryType" id="formRadios3" value="E"
                                                    class="form-check-input"><label for="formRadios2"
                                                    class="form-check-label"> No EWay Bill Exemption
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">EWay Bill No</label>
                                                <div class="hstack gap-1">
                                                    <input type="text" class="form-control"
                                                        placeholder="Enter ewayBillNo " formControlName="ewayBillNo">
                                                    <button type="button" class="btn btn-primary"
                                                        (click)="searchGSTDetails()">Search</button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">EWay Bill Date</label>
                                                <input bsdatepicker="" type="date" autoclose="false"
                                                    placeholder="yyyy-mm-dd" formControlName="ewayBillDate"
                                                    class="form-control">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">EWay Bill Exp Date</label>
                                                <input bsdatepicker="" type="date" autoclose="false"
                                                    placeholder="yyyy-mm-dd" formControlName="ewayBillExpDate"
                                                    class="form-control">
                                            </div>
                                        </div>
                                        <div class="col-lg-3">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Vehicle No</label>
                                               
                                                    <input autoclose="false" class="form-control"
                                                    formControlName="vehicleNumber">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">From Place</label>
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="locationList" formControlName="fromPlace"
                                                        [searchKeyword]="keywordLocation"
                                                        placeholder="From Place" (selected)='selectEvent($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>                                                
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Pin</label>
                                                <input autoclose="false" class="form-control"
                                                    formControlName="fromPlacePin">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">To Place</label>
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="locationList" formControlName="toPlace"
                                                        [searchKeyword]="keywordLocation"
                                                        placeholder="To Place" (selected)='selectEvent($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate"
                                                        [customFilter]="startWithFilter">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>  
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Pin</label>
                                                <input autoclose="false" class="form-control"
                                                    formControlName="toPlacePin">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">kMs</label>
                                                <input type="text" class="form-control" placeholder="Enter  "
                                                    formControlName="kms">
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4">Consignor/Consignee</h4>
                                    <div class="row">
                                        <div class="col-lg-4">
                                            <div class="mb-3"><label for="formrow-inputCity">Consignor</label>

                                                <input type="text" id="formrow-inputCity" class="form-control"
                                                    placeholder="Enter Consignor" formControlName="cnorCode" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Cnor Gst</label>
                                                <input type="text" id="formrow-inputCity" class="form-control"
                                                    placeholder="Enter Cnor Gst" formControlName="" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3"><label for="formrow-inputZip">Cnor Inv No</label>
                                                <input class="form-control">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Invoice Value</label>
                                                <input type="text" autoclose="false" class="form-control"
                                                    formControlName="invoiceValue">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputState">Invoice Date</label>
                                                <input bsdatepicker="" type="date" autoclose="false"
                                                    placeholder="yyyy-mm-dd" formControlName="cnorInvDate"
                                                    class="form-control">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-lg-4">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Consignee</label>

                                                <input type="text" id="formrow-inputCity" class="form-control"
                                                    placeholder="Enter Consignee" formControlName="cneeCode" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">&nbsp;</label>
                                                <input class="form-control" formControlName="consigneeAddress">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">&nbsp;</label>
                                                <input class="form-control" formControlName="consigneePinCode">
                                            </div>
                                        </div>
                                        <div class="col-lg-4">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Contents</label>
                                                <select id="formrow-inputState" class="form-control">
                                                    <option selected="">Choose...</option>
                                                    <option>...</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-4">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Contents Desc</label>
                                                <input type="text" class="form-control" placeholder="Enter  "
                                                    formControlName="gcSeries" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Actual Wt</label>
                                                <input type="text" class="form-control" placeholder="Enter  actualWt "
                                                    formControlName="actualWt" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Charged Wt</label>
                                                <input type="text" class="form-control" placeholder="Enter  chargewt "
                                                    formControlName="chargewt" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Qty/Pkgs</label>
                                                <input autoclose="false" placeholder="Enter Qty/Pkgs "
                                                    class="form-control">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Rate Type</label>

                                                <select class="form-control" formControlName="rateRs" [ngClass]="">
                                                    <option *ngFor="let branch of rateList" value={{branch.dataId}}>
                                                        {{branch.dataName}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mb-4">Freight Details</h4>
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Rate</label>
                                                <input type="text" class="form-control" placeholder="Enter  rateRs "
                                                    formControlName="rateRs" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Freight</label>
                                                <input type="text" class="form-control" placeholder="Enter  freightRs "
                                                    formControlName="freightRs" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Statistical</label>
                                                <input type="text" class="form-control"
                                                    placeholder="Enter  statisticalRs " formControlName="statisticalRs"
                                                    [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Loading</label>
                                                <input type="text" class="form-control"
                                                    placeholder="Enter  loadingDetnRs " formControlName="loadingDetnRs"
                                                    [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Ld Pt Detn</label>
                                                <input class="form-control">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Extra Ch</label>
                                                <input type="text" class="form-control" placeholder="Enter  extrasRS "
                                                    formControlName="extrasRS" [ngClass]=>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Misc. Charge</label>
                                                <input type="text" class="form-control" placeholder="Enter  miscRs "
                                                    formControlName="miscRs" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Un Loading</label>
                                                <input type="text" class="form-control"
                                                    placeholder="Enter  unLoadingRs " formControlName="unLoadingRs"
                                                    [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">UL Pt Detn</label>
                                                <input class="form-control">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Multi Pt</label>
                                                <input class="form-control">
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Other Charge</label>
                                                <input type="text" class="form-control" placeholder="Enter  othersRs "
                                                    formControlName="othersRs" [ngClass]=>
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Sub Total</label>
                                                <input type="text" class="form-control" placeholder="Enter  subTotalRs "
                                                    formControlName="subTotalRs" [ngClass]=>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">

                                        <div class="col-lg-2">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Net Total</label>
                                                <input type="text" class="form-control" placeholder="Enter  total "
                                                    formControlName="gtotalRs" [ngClass]=>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="ng-untouched ng-pristine ng-valid">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-4">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Billing Station</label>
                                                <div class="ng-autocomplete">
                                                    <ng-autocomplete [data]="locationList" formControlName="toPlace"
                                                        [searchKeyword]="keywordLocation"
                                                        placeholder="station" (selected)='selectEvent($event)'
                                                        (inputChanged)='onChangeSearch($event)'
                                                        (inputFocused)='onFocused($event)' [itemTemplate]="itemTemplate"
                                                        [notFoundTemplate]="notFoundTemplate">
                                                    </ng-autocomplete>

                                                    <ng-template #itemTemplate let-item>
                                                        <a [innerHTML]="item.dataName"></a>
                                                    </ng-template>

                                                    <ng-template #notFoundTemplate let-notFound>
                                                        <div [innerHTML]="notFound"></div>
                                                    </ng-template>
                                                </div>  
                                                
                                            </div>
                                        </div>
                                        <div class="col-lg-8">
                                            <div class="mb-3">
                                                <label for="formrow-inputZip">Remarks</label>
                                                <input type="text" id="formrow-inputCity" class="form-control"
                                                    placeholder="Enter generalRemarks " formControlName="generalRemarks"
                                                    [ngClass]=>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-right">
                    <div class="col-lg-12">
                        <div class="tex">

                            <button type="submit" class="btn btn-primary w-md"
                                (click)="submitConsignmentForm()">Submit</button>
                        </div>
                    </div>
                </div>
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
