<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Driver Master</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <li class="breadcrumb-item"><a href="/#/drivermasterlist">Driver Master</a></li>
                                <li class="breadcrumb-item active">Driver Master Add</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <form [formGroup]="formDriverMaster" (ngSubmit)="submitDriverMasterForm()">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <div id="basic-example">
                                    <!-- Personal Details -->
                                    <h3>Personal Details</h3>
                                    <section>
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Driver name</label>
                                                    <input type="text" class="form-control"
                                                        id="basicpill-firstname-input" formControlName="driverName"
                                                        placeholder="Enter Driver Name">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Father name</label>
                                                    <input type="text" class="form-control"
                                                         formControlName="fatherName"
                                                        placeholder="Enter Driver Father Name">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Date of Birth</label>
                                                    <input type="date" class="form-control"
                                                        formControlName="dateOfBirth"
                                                        placeholder="Enter Date of Birth">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Age</label>
                                                    <input type="text" class="form-control" formControlName="age"
                                                         placeholder="Enter Age">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Blood Group</label>
                                                    <input type="text" class="form-control"
                                                       formControlName="bloodGroup"
                                                        placeholder="Enter Blood Group">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Introduced By</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="introBy"
                                                        placeholder="Enter Introduced By">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Mobile No</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="introByMobileNo" 
                                                        placeholder="Enter Mobile No">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Date of
                                                        Appointment</label>
                                                    <input type="date" class="form-control"
                                                         formControlName="dateOfAppoint"
                                                        placeholder="Enter Date of Appointment">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Group Name</label>
                                                    <input type="text" class="form-control" formControlName="groupName"
                                                        placeholder="Enter Name">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Aadhar No</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="driverAadharNo"
                                                        placeholder="Enter Aadhar No">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Licence No</label>
                                                    <input type="text" class="form-control"
                                                         formControlName="licenseNo"
                                                        placeholder="Enter Licence No">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Valid Upto</label>
                                                    <input type="date" class="form-control"
                                                         formControlName="licValidUpto"
                                                        placeholder="Enter Valid Upto">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Issue Auth</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="licenseIssuAuth"
                                                        placeholder="Enter Name">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <div class="form-check mt-4">
                                                        <input type="checkbox" id="formHLicYNRadio"
                                                            class="form-check-input mt-10"
                                                            formControlName="isHazardousLicYN">
                                                        <label for="formHLicYNRadio" class="form-check-label"> Hazardous Lic
                                                            Y/N
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Hazardous Licence No</label>
                                                    <input type="text" class="form-control"
                                                         formControlName="hazardousLicNo"
                                                        placeholder="Enter Licence No">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>hazardous Valid Upto</label>
                                                    <input type="date" class="form-control"
                                                         formControlName="hazLicValidUpto"
                                                        placeholder="Enter Valid Upto">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>HazLicense Issue Auth</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="hazLicenseIssuAuth"
                                                        placeholder="Enter">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <!-- <div class="mb-3">
                                                        <label for="basicpill-lastname-input">Valid Upto</label>
                                                        <input type="date" class="form-control"
                                                             formControlName="userName"
                                                            placeholder="Enter Valid Upto">
                                                    </div> -->
                                            </div>
                                            <div class="col-lg-3">

                                            </div>
                                            <div class="col-lg-3">

                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-6">
                                                <div class="mb-3">
                                                    <label>Temporary Address</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="temporaryAddr"
                                                        placeholder="Enter Temporary Address">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label>City</label>
                                                    <input type="email" class="form-control"
                                                        formControlName="temporaryAddrCity"
                                                        placeholder="Enter City">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label>Pin</label>
                                                    <input type="email" class="form-control"
                                                        formControlName="temporaryAddrPin"
                                                        placeholder="Enter Pin">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label>Phone</label>
                                                    <input type="email" class="form-control"
                                                        formControlName="tempAddPhone"
                                                        placeholder="Enter Phone">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-6">
                                                <div class="mb-3">
                                                    <label>Permanent Address</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="permanentAddr"
                                                        placeholder="Enter Permanent Address">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label>City</label>
                                                    <input type="email" class="form-control"
                                                        formControlName="permanentAddrCity"
                                                        placeholder="Enter City">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label>Pin</label>
                                                    <input type="email" class="form-control"
                                                        formControlName="permanentAddrPin" 
                                                        placeholder="Enter Pin">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">
                                                    <label>Phone</label>
                                                    <input type="email" class="form-control"
                                                        formControlName="permAddPhone" 
                                                        placeholder="Enter Phone">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Experience</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="previousExpDetails"
                                                        placeholder="Enter Experience">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Years</label>
                                                    <input type="email" class="form-control"
                                                        formControlName="previousExpYears"
                                                        placeholder="Enter Years">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Driver Photo</label>
                                                    <input class="form-control" type="file" id="formDriverPhoto">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">

                                            </div>
                                        </div>
                                        <div class="row">

                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Mobile 1</label>
                                                    <input type="email" class="form-control"
                                                        placeholder="Enter Mobile 1">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Mobile 2</label>
                                                    <input type="email" class="form-control"
                                                        placeholder="Enter Mobile 2">
                                                </div>
                                            </div>
                                            <div class="col-lg-2">
                                                <div class="mb-3">

                                                </div>
                                            </div>
                                        </div>

                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <div class="form-check mt-4">
                                                        <input type="checkbox" id="formActive"
                                                            class="form-check-input mt-10" formControlName="isActive">
                                                        <label for="formActive" class="form-check-label"> Active Y/N
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>InActive Date</label>
                                                    <input type="date" class="form-control"
                                                         formControlName="inActiveDate"
                                                        placeholder="Enter InActive Date">
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <div class="form-check mt-4">
                                                        <input type="checkbox" id="formRemovedRadio"
                                                            class="form-check-input mt-10" formControlName="removedYN">
                                                        <label for="formRemovedRadio" class="form-check-label"> Removed Y/N
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mb-3">
                                                    <label>Removed Date</label>
                                                    <input type="date" class="form-control"
                                                         formControlName="removedDate"
                                                        placeholder="Enter Renewed Date">
                                                </div>
                                            </div>
                                        </div>
                                    </section>

                                    <!-- Bank Details -->
                                    <h3>Bank Details</h3>
                                    <section>
                                        <div class="row">
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label>Bank Account Name</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="drBankAccountName"
                                                        placeholder="Enter Bank Account Name">
                                                </div>
                                            </div>
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label>Bank Name</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="bankName" placeholder="Enter Bank Name">
                                                </div>
                                            </div>
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label>Bank Account No</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="bankAcNo" placeholder="Enter Bank Account No">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label>IFSC Code</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="bankIfsCode" placeholder="Enter IFSC Code">
                                                </div>
                                            </div>
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label>Branch Name</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="bankBranch" placeholder="Enter Branch Name">
                                                </div>
                                            </div>
                                            <div class="col-lg-4">
                                                <div class="mb-3">
                                                    <label >Account Status</label>
                                                    <input type="text" class="form-control"
                                                        formControlName="bankAccountStatus"
                                                        placeholder="Enter Account Type">
                                                </div>
                                            </div>
                                        </div>
                                    </section>

                                    <!-- Attachment Details -->
                                    <h3>Attachment Details</h3>
                                    <section>
                                        <div>
                                            <div class="row">
                                                <div class="col-lg-4">
                                                    <div class="mt-3">
                                                        <label for="formDLFile" class="form-label">Driving License</label>
                                                        <input class="form-control" type="file" id="formDLFile">
                                                    </div>
                                                </div>
                                                <div class="col-lg-4">
                                                    <div class="mt-3">
                                                        <label for="formLicFile" class="form-label">License</label>
                                                        <input class="form-control" type="file" id="formLicFile">
                                                    </div>
                                                </div>
                                                <div class="col-lg-4">
                                                    <div class="mt-3">
                                                        <label for="formTempAddFile" class="form-label">Temporary Address
                                                            Prove</label>
                                                        <input class="form-control" type="file" id="formTempAddFile">
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row">
                                                <div class="col-lg-4">
                                                    <div class="mt-3">
                                                        <label for="formPerAddFile" class="form-label">Permanent Address
                                                            Prove</label>
                                                        <input class="form-control" type="file" id="formPerAddFile">
                                                    </div>
                                                </div>
                                                <div class="col-lg-4">
                                                    <div class="mt-3">
                                                        <label for="formAadharFile" class="form-label">AAdhar Card</label>
                                                        <input class="form-control" type="file" id="formAadharFile">
                                                    </div>
                                                </div>
                                                <div class="col-lg-4">
                                                    <div class="mt-3">
                                                        <label for="formPassbookFile" class="form-label">Bank Passbook</label>
                                                        <input class="form-control" type="file" id="formPassbookFile">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </section>
                                    <div class="row text-right">
                                        <div class="col-lg-12">
                                            <div class="tex">
                                                <button type="submit" class="btn btn-primary w-md"
                                                   style="display: none;">Submit</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                            <!-- end card body -->
                        </div>
                        <!-- end card -->

                    </div>
                    <!-- end col -->
                </div>
                <!-- end row -->
            </form>
            <!-- end row -->
            <!-- end row -->
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
