
<div class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <!-- start page title -->
            <div class="row">
                <div class="col-12">
                    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                        <h4 class="mb-sm-0 font-size-18">Doc Renewal Report</h4>
                        <div class="page-title-right">
                            <ol class="breadcrumb m-0">
                                <!-- <li class="breadcrumb-item"><a href="javascript: void(0);">Fleet</a></li>
                                <li class="breadcrumb-item active">Driver Master </li> -->
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end page title -->
            <div class="row top-controls">
                <div class="col-sm-8 col-md-8">
                    <form [formGroup]="formFilter">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">From Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="fromDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['fromDate'].invalid) }">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="mb-3">
                                    <label for="formrow-inputState">To Date </label><span style="color: red">*</span>    
                                    <input type="date" class="form-control" 
                                    formControlName="toDate" min="{{minDate}}" max="{{maxDate}}"
                                    [ngClass]="{ 'is-invalid': userSubmitted && (f['toDate'].invalid) }">
                                </div>
                            </div>
                           <!-- <div class="col-md-2">
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Loading Branch</label>  
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="branchList"
                                            [searchKeyword]="keywordLocation" placeholder=""
                                            formControlName="tripBranch" [initialValue]=""
                                            (selected)='selectEvent($event)'
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>-->
                            <div class="col-md-3">
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Vehicle No</label>  
                                    <div class="ng-autocomplete">
                                        <ng-autocomplete [data]="vehicleList"
                                            [searchKeyword]="keywordLocation" placeholder=""
                                            formControlName="vehicleMasterID" [initialValue]=""
                                            (selected)='selectEvent($event)'
                                            (inputChanged)='onChangeSearch($event)'
                                            (inputFocused)='onFocused($event)' 
                                            [itemTemplate]="itemTemplate"
                                            [notFoundTemplate]="notFoundTemplate"
                                            [customFilter]="startWithFilter">
                                        </ng-autocomplete>

                                        <ng-template #itemTemplate let-item>
                                            <a [innerHTML]="item.dataName"></a>
                                        </ng-template>

                                        <ng-template #notFoundTemplate let-notFound>
                                            <div [innerHTML]="notFound"></div>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">                                    
                                    <label for="formrow-inputCity">Doc RefNo</label>  
                                    <div class="ng-autocomplete">
                                        <select id="formrow-inputState" class="form-control" 
                                        class="form-control form-select ng-pristine ng-touched"
                                        formControlName="docRenewalID"
                                        [ngClass]="{ 'is-invalid': userSubmitted && (f['docRenewalID'].invalid) }"> 
                                           <option *ngFor="let doc of docRenewalList" value={{doc.dataId}}>
                                              {{doc.dataName}}
                                           </option>
                                        </select>
                                </div>
                            </div>
                        </div>
                            <div class="col-lg-1">
                                <div class="mt-3">
                                    <button class="btn btn-primary" type="submit" (click)="search()"><span>Search</span></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-sm-4 col-md-4 text-right">
                    <div class="dt-buttons btn-group flex-wrap export-button">
                        <button class="btn btn-secondary buttons-excel buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button" 
                            (click)="exportExcel()"><span>Excel</span></button>
                       <!--<button class="btn btn-secondary buttons-pdf buttons-html5" tabindex="0"
                            aria-controls="datatable-buttons" type="button"><span>PDF</span></button>--> 
                    </div>
                </div>
            </div>
            <div id="datatable_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                <table datatable [dtOptions]="dtOptions" class="table table-bordered dt-responsive w-100">
                    <thead>
                        <tr>
                            <th>RenewalDocName</th>
                            <th>TransDate</th>
                            <th>VehicleNo</th>  
                            <th>ValidFromDt</th>
                            <th>ValidToDt</th>
                            <th>NetAmount</th>   
                            <th>DocumentRefNo</th>
                       

                        </tr>
                    </thead>
                    <tbody *ngIf="allDocRenewalRptlist.docRenewalRptlist?.length != 0">
                        <tr *ngFor="let eta of allDocRenewalRptlist.docRenewalRptlist">
                            <td>{{ eta.renewalDocName }}</td>
                            <td>{{ eta.vehicleNo }}</td> 
                            <td>{{ eta.transDate }}</td>
                            <td>{{ eta.validFromDt }}</td>
                            <td>{{ eta.validToDt }}</td>
                             <td>{{ eta.netAmount }}</td> 
                            <td>{{ eta.documentRefNo }}</td> 
                        
                       
                        </tr>
                    </tbody>
                    <tbody *ngIf="allDocRenewalRptlist.docRenewalRptlist?.length == 0">
                        <tr>
                            <td colspan="3" class="no-data-available">No data!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- container-fluid -->
    </div>
    <!-- End Page-content -->
</div>
